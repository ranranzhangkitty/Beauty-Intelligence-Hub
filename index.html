<style>
:root{--ink:#20302C;--ink-soft:#4B584F;--paper:#EFEDE2;--card:#FFFFFF;--plinth:#F5F3EA;--line:#DDD8C6;--honey:#BE8F35;--honey-soft:#EFDFB2;--sage:#5B6B4F;--sage-soft:#DCE3D1;--plum:#8B5A6B;--plum-soft:#E7D6DC;--grey:#8B8A7D;--grey-soft:#E7E5DA;--shadow:0 1px 3px rgba(32,48,44,.05),0 12px 28px rgba(32,48,44,.08);--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Montserrat","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}.wrap{max-width:1380px;margin:auto;padding:24px 26px 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--honey);font-weight:700;margin-bottom:10px}h1{font-family:var(--serif);font-size:40px;margin:0 0 8px}.hero p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.7;max-width:650px}.stats{display:flex;align-items:center}.stat{font-family:var(--serif);text-align:center;padding:6px 19px;border-left:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--grey);letter-spacing:.1em}button,input,select{font-family:var(--sans)}button{cursor:pointer;border-radius:3px;font-size:12.5px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button:hover{box-shadow:var(--shadow)}.lang{font-weight:700;border-color:var(--ink);min-width:52px}
.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 28px}.group{display:flex;gap:9px;flex-wrap:wrap}.search,.filter{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 12px;font-size:13px}.search{min-width:250px}.primary{background:var(--honey);border-color:var(--honey);font-weight:700}
.workspace{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}.side{position:relative;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px;cursor:pointer;text-align:center}.side.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft) inset}.side-num{position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:2}.side img{width:100%;height:82px;object-fit:contain;background:var(--plinth);border-radius:3px}.side-name{font-size:10.5px;line-height:1.35;margin-top:6px;color:var(--ink-soft)}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-top:5px;background:var(--honey)}.dot.europe{background:var(--sage)}.detail{background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(350px,41%) minmax(0,59%);overflow:hidden}
.media{background:var(--plinth);border-right:1px solid var(--line);display:flex;flex-direction:column}.media-hero{height:460px;display:flex;align-items:center;justify-content:center;padding:24px 24px 16px}.media-hero img{width:78%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(32,48,44,.15))}.thumbs{display:flex;justify-content:center;gap:8px;padding:12px 16px 18px;flex-wrap:wrap}.thumb{width:48px;height:62px;padding:3px;border:1.5px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center}.thumb.active{border-color:var(--honey)}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.content{padding:20px 22px 18px;min-width:0}.content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.index{font-family:var(--serif);font-size:11px;color:var(--grey);letter-spacing:.08em}.cat{font-size:10.5px;padding:4px 10px;border-radius:20px;background:var(--honey-soft);color:#7A5A18;border:0}.pname{font-family:var(--sans);font-weight:800;font-size:22px;line-height:1.22;margin:0 0 10px;outline:none;letter-spacing:-.01em}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 18px;margin-bottom:0}.chip{background:#fff;padding:6px 8px;border-radius:4px;border:1px solid var(--line)}.chip-label{font-size:9px;letter-spacing:.08em;color:var(--grey);font-weight:700;text-transform:uppercase;margin-bottom:4px}.chip-val{font-size:11.5px;line-height:1.45;outline:none}.section{border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}.section-head{background:var(--honey-soft);color:#7A5A18;padding:6px 10px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans)}.section-body{padding:9px 12px;font-size:12px;line-height:1.55;outline:none;white-space:pre-wrap}.section-body:hover,.chip-val:hover,.pname:hover{background:rgba(190,143,53,.07)}.note{background:#FBEFC4;border:1px solid #E6D28B;border-radius:4px;padding:11px 14px;margin-top:2px}.note-label{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:#8A6A1E;margin-bottom:6px}.note-body{font-size:12px;line-height:1.6;outline:none;min-height:18px}.sources{display:flex;gap:7px;flex-wrap:wrap}.media-price{padding:0 16px 18px}.media-price .section{margin-bottom:0}.sources a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.sources-plain{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}.sources-plain a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--grey);font-size:10.5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}.media{border-right:0;border-bottom:1px solid var(--line);min-height:auto}.media-hero{height:520px}}
@media(max-width:760px){.wrap{padding:20px 14px 60px}.workspace{grid-template-columns:1fr}.sidebar{position:relative;max-height:none;display:flex;flex-direction:row;overflow:auto}.side{min-width:100px}.chips{grid-template-columns:1fr 1fr}}
@media print{.toolbar,.sidebar,.lang,.thumb-add,.upload-btn,.image-upload-row,.thumb-delete{display:none!important}.workspace{display:none!important}.detail{box-shadow:none}.section{break-inside:avoid}#printArea{display:none}body.print-all #printArea{display:block!important}.print-detail{border:none;box-shadow:none;page-break-after:always;margin-bottom:0}.print-detail:last-child{page-break-after:auto}}

.image-upload-row{display:flex;justify-content:center;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.upload-btn{background:transparent;border:1px dashed var(--honey);color:#7A5A18;padding:8px 12px}
.upload-hint{font-size:9.5px;color:var(--grey);align-self:center}
.thumb-wrap{position:relative}
.thumb-delete{position:absolute;right:-4px;top:-4px;width:17px;height:17px;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;line-height:17px;display:none}
.thumb-wrap:hover .thumb-delete{display:block}
#printArea{display:none}
.print-product{page-break-after:always;background:#fff;padding:16mm;min-height:270mm}
.print-product:last-child{page-break-after:auto}
.print-title{font-family:var(--serif);font-size:25px;margin:0 0 10px}
.print-grid{display:grid;grid-template-columns:34% 66%;gap:12mm}
.print-image{height:220mm;display:flex;align-items:flex-start;justify-content:center;background:var(--plinth);padding:12mm}
.print-image img{max-width:100%;max-height:100%;object-fit:contain}
.print-section{border:1px solid var(--line);margin-bottom:6px}
.print-section h3{font-size:10px;letter-spacing:.06em;background:var(--honey-soft);color:#7A5A18;margin:0;padding:6px 8px}
.print-section p{font-size:10px;line-height:1.5;margin:0;padding:7px 8px;white-space:pre-wrap}
@media print{
  body.print-all .wrap{display:none!important}
  body.print-all #printArea{display:block!important}
  body.print-all{background:#fff}
  @page{size:A4 portrait;margin:0}
}


.thumb-add{
  width:48px;height:62px;padding:0;border:1.5px dashed var(--line);
  background:rgba(255,255,255,.35);color:var(--grey);font-size:25px;
  display:flex;align-items:center;justify-content:center;
}
.thumb-add:hover{border-color:var(--honey);color:var(--honey);box-shadow:none}
.official-source{font-weight:700;color:#7A5A18!important;border-bottom-color:var(--honey)!important}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row2>.section{margin-bottom:0}
.ic-head{display:flex;align-items:center;gap:7px}
.ic-head .ic{font-size:13px}
.ul-dot{margin:0;padding:0;list-style:none}
.ul-dot li{position:relative;padding-left:14px;margin-bottom:3px;font-size:11.5px;line-height:1.42}
.ul-dot li:before{content:"•";position:absolute;left:0;color:var(--honey);font-weight:700}
.ul-check{margin:0;padding:0;list-style:none}
.ul-check li{position:relative;padding-left:18px;margin-bottom:3px;font-size:11.5px;line-height:1.42}
.ul-check li:before{content:"✓";position:absolute;left:0;color:#3F8E52;font-weight:700}
.ingredient-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.ingredient-name{font-weight:700;font-size:12px;margin-top:2px}
.ingredient-tag{font-size:10.5px;color:#7A5A18;margin-top:2px}
.ingredient-desc{font-size:10.5px;color:var(--grey);margin-top:2px;line-height:1.4}
.price-tier-row{display:flex;gap:4px;margin-bottom:8px}
.price-tier-seg{flex:1;height:8px;border-radius:2px;background:var(--grey-soft)}
.price-tier-seg.active{background:var(--honey)}
.price-tier-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--grey);margin-bottom:12px}
.price-tier-title{font-weight:700;font-size:12.5px;margin-bottom:2px}
.price-tier-desc{font-size:11px;color:var(--ink-soft)}
.price-tier-stat{font-size:10.5px;color:#7A5A18;margin-top:10px;background:var(--honey-soft);padding:5px 8px;border-radius:3px;display:inline-block}
.market-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.market-col-title{font-size:9px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.concept-card{border:1px solid var(--line);border-radius:4px;padding:7px}
.concept-card .t{font-size:11.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.concept-card .d{font-size:10.5px;line-height:1.5;color:var(--ink-soft)}
.adv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adv-col-title{font-size:10.5px;font-weight:700;margin-bottom:5px;color:var(--ink-soft)}
@media(max-width:1000px){.row2,.ingredient-grid,.market-grid,.concept-grid,.adv-grid{grid-template-columns:1fr}}

</style>
</head>

<script>
const DEFAULTS=[{"id": "loreal","category": "europe","name": {"zh": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo","en": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo"},"brand": {"zh": "L’Oréal Professionnel","en": "L’Oréal Professionnel"},"company": {"zh": "L’Oréal","en": "L’Oréal"},"origin": {"zh": "法国","en": "France"},"launch": {"zh": "Scalp Advanced 系列现行版本","en": "Current Scalp Advanced range"},"market": {"zh": "全球专业沙龙、品牌官网与授权零售；日本以进口电商为主","en": "Professional salons, official channels and authorized retail; mainly import e-commerce in Japan"},"capacity": {"zh": "300 mL / 500 mL","en": "300 mL / 500 mL"},"price": {"zh": "日本进口价约 ¥3,490–¥4,620（300 mL）","en": "Approx. ¥3,490–¥4,620 in Japan (300 mL)"},"positioning": {"zh": "欧莱雅专业线针对头屑与头皮微生态失衡人群推出的沙龙级治疗型洗发产品。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。","en": "A salon-grade treatment shampoo from L'Oréal Professionnel, developed for people with dandruff and scalp micro-ecology imbalance. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations."},"target": {"zh": "核心消费者是反复出现可见头屑、同时担心头皮干燥、油腻或不适的人群。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。官方未限定性别；产品覆盖干性与油性头屑场景。","en": "Designed for consumers with recurring visible dandruff who may also experience dryness, oiliness or discomfort. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations. Official communication is gender-neutral and covers both dry and oily dandruff."},"distribution": {"zh": "300 mL 与 500 mL 两种规格，主要依赖专业沙龙、L’Oréal Professionnel 官方渠道及各国授权零售。日本并非其最强本土渠道，进口电商价格差异较大，因此价格竞争力不如日本本土药妆洗护，但专业品牌形象和针对性头皮功效支撑了溢价。","en": "Available in 300 mL and 500 mL sizes through professional salons, official L’Oréal Professionnel channels and authorized retailers. In Japan, import pricing varies considerably, so it is less price-competitive than domestic drugstore products. Its premium is supported by professional branding and targeted scalp efficacy."},"ingredients": {"zh": "核心活性为 Piroctone Olamine，用于去屑及抑制与头屑相关的微生物；配方中还可见 Salicylic Acid、Glycerin、Coco-Betaine、Guar Hydroxypropyltrimonium Chloride 等。整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The key active is Piroctone Olamine for dandruff control. The formula also includes Salicylic Acid, Glycerin, Coco-Betaine and Guar Hydroxypropyltrimonium Chloride. The cleansing base is conventional, while humectants, conditioning polymers and sensorial modifiers improve the professional-use experience. The broader Scalp Advanced range frames these ingredients within a scalp-skinification story."},"evidence": {"zh": "官方公开资料给出了较清晰的测试层级：首次使用后“最多去除 100% 可见头屑”为消费者测试；“最长 72 小时去屑保护”为临床测试；另有 44 名受试者、每周使用 3 次的临床测试描述，用于支持头屑外观减少。公开页面仍未完整披露各测试的详细设计、对照组和统计方法，因此适合归类为“有消费者与临床支持，但完整研究报告未公开”。","en": "Official materials describe consumer and clinical testing, including removal of up to 100% visible dandruff after first use and protection lasting up to 72 hours. A 44-subject clinical test used three applications per week. However, full protocols, control design and statistical details are not publicly available."},"experience": {"zh": "轻盈乳霜型洗发质地，目标是兼顾去屑清洁和头皮舒适度。官方建议在湿发与头皮上均匀涂抹，用指腹轻柔起泡后冲洗，油性头屑可先搭配同系列深层净化产品。香气被描述为中性、清新、具有洁净感和专业护理基调。包装为白色专业线瓶身，搭配淡蓝绿色区块和黑色瓶盖，视觉接近皮肤科与沙龙专业护理。","en": "A lightweight cream shampoo designed to combine anti-dandruff cleansing with scalp comfort. It is applied to wet hair and scalp, gently lathered with fingertips, then rinsed. The scent is clean, neutral and professional. White packaging with pale blue-green accents creates a dermatological salon-care impression."},"packaging": {"zh": "白色大面积留白、黑色专业品牌标识、浅蓝绿色功能标签，强化“临床、洁净、专业”的视觉联想。300 mL / 500 mL 规格便于区分家用和沙龙需求。优势是专业感强、功能识别直接；弱点是与其他 Scalp Advanced 单品外观接近，消费者需要仔细阅读功能名称。","en": "Large white areas, a black professional logo and pale blue-green functional labels communicate clinical cleanliness and expertise. The 300 mL and 500 mL formats serve home and salon use. The design is professional and clear, although products within the range look similar and require close label reading."},"insight": {"zh": "其真正竞争力不是单一的 Piroctone Olamine，而是把经典去屑活性放进专业沙龙与头皮皮肤学叙事中，并用可量化功效、专家共创和更精致的质地完成品牌升级。最值得学习的是“功能问题—专业诊断—方案组合”的完整路径。较容易被复制的是基础表活和去屑活性组合；较难复制的是全球沙龙网络、品牌权威和成套产品协议。","en": "Its advantage is not Piroctone Olamine alone, but the way a classic anti-dandruff active is elevated through professional salon authority, scalp-skinification and quantified claims. The easiest elements to replicate are the cleansing and active system; the hardest are the global salon network, brand authority and protocol-led portfolio."},"notes": {"zh": "","en": ""},"images": ["https://u.makeup.com.ua/o/ow/owtokyuk6f6v.jpg"],"sources": [["L’Oréal Professionnel Official","https://www.lorealprofessionnel.com/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["L’Oréal Professionnel UK","https://www.lorealprofessionnel.co.uk/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["Japan retail reference","https://makeup.jp/product/730063/"]],"targetUsers": {"zh": ["中度至重度头屑人群","头皮敏感、瘙痒人群","经常染烫、头皮受损人群","追求沙龙级专业护理的消费者"],"en": ["Moderate to severe dandruff","Sensitive, itchy scalp","Frequently colored/permed, damaged scalp","Consumers seeking salon-grade professional care"]},"keyClaims": {"zh": ["有效去屑，长效抑制头屑再生","舒缓头皮不适，减少瘙痒","平衡头皮微生态","专业沙龙级配方，温和不刺激","皮肤学测试，安全有效"],"en": ["Effective dandruff removal, long-lasting recurrence control","Soothes scalp discomfort, reduces itching","Balances scalp micro-ecology","Professional salon-grade formula, gentle","Dermatologically tested, safe and effective"]},"heroIngredients": {"zh": [{"name": "Piroctone Olamine","tag": "高效去屑因子","desc": "抑制马拉色菌，减少头屑生成"},{"name": "Niacinamide（烟酰胺）","tag": "舒缓修护头皮","desc": "强韧屏障，减少头皮不适"}],"en": [{"name": "Piroctone Olamine","tag": "High-efficacy anti-dandruff agent","desc": "Inhibits Malassezia, reduces dandruff formation"},{"name": "Niacinamide","tag": "Soothes & repairs scalp","desc": "Strengthens barrier, reduces scalp discomfort"}]},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Professional","desc": "沙龙专业护理 · 高端专业线"},"en": {"tier": "premium","label": "Premium Professional","desc": "Salon professional care · High-end line"}},"marketChannel": {"zh": {"global": ["专业沙龙","品牌官网","Amazon","授权零售渠道"],"japan": ["乐天","Amazon JP","Yahoo! Shopping","美容院渠道"],"channelLabel": "Salon Professional","channelDesc": "专业沙龙护理渠道为核心"},"en": {"global": ["Professional salons","Official website","Amazon","Authorized retail"],"japan": ["Rakuten","Amazon JP","Yahoo! Shopping","Salon channel"],"channelLabel": "Salon Professional","channelDesc": "Professional salon care channel as core"}},"brandConceptRich": {"zh": {"coreIdea": {"title": "核心理念","desc": "以“Scalp Advanced”为专业头皮护理概念，将头皮失衡视为需要诊断、分型与持续管理的肌肤问题。"},"expertise": {"title": "专业背书","desc": "依托 L’Oréal Professionnel 沙龙形象，结合皮肤学活性成分与专家共创，建立信任。"},"science": {"title": "科学实证","desc": "通过皮肤学测试验证，温和有效，兼顾去屑力与头皮舒适度，达成可量化的功效。"}},"en": {"coreIdea": {"title": "Core Idea","desc": "Built around the “Scalp Advanced” concept, treating scalp imbalance as a skin issue requiring diagnosis, classification and ongoing management."},"expertise": {"title": "Professional Endorsement","desc": "Backed by L’Oréal Professionnel’s salon authority, combining dermatological actives with expert co-development to build trust."},"science": {"title": "Scientific Evidence","desc": "Dermatologically tested for gentle, effective performance, balancing anti-dandruff efficacy with scalp comfort into quantifiable results."}}},"competitiveAdvantage": {"zh": [{"name": "Head & Shoulders","points": ["更专业的沙龙定位","更关注头皮微生态平衡","配方更温和，兼顾护理体验"]},{"name": "Kérastase","points": ["价格更具竞争力","针对头屑问题更聚焦","日常护理更易坚持"]},{"name": "Aveda","points": ["更强调医学化头皮护理","去屑功效更明确","渠道覆盖更广泛"]}],"en": [{"name": "Head & Shoulders","points": ["More professional salon positioning","Greater focus on scalp micro-ecology balance","Gentler formula with better care experience"]},{"name": "Kérastase","points": ["More competitive pricing","More focused on dandruff specifically","Easier to maintain as daily routine"]},{"name": "Aveda","points": ["Stronger medicalized scalp-care framing","Clearer anti-dandruff efficacy claims","Broader channel coverage"]}]},"ingredientsNote": {"zh": "整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The cleansing base follows a classic anionic + amphoteric surfactant framework, with pearlizers, humectants, conditioning polymers and cooling agents improving the professional-use experience. The brand places it within the Scalp Advanced dermatological-active lineup, alongside Niacinamide, AHA and Clay, to build a broader scalp-“skinification” story."},"evidenceStats": {"zh": ["首次使用：最多去除100%可见头屑（消费者测试）","持效：最长72小时去屑保护（临床测试）","临床样本：44名受试者，每周使用3次","局限：完整测试设计、对照组与统计方法未公开"],"en": ["First use: up to 100% visible dandruff removal (consumer test)","Duration: up to 72-hour dandruff protection (clinical test)","Clinical sample: 44 subjects, 3 applications/week","Limitation: full protocol, control group and statistics not disclosed"]},"experienceItems": {"zh": ["质地：轻盈乳霜型洗发水","用法：湿发湿头皮涂抹，指腹轻柔起泡后冲洗","进阶：油性头屑可先用同系列深层净化产品","香调：中性清新，专业护理感"],"en": ["Texture: lightweight cream shampoo","Usage: apply to wet hair/scalp, lather gently with fingertips, then rinse","Pairing: oily dandruff can pre-treat with the deep-purifying product in the range","Scent: clean, neutral, professional"]},"packagingItems": {"zh": ["视觉：大面积留白 + 黑色品牌标识 + 浅蓝绿功能标签","联想：强化“临床、洁净、专业”印象","规格：300 mL / 500 mL，区分家用与沙龙场景","弱点：系列内单品外观接近，需仔细看标签区分"],"en": ["Visual: large white space, black logo, pale blue-green functional labels","Association: reinforces a “clinical, clean, professional” impression","Sizes: 300 mL / 500 mL for home vs. salon use","Weakness: products within the range look similar, requiring close label reading"]}},{"id": "andhoney","category": "japan","name": {"zh": "&honey Deep Moist Shampoo 1.0","en": "&honey Deep Moist Shampoo 1.0"},"brand": {"zh": "&honey","en": "&honey"},"company": {"zh": "ViCREA","en": "ViCREA"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2018 年 4 月 5 日","en": "April 5, 2018"},"market": {"zh": "日本全国药妆、综合零售、品牌电商及跨境电商","en": "Japanese drugstores, general retail, brand e-commerce and cross-border e-commerce"},"capacity": {"zh": "440 mL","en": "440 mL"},"price": {"zh": "¥1,540","en": "¥1,540"},"positioning": {"zh": "以“头发水分量 14%”和“保水有机美容”为核心，把蜂蜜、有机油和美容液成分组合成高保湿洗护体系。产品的核心差异不是解决单一损伤，而是让消费者相信整个洗护流程都围绕保持发丝水分展开。系列化步骤编号、香味变化和高装饰性瓶身进一步强化仪式感。","en": "Built around “14% hair moisture” and a moisture-organic beauty proposition. Honey, organic oils and beauty-serum ingredients are organized into a hydration system, while numbered steps, changing fragrances and jewel-like packaging create ritual value."},"target": {"zh": "面向干燥、毛躁、缺水、卷曲和希望获得明显滋润感的人群。品牌视觉年轻、甜美、适合社交媒体传播，核心用户更偏年轻女性，但实际购买人群很广。对细软、容易塌发的人群，Deep Moist 的丰润感可能偏重。","en": "For consumers with dry, frizzy and moisture-depleted hair who want a rich conditioning feel. The brand’s visual language is young, sweet and social-media friendly, although its actual audience is broad."},"distribution": {"zh": "440 mL / ¥1,540，与日本大众高机能洗护主流价位一致。全国药妆、Ainz & Tulpe、综合零售、电商覆盖广，渠道优势明显。长期在售与高评论量形成较强社会证明，替代成本来自品牌认知而非高技术壁垒。","en": "440 mL at ¥1,540, aligned with Japan’s mainstream mass-premium haircare segment. Wide drugstore, lifestyle retail and e-commerce distribution gives the brand a major channel advantage."},"ingredients": {"zh": "品牌强调 90% 以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，并使用摩洛哥有机油。蜂蜜配比故事为 Manuka 50%、Acacia 30%、日本生蜂蜜 20%。洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。","en": "The brand emphasizes that more than 90% of the formula consists of honey, organic oils, royal jelly and other moisturizing or protective ingredients. The honey story uses a 50% Manuka, 30% Acacia and 20% Japanese raw honey blend."},"evidence": {"zh": "公开资料主要是配方比例、成分来源、自由配方和消费者评论。没有在官方产品页看到完整临床或仪器测试方案。其证据优势来自长期市场销售、较高评论量和清晰的成分比例传播，而非公开临床研究。","en": "Public evidence is mainly formula ratios, ingredient sourcing, free-from claims and large volumes of consumer reviews. No full clinical or instrumental study protocol was found on the official product page."},"experience": {"zh": "浓厚的 Shea & Honey 泡沫，Peony Honey 香味，洗后追求柔软、滋润、香气持续和毛躁改善。瓶身厚重、透明、带切割感和蜂蜜色液体，视觉非常适合货架和社交媒体。使用体验偏丰润，对重度干燥发更有吸引力。","en": "Rich Shea & Honey foam, Peony Honey fragrance and a strongly moisturized finish. The faceted transparent bottle, amber liquid and gold pump create high shelf visibility and social-media appeal."},"packaging": {"zh": "琥珀色透明液体、几何切面瓶和金色泵头构成极强的蜂蜜高级感。步骤编号 1.0、1.5、2.0 让消费者自然理解整套使用顺序。包装是其最难被低成本复制的品牌资产之一。","en": "Amber liquid, a geometric faceted bottle, gold hardware and numbered steps create a strong premium honey identity. Packaging is one of the brand’s hardest assets to copy cheaply."},"insight": {"zh": "&honey 的成功说明大众洗护的竞争不一定依赖新型活性，而可以通过一个极强的单一概念——“保水”——把配方、包装、香味、步骤和渠道统一起来。研发层面容易模仿，品牌层面难以复制。","en": "&honey shows that mass haircare can win without a new active by aligning formula, packaging, fragrance, usage steps and distribution around one powerful memory structure: moisture."},"notes": {"zh": "","en": ""},"images": ["https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-1-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600","https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-2-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600","https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-3-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600"],"sources": [["Official product page","https://www.and-honey.com/deep/product/"],["@cosme","https://www.cosme.net/variations/973782/"],["Ainz & Tulpe","https://ainz-tulpe.jp/products/4589546890758"]],"targetUsers": {"zh": ["干燥、毛躁、缺水、卷曲发质","希望获得明显滋润感的人群","年轻、偏好甜美视觉与社交媒体传播的消费者","细软易塌发人群需注意丰润感是否过重"],"en": ["Dry, frizzy, dehydrated, curly hair","Consumers seeking a noticeably richer, moisturized feel","Younger consumers drawn to sweet visuals and social sharing","Fine, flat-prone hair types should note the rich feel may be heavy"]},"keyClaims": {"zh": ["头发水分量14%的保水诉求","90%以上蜂蜜、有机油、蜂王浆等保湿成分","系列化步骤编号强化护理仪式感","长期热销与高评论量的市场验证"],"en": ["“14% hair moisture” hydration claim","90%+ honey, organic oils, royal jelly and other moisturizing ingredients","Numbered step system reinforces a ritual care routine","Long-term bestseller status with high review volume as market proof"]},"heroIngredients": {"zh": [{"name": "蜂蜜复合配方","tag": "核心保湿因子","desc": "Manuka 50%+洋槐30%+日本生蜂蜜20%，构成品牌“保水”故事"},{"name": "摩洛哥有机油+蜂王浆","tag": "顺滑保护","desc": "配合油脂、保湿剂与调理成分，减少洗后干涩"}],"en": [{"name": "Honey Complex","tag": "Core moisture factor","desc": "50% Manuka + 30% Acacia + 20% raw Japanese honey forms the brand's “moisture” story"},{"name": "Moroccan Organic Oil + Royal Jelly","tag": "Smoothing & protection","desc": "Paired with oils, humectants and conditioning agents to reduce post-wash dryness"}]},"ingredientsNote": {"zh": "品牌强调90%以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。","en": "The brand states that 90%+ of the formula is honey, organic oils, royal jelly and similar moisturizing/protective ingredients, paired with a cleansing base designed to reduce dryness and retain a hydrated feel after washing."},"pricePositioning": {"zh": {"tier": "masstige","label": "大众高机能 · Masstige定位"},"en": {"tier": "masstige","label": "Mass-Premium · Masstige Positioning"}},"marketChannel": {"zh": {"global": ["品牌官网","跨境电商"],"japan": ["全国药妆","Ainz & Tulpe","综合零售"],"channelLabel": "Drugstore & Mass Retail","channelDesc": "日本全国药妆与综合零售为核心，电商覆盖广"},"en": {"global": ["Official website","Cross-border e-commerce"],"japan": ["Nationwide drugstores","Ainz & Tulpe","General retail"],"channelLabel": "Drugstore & Mass Retail","channelDesc": "Core distribution via Japanese drugstores and mass retail, with broad e-commerce reach"}},"brandConceptRich": {"zh": {"coreIdea": {"title": "核心理念","desc": "以蜂蜜为核心叙事，将“头发含水量”作为美容指标，整个洗护流程围绕保水展开。"},"expertise": {"title": "专业背书","desc": "ViCREA自有品牌开发，强调成分来源公开与配比透明。"},"science": {"title": "科学实证","desc": "证据优势来自长期市场销售与高评论量，而非公开临床研究。"}},"en": {"coreIdea": {"title": "Core Idea","desc": "Centers on honey as the narrative, treating hair ‘water content’ as the key beauty metric, with the entire routine built around hydration."},"expertise": {"title": "Professional Endorsement","desc": "Developed in-house by ViCREA, emphasizing transparent ingredient sourcing and ratios."},"science": {"title": "Scientific Evidence","desc": "Its evidence advantage comes from long-term sales and high review volume rather than published clinical research."}}},"competitiveAdvantage": {"zh": [{"name": "Moroccanoil","points": ["蜂蜜叙事比单一油类更具情感辨识度","价格更亲民，渠道更下沉","系列步骤感增强复购逻辑"]},{"name": "TSUBAKI（大众品牌）","points": ["更强调“有机”与国际化视觉","蜂蜜甜美香调差异化明显","瓶身设计更具收藏与社交属性"]},{"name": "Kérastase（沙龙线）","points": ["价格更具竞争力，购买门槛低","无需依赖沙龙渠道即可获得","更适合日常自我护理场景"]}],"en": [{"name": "Moroccanoil","points": ["Honey narrative offers stronger emotional distinctiveness than a single oil story","More accessible price point and wider retail reach","Step-numbered range logic encourages repeat purchase"]},{"name": "TSUBAKI (mass brand)","points": ["Stronger “organic”/international visual language","Clear differentiation through a sweet honey scent","Bottle design carries more collectible, social-media appeal"]},{"name": "Kérastase (salon line)","points": ["More competitive pricing, lower purchase barrier","Accessible without relying on a salon channel","Better suited to everyday self-care routines"]}]},"evidenceStats": {"zh": ["证据类型：配方比例、成分来源、自由配方声明与消费者评论","未见官方产品页公开完整临床或仪器测试方案","支撑逻辑：长期市场销售+高评论量+清晰成分比例传播"],"en": ["Evidence type: formula ratios, ingredient sourcing, free-from claims and consumer reviews","No full clinical or instrumental test protocol found on the official product page","Support logic: long-term sales performance + high review volume + transparent ingredient ratios"]},"experienceItems": {"zh": ["质地：浓厚Shea & Honey泡沫","香调：Peony Honey，甜美持续","洗感：柔软滋润，改善毛躁","瓶身：厚重透明切面设计，货架吸睛"],"en": ["Texture: rich Shea & Honey foam","Scent: Peony Honey, sweet and long-lasting","Feel: soft, moisturized, reduces frizz","Bottle: heavy, transparent, faceted design with strong shelf appeal"]},"packagingItems": {"zh": ["视觉：琥珀色透明液体+几何切面瓶+金色泵头","联想：强化“蜂蜜高级感”","步骤编号：1.0/1.5/2.0体系强化仪式感","优势：包装是最难被低成本复制的品牌资产之一"],"en": ["Visual: amber transparent liquid + geometric faceted bottle + gold pump","Association: reinforces a “premium honey” feel","Step numbering: 1.0/1.5/2.0 system reinforces ritual routine","Strength: packaging is one of the hardest brand assets to copy cheaply"]}},{"id": "8thalasso","category": "japan","name": {"zh": "8 THE THALASSO Moist Shampoo","en": "8 THE THALASSO Moist Shampoo"},"brand": {"zh": "8 THE THALASSO","en": "8 THE THALASSO"},"company": {"zh": "Stella Seed","en": "Stella Seed"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "系列既有产品；现版本于 2025 年夏季更新","en": "Existing range; current version renewed in summer 2025"},"market": {"zh": "日本全国药妆、电商、Loft / PLAZA 等","en": "Japanese drugstores, e-commerce, Loft, PLAZA and lifestyle retail"},"capacity": {"zh": "本体 475 mL / 替换装 400 mL","en": "475 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,540 / 替换装 ¥1,210","en": "¥1,540 bottle / ¥1,210 refill"},"positioning": {"zh": "“护肤化的保水美容液洗发水”。把海洋来源成分、干细胞提取物概念、PPT 系洗净成分和 84% 美容液成分整合为高保湿修护叙事。差异点不是单一成分，而是“洗发步骤即美容液护理”。","en": "A skincare-inspired moisture serum shampoo that combines marine-derived ingredients, stem-cell-extract concepts, PPT cleansing agents and an “84% beauty serum ingredients” claim. Its differentiation is not a single active but the idea that shampooing itself functions as a serum-care step."},"target": {"zh": "核心面向干燥、毛躁、打结、缺乏光泽、有染烫或热工具损伤的人群。年龄并未在官方页面明确限定，视觉语言更接近重视成分感、简洁包装和药妆可得性的年轻至中青年消费者。","en": "Aimed at people with dryness, frizz, tangling, dullness and damage from coloring, perming or heat tools. The minimalist packaging and ingredient-focused language appeal mainly to young and middle-aged beauty consumers."},"distribution": {"zh": "本体 475 mL / ¥1,540；替换装 400 mL / ¥1,210。属于日本中价位大众高机能洗护，依赖药妆与大型生活方式零售触达，同时通过官方电商和平台电商覆盖。","en": "475 mL at ¥1,540 and a 400 mL refill at ¥1,210. It sits in Japan’s mid-priced mass-premium haircare segment, with broad distribution through drugstores, lifestyle retailers and e-commerce."},"ingredients": {"zh": "氨基酸系洗净成分 + PPT 系洗净成分；代表成分包括 Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K。Polyquaternium-51 作为保湿与顺滑强化点，“Thalasso stem-cell formula”则是品牌复合概念。新版去除了 Olefin(C12-16) Sulfonate Na，意图降低强清洁印象。","en": "Amino-acid cleansing agents plus PPT-derived surfactants, including Cocoyl Hydrolyzed Collagen K and Cocoyl Hydrolyzed Keratin K. Polyquaternium-51 strengthens hydration and slip, while the “Thalasso stem-cell formula” acts as the brand’s composite technology story."},"evidence": {"zh": "当前公开页面以配方、成分功能及品牌内部比较为主。公开资料明确提到产品中 84% 为美容液成分，但该比例包含水；未看到完整第三方临床报告、详细样本量或公开统计结果。","en": "Public materials focus on formula composition, ingredient functions and internal brand comparisons. The 84% beauty-serum figure includes water. No complete third-party clinical report or detailed sample size was found."},"experience": {"zh": "透明或半透明大容量泵瓶，银白色泵头与竖排极简标签强化“水感、洁净、实验室感”。香型为 Aqua White Floral。洗发剂型强调浓密泡沫、温和清洁、洗后湿润与“ぷるん髪”弹润感。","en": "A transparent large pump bottle with silver-white hardware and vertical minimalist labeling. Aqua White Floral fragrance. The product emphasizes rich foam, mild cleansing, moisturized feel and bouncy, supple hair."},"packaging": {"zh": "极简透明瓶、垂直排版和银白配色是品牌最强识别资产。视觉同时传达海洋、水感和实验室美容液。优点是货架辨识度高；风险是系列扩张后不同功效款外观相近。","en": "The transparent bottle, vertical typography and silver-white palette strongly convey water, marine beauty and laboratory skincare. Shelf recognition is high, although multiple variants can be difficult to distinguish."},"insight": {"zh": "真正值得研究的不是“84% 美容液”这个数字，而是如何把 PPT 洗净成分、阳离子保湿聚合物、海洋成分与干细胞概念整合成一个消费者能理解的 Skinification 故事。","en": "The most valuable lesson is not the 84% claim itself, but the integration of PPT cleansing agents, a moisturizing polymer, marine ingredients and stem-cell language into one understandable skinification story."},"notes": {"zh": "","en": ""},"images": ["https://taosbeauty.com/cdn/shop/files/72664f3e1aa7b236c00fc90563382201_a3885a1b-7e2a-42bd-8220-7212e70b320e.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/c559df78-8834-48c0-b293-45944896881c.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/1eb5fa63-b2b9-4e4b-b5f7-de6727f1b6f8.jpg?v=1753689513&width=1000"],"sources": [["MAQUIA renewal information","https://maquia.hpplus.jp/cosme/170189/"],["Retail product page","https://taosbeauty.com/products/eight-the-thalasso-moist-shampoo"]],"targetUsers": {"zh": ["干燥、毛躁、打结、缺乏光泽人群","染烫或热工具损伤发质","偏好成分感、简洁包装的年轻至中青年消费者","希望“洗发即美容液护理”体验的人群"],"en": ["Dryness, frizz, tangling, dullness","Hair damaged by coloring, perming or heat tools","Young to middle-aged consumers who value ingredient-forward, minimalist packaging","Those seeking a “shampoo as serum care” experience"]},"keyClaims": {"zh": ["84%成分为美容液成分（含水）","干细胞提取物+海洋来源成分复合概念","PPT系洗净成分，兼顾清洁与滋养","2025年夏季配方更新，降低强清洁印象"],"en": ["84% of ingredients are “beauty serum” ingredients (water included)","Composite concept of stem-cell extracts + marine-derived ingredients","PPT-derived cleansing agents balance cleansing and nourishment","Reformulated in summer 2025 to soften the “strong cleansing” impression"]},"heroIngredients": {"zh": [{"name": "Thalasso干细胞复合物","tag": "海洋美容概念","desc": "品牌复合概念，整合海洋来源成分与干细胞提取物叙事"},{"name": "PPT系洗净成分","tag": "氨基酸温和洁净","desc": "Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K等"}],"en": [{"name": "T atment"},"brand": {"zh": "HONEYQUE","en": "HONEYQUE"},"company": {"zh": "Bottle Works","en": "Bottle Works"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2023 年 9 月 13 日","en": "September 13, 2023"},"market": {"zh": "日本药妆、电商及生活方式零售","en": "Japanese drugstores, e-commerce and lifestyle retail"},"capacity": {"zh": "本体 450 mL / 替换装 400 mL","en": "450 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,650 / 替换装 ¥1,210","en": "¥1,650 bottle / ¥1,210 refill"},"positioning": {"zh": "围绕“貯水リペア”和“蜜髪”构建光泽修护定位。产品把有机麦卢卡蜂蜜的保水故事、三种胶原蛋白的空洞损伤修护、角质层护理和热保护整合在一起，主打毛躁、粗硬、内部空洞化和光泽不足。","en": "Positioned around water-retention repair and glossy “honey hair.” Organic Manuka honey, three collagen types, cuticle care and heat protection are combined to address frizz, coarse texture, internal hollow damage and lack of shine."},"target": {"zh": "主要面向染烫、吹风和夹板使用频繁、发丝干燥粗糙、缺乏光泽及难以服帖的人群。视觉和香味偏女性化，但官方没有严格限定年龄。","en": "For consumers with color, perm and heat-tool damage who experience dryness, roughness, poor shine and difficult manageability. The visual and fragrance direction is feminine, though the brand does not impose a strict age limit."},"distribution": {"zh": "本体 450 mL / ¥1,650；替换装 400 mL / ¥1,210。属于日本大众高机能洗护的主流价位。药妆和电商是核心渠道，替换装有利于维持复购。","en": "450 mL at ¥1,650 and a 400 mL refill at ¥1,210. It occupies the mainstream Japanese mass-premium haircare price band, relying on drugstores and e-commerce for reach."},"ingredients": {"zh": "核心故事包括有机麦卢卡蜂蜜、三种胶原蛋白、透明质酸衍生物、神经酰胺、角蛋白和水解丝。官方还提到 γ-Docosalactone 与水解芝麻蛋白衍生物作为热保护相关成分。","en": "Organic Manuka honey, three collagen types, a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk. Heat-care ingredients support a story of retaining internal moisture and smoothing the cuticle."},"evidence": {"zh": "官方公开页面主要提供成分功能、产品特征和热保护成分说明，未见完整公开的人体临床方案、仪器测试数据或样本量。其支撑更偏向成分机理与品牌内部产品开发逻辑。","en": "Official communication mainly provides ingredient functions and product-development logic. No complete public human clinical protocol, instrumental data set or sample size was found."},"experience": {"zh": "450 mL 泵瓶，浅奶油色与蜂蜜琥珀色组合，强调甜润、柔软和高光泽。香型为 Aqua Blossom Honey。护发素定位强调包裹感、湿发顺滑、冲洗后的柔软度以及吹干后的服帖和光泽。","en": "A 450 mL pump bottle in soft cream and honey-amber tones. Aqua Blossom Honey fragrance. The conditioner emphasizes coating, wet detangling, softness after rinsing, and smooth glossy hair after drying."},"packaging": {"zh": "柔和浅色瓶身、蜂蜜色液滴与圆润泵头形成明显的甜润感。相比 &honey 的装饰性包装，HONEYQUE 更简洁成熟；相比专业沙龙品牌，则更亲和。","en": "Soft colors, honey-toned details and a rounded pump create a rich but approachable look. It is simpler and more mature than highly decorative honey brands, while remaining more friendly than salon-professional packaging."},"insight": {"zh": "核心优势是把蜂蜜故事从“天然保湿”推进到“发丝空洞化修护”，因此比单纯的蜂蜜香氛产品更具技术感。较容易复制的是成分组合；较难复制的是蜜感视觉、香味、顺滑触感和全系列传播的一致性。","en": "Its strength is extending honey from a natural-moisture story into internal hollow-damage repair. The ingredient combination is easy to copy; the difficult part is achieving consistent scent, slip, gloss and visual identity across the line."},"notes": {"zh": "","en": ""},"images": ["https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml1.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml2.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml3.png?v=1745527002&width=1024"],"sources": [["Official product page","https://honeyque.jp/products/rich-gloss-treatment/"],["MAQUIA","https://maquia.hpplus.jp/cosme/170297/"],["Brand concept","https://honeyque.jp/"]],"targetUsers": {"zh": ["染烫、吹风、夹板等热工具使用频繁人群","发丝干燥粗糙、缺乏光泽人群","难以服帖、内部空洞化受损发质","视觉与香味偏好女性化护理体验的消费者"],"en": ["Frequent users of coloring, blow-drying and flat irons","Dry, rough, dull hair","Hard-to-manage hair with internal hollow damage","Consumers who prefer a feminine visual and fragrance experience"]},"keyClaims": {"zh": ["有机麦卢卡蜂蜜“貯水リペア”保水修护","三种胶原蛋白修护空洞化损伤","角质层护理+热保护成分","     out+=iconBox('\ud83c\udf10',t.marketChannel,mcHtml);
  }else{

  }
  const adv=biList(p.competitiveAdvantage);
  if(adv.length){
    const advHtml=`<div class="adv-grid">${adv.map(c=>`<div><div class="adv-col-title">VS ${esc(c.name)}</div><ul class="ul-check">${(c.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    out+=iconBox('\ud83c\udfc6',t.competitiveAdvantage,advHtml);
  }
  return out;
}

function compressImage(file,maxDim=1200,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function exportPptx(){
  if(typeof PptxGenJS==='undefined'){toast(lang==='zh'?'PPT组件加载失败，请确认网络连接':'PPT library failed to load; check your connection');return}
  const savedLang=lang;
  lang='en';
  try{
  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE';
  pptx.author='Competitor Library';
  pptx.subject='Competitive intelligence';
  pptx.title='Competitor Library';
  pptx.company='Internal';
  pptx.lang='en-US';

  function imgOpt(u){ return u&&u.startsWith('data:') ? {data:u} : {path:u}; }
  function bulletBody(list){ return (list||[]).map(x=>'• '+x).join('\n'); }

  function blocksFor(p){
    const arr=[];
    if(bi(p.positioning)) arr.push([tr().positioning,bi(p.positioning)]);
    if(biList(p.targetUsers).length) arr.push([tr().targetUser,bulletBody(biList(p.targetUsers))]);
    else if(bi(p.target)) arr.push([tr().target,bi(p.target)]);
    if(biList(p.keyClaims).length) arr.push([tr().keyClaims,bulletBody(biList(p.keyClaims))]);
    const bc=biObj(p.brandConceptRich);
    if(bc){
      const t=['coreIdea','expertise','science'].map(k=>bc[k]?`${bc[k].title}: ${bc[k].desc}`:'').filter(Boolean).join('\n');
      if(t) arr.push([tr().brandConcept,t]);
    }else if(bi(p.brandConcept)){ arr.push([tr().brandConcept,bi(p.brandConcept)]); }
    if(biList(p.heroIngredients).length){
      let t=biList(p.heroIngredients).map(ing=>`${ing.name} — ${ing.tag}: ${ing.desc}`).join('\n');
      if(bi(p.ingredientsNote)) t+='\n'+bi(p.ingredientsNote);
      arr.push([tr().heroIngredients,t]);
    }else if(bi(p.ingredients)){ arr.push([tr().ingredients,bi(p.ingredients)]); }
    const pp=biObj(p.pricePositioning);
    if(pp) arr.push([tr().pricePositioning,`${pp.label} (${pp.tier})`]);
    if(biList(p.evidenceStats).length) arr.push([tr().evidence,bulletBody(biList(p.evidenceStats))]);
    else if(bi(p.evidence)) arr.push([tr().evidence,bi(p.evidence)]);
    if(biList(p.experienceItems).length) arr.push([tr().experience,bulletBody(biList(p.experienceItems))]);
    else if(bi(p.experience)) arr.push([tr().experience,bi(p.experience)]);
    if(biList(p.packagingItems).length) arr.push([tr().packaging,bulletBody(biList(p.packagingItems))]);
    else if(bi(p.packaging)) arr.push([tr().packaging,bi(p.packaging)]);
    const mc=biObj(p.marketChannel);
    if(mc){
      const t=`Global: ${(mc.global||[]).join(', ')}\nJapan: ${(mc.japan||[]).join(', ')}\nChannel: ${mc.channelLabel} — ${mc.channelDesc}`;
      arr.push([tr().marketChannel,t]);
    }else if(bi(p.market)){ arr.push([tr().market,bi(p.market)]); }
    const adv=biList(p.competitiveAdvantage);
    if(adv.length){
      const t=adv.map(c=>`VS ${c.name}: ${(c.points||[]).join('; ')}`).join('\n');
      arr.push([tr().competitiveAdvantage,t]);
    }
    if(bi(p.insight)) arr.push([tr().insight,bi(p.insight)]);
    return arr;
  }

  for(let i=0;i<products.length;i++){
    const p=products[i];
    const idxLabel=String(i+1).padStart(3,'0');
    const images=(p.images||[]).slice(0,6);

    // ---- Cover slide ----
    const cover=pptx.addSlide();
    cover.background={color:'EFEDE2'};
    cover.addText(`${idxLabel}  ${bi(p.name)}`,{x:.45,y:.35,w:12.1,h:.55,fontFace:'Montserrat',fontSize:24,bold:true,color:'20302C',margin:0});
    cover.addText(`${bi(p.brand)}   ·   ${p.category==='japan'?'Japan':'Europe'}`,{x:.47,y:.92,w:8,h:.3,fontFace:'Montserrat',fontSize:11,color:'BE8F35',bold:true,margin:0});
    const gridPos=[[.55,1.5,3.7,3.05],[4.35,1.5,3.7,3.05],[.55,4.65,3.7,2.55],[4.35,4.65,3.7,2.55]];
    images.slice(0,4).forEach((u,j)=>{
      const [x,y,w,h]=gridPos[j];
      try{cover.addImage({...imgOpt(u),x,y,w,h,sizing:{type:'contain',w,h}})}catch(e){}
    });
    const introX=8.25,introW=4.4;
    cover.addText(tr().positioning,{x:introX,y:1.5,w:introW,h:.25,fontFace:'Montserrat',fontSize:10,bold:true,color:'7A5A18',margin:0});
    cover.addText(bi(p.positioning)||'',{x:introX,y:1.78,w:introW,h:2.3,fontFace:'Noto Sans SC',fontSize:10.5,color:'20302C',valign:'top',fit:'shrink',margin:0});
    const chipRow=[[tr().brand,bi(p.brand)],[tr().company,bi(p.company)],[tr().origin,bi(p.origin)],[tr().capacity,bi(p.capacity)],[tr().launch,bi(p.launch)],[tr().price,bi(p.price)]];
    chipRow.forEach(([lab,val],j)=>{
      const cx=introX+(j%2)*2.25, cy=4.3+Math.floor(j/2)*.95;
      cover.addShape(pptx.ShapeType.rect,{x:cx,y:cy,w:2.1,h:.82,fill:{color:'FFFFFF'},line:{color:'DDD8C6',width:1},radius:.05});
      cover.addText(lab,{x:cx+.12,y:cy+.08,w:1.86,h:.2,fontFace:'Montserrat',fontSize:7.5,bold:true,color:'8B8A7D',margin:0});
      cover.addText(val||'',{x:cx+.12,y:cy+.3,w:1.86,h:.45,fontFace:'Noto Sans SC',fontSize:9,color:'20302C',fit:'shrink',margin:0});
    });
    if(images.length>4){
      cover.addText(`+${images.length-4} more images`,{x:.55,y:6.95,w:3.5,h:.25,fontFace:'Montserrat',fontSize:8,color:'8B8A7D',margin:0});
    }

    // ---- Content slides (paginated, ~6 blocks each) ----
    const blocks=blocksFor(p).filter(b=>b[0]!==tr().positioning);
    const perSlide=6;
    const positions=[[.45,1.1,4.05,1.75],[4.65,1.1,4.05,1.75],[8.85,1.1,4.05,1.75],[.45,3.0,4.05,1.75],[4.65,3.0,4.05,1.75],[8.85,3.0,4.05,1.75]];
    for(let s=0;s<blocks.length;s+=perSlide){
      const pageBlocks=blocks.slice(s,s+perSlide);
      const slide=pptx.addSlide();
      slide.background={color:'FFFFFF'};
      slide.addText(`${idxLabel}  ${bi(p.name)}`,{x:.45,y:.32,w:12.1,h:.45,fontFace:'Montserrat',fontSize:16,bold:true,color:'20302C',margin:0});
      pageBlocks.forEach((b,j)=>{
        const [x,y,w,h]=positions[j];
        slide.addShape(pptx.ShapeType.rect,{x,y,w,h,fill:{color:'FBFAF6'},line:{color:'DDD8C6',width:1},radius:.06});
        slide.addText(b[0],{x:x+.16,y:y+.12,w:w-.32,h:.22,fontFace:'Montserrat',fontSize:8.5,bold:true,color:'7A5A18',margin:0});
        slide.addText(b[1],{x:x+.16,y:y+.4,w:w-.32,h:h-.5,fontFace:'Noto Sans SC',fontSize:8.8,color:'20302C',valign:'top',fit:'shrink',margin:0});
      });
    }
  }
  await pptx.writeFile({fileName:'Competitor_Library_EN.pptx'});
    }catch(err){
    console.error('exportPptx failed:',err);
    toast((savedLang==='zh'?'幻灯片生成出错：':'Slide generation error: ')+(err&&err.message?err.message:err));
  }finally{
    lang=savedLang;
  }
}
