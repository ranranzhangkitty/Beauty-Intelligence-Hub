"launch": {"zh": "2023 年 9 月 13 日","en": "September 13, 2023"},"market": {"zh": "日本药妆、电商及生活方式零售","en": "Japanese drugstores, e-commerce and lifestyle retail"},"capacity": {"zh": "本体 450 mL / 替换装 400 mL","en": "450 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,650 / 替换装 ¥1,210","en": "¥1,650 bottle / ¥1,210 refill"},"positioning": {"zh": "围绕“貯水リペア”和“蜜髪”构建光泽修护定位。产品把有机麦卢卡蜂蜜的保水故事、三种胶原蛋白的空洞损伤修护、角质层护理和热保护整合在一起，主打毛躁、粗硬、内部空洞化和光泽不足。","en": "Positioned around water-retention repair and glossy “honey hair.” Organic Manuka honey, three collagen types, cuticle care and heat protection are combined to address frizz, coarse texture, internal hollow damage and lack of shine."},"target": {"zh": "主要面向染烫、吹风和夹板使用频繁、发丝干燥粗糙、缺乏光泽及难以服帖的人群。视觉和香味偏女性化，但官方没有严格限定年龄。","en": "For consumers with color, perm and heat-tool damage who experience dryness, roughness, poor shine and difficult manageability. The visual and fragrance direction is feminine, though the brand does not impose a strict age limit."},"distribution": {"zh": "本体 450 mL / ¥1,650；替换装 400 mL / ¥1,210。属于日本大众高机能洗护的主流价位。药妆和电商是核心渠道，替换装有利于维持复购。","en": "450 mL at ¥1,650 and a 400 mL refill at ¥1,210. It occupies the mainstream Japanese mass-premium haircare price band, relying on drugstores and e-commerce for reach."},"ingredients": {"zh": "核心故事包括有机麦卢卡蜂蜜、三种胶原蛋白、透明质酸衍生物、神经酰胺、角蛋白和水解丝。官方还提到 γ-Docosalactone 与水解芝麻蛋白衍生物作为热保护相关成分。","en": "Organic Manuka honey, three collagen types, a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk. Heat-care ingredients support a story of retaining internal moisture and smoothing the cuticle."},"evidence": {"zh": "官方公开页面主要提供成分功能、产品特征和热保护成分说明，未见完整公开的人体临床方案、仪器测试数据或样本量。其支撑更偏向成分机理与品牌内部产品开发逻辑。","en": "Official communication mainly provides ingredient functions and product-development logic. No complete public human clinical protocol, instrumental data set or sample size was found."},"experience": {"zh": "450 mL 泵瓶，浅奶油色与蜂蜜琥珀色组合，强调甜润、柔软和高光泽。香型为 Aqua Blossom Honey。护发素定位强调包裹感、湿发顺滑、冲洗后的柔软度以及吹干后的服帖和光泽。","en": "A 450 mL pump bottle in soft cream and honey-amber tones. Aqua Blossom Honey fragrance. The conditioner emphasizes coating, wet detangling, softness after rinsing, and smooth glossy hair after drying."},"packaging": {"zh": "柔和浅色瓶身、蜂蜜色液滴与圆润泵头形成明显的甜润感。相比 &honey 的装饰性包装，HONEYQUE 更简洁成熟；相比专业沙龙品牌，则更亲和。","en": "Soft colors, honey-toned details and a rounded pump create a rich but approachable look. It is simpler and more mature than highly decorative honey brands, while remaining more friendly than salon-professional packaging."},"insight": {"zh": "核心优势是把蜂蜜故事从“天然保湿”推进到“发丝空洞化修护”，因此比单纯的蜂蜜香氛产品更具技术感。较容易复制的是成分组合；较难复制的是蜜感视觉、香味、顺滑触感和全系列传播的一致性。","en": "Its strength is extending honey from a natural-moisture story into internal hollow-damage repair. The ingredient combination is easy to copy; the difficult part is achieving consistent scent, slip, gloss and visual identity across the line."},"notes": {"zh": "","en": ""},"images": ["https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml1.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml2.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml3.png?v=1745527002&width=1024"],"sources": [["Official product page","https://honeyque.jp/products/rich-gloss-treatment/"],["MAQUIA","https://maquia.hpplus.jp/cosme/170297/"],["Brand concept","https://honeyque.jp/"]],"targetUsers": {"zh": ["染烫、吹风、夹板等热工具使用频繁人群","发丝干燥粗糙、缺乏光泽人群","难以服帖、内部空洞化受损发质","视觉与香味偏好女性化护理体验的消费者"],"en": ["Frequent users of coloring, blow-drying and flat irons","Dry, rough, dull hair","Hard-to-manage hair with internal hollow damage","Consumers who prefer a feminine visual and fragrance experience"]},"keyClaims": {"zh": ["有机麦卢卡蜂蜜“貯水リペア”保水修护","三种胶原蛋白修护空洞化损伤","角质层护理+热保护成分","替换装设计，利于维持复购"],"en": ["Organic Manuka honey “water-retention repair” (chosui repair)","Three collagen types repair internally hollowed-out damage","Cuticle care plus heat-protection ingredients","Refill pack design supports repeat purchase"]},"heroIngredients": {"zh": [{"name": "有机麦卢卡蜂蜜","tag": "保水修护核心","desc": "“貯水リペア”故事，锁住发丝内部水分"},{"name": "三种胶原蛋白","tag": "空洞化损伤修护","desc": "修护发丝内部空洞化损伤，提升光泽与柔顺度"}],"en": [{"name": "Organic Manuka Honey","tag": "Core water-retention repair","desc": "The “water-retention repair” story that locks moisture inside the hair"},{"name": "Three Collagen Types","tag": "Hollow-damage repair","desc": "Repairs internally hollowed-out damage, boosting shine and smoothness"}]},"ingredientsNote": {"zh": "官方还提到γ-Docosalactone与水解芝麻蛋白衍生物作为热保护相关成分，搭配透明质酸衍生物、神经酰胺、角蛋白和水解丝。","en": "The brand also cites γ-Docosalactone and a hydrolyzed sesame protein derivative as heat-care ingredients, alongside a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk."},"pricePositioning": {"zh": {"tier": "masstige","label": "大众高机能主流价位"},"en": {"tier": "masstige","label": "Mainstream Mass-Premium"}},"marketChannel": {"zh": {"global": ["品牌官网","海外电商（LAMOUR等）"],"japan": ["药妆","生活方式零售"],"channelLabel": "Drugstore & E-commerce","channelDesc": "药妆与电商为核心，替换装利于维持复购"},"en": {"global": ["Official website","Overseas e-commerce (LAMOUR, etc.)"],"japan": ["Drugstores","Lifestyle retail"],"channelLabel": "Drugstore & E-commerce","channelDesc": "Core distribution via drugstores and e-commerce; refill packs support repeat purchase"}},"brandConceptRich": {"zh": {"tagline": "蜂蜜胶原，让头发记住水分。","concept": "HONEYQUE定位为更亲民的蜂蜜修护替代品，用有机麦卢卡蜂蜜与胶原蛋白专门修护发丝内部空洞化损伤，而非仅仅解决表层干燥。"},"en": {"tagline": "Honey Collagen, for hair that remembers water.","concept": "HONEYQUE positions itself as the accessible honey-repair alternative, using organic Manuka honey and collagen to target internally hollowed-out damage rather than surface dryness alone."}},"competitiveAdvantage": {"zh": [{"name": "Gisou","points": ["价格更亲民，购买门槛远低于Gisou的高端定价","更强调“空洞化修护”技术叙事，而非纯粹蜂蜜香氛联想","药妆/电商渠道更易触达，无需依赖精品美妆专柜"]},{"name": "OUAI","points": ["更强调具体功效成分（胶原蛋白、神经酰胺）而非生活方式营销","日本本土渠道覆盖更深，海外零售仍处起步阶段","香调走“甜美蜂蜜”路线，与OUAI的中性香氛调性形成差异化"]},{"name": "Briogeo","points": ["同样主打胶原蛋白修护，但更强调“蜜感”体验与日系包装美学","替换装设计更利于日常复购，Briogeo更依赖单瓶定价","价格带更贴近大众高机能，Briogeo定位略高"]}],"en": [{"name": "Gisou","points": ["More accessible price, far below Gisou's prestige positioning","Leads with a “hollow-damage repair” technology story rather than a purely honey-fragrance association","Easier to reach via drugstore/e-commerce, without relying on prestige beauty counters"]},{"name": "OUAI","points": ["Leans on specific functional ingredients (collagen, ceramides) rather than lifestyle-driven marketing","Deeper penetration in Japan's domestic channels, though still early-stage in overseas retail","Sweet honey scent direction differentiates from OUAI's more neutral fragrance tone"]},{"name": "Briogeo","points": ["Also centers on collagen repair, but leans more into a “honey-touch” sensorial experience and J-beauty packaging aesthetic","Refill pack design better supports everyday repeat purchase; Briogeo relies more on single-bottle pricing","Sits closer to the mass-premium price band, while Briogeo is positioned slightly higher"]}]},"evidenceStats": {"zh": ["公开页面主要提供成分功能与产品特征说明","未见完整公开的人体临床方案或仪器测试数据","支撑逻辑偏向成分机理与品牌内部开发逻辑"],"en": ["Official page mainly provides ingredient function and product-feature descriptions","No complete public human clinical protocol or instrumental data set was found","Support logic leans on ingredient mechanism and internal brand development logic"]},"experienceItems": {"zh": ["瓶身：450 mL泵瓶，浅奶油+蜂蜜琥珀配色","香调：Aqua Blossom Honey","洗感：湿发顺滑，冲洗后柔软","吹干后：服帖有光泽"],"en": ["Bottle: 450 mL pump, soft cream + honey-amber tones","Scent: Aqua Blossom Honey","Feel: smooth detangling wet, soft after rinsing","After drying: sleek and glossy"]},"packagingItems": {"zh": ["视觉：柔和浅色瓶身+蜂蜜色液滴+圆润泵头","定位：比&honey更简洁成熟，比沙龙品牌更亲和","规格：本体450 mL+替换装400 mL","优势：替换装降低复购门槛"],"en": ["Visual: soft-colored bottle + honey-toned droplet motif + rounded pump","Positioning: simpler/more mature than &honey, friendlier than salon brands","Sizes: 450 mL bottle + 400 mL refill","Strength: refill pack lowers the repeat-purchase barrier"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "貯水リペア保水修护技术","desc": "品牌自有命名的保水修护技术体系，专门针对发丝内部空洞化损伤设计。"},{"title": "三重胶原复合技术","desc": "组合三种不同类型的胶原蛋白协同修护，而非依赖单一胶原成分。"}],"en": [{"title": "Water-Retention Repair (Chosui Repair) System","desc": "A brand-named repair technology specifically engineered to address internally hollowed-out hair damage."},{"title": "Triple Collagen Complex","desc": "Combines three distinct collagen types working together, rather than relying on a single collagen ingredient."}]},"addedAt": 4},{"id": "kinkycurly-knottoday","category": "usa","name": {"zh": "Kinky-Curly Knot Today","en": "Kinky-Curly Knot Today"},"brand": {"zh": "Kinky-Curly","en": "Kinky-Curly"},"company": {"zh": "Kinky-Curly Hair Care","en": "Kinky-Curly Hair Care"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "天然发社群经典长青单品（早年推出，长期在售）","en": "A natural-hair community classic, launched years ago and still a staple"},"market": {"zh": "品牌官网、Sally Beauty、CVS、Meijer等美国零售渠道","en": "Brand website, Sally Beauty, CVS, Meijer and other US retail channels"},"capacity": {"zh": "8 fl oz / 236 mL","en": "8 fl oz / 236 mL"},"price": {"zh": "约US$14","en": "~US$14"},"positioning": {"zh": "打结今日终结，奶油质地的草本护发素/免洗顺发乳，专为浓密纠结的卷发/紧致纹理发梳理设计，可作冲洗型护发素或免洗使用。","en": "Knot Today (a play on 'not today'), a creamy herbal conditioner/detangler for thick, tangle-prone curly and coily hair, usable as either a rinse-out conditioner or a leave-in."},"target": {"zh": "浓密卷发/紧致纹理发、拆卸编发/延伸发后急需梳理的人群；天然发社群中配方极简的忠实拥趸。","en": "Thick, curly/coily hair, especially post-braid or post-extension detangling needs; loyal natural-hair community members who favor minimalist formulas."},"ingredients": {"zh": "有机芒果果提取物、有机榆树皮提取物、有机蜀葵根提取物、有机柠檬草提取物、鲸蜡醇、双十八烷基甲基硫酸铵甲基硫酸盐（Behentrimonium Methosulfate）、柠檬酸、苯氧乙醇、天然香精。","en": "Organic mango fruit extract, organic slippery elm, organic marshmallow root, organic lemongrass, cetyl alcohol, behentrimonium methosulfate, citric acid, phenoxyethanol, natural fragrance."},"evidence": {"zh": "宣称主要基于成分描述与十余年的消费者口碑（天然发博主评测、社群评价），未见公开的独立临床或仪器测试数据。","en": "Claims rest mainly on ingredient descriptions and over a decade of consumer word-of-mouth (natural-hair blogger reviews, community reviews); no public independent clinical or instrumental data found."},"experience": {"zh": "奶油质地，洗发后大量涂抹并用宽齿梳分区梳理；也可作免洗护发素用于浓密卷发。用户反馈滑感极佳但保湿力对干发需搭配其他产品。","en": "Creamy texture; apply generously after shampooing and detangle in sections with a wide-tooth comb. Can also be used as a leave-in for thick curly hair. Users report excellent slip, though it should be paired with a separate moisturizer for dry hair."},"packaging": {"zh": "简约塑料瓶身，粉色系视觉与手写体品牌名，走亲和、怀旧的天然发社群美学，识别度高但不算精品化。","en": "Simple plastic bottle with a pink color scheme and a handwritten-style logo, an approachable, nostalgic natural-hair community aesthetic, recognizable but not premium in feel."},"insight": {"zh": "Knot Today长期稳居天然发社群必入清单，证明极简、聚焦单一痛点（打结/梳理）的产品，凭借持续口碑传播也能在拥挤市场中占据长期心智份额，而不依赖频繁的产品迭代或营销投入。","en": "Knot Today's long-standing place on natural-hair must-buy lists shows that a minimalist product solving one clear pain point (tangles/detangling) can hold durable mindshare in a crowded market through sustained word-of-mouth, without frequent reformulation or heavy marketing spend."},"notes": {"zh": "","en": ""},"images": ["https://kinky-curly.com/cdn/shop/products/Kinky-CurlyKnotToday_1200x1200.png?v=1606339935"],"sources": [["Official product page","https://kinky-curly.com/products/knot-today"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/kinky-curly-knot-today-odzywka-bez-splukiwania"]],"targetUsers": {"zh": ["浓密卷发/紧致纹理发人群","拆卸编发、延伸发后需要梳理的人群","偏好极简成分配方的天然发社群成员","习惯在CVS/Sally Beauty等渠道购买的消费者"],"en": ["Thick, curly/coily hair","Post-braid or post-extension detangling needs","Natural-hair community members who prefer minimalist formulas","Shoppers who buy at CVS/Sally Beauty channels"]},"keyClaims": {"zh": ["顺滑梳理，减少打结与拉扯","可作冲洗型护发素或免洗使用","适合浓密卷发/紧致纹理发","天然草本成分，配方简洁"],"en": ["Smooth detangling, reduces knots and pulling","Usable as rinse-out conditioner or leave-in","Suited to thick curly/coily hair","Natural herbal ingredients, minimalist formula"]},"heroIngredients": {"zh": [{"name": "有机芒果果提取物","tag": "顺滑保湿","desc": "提供丝滑梳理感与轻盈保湿"},{"name": "有机蜀葵根+榆树皮提取物","tag": "顺发滑感来源","desc": "天然黏滑质地成分，赋予护发素标志性滑感"}],"en": [{"name": "Organic Mango Fruit Extract","tag": "Slip & moisture","desc": "Provides silky detangling slip and light hydration"},{"name": "Organic Marshmallow Root + Slippery Elm","tag": "Signature slip","desc": "Naturally mucilaginous extracts that give the conditioner its signature slip"}]},"ingredientsNote": {"zh": "配方还含柠檬草提取物提供清新香调，双十八烷基甲基硫酸铵甲基硫酸盐作为调理剂主力成分，整体配方成分数量精简，是该品牌极简定位的直接体现。","en": "The formula also includes lemongrass extract for a fresh scent, with behentrimonium methosulfate as the primary conditioning agent, an overall short ingredient list that directly reflects the brand's minimalist positioning."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Community Staple"},"en": {"tier": "mass","label": "Mass Community Staple"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "美国药妆与大众零售渠道为核心分销路径"},"en": {"global": ["Brand website","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "US drugstore and mass retail are the core distribution channels"}},"brandConceptRich": {"zh": {"tagline": "干净、简单、Wash-and-Go。","concept": "作为最早的天然清洁配方品牌之一，Kinky-Curly靠极简成分表和专注于卷发/紧卷发wash-and-go造型解结的单一定位建立口碑。"},"en": {"tagline": "Clean, simple, wash-and-go.","concept": "One of the original clean natural-hair brands, Kinky-Curly built its reputation on short, minimal ingredient lists and a singular focus on detangling for wash-and-go kinky and curly styling."}},"competitiveAdvantage": {"zh": [{"name": "Uncle Funky's Daughter系列","points": ["更聚焦梳理/打结这一单一场景，而非造型定型","价格更亲民","渠道覆盖(CVS/Meijer)比UFD更下沉"]},{"name": "Cantu Shea Butter Leave-In","points": ["草本滑感成分组合更独特（芒果+蜀葵根+榆树皮）","品牌社群忠诚度历史更悠久","Cantu渠道覆盖与营销投入更大"]},{"name": "Jessicurl","points": ["价格更具竞争力，渠道更广泛（CVS等大众药妆）","配方更极简，学习成本更低","Jessicurl保湿力评价通常更高"]}],"en": [{"name": "Uncle Funky's Daughter line","points": ["More narrowly focused on detangling vs. styling/hold","More accessible price","Broader mass-retail reach (CVS/Meijer) than UFD"]},{"name": "Cantu Shea Butter Leave-In","points": ["More distinctive slip-ingredient blend (mango + marshmallow root + slippery elm)","Longer community loyalty history","Cantu has broader retail reach and marketing spend"]},{"name": "Jessicurl","points": ["More competitive pricing, broader retail reach (CVS etc.)","Simpler formula, lower learning curve for users","Jessicurl is generally rated higher for moisture"]}]},"evidenceStats": {"zh": ["宣称主要基于十余年消费者口碑与博主评测","未见独立第三方临床或仪器测试数据","部分评论指出保湿力对干发需搭配其他产品"],"en": ["Claims rest mainly on over a decade of consumer word-of-mouth and blogger reviews","No independent third-party clinical or instrumental data found","Some reviews note it needs pairing with another product for dry hair moisture"]},"experienceItems": {"zh": ["质地：奶油状护发素","用法：冲洗型或免洗均可，宽齿梳分区梳理","场景：拆卸编发/延伸发后梳理首选","反馈：滑感佳，保湿力对干发略弱"],"en": ["Texture: creamy conditioner","Usage: works as rinse-out or leave-in, detangle in sections with a wide-tooth comb","Occasion: a go-to after removing braids/extensions","Feedback: great slip, moisture may be light for very dry hair"]},"packagingItems": {"zh": ["视觉：简约瓶身+粉色系配色+手写体logo","联想：亲和、怀旧的天然发社群美学","规格：8oz家用装为主","优势：识别度高，长期在售形成信任资产"],"en": ["Visual: simple bottle, pink color scheme, handwritten-style logo","Association: approachable, nostalgic natural-hair community aesthetic","Size: mainly 8oz household size","Strength: high recognition, long tenure builds trust as a brand asset"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "极简顺滑剂配方技术","desc": "围绕少数高效顺滑/解结成分构建配方，而非堆砌长长的成分列表。"},{"title": "Wash-and-Go适配测试","desc": "专门针对wash-and-go造型方法进行配方适配与测试。"}],"en": [{"title": "Minimalist Slip-Agent Formulation","desc": "Built around a small number of high-performing slip and detangling agents rather than a long ingredient list."},{"title": "Wash-and-Go Compatibility Testing","desc": "Formulated and tested specifically for compatibility with the wash-and-go styling method."}]},"addedAt": 10},{"id": "loreal","category": "europe","name": {"zh": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo","en": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo"},"brand": {"zh": "L’Oréal Professionnel","en": "L’Oréal Professionnel"},"company": {"zh": "L’Oréal","en": "L’Oréal"},"origin": {"zh": "法国","en": "France"},"launch": {"zh": "Scalp Advanced 系列现行版本","en": "Current Scalp Advanced range"},"market": {"zh": "全球专业沙龙、品牌官网与授权零售；日本以进口电商为主","en": "Professional salons, official channels and authorized retail; mainly import e-commerce in Japan"},"capacity": {"zh": "300 mL / 500 mL","en": "300 mL / 500 mL"},"price": {"zh": "日本进口价约 ¥3,490–¥4,620（300 mL）","en": "Approx. ¥3,490–¥4,620 in Japan (300 mL)"},"positioning": {"zh": "欧莱雅专业线针对头屑与头皮微生态失衡人群推出的沙龙级治疗型洗发产品。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。","en": "A salon-grade treatment shampoo from L'Oréal Professionnel, developed for people with dandruff and scalp micro-ecology imbalance. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations."},"target": {"zh": "核心消费者是反复出现可见头屑、同时担心头皮干燥、油腻或不适的人群。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。官方未限定性别；产品覆盖干性与油性头屑场景。","en": "Designed for consumers with recurring visible dandruff who may also experience dryness, oiliness or discomfort. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations. Official communication is gender-neutral and covers both dry and oily dandruff."},"distribution": {"zh": "300 mL 与 500 mL 两种规格，主要依赖专业沙龙、L’Oréal Professionnel 官方渠道及各国授权零售。日本并非其最强本土渠道，进口电商价格差异较大，因此价格竞争力不如日本本土药妆洗护，但专业品牌形象和针对性头皮功效支撑了溢价。","en": "Available in 300 mL and 500 mL sizes through professional salons, official L’Oréal Professionnel channels and authorized retailers. In Japan, import pricing varies considerably, so it is less price-competitive than domestic drugstore products. Its premium is supported by professional branding and targeted scalp efficacy."},"ingredients": {"zh": "核心活性为 Piroctone Olamine，用于去屑及抑制与头屑相关的微生物；配方中还可见 Salicylic Acid、Glycerin、Coco-Betaine、Guar Hydroxypropyltrimonium Chloride 等。整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The key active is Piroctone Olamine for dandruff control. The formula also includes Salicylic Acid, Glycerin, Coco-Betaine and Guar Hydroxypropyltrimonium Chloride. The cleansing base is conventional, while humectants, conditioning polymers and sensorial modifiers improve the professional-use experience. The broader Scalp Advanced range frames these ingredients within a scalp-skinification story."},"evidence": {"zh": "官方公开资料给出了较清晰的测试层级：首次使用后“最多去除 100% 可见头屑”为消费者测试；“最长 72 小时去屑保护”为临床测试；另有 44 名受试者、每周使用 3 次的临床测试描述，用于支持头屑外观减少。公开页面仍未完整披露各测试的详细设计、对照组和统计方法，因此适合归类为“有消费者与临床支持，但完整研究报告未公开”。","en": "Official materials describe consumer and clinical testing, including removal of up to 100% visible dandruff after first use and protection lasting up to 72 hours. A 44-subject clinical test used three applications per week. However, full protocols, control design and statistical details are not publicly available."},"experience": {"zh": "轻盈乳霜型洗发质地，目标是兼顾去屑清洁和头皮舒适度。官方建议在湿发与头皮上均匀涂抹，用指腹轻柔起泡后冲洗，油性头屑可先搭配同系列深层净化产品。香气被描述为中性、清新、具有洁净感和专业护理基调。包装为白色专业线瓶身，搭配淡蓝绿色区块和黑色瓶盖，视觉接近皮肤科与沙龙专业护理。","en": "A lightweight cream shampoo designed to combine anti-dandruff cleansing with scalp comfort. It is applied to wet hair and scalp, gently lathered with fingertips, then rinsed. The scent is clean, neutral and professional. White packaging with pale blue-green accents creates a dermatological salon-care impression."},"packaging": {"zh": "白色大面积留白、黑色专业品牌标识、浅蓝绿色功能标签，强化“临床、洁净、专业”的视觉联想。300 mL / 500 mL 规格便于区分家用和沙龙需求。优势是专业感强、功能识别直接；弱点是与其他 Scalp Advanced 单品外观接近，消费者需要仔细阅读功能名称。","en": "Large white areas, a black professional logo and pale blue-green functional labels communicate clinical cleanliness and expertise. The 300 mL and 500 mL formats serve home and salon use. The design is professional and clear, although products within the range look similar and require close label reading."},"insight": {"zh": "其真正竞争力不是单一的 Piroctone Olamine，而是把经典去屑活性放进专业沙龙与头皮皮肤学叙事中，并用可量化功效、专家共创和更精致的质地完成品牌升级。最值得学习的是“功能问题—专业诊断—方案组合”的完整路径。较容易被复制的是基础表活和去屑活性组合；较难复制的是全球沙龙网络、品牌权威和成套产品协议。","en": "Its advantage is not Piroctone Olamine alone, but the way a classic anti-dandruff active is elevated through professional salon authority, scalp-skinification and quantified claims. The easiest elements to replicate are the cleansing and active system; the hardest are the global salon network, brand authority and protocol-led portfolio."},"notes": {"zh": "","en": ""},"images": ["https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/1-slider.jpg?rev=efaa1ce17fbc46e89231df450630a23c&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=3C7CB343DD83CA74C193FAC4DD71971D","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/2-slider.jpg?rev=fc2f59083a7441b2ba529fec034b0952&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=EA207AAB5C9EC015B416591B12F0BB8C","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/3-slider.jpg?rev=a86a74bd0af444e5af9c0945b5b5270d&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=2D01FDE06D41407D4C65FA6D849910BB"],"sources": [["L’Oréal Professionnel Official","https://www.lorealprofessionnel.com/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["L’Oréal Professionnel UK","https://www.lorealprofessionnel.co.uk/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["Japan retail reference","https://makeup.jp/product/730063/"]],"targetUsers": {"zh": ["中度至重度头屑人群","头皮敏感、瘙痒人群","经常染烫、头皮受损人群","追求沙龙级专业护理的消费者"],"en": ["Moderate to severe dandruff","Sensitive, itchy scalp","Frequently colored/permed, damaged scalp","Consumers seeking salon-grade professional care"]},"keyClaims": {"zh": ["有效去屑，长效抑制头屑再生","舒缓头皮不适，减少瘙痒","平衡头皮微生态","专业沙龙级配方，温和不刺激","皮肤学测试，安全有效"],"en": ["Effective dandruff removal, long-lasting recurrence control","Soothes scalp discomfort, reduces itching","Balances scalp micro-ecology","Professional salon-grade formula, gentle","Dermatologically tested, safe and effective"]},"heroIngredients": {"zh": [{"name": "Piroctone Olamine","tag": "高效去屑因子","desc": "抑制马拉色菌，减少头屑生成"},{"name": "Niacinamide（烟酰胺）","tag": "舒缓修护头皮","desc": "强韧屏障，减少头皮不适"}],"en": [{"name": "Piroctone Olamine","tag": "High-efficacy anti-dandruff agent","desc": "Inhibits Malassezia, reduces dandruff formation"},{"name": "Niacinamide","tag": "Soothes & repairs scalp","desc": "Strengthens barrier, reduces scalp discomfort"}]},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Professional","desc": "沙龙专业护理 · 高端专业线"},"en": {"tier": "premium","label": "Premium Professional","desc": "Salon professional care · High-end line"}},"marketChannel": {"zh": {"global": ["专业沙龙","品牌官网","Amazon","授权零售渠道"],"japan": ["乐天","Amazon JP","Yahoo! Shopping","美容院渠道"],"channelLabel": "Salon Professional","channelDesc": "专业沙龙护理渠道为核心"},"en": {"global": ["Professional salons","Official website","Amazon","Authorized retail"],"japan": ["Rakuten","Amazon JP","Yahoo! Shopping","Salon channel"],"channelLabel": "Salon Professional","channelDesc": "Professional salon care channel as core"}},"brandConceptRich": {"zh": {"tagline": "头皮即肌肤。","concept": "用护肤级的严谨对待头皮，将皮肤学科学与欧莱雅专业线的沙龙权威结合，把去屑护理从速效方案重新定义为专业、仪式化的护理过程。"},"en": {"tagline": "Scalp is skin.","concept": "Treats the scalp with the same rigor as skincare, combining dermatological science with L'Oréal Professionnel's salon authority to reframe dandruff care as expert, ritualized treatment rather than a quick fix."}},"competitiveAdvantage": {"zh": [{"name": "Head & Shoulders","points": ["更专业的沙龙定位","更关注头皮微生态平衡","配方更温和，兼顾护理体验"]},{"name": "Kérastase","points": ["价格更具竞争力","针对头屑问题更聚焦","日常护理更易坚持"]},{"name": "Aveda","points": ["更强调医学化头皮护理","去屑功效更明确","渠道覆盖更广泛"]}],"en": [{"name": "Head & Shoulders","points": ["More professional salon positioning","Greater focus on scalp micro-ecology balance","Gentler formula with better care experience"]},{"name": "Kérastase","points": ["More competitive pricing","More focused on dandruff specifically","Easier to maintain as daily routine"]},{"name": "Aveda","points": ["Stronger medicalized scalp-care framing","Clearer anti-dandruff efficacy claims","Broader channel coverage"]}]},"ingredientsNote": {"zh": "整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The cleansing base follows a classic anionic + amphoteric surfactant framework, with pearlizers, humectants, conditioning polymers and cooling agents improving the professional-use experience. The brand places it within the Scalp Advanced dermatological-active lineup, alongside Niacinamide, AHA and Clay, to build a broader scalp-“skinification” story."},"evidenceStats": {"zh": ["首次使用：最多去除100%可见头屑（消费者测试）","持效：最长72小时去屑保护（临床测试）","临床样本：44名受试者，每周使用3次","局限：完整测试设计、对照组与统计方法未公开"],"en": ["First use: up to 100% visible dandruff removal (consumer test)","Duration: up to 72-hour dandruff protection (clinical test)","Clinical sample: 44 subjects, 3 applications/week","Limitation: full protocol, control group and statistics not disclosed"]},"experienceItems": {"zh": ["质地：轻盈乳霜型洗发水","用法：湿发湿头皮涂抹，指腹轻柔起泡后冲洗","进阶：油性头屑可先用同系列深层净化产品","香调：中性清新，专业护理感"],"en": ["Texture: lightweight cream shampoo","Usage: apply to wet hair/scalp, lather gently with fingertips, then rinse","Pairing: oily dandruff can pre-treat with the deep-purifying product in the range","Scent: clean, neutral, professional"]},"packagingItems": {"zh": ["视觉：大面积留白 + 黑色品牌标识 + 浅蓝绿功能标签","联想：强化“临床、洁净、专业”印象","规格：300 mL / 500 mL，区分家用与沙龙场景","弱点：系列内单品外观接近，需仔细看标签区分"],"en": ["Visual: large white space, black logo, pale blue-green functional labels","Association: reinforces a “clinical, clean, professional” impression","Sizes: 300 mL / 500 mL for home vs. salon use","Weakness: products within the range look similar, requiring close label reading"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "皮肤学净化科技","desc": "将活性成分与皮肤学级洁净配方结合，在抑制马拉色菌的同时避免过度破坏头皮屏障。"},{"title": "临床验证方法论","desc": "功效宣称依托结构化的消费者与临床测试体系（44名受试者，每周3次），而非单纯依赖成分宣称。"}],"en": [{"title": "Dermo-Clarifier Technology","desc": "Combines active ingredients with a dermatological-grade cleansing base to disrupt Malassezia without over-stripping the scalp barrier."},{"title": "Clinically Validated Protocol","desc": "Efficacy claims rest on a structured consumer and clinical testing framework — 44 subjects, 3x weekly use — not ingredient claims alone."}]},"addedAt": 1},{"id": "thedoux-moussedef","category": "usa","name": {"zh": "The Doux Mousse Def Texture Foam","en": "The Doux Mousse Def Texture Foam"},"brand": {"zh": "The Doux","en": "The Doux"},"company": {"zh": "The Doux（黑人及退伍军人创立）","en": "The Doux (Black- and Veteran-owned)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌奠基性单品，让The Doux出圈的招牌产品","en": "The brand's foundational hero product, the one that put The Doux on the map"},"market": {"zh": "品牌官网、Target、Sally Beauty等美国零售渠道","en": "Brand website, Target, Sally Beauty and other US retail channels"},"capacity": {"zh": "7 fl oz / 207 mL（另有3.4oz旅行装）","en": "7 fl oz / 207 mL (also 3.4oz travel size)"},"price": {"zh": "约US$16.99","en": "~US$16.99"},"positioning": {"zh": "双用途定型泡沫，主打零结块的中至强定型力，既能定义卷发又能抚平直发边缘，强调不结块、不留白屑的专利聚合物技术。","en": "A dual-use styling foam positioned around medium-to-firm hold without the crunch, defining curls or smoothing straight edges alike, built on a proprietary polymer for a no-flake, no-crunch finish."},"target": {"zh": "追求手感柔软但持牢的卷发造型人群，也覆盖需要抚平边缘、抗湿度的直发/编发造型场景。","en": "Curl stylers who want soft, touchable hold without stiffness, as well as those smoothing edges or fighting humidity for sleek/braided styles."},"ingredients": {"zh": "水、聚季铵盐-55（Polyquaternium-55，核心定型聚合物）、椰油酰胺丙基羟基磺基甜菜碱、芦荟叶、PVP、生育酚乙酸酯、柠檬酸、丝氨基酸、聚山梨醇酯20、乙基己基甘油、Oleth-20、香精、甘油醚-2椰油酸酯、异硬脂酰胺丙基吗啉乳酸酯、苯氧乙醇、苯甲酸、依地酸二钠。","en": "Water, Polyquaternium-55 (the core styling polymer), cocamidopropyl hydroxysultaine, aloe vera leaf, PVP, tocopheryl acetate, citric acid, silk amino acids, polysorbate 20, ethylhexylglycerin, oleth-20, fragrance, glycereth-2 cocoate, isostearamidopropyl morpholine lactate, phenoxyethanol, benzoic acid, disodium EDTA."},"evidence": {"zh": "宣称主要基于品牌自述的pH平衡配方与聚合物技术描述，未见公开的独立第三方临床或仪器测试数据；获多个行业奖项认可（品牌官网列为award-winning）。","en": "Claims rest mainly on the brand's own description of a pH-balanced formula and polymer technology; no public independent third-party clinical or instrumental data found. The brand cites multiple industry awards (award-winning per the official site)."},"experience": {"zh": "泡沫质地，卷发造型时湿发大量涂抹梳理定型，直发造型时少量用于发际边缘吹干前使用；无结块、无白屑残留，风干或吹干均可。","en": "Foam texture; for curls, apply liberally to damp hair and comb through; for sleek styles, use a small amount on edges before blow-drying. No crunch or white flaking; works air-dried or blow-dried."},"packaging": {"zh": "黑白撞色瓶身，品牌名与MOUSSE DEF产品名突出，走年轻、街头文化调性的视觉语言，区别于传统天然发品牌的草本包装美学。","en": "Black-and-white bottle design with bold brand and product name typography, a youthful, street-culture visual language, distinct from the herbal-aesthetic packaging typical of traditional natural-hair brands."},"insight": {"zh": "The Doux证明技术叙事+文化认同可以在拥挤的泡沫定型剂品类里建立差异化，聚季铵盐-55这一专利感成分命名和黑人及退伍军人创立的品牌故事，共同构成了比单纯功能诉求更强的购买理由。","en": "The Doux shows that combining a technical narrative with cultural identity can differentiate within the crowded styling-foam category, the patent-feel naming of Polyquaternium-55 plus the Black- and Veteran-owned founding story together form a stronger purchase rationale than functional claims alone."},"notes": {"zh": "","en": ""},"images": ["https://thedoux.com/cdn/shop/files/1_3_720x.jpg?v=1748803353","https://thedoux.com/cdn/shop/files/2_4_720x.jpg?v=1748803353","https://thedoux.com/cdn/shop/files/MousseDef_720x.jpg?v=1770389659"],"sources": [["Official product page","https://thedoux.com/products/mousse-def-texture-foam"],["Ingredients (CVS)","https://www.cvs.com/shop/ingredients/the-doux-mousse-def-texture-foam-7-oz-prodid-336256"]],"targetUsers": {"zh": ["追求柔软手感但持牢定型的卷发人群","需要抚平边缘、抗湿度的直发/编发造型场景","偏好年轻街头文化视觉调性的消费者","支持黑人及退伍军人创立品牌的购物者"],"en": ["Curly-hair stylers who want soft yet lasting hold","Sleek/braided styles needing edge control and humidity resistance","Consumers drawn to a youthful, street-culture visual identity","Shoppers who support Black- and Veteran-owned brands"]},"keyClaims": {"zh": ["中至强定型力，零结块","抗湿度，持久定型","双用途：卷发定义+直发边缘抚平","获多项行业奖项认可"],"en": ["Medium-to-firm hold, no crunch","Humidity-resistant, long-lasting hold","Dual-use: curl definition + sleek edge control","Recognized with multiple industry awards"]},"heroIngredients": {"zh": [{"name": "Polyquaternium-55","tag": "专利定型聚合物","desc": "品牌核心技术，实现柔韧定型不结块"},{"name": "丝氨基酸+芦荟叶","tag": "强韧滋润","desc": "强化发丝并保持柔软触感"}],"en": [{"name": "Polyquaternium-55","tag": "Proprietary styling polymer","desc": "The brand's core technology for flexible hold without crunch"},{"name": "Silk Amino Acids + Aloe async function loadFeedback(root,pid){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!sbClient){
    list.innerHTML=`<span class="feedback-loading">${lang==='zh'?'评论功能未连接':'Comments not connected'}</span>`;
    return;
  }
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('*').eq('product_id',pid).order('created_at',{ascending:true});
    if(error) throw error;
    renderFeedbackItems(root,data||[]);
  }catch(err){
    console.warn(err);
    list.innerHTML=`<span class="feedback-loading">${tr().feedbackLoadErr}</span>`;
  }
  const addBtn=root.querySelector('#feedbackAddBtn');
  if(addBtn){
    addBtn.onclick=async()=>{
      const nameEl=root.querySelector('#feedbackName');
      const textEl=root.querySelector('#feedbackText');
      const name=nameEl.value.trim(), comment=textEl.value.trim();
      if(!name||!comment){ toast(tr().feedbackNeedBoth); return; }
      addBtn.disabled=true;
      try{
        const {error}=await sbClient.from(SB_TABLE).insert({product_id:pid,name,comment});
        if(error) throw error;
        nameEl.value='';textEl.value='';
        await loadFeedback(root,pid);
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }finally{
        addBtn.disabled=false;
      }
    };
  }
}

function compressImage(file,maxDim=1200,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function exportPptx(){
  if(typeof PptxGenJS==='undefined'){toast(lang==='zh'?'PPT组件加载失败，请确认网络连接':'PPT library failed to load; check your connection');return}
  const savedLang=lang;

  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE';
  pptx.author='Competitor Library';
  pptx.subject='Competitive intelligence';
  pptx.title='Competitor Library';
  pptx.company='Internal';
  pptx.lang='en-US';

  function imgOpt(u){ return u&&u.startsWith('data:') ? {data:u} : {path:u}; }
  const ACCENT='C15B72';
  const INK='1A1D24';
  const GREY='8A8F9C';

  function estLines(str,charsPerLine){ return Math.max(1,Math.ceil((str||'').length/charsPerLine)); }

  const exportList=selectedForExport.size?products.filter(p=>selectedForExport.has(p.id)):products;
  exportList.forEach((p)=>{
    const slide=pptx.addSlide();

    const catLabel=p.category==='japan'?'Japan':p.category==='usa'?'USA':'Europe';

    let y=1.35;

      slide.addText(text,{x,y,w,h:0.24,fontFace:'Montserrat',fontSize:10.5,bold:true,color:ACCENT,charSpacing:1});
    }
    function value(text,x,y0,w,fontSize,lines,italic){
      slide.addText(text||'—',{x,y:y0,w,h:0.24*lines+0.1,fontFace:'Montserrat',fontSize:fontSize||13,color:INK,italic:!!italic,valign:'top'});
    }

    // Row 1: Net Volume + Price | Price Position
    const halfW=(leftW-0.4)/2;
    label(lang==='zh'?'容量与价格':'Net Volume + Price',leftX,halfW);
    const npText=[bi(p.capacity),bi(p.price)].filter(Boolean).join(' · ');
    value(npText,leftX,y+0.26,halfW,13,estLines(npText,42));

    const pp=biObj(p.pricePositioning);
    if(pp){
      const tiers=['mass','masstige','premium','luxury'];
      const idx=tiers.indexOf(pp.tier);
      const segX=leftX+halfW+0.4;
      tiers.forEach((tname,i)=>{
        slide.addShape(pptx.ShapeType.rect,{x:segX+i*0.85,y:y+0.03,w:0.78,h:0.07,fill:{color:i===idx?ACCENT:'E7E9EC'},line:{type:'none'}});
      });
      slide.addText(pp.label||'',{x:segX,y:y+0.18,w:halfW,h:0.28,fontFace:'Montserrat',fontSize:12,bold:true,color:INK});
    }
    y+=0.72;

    // Brand Concept
    const bc=biObj(p.brandConceptRich);
    const taglineTxt=bc&&bc.tagline?`"${bc.tagline}"`:(bi(p.brandTagline)?`"${bi(p.brandTagline)}"`:'');
    if(taglineTxt){
      label(lang==='zh'?'品牌概念':'Brand Concept',leftX,leftW);
      y+=0.26;
      slide.addText(taglineTxt,{x:leftX,y,w:leftW,h:0.3,fontFace:'Montserrat',fontSize:13,italic:true,color:INK});
      y+=0.44;
    }

    // Positioning (merged with target users)
    const targetPhrase=biList(p.targetUsers).slice(0,2).join(', ');
    const posText=[targetPhrase?`For ${targetPhrase}`:'',bi(p.positioning)].filter(Boolean).join(' — ');
    if(posText){
      label(lang==='zh'?'定位':'Positioning',leftX,leftW);
      y+=0.26;
      const lines=estLines(posText,68);
      value(posText,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Technology
    const techTxt=biList(p.keyTechnology).map(x=>x.title).join(' · ');
    if(techTxt){
      label(lang==='zh'?'核心技术':'Key Technology',leftX,leftW);
      y+=0.26;
      const lines=estLines(techTxt,68);
      value(techTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Claims
    const claimsTxt=biList(p.keyClaims).join(' · ');
    if(claimsTxt){
      label(lang==='zh'?'核心卖点':'Key Claims',leftX,leftW);
      y+=0.26;
      const lines=estLines(claimsTxt,68);
      value(claimsTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Core Ingredients
    let ingTxt=biList(p.heroIngredients).map(x=>x.name).join(', ');
    if(!ingTxt) ingTxt=bi(p.ingredients);
    if(ingTxt){
      label(lang==='zh'?'核心成分':'Core Ingredients',leftX,leftW);
      y+=0.26;
      const lines=estLines(ingTxt,68);
      value(ingTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Source (link only, same color as body text)
    if(p.sources && p.sources[0]){
      slide.addText(p.sources[0][1],{x:leftX,y:Math.min(y+0.05,7.05),w:leftW,h:0.25,fontFace:'Montserrat',fontSize:10,color:INK});
    }

    // Images (right column, clean product shots, up to 3) — spans full content height for even distribution
    const images=(p.images||[]).slice(0,3);
    const imgX=9.35, imgW=3.45;
    const imgTop=1.35, imgBottom=7.1, imgSpan=imgBottom-imgTop;
    if(images[0]){
      const h0=images.length>1?imgSpan*0.62:imgSpan;
      try{ slide.addImage({...imgOpt(images[0]),x:imgX,y:imgTop,w:imgW,h:h0,sizing:{type:'contain',w:imgW,h:h0}}); }catch(e){}
      if(images[1]){
        const y2=imgTop+h0+0.2;
        const h2=imgBottom-y2;
        const halfImgW=(imgW-0.15)/2;
        try{ slide.addImage({...imgOpt(images[1]),x:imgX,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        if(images[2]){
          try{ slide.addImage({...imgOpt(images[2]),x:imgX+halfImgW+0.15,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        }
      }
    }
  });

  await pptx.writeFile({fileName:'Competitor_Library_EN.pptx'});
  }catch(err){
    console.error('exportPptx failed:',err);
    toast((savedLang==='zh'?'幻灯片生成出错：':'Slide generation error: ')+(err&&err.message?err.message:err));
  }finally{
    lang=savedLang;
  }
}

function render(){renderChrome();renderSidebar();renderDetail();renderGrid();document.getElementById('workspace').style.display=gridMode?'none':'grid';document.getElementById('libraryGrid').style.display=gridMode?'grid':'none';const gb=document.getElementById('gridToggle');if(gb)gb.classList.toggle('active',gridMode)}
document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};document.getElementById('filterType').onchange=e=>{ptype=e.target.value;render()};let gridSpins=0;
const TYPE_ORDER=['shampoo','conditioner','mask','serum','oil','mist','gel'];
document.getElementById('sortBrandBtn').onclick=()=>{
  products.sort((a,b)=>{
    const bc=bi(a.brand).toLowerCase().localeCompare(bi(b.brand).toLowerCase(),'en',{sensitivity:'base'});
    if(bc!==0) return bc;
    return TYPE_ORDER.indexOf(a.productType)-TYPE_ORDER.indexOf(b.productType);
  });
  save();
  render();
  toast(lang==='zh'?'已按品牌排序':'Sorted by brand');
};
document.getElementById('sortAddedBtn').onclick=()=>{
  products.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  save();
  render();
  toast(lang==='zh'?'已按添加时间排序':'Sorted by date added');
};
document.getElementById('gridToggle').onclick=()=>{
  gridMode=!gridMode;gridSpins+=1;
  const gi=document.getElementById('gridIcon');
  gi.style.transform='rotate('+(gridSpins*90)+'deg)';
  gi.querySelectorAll('rect').forEach(r=>{r.style.transition='fill .3s ease';r.setAttribute('fill',gridMode?'#fff':'#C15B72')});
  render();
};document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.getElementById('pdfBtn').onclick=()=>{buildPrintArea();document.body.classList.add('print-all');setTimeout(()=>window.print(),60)};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
document.getElementById('slidesBtn').onclick=exportPptx;
render();
</script></body></html>
