官归因。产品的柔顺感主要来自Behentrimonium Chloride与Dimethicone的调理层，但对外表达全部集中在角蛋白浓度上。用户端已经出现长期使用后干燥脆化的反馈，这是高蛋白低油脂平衡的典型结果。如果我们做同类产品，浓度可以照学，但必须同时给出使用频率建议，否则会重复同样的负面口碑。", "en": "The lesson at UNOVE is the choice of unit. Three percent hydrolysed keratin written as 30,000 ppm is the identical fact, but the second version hits far harder on front-of-pack — and a number crosses languages more easily than an ingredient name, which directly supports the brand's export. Changing a unit costs nothing in formulation and carries no compliance risk.\n\nThe second lesson is channel strategy. UNOVE did not spread out; it became category number one inside Olive Young alone, then converted that ranking into endorsement for entering Sephora and Japan. For a brand with limited budget, going deep in one channel builds a quotable asset that going wide does not.\n\nThe thing to watch is sensory attribution. The softness comes mainly from the behentrimonium chloride and dimethicone conditioning layer, while all the external messaging sits on keratin concentration. Users are already reporting dryness and brittleness after prolonged use — the classic outcome of high protein with insufficient lipid balance. If we build something comparable, the concentration is copyable, but usage-frequency guidance has to ship with it or the same negative word of mouth follows."}, "notes": {"zh": "资料采集日 2026-07-31。价格取自UNOVE官方全球商城；日本Amazon官方店207 mL约¥2,399–2,630。", "en": "Researched 2026-07-31. Prices from the official UNOVE global store; the official Amazon Japan store lists 207 mL at about ¥2,399–2,630."}},{"id": "cerave-gentle-hydrating-shampoo", "category": "usa", "productType": "shampoo", "addedAt": 23, "name": {"zh": "CeraVe Gentle Hydrating Shampoo", "en": "CeraVe Gentle Hydrating Shampoo"}, "brand": {"zh": "CeraVe", "en": "CeraVe"}, "company": {"zh": "L'Oréal（CeraVe于2017年被欧莱雅收购，原属Valeant）", "en": "L'Oréal (CeraVe was acquired in 2017; previously Valeant)"}, "origin": {"zh": "美国", "en": "USA"}, "launch": {"zh": "2024年11月，CeraVe首次进入护发品类的两条产品线之一（另一条为去屑线）", "en": "November 2024 — one of the two lines with which CeraVe first entered haircare (the other being anti-dandruff)"}, "capacity": {"zh": "12 fl oz / 355 mL", "en": "12 fl oz / 355 mL"}, "price": {"zh": "US$10.99（官网），单毫升约US$0.031", "en": "US$10.99 (official site), about US$0.031 per mL"}, "market": {"zh": "美国药妆与商超为主（Target、Walmart、Ulta、Amazon）", "en": "US drugstore and mass retail — Target, Walmart, Ulta, Amazon"}, "images": ["https://www.cerave.com/-/media/project/loreal/brand-sites/cerave/americas/us/haircare/hair-packshot/gentle-hydrating-shampoo-allure-seal-700x785-v3.jpg"], "sources": [["CeraVe official — Gentle Hydrating Shampoo", "https://www.cerave.com/haircare/shampoo/gentle-hydrating-shampoo"], ["Amazon product page", "https://www.amazon.com/CeraVe-Hydrating-Ceramides-Niacinamide-Hyaluronic/dp/B0DV42H38H"], ["PR Newswire haircare launch release (2024-11-04)", "https://www.prnewswire.com/news-releases/cerave-reinvents-haircare-with-the-launch-of-its-first-haircare-products-developed-with-dermatologists-302294342.html"]], "positioning": {"zh": "CeraVe把护肤端建立起来的屏障修护体系整体搬到头皮的第一支洗发水：三种神经酰胺（EOP、NP、AP）配合神经酰胺前体与胆固醇，加烟酰胺与透明质酸，主打「清洁但不破坏头皮屏障」。US$10.99／355 mL，单毫升约US$0.031，是本库中单价最低的洗发水。无香精、免硫酸盐、pH平衡、致敏性测试，面向敏感头皮。", "en": "CeraVe's first shampoo moves the barrier-repair system it built in skincare wholesale onto the scalp: three ceramides (EOP, NP, AP) with a ceramide precursor and cholesterol, plus niacinamide and hyaluronic acid, promising cleansing that does not disrupt the scalp barrier. At US$10.99 for 355 mL — about US$0.031 per mL — it is the cheapest shampoo in this library. Fragrance-free, sulfate-free, pH-balanced and allergy-tested, aimed at sensitive scalps."}, "target": {"zh": "敏感头皮、干性头皮人群；已经在使用CeraVe护肤产品并信任该体系的消费者", "en": "Sensitive and dry scalps, and existing CeraVe skincare users who already trust the system"}, "targetUsers": {"zh": ["敏感头皮、易受刺激的人群", "干性头皮但不希望使用重型调理产品的用户", "已在使用CeraVe护肤线、把同一逻辑延伸到头皮的消费者", "所有发质与卷度，含染后发；官网标注适用年龄为3岁以上（页面另一处写13岁以上）"], "en": ["Sensitive, easily irritated scalps", "Dry scalps that do not want heavy conditioning", "Existing CeraVe skincare users extending the same logic to the scalp", "All hair types and curl patterns including colour-treated; the site says ages 3+ in one place and 13+ in another"]}, "keyClaims": {"zh": ["三种必需神经酰胺（EOP、NP、AP）", "头皮与头发保湿维持72小时（消费者测试，与护发素配合单次使用后）", "单次清洗后保湿度提升5倍、顺滑度提升10倍（对照：非调理型洗发水）", "免硫酸盐、无香精、无邻苯二甲酸酯、无对羟基苯甲酸酯、无MIT", "pH平衡、非致粉刺、致敏性测试、与皮肤科医生共同开发"], "en": ["Three essential ceramides (EOP, NP, AP)", "Scalp and hair stay hydrated for up to 72 hours (consumer test, after one use with the conditioner)", "5x more hydrated and 10x smoother after one wash (comparator: non-conditioning shampoo)", "Sulfate-free, fragrance-free, phthalate-free, paraben-free, MIT-free", "pH-balanced, non-comedogenic, allergy-tested, developed with dermatologists"]}, "ingredients": {"zh": "洗净基剂为Sodium C14-16 Olefin Sulfonate、Disodium Laureth Sulfosuccinate、Disodium Cocoamphodiacetate、Sodium Lauryl Sulfoacetate与Coco-Betaine的复配，全部避开SLS与SLES。屏障成分为Ceramide NP、Ceramide AP、Ceramide EOP三种神经酰胺，加Cholesterol与Phytosphingosine——后两者是护肤配方中构成屏障脂质三要素的标准组合，出现在洗发水中并不常见。另含Niacinamide、Sodium Hyaluronate、Salicylic Acid（低量）、Amodimethicone与Potato Starch Modified。全配方无香精。", "en": "The cleansing base combines sodium C14-16 olefin sulfonate, disodium laureth sulfosuccinate, disodium cocoamphodiacetate, sodium lauryl sulfoacetate and coco-betaine — all avoiding SLS and SLES. Barrier ingredients are ceramide NP, AP and EOP plus cholesterol and phytosphingosine; those last two complete the standard barrier-lipid trio from skincare formulation and are uncommon in a shampoo. Also present are niacinamide, sodium hyaluronate, a low level of salicylic acid, amodimethicone and modified potato starch. The formula is entirely fragrance-free."}, "ingredientsNote": {"zh": "神经酰胺＋胆固醇＋植物鞘氨醇的组合是CeraVe护肤配方的核心结构，这次原样移植到洗发水。在冲洗型产品中这些成分的实际留存量存疑，但配方设计本身传达的信息很明确：这是把一整套护肤配方逻辑整体搬了过来，而非在洗发水里添加几个概念成分。", "en": "Ceramides plus cholesterol plus phytosphingosine is the core structure of CeraVe's skincare formulas, transplanted here unchanged. How much of it survives a rinse-off product is open to question, but the design communicates something clear: a whole skincare formulation logic has been moved across, rather than a few concept ingredients being added to a shampoo."}, "heroIngredients": {"zh": [{"name": "三种神经酰胺（EOP・NP・AP）", "tag": "品牌核心资产", "desc": "CeraVe二十年来的品牌识别成分，此次原样带入护发。消费者对这三个名字的认知已经在护肤端完成，护发端不需要重新教育。"}, {"name": "Cholesterol + Phytosphingosine", "tag": "屏障脂质三要素", "desc": "与神经酰胺共同构成皮肤屏障脂质的标准配比结构。这两个成分出现在洗发水中是少见的，说明配方是从护肤端整体移植而非局部借用。"}, {"name": "Niacinamide", "tag": "舒缓・屏障支持", "desc": "维生素B3，护肤端的成熟成分，在头皮场景承担舒缓与屏障支持。"}, {"name": "Sodium Hyaluronate", "tag": "保湿", "desc": "承担「72小时保湿」宣称的保湿主力。"}], "en": [{"name": "Three ceramides (EOP, NP, AP)", "tag": "Core brand asset", "desc": "CeraVe's identifying ingredients for twenty years, brought into haircare unchanged. Consumer recognition of these three names was already built in skincare, so haircare needs no re-education."}, {"name": "Cholesterol + phytosphingosine", "tag": "Barrier lipid trio", "desc": "With the ceramides these complete the standard ratio structure of skin barrier lipids. Seeing them in a shampoo is unusual and indicates a whole transplant from skincare rather than selective borrowing."}, {"name": "Niacinamide", "tag": "Soothing / barrier support", "desc": "Vitamin B3, mature in skincare, here handling comfort and barrier support on the scalp."}, {"name": "Sodium hyaluronate", "tag": "Hydration", "desc": "The main humectant behind the 72-hour hydration claim."}]}, "keyTechnology": {"zh": [{"title": "护肤资产的跨品类迁移", "desc": "CeraVe没有为护发线开发新的识别成分，而是直接使用护肤端已经建立认知的三种神经酰胺。品类扩张的成本主要落在配方适配上，认知教育成本接近于零。这是集团型品牌最有效率的扩张路径。"}, {"title": "屏障脂质结构的完整移植", "desc": "神经酰胺、胆固醇、植物鞘氨醇三者按护肤配方的结构关系一起投料，而不是单独添加神经酰胺。这个细节把「加了神经酰胺」和「移植了屏障体系」区分开。"}, {"title": "皮肤科医生共同开发的背书结构", "desc": "CeraVe从护肤端沿用的核心背书方式。产品页直接引用具名皮肤科医生（Dr. Natasha Mesinkovska）的评价，这比匿名的「专家推荐」更具体，也更难被模仿。"}, {"title": "系统化测试设计", "desc": "所有功效数字都标注「与护发素配合使用」的前提。测试设计本身把连带购买写进了数据条件，与OLAPLEX的Nº.4＋Nº.5做法一致。"}], "en": [{"title": "Moving a skincare asset across categories", "desc": "CeraVe did not develop new signature ingredients for haircare; it used the three ceramides already recognised from skincare. The cost of category expansion falls on formulation adaptation, and the cost of consumer education is close to zero. This is the most efficient expansion route available to a group brand."}, {"title": "Transplanting the full barrier lipid structure", "desc": "Ceramides, cholesterol and phytosphingosine are dosed together in the structural relationship used in skincare, rather than adding ceramides alone. That detail separates “contains ceramides” from “the barrier system was moved across.”"}, {"title": "The developed-with-dermatologists endorsement", "desc": "CeraVe's core endorsement structure, carried over from skincare. The product page quotes a named dermatologist (Dr. Natasha Mesinkovska), which is more specific — and harder to imitate — than anonymous expert recommendation."}, {"title": "System-based test design", "desc": "Every efficacy figure is footnoted “when used as a system with the conditioner.” The test design writes the attached purchase into the data condition, the same move OLAPLEX makes with Nº.4 plus Nº.5."}]}, "evidence": {"zh": "官网提供了三组量化数字：72小时保湿（消费者测试，单次使用洗发水＋护发素后）、单次清洗后保湿度5倍与顺滑度10倍（对照为非调理型洗发水）。对照条件与测试前提标注清晰，这一点优于本库中多数产品。\n\n但同一页面内存在数字冲突：主视觉区写「5倍保湿・10倍顺滑」，Key Features区写「4倍保湿・12倍顺滑」，两组数据的脚注均为「与非调理型洗发水对照」。适用年龄也同时出现「3岁以上」与「13岁以上」两种表述。做对标资料引用时需要注明出处位置。此外所有数字均为品牌自行委托，无第三方机构报告。", "en": "The site publishes three quantified figures: 72-hour hydration (consumer test, after one use of shampoo plus conditioner) and, after a single wash, 5x hydration and 10x smoothness against a non-conditioning shampoo. Comparators and test conditions are stated clearly, which is better than most products in this library.\n\nBut the same page contradicts itself. The hero area says 5x hydrated and 10x smoother while the Key Features section says 4x hydrated and 12x smoother, both footnoted against a non-conditioning shampoo. Age suitability appears as both 3+ and 13+. Any benchmarking citation needs to record which part of the page it came from. All figures are brand-commissioned with no third-party report."}, "evidenceStats": {"zh": ["72小时头皮与头发保湿（消费者测试，洗发水＋护发素单次使用后）", "单次清洗保湿度5倍・顺滑度10倍（对照：非调理型洗发水）", "同页面另一处：保湿度4倍・顺滑度12倍（同一对照条件）", "pH平衡、非致粉刺、致敏性测试、临床测试", "适用年龄同页面出现3岁以上与13岁以上两种表述", "可引用性：中。对照条件标注清晰是优点，但页内数字冲突需注明出处"], "en": ["72-hour scalp and hair hydration (consumer test, one use of shampoo + conditioner)", "5x hydration and 10x smoothness after one wash (comparator: non-conditioning shampoo)", "Elsewhere on the same page: 4x hydration and 12x smoothness, same comparator", "pH-balanced, non-comedogenic, allergy-tested, clinically tested", "Age suitability given as both 3+ and 13+ on the same page", "Citability: medium. Clear comparators are a strength, but the on-page conflict means the source location must be recorded"]}, "experience": {"zh": "免硫酸盐复配基剂起泡量中等，用户反馈泡沫细腻、冲洗顺畅。无香精是这支产品的主要体验特征——在竞品普遍以香型作为差异化主轴的市场里，主动放弃香味是一个明确的取舍，换来的是敏感人群的可用性。洗后头发偏干爽，官方明确设计为与同系列护发素配合使用，单用可能润度不足。Ulta评价指出更适合中性至干性发质，油性发质可能觉得过润。", "en": "The sulfate-free blend gives moderate lather, described by users as fine and easy to rinse. Being fragrance-free is the defining experience characteristic — in a market where competitors differentiate mainly on scent, deliberately giving up fragrance is a clear trade, bought back in usability for sensitive users. Hair dries on the clean side, and the design explicitly assumes the matching conditioner; used alone it may feel under-conditioned. Ulta reviews suggest it suits normal to dry hair and may feel too rich for oily hair."}, "experienceItems": {"zh": ["泡沫：免硫酸盐复配基剂，泡量中等，细腻易冲洗", "无香精：主动放弃香味差异化，换取敏感人群可用性", "干后手感：偏干爽，设计上依赖同系列护发素", "适用性：Ulta评价指出更适合中性至干性发质，油性发质可能觉得过润", "经济性：355 mL／US$10.99，单毫升约US$0.031，本库最低"], "en": ["Lather: sulfate-free blend, moderate volume, fine and easy to rinse", "Fragrance-free: gives up scent differentiation in exchange for usability by sensitive users", "Dry feel: on the clean side; the design depends on the matching conditioner", "Fit: Ulta reviews point to normal-to-dry hair; oily hair may find it too rich", "Value: 355 mL for US$10.99, about US$0.031/mL — the lowest in this library"]}, "packaging": {"zh": "白瓶蓝字，与CeraVe护肤线完全一致的视觉体系，货架上不需要任何额外识别成本。瓶身正面标注三种神经酰胺与烟酰胺、透明质酸，信息密度高但排版克制。12 fl oz为美国药妆渠道的标准规格。包装上未做任何护发专属的视觉区分——这是有意的，目的是让护发产品直接继承护肤线的信任。", "en": "White bottle with blue type, visually identical to the CeraVe skincare line, so it needs no extra recognition cost on shelf. The front lists three ceramides plus niacinamide and hyaluronic acid — high information density with restrained typography. Twelve fl oz is the standard US drugstore size. Nothing on the pack visually separates haircare from skincare, and that is deliberate: the haircare products inherit the skincare line's trust directly."}, "packagingItems": {"zh": ["视觉：白瓶蓝字，与护肤线完全一致，零额外识别成本", "信息：正面直接列出三种神经酰胺＋烟酰胺＋透明质酸", "规格：12 fl oz / 355 mL，美国药妆渠道标准规格", "设计意图：不做护发专属视觉区分，让新品类直接继承护肤线信任"], "en": ["Visual: white bottle, blue type, identical to skincare — zero extra recognition cost", "Information: three ceramides plus niacinamide and hyaluronic acid listed on the front", "Size: 12 fl oz / 355 mL, the standard US drugstore format", "Design intent: no haircare-specific visual break, so the new category inherits the skincare line's trust directly"]}, "distribution": {"zh": "Target、Walmart、Ulta Beauty、Amazon、CVS等美国药妆与商超渠道，另有澳新市场", "en": "Target, Walmart, Ulta Beauty, Amazon and CVS across US drugstore and mass retail, plus Australia and New Zealand"}, "marketChannel": {"zh": {"global": ["Target、Walmart（美国商超主力）", "Ulta Beauty", "Amazon", "CVS等连锁药房", "澳大利亚、新西兰市场已上市"], "japan": ["截至资料采集日未见日本正规上市，需通过跨境购买", "CeraVe护肤线在日本已有认知基础，护发线导入门槛较低"], "channelLabel": "Dermatologist Mass Drugstore", "channelDesc": "完全依托护肤线已有的药妆渠道货架位，新品类不需要重新谈判渠道，这是集团型品牌品类扩张的核心优势"}, "en": {"global": ["Target and Walmart (core US mass retail)", "Ulta Beauty", "Amazon", "CVS and other pharmacy chains", "Launched in Australia and New Zealand"], "japan": ["No official Japan launch as of the research date; available only cross-border", "CeraVe skincare already has recognition in Japan, so the barrier to introducing haircare is low"], "channelLabel": "Dermatologist Mass Drugstore", "channelDesc": "Rides entirely on the drugstore shelf space the skincare line already holds. The new category needs no channel renegotiation — the core advantage of category expansion inside a group brand"}}, "pricePositioning": {"zh": {"tier": "mass", "label": "Derm-Backed Mass"}, "en": {"tier": "mass", "label": "Derm-Backed Mass"}}, "brandConceptRich": {"zh": {"tagline": "Developed with dermatologists", "concept": "CeraVe以三种必需神经酰胺修复皮肤屏障为核心命题，二十年来只讲这一件事。2024年11月进入护发品类时，品牌没有更换命题，而是把头皮视作皮肤的延续，用同一套屏障逻辑组织新品线。"}, "en": {"tagline": "Developed with dermatologists", "concept": "CeraVe has argued one thing for twenty years: three essential ceramides restore the skin barrier. Entering haircare in November 2024 it did not change the argument — it treated the scalp as a continuation of skin and organised the new line on the same barrier logic."}}, "competitiveAdvantage": {"zh": [{"name": "L'Oréal Paris Elvive / Elseve", "points": ["同属欧莱雅集团但定位不同：Elvive靠功效细分与香型，CeraVe靠皮肤科背书", "价格带接近，CeraVe无香精是明确的差异点", "Elvive渠道更广，CeraVe靠护肤线货架位切入"]}, {"name": "Vanicream Free & Clear", "points": ["同为敏感肌向的无香精洗发水，Vanicream在皮肤科推荐圈层认知更早", "CeraVe有神经酰胺这一可命名的成分资产，Vanicream主打的是「不含什么」", "CeraVe渠道覆盖与品牌声量远大于Vanicream"]}, {"name": "Aveeno Scalp Soothing", "points": ["同为药妆渠道的头皮舒缓线，Aveeno以燕麦为核心成分资产", "两者都在把护肤成分带入头皮，说服结构相似", "CeraVe的屏障脂质结构更完整，Aveeno的天然定位更清晰"]}], "en": [{"name": "L'Oréal Paris Elvive / Elseve", "points": ["Same group, different position: Elvive sells on benefit segmentation and fragrance, CeraVe on dermatologist endorsement", "Similar price band, with fragrance-free as CeraVe's clear point of difference", "Elvive has wider distribution; CeraVe enters on the skincare line's shelf space"]}, {"name": "Vanicream Free & Clear", "points": ["Also a fragrance-free shampoo for sensitive users, and earlier established in dermatologist-recommendation circles", "CeraVe has a nameable ingredient asset in ceramides; Vanicream sells on what it leaves out", "CeraVe's distribution and brand volume are far larger"]}, {"name": "Aveeno Scalp Soothing", "points": ["Another drugstore scalp-comfort line, built on oat as its ingredient asset", "Both bring skincare ingredients onto the scalp, so the persuasion structures are similar", "CeraVe's barrier lipid structure is more complete; Aveeno's natural positioning is clearer"]}]}, "insight": {"zh": "CeraVe这次扩张最值得学习的是资产迁移的完整度。品牌没有为护发线开发新的识别成分，直接把护肤端二十年积累的三种神经酰胺带过来，认知教育成本接近于零。更关键的是它连胆固醇和植物鞘氨醇一起带了过来——按护肤配方的结构关系投料，而不是单独加神经酰胺。这个细节把「加了概念成分」和「移植了体系」区分开，也是这支产品配方上唯一真正难以模仿的地方。\n\n渠道端同理。护发新品直接使用护肤线在Target、Walmart已有的货架位，不需要重新谈判。对我们来说，这条路径的前提是母品牌已经有一个足够强的成分资产——如果没有，迁移就无从谈起。\n\n还有一处必须记下来：官网同一页面内「5倍保湿・10倍顺滑」与「4倍保湿・12倍顺滑」两组数字并存，适用年龄也同时写着3岁以上和13岁以上。这个量级的品牌出现这种疏漏，说明护发线的上市节奏很赶。引用其数据时要注明出处位置。", "en": "What is most worth studying in CeraVe's expansion is how complete the asset transfer is. The brand developed no new signature ingredient for haircare — it brought across the three ceramides built over twenty years in skincare, and the education cost is close to zero. More importantly it brought cholesterol and phytosphingosine too, dosed in the structural relationship used in skincare rather than adding ceramides alone. That detail separates “added a concept ingredient” from “moved the system across,” and it is the only genuinely hard-to-copy thing in the formula.\n\nThe same holds on channel. The haircare launch uses the shelf space the skincare line already holds at Target and Walmart, with no renegotiation. For us the precondition is a parent brand with an ingredient asset strong enough to transfer — without one there is nothing to move.\n\nOne more thing to record: the same official page carries both “5x hydrated / 10x smoother” and “4x hydrated / 12x smoother,” and states age suitability as both 3+ and 13+. A slip like that at this scale of brand suggests the haircare launch was run at speed. Any citation of these figures needs the source location noted."}, "notes": {"zh": "资料采集日 2026-07-31。官网页面数字冲突为原文实际状态，已在evidence中如实记录。", "en": "Researched 2026-07-31. The conflicting figures are the actual state of the official page and are recorded as found in the evidence section."}}]; const KEY='competitor-library-v36';

async function loadFeedback(root,pid){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!sbClient){
    list.innerHTML=`<span class="feedback-loading">${lang==='zh'?'评论功能未连接':'Comments not connected'}</span>`;
    return;
  }
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('*').eq('product_id',pid).order('created_at',{ascending:true});
    if(error) throw error;
    renderFeedbackItems(root,data||[]);
  }catch(err){
    console.warn(err);
    list.innerHTML=`<span class="feedback-loading">${tr().feedbackLoadErr}</span>`;
  }
  const addBtn=root.querySelector('#feedbackAddBtn');
  if(addBtn){
    addBtn.onclick=async()=>{
      const nameEl=root.querySelector('#feedbackName');
      const textEl=root.querySelector('#feedbackText');
      const name=nameEl.value.trim(), comment=textEl.value.trim();
      if(!name||!comment){ toast(tr().feedbackNeedBoth); return; }
      addBtn.disabled=true;
      try{
        const {error}=await sbClient.from(SB_TABLE).insert({product_id:pid,name,comment});
        if(error) throw error;
        nameEl.value='';textEl.value='';
        await loadFeedback(root,pid);
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }finally{
        addBtn.disabled=false;
      }
    };
  }
}

function compressImage(file,maxDim=1200,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const ACCENT='C15B72';
  const INK='1A1D24';
  const GREY='8A8F9C';

  function estLines(str,charsPerLine){ return Math.max(1,Math.ceil((str||'').length/charsPerLine)); }

  const exportList=selectedForExport.size?products.filter(p=>selectedForExport.has(p.id)):products;
  exportList.forEach((p)=>{

    }
    function value(text,x,y0,w,fontSize,lines,italic){

    }

    // Row 1: Net Volume + Price | Price Position

    const npText=[bi(p.capacity),bi(p.price)].filter(Boolean).join(' · ');
    value(npText,leftX,y+0.26,halfW,13,estLines(npText,42));

    const pp=biObj(p.pricePositioning);
    if(pp){
      const tiers=['mass','masstige','premium','luxury'];
      const idx=tiers.indexOf(pp.tier);
      const segX=leftX+halfW+0.4;

    const taglineTxt=bc&&bc.tagline?`"${bc.tagline}"`:(bi(p.brandTagline)?`"${bi(p.brandTagline)}"`:'');

    if(posText){
      label(lang==='zh'?'定位':'Positioning',leftX,leftW);
      y+=0.26;
      const lines=estLines(posText,68);
      value(posText,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Technology
    const techTxt=biList(p.keyTechnology).map(x=>x.title).join(' · ');
    if(techTxt){
      label(lang==='zh'?'核心技术':'Key Technology',leftX,leftW);
      y+=0.26;
      const lines=estLines(techTxt,68);
      value(techTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Claims
    const claimsTxt=biList(p.keyClaims).join(' · ');
    if(claimsTxt){
      label(lang==='zh'?'核心卖点':'Key Claims',leftX,leftW);
      y+=0.26;
      const lines=estLines(claimsTxt,68);
      value(claimsTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Core Ingredients
    let ingTxt=biList(p.heroIngredients).map(x=>x.name).join(', ');
    if(!ingTxt) ingTxt=bi(p.ingredients);
    if(ingTxt){
      label(lang==='zh'?'核心成分':'Core Ingredients',leftX,leftW);
      y+=0.26;
      const lines=estLines(ingTxt,68);
      value(ingTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Source (link only, same color as body text)
    if(p.sources && p.sources[0]){
      slide.addText(p.sources[0][1],{x:leftX,y:Math.min(y+0.05,7.05),w:leftW,h:0.25,fontFace:'Montserrat',fontSize:10,color:INK});
    }

    // Images (right column, clean product shots, up to 3) — spans full content height for even distribution
    const images=(p.images||[]).slice(0,3);
    const imgX=9.35, imgW=3.45;
    const imgTop=1.35, imgBottom=7.1, imgSpan=imgBottom-imgTop;
    if(images[0]){
      const h0=images.length>1?imgSpan*0.62:imgSpan;
      try{ slide.addImage({...imgOpt(images[0]),x:imgX,y:imgTop,w:imgW,h:h0,sizing:{type:'contain',w:imgW,h:h0}}); }catch(e){}
      if(images[1]){
        const y2=imgTop+h0+0.2;
        const h2=imgBottom-y2;
        const halfImgW=(imgW-0.15)/2;
        try{ slide.addImage({...imgOpt(images[1]),x:imgX,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        if(images[2]){
          try{ slide.addImage({...imgOpt(images[2]),x:imgX+halfImgW+0.15,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        }
      }
    }
  });

  await pptx.writeFile({fileName:'Competitor_Library_EN.pptx'});
  }catch(err){
    console.error('exportPptx failed:',err);
    toast((savedLang==='zh'?'幻灯片生成出错：':'Slide generation error: ')+(err&&err.message?err.message:err));
  }finally{
    lang=savedLang;
  }
}

 submit:'Submit',tabAll:'All',tabTodo:'To research',tabDone:'Researched',sortVotes:'By votes',sortDate:'By date',

const wt=()=>WT[lang];
let wishMode=false, wlRows=[], wlFilter='all', wlSort='votes', wlShellLang=null, wlLoaded=false;
const VOTER_KEY='wl-voter-id', NAME_KEY='wl-my-name';
function voterId(){let v=localStorage.getItem(VOTER_KEY);if(!v){v=(crypto.randomUUID?crypto.randomUUID():'v'+Date.now()+Math.random().toString(36).slice(2));localStorage.setItem(VOTER_KEY,v)}return v}
function wlDays(iso){const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);return d<=0?wt().today:wt().daysAgo(d)}
function wlHost(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
function wlBadge(){const b=document.getElementById('wishBadge');if(!b)return;const n=wlRows.filter(r=>r.status==='todo').length;b.textContent=n;b.style.display=n?'flex':'none'}

async function loadWishlist(){
  if(!sbClient){wlLoaded=true;return}
  try{
    const [rq,vt]=await Promise.all([
      sbClient.from(SB_REQ).select('*').order('created_at',{ascending:false}),
      sbClient.from(SB_VOTE).select('request_id,voter_key')
    ]);
    if(rq.error) throw rq.error;
    if(vt.error) throw vt.error;
    const me=voterId(), counts={}, mine={};
    (vt.data||[]).forEach(v=>{counts[v.request_id]=(counts[v.request_id]||0)+1;if(v.voter_key===me)mine[v.request_id]=true});
    wlRows=(rq.data||[]).map(r=>({...r,votes:counts[r.id]||0,mine:!!mine[r.id]}));
    wlLoaded=true; wlBadge();
  }catch(err){console.warn('wishlist load',err);wlLoaded=true;wlRows=null}
}

function wishlistShell(){
  const w=wt();
  return `<div class="wl-head">
    <div class="wl-eyebrow">Wishlist</div>
    <h2 class="wl-title">${esc(w.title)}</h2>
    <p class="wl-desc">${esc(w.desc)}</p>
  </div>
  <div class="wl-form">
    <div class="wl-form-head">${esc(w.formHead)}</div>
    <div class="wl-form-body">
      <div class="wl-row">
        <input id="wlName" placeholder="${esc(w.phName)}">
        <input id="wlProd" placeholder="${esc(w.phProd)}">
      </div>
      <div class="wl-row" style="grid-template-columns:1fr"><input id="wlUrl" placeholder="${esc(w.phUrl)}"></div>
      <div class="wl-row" style="grid-template-columns:1fr;margin-bottom:12px"><textarea id="wlWhy" placeholder="${esc(w.phWhy)}"></textarea></div>
      <div class="wl-form-foot">
        <div class="wl-hint">${w.hint}</div>
        <button class="wl-submit" id="wlSubmit">${esc(w.submit)}</button>
      </div>
    </div>
  </div>
  <div class="wl-bar">
    <div class="wl-tabs">
      <button class="wl-tab" data-wf="all">${esc(w.tabAll)} <span id="wlCntAll">0</span></button>
      <button class="wl-tab" data-wf="todo">${esc(w.tabTodo)} <span id="wlCntTodo">0</span></button>
      <button class="wl-tab" data-wf="done">${esc(w.tabDone)} <span id="wlCntDone">0</span></button>
    </div>
    <div class="wl-sorts">
      <button class="wl-sortb" data-ws="votes">${esc(w.sortVotes)}</button>
      <button class="wl-sortb" data-ws="date">${esc(w.sortDate)}</button>
    </div>
  </div>
  <table class="wl-table"><thead><tr>
    <th class="wl-c-vote">${esc(w.thVote)}</th><th class="wl-c-prod">${esc(w.thProd)}</th>
    <th class="wl-c-who">${esc(w.thWho)}</th><th class="wl-c-reason">${esc(w.thReason)}</th>
    <th class="wl-c-status">${esc(w.thStatus)}</th><th class="wl-c-act">${esc(w.thAct)}</th>
  </tr></thead><tbody id="wlBody"></tbody></table>`;
}

function renderWishlistTable(){
  const w=wt(), body=document.getElementById('wlBody');
  if(!body) return;
  document.querySelectorAll('.wl-tab').forEach(b=>b.classList.toggle('on',b.dataset.wf===wlFilter));
  document.querySelectorAll('.wl-sortb').forEach(b=>b.classList.toggle('on',b.dataset.ws===wlSort));
  if(!sbClient){body.innerHTML=`<tr class="wl-empty"><td colspan="6">${esc(w.notConnected)}</td></tr>`;return}
  if(wlRows===null){body.innerHTML=`<tr class="wl-empty"><td colspan="6">${esc(w.errLoad)}</td></tr>`;return}
  if(!wlLoaded){body.innerHTML=`<tr class="wl-empty"><td colspan="6">${esc(w.loading)}</td></tr>`;return}
  const c={todo:0,done:0};
  wlRows.forEach(r=>{c[r.status]=(c[r.status]||0)+1});
  const setTxt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  setTxt('wlCntAll',wlRows.length);setTxt('wlCntTodo',c.todo);setTxt('wlCntDone',c.done);
  wlBadge();
  let rows=wlRows.filter(r=>wlFilter==='all'||r.status===wlFilter);
  rows.sort((a,b)=> wlSort==='votes'
    ? (b.votes-a.votes)||(new Date(b.created_at)-new Date(a.created_at))
    : (new Date(b.created_at)-new Date(a.created_at))||(b.votes-a.votes));
  if(!rows.length){body.innerHTML=`<tr class="wl-empty"><td colspan="6">${esc(w.empty)}</td></tr>`;return}
  body.innerHTML=rows.map(r=>{
    const known=r.library_product_id&&products.some(p=>p.id===r.library_product_id);
    return `<tr>
    <td class="wl-c-vote"><button class="wl-vote${r.mine?' voted':''}" data-wv="${esc(r.id)}"><span class="car">▲</span><span class="num">${r.votes}</span></button></td>
    <td class="wl-c-prod">
      ${r.product_name?`<div class="wl-pname">${esc(r.product_name)}</div>`:`<div class="wl-pname noname">${esc(w.noName)}</div>`}
      ${r.product_url?`<a class="wl-plink" href="${esc(r.product_url)}" target="_blank" rel="noopener">${esc(r.product_name?wlHost(r.product_url):r.product_url)}</a>`:''}
      ${known?`<br><a class="wl-golink" data-wg="${esc(r.library_product_id)}">${esc(w.goLib)}</a>`:''}
    </td>
    <td class="wl-c-who"><div class="wl-who">${esc(r.requester_name)}</div><div class="wl-date">${esc(wlDays(r.created_at))}</div></td>
    <td class="wl-c-reason"><div class="wl-reason${r.reason?'':' empty'}">${r.reason?esc(r.reason):esc(w.noWhy)}</div></td>
    <td class="wl-c-status">
      <span class="wl-st ${r.status==='done'?'wl-st-done':'wl-st-todo'}">${esc(r.status==='done'?w.stDone:w.stTodo)}</span>
      <select class="wl-stsel" data-wst="${esc(r.id)}">
        <option value="todo"${r.status==='todo'?' selected':''}>${esc(w.stTodo)}</option>
        <option value="done"${r.status==='done'?' selected':''}>${esc(w.stDone)}</option>
      </select>
    </td>
    <td class="wl-c-act"><button class="wl-del" data-wd="${esc(r.id)}">${esc(w.del)}</button></td>
  </tr>`}).join('');
}

function renderWishlist(){
  const root=document.getElementById('wishlistView');
  if(!root) return;
  if(wlShellLang!==lang){
    root.innerHTML=wishlistShell();
    wlShellLang=lang;
    const nameEl=document.getElementById('wlName');
    if(nameEl) nameEl.value=localStorage.getItem(NAME_KEY)||'';
    bindWishlist(root);
  }
  renderWishlistTable();
}

function bindWishlist(root){
  root.querySelectorAll('.wl-tab').forEach(b=>b.onclick=()=>{wlFilter=b.dataset.wf;renderWishlistTable()});
  root.querySelectorAll('.wl-sortb').forEach(b=>b.onclick=()=>{wlSort=b.dataset.ws;renderWishlistTable()});
  const btn=root.querySelector('#wlSubmit');
  if(btn) btn.onclick=async()=>{
    const w=wt();
    const nameEl=root.querySelector('#wlName'),prodEl=root.querySelector('#wlProd'),
          urlEl=root.querySelector('#wlUrl'),whyEl=root.querySelector('#wlWhy');
    const name=nameEl.value.trim(),prod=prodEl.value.trim(),url=urlEl.value.trim(),why=whyEl.value.trim();
    if(!name){toast(w.needName);nameEl.focus();return}
    if(!prod&&!url){toast(w.needProd);prodEl.focus();return}
    if(!sbClient){toast(w.notConnected);return}
    btn.disabled=true;
    try{
      const {data,error}=await sbClient.from(SB_REQ)
        .insert({product_name:prod,product_url:url,requester_name:name,reason:why,status:'todo'}).select().single();
      if(error) throw error;
      localStorage.setItem(NAME_KEY,name);
      await sbClient.from(SB_VOTE).insert({request_id:data.id,voter_key:voterId()});
      prodEl.value='';urlEl.value='';whyEl.value='';
      wlFilter='all';
      await loadWishlist(); renderWishlistTable();
      toast(w.added);
    }catch(err){console.warn(err);toast(w.errSave)}
    finally{btn.disabled=false}
  };
  root.addEventListener('click',async e=>{
    const w=wt();
    const v=e.target.closest('[data-wv]');
    if(v){
      const id=v.dataset.wv, row=wlRows.find(r=>r.id===id);
      if(!row||!sbClient) return;
      v.disabled=true;
      try{
        if(row.mine){
          await sbClient.from(SB_VOTE).delete().eq('request_id',id).eq('voter_key',voterId());
          row.mine=false;row.votes=Math.max(0,row.votes-1);
        }else{
          await sbClient.from(SB_VOTE).insert({request_id:id,voter_key:voterId()});
          row.mine=true;row.votes+=1;
        }
        renderWishlistTable();
      }catch(err){console.warn(err);toast(w.errSave)}
      return;
    }
    const g=e.target.closest('[data-wg]');
    if(g){selected=g.dataset.wg;wishMode=false;gridMode=false;render();window.scrollTo({top:0,behavior:'smooth'});return}
    const d=e.target.closest('[data-wd]');
    if(d){
      if(!confirm(w.confirmDel)) return;
      try{
        await sbClient.from(SB_REQ).delete().eq('id',d.dataset.wd);
        wlRows=wlRows.filter(r=>r.id!==d.dataset.wd);
        renderWishlistTable(); toast(w.removed);
      }catch(err){console.warn(err);toast(w.errSave)}
    }
  });
  root.addEventListener('change',async e=>{
    const sel=e.target.closest('[data-wst]');
    if(!sel) return;
    const id=sel.dataset.wst, row=wlRows.find(r=>r.id===id);
    if(!row) return;
    const prev=row.status; row.status=sel.value;
    renderWishlistTable();
    try{
      const {error}=await sbClient.from(SB_REQ).update({status:sel.value}).eq('id',id);
      if(error) throw error;
    }catch(err){console.warn(err);row.status=prev;renderWishlistTable();toast(wt().errSave)}
  });
}

function render(){renderChrome();renderSidebar();renderDetail();renderGrid();renderWishlist();
document.getElementById('workspace').style.display=(wishMode||gridMode)?'none':'grid';
document.getElementById('libraryGrid').style.display=(!wishMode&&gridMode)?'grid':'none';
document.getElementById('wishlistView').style.display=wishMode?'block':'none';
if(wishMode){const eb=document.getElementById('exportBar');if(eb)eb.style.display='none';}
const gb=document.getElementById('gridToggle');if(gb)gb.classList.toggle('active',gridMode&&!wishMode);
const wb=document.getElementById('wishToggle');if(wb)wb.classList.toggle('active',wishMode)}
document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};document.getElementById('filterType').onchange=e=>{ptype=e.target.value;render()};let gridSpins=0;
const TYPE_ORDER=['shampoo','conditioner','mask','serum','oil','mist','gel'];
document.getElementById('sortBrandBtn').onclick=()=>{
  products.sort((a,b)=>{
    const bc=bi(a.brand).toLowerCase().localeCompare(bi(b.brand).toLowerCase(),'en',{sensitivity:'base'});
    if(bc!==0) return bc;
    return TYPE_ORDER.indexOf(a.productType)-TYPE_ORDER.indexOf(b.productType);
  });
  save();
  render();
  toast(lang==='zh'?'已按品牌排序':'Sorted by brand');
};
document.getElementById('sortAddedBtn').onclick=()=>{
  products.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  save();
  render();
  toast(lang==='zh'?'已按添加时间排序':'Sorted by date added');
};
document.getElementById('gridToggle').onclick=()=>{
  if(wishMode){wishMode=false;gridMode=true;}else{gridMode=!gridMode;}
  gridSpins+=1;
  const gi=document.getElementById('gridIcon');
  gi.style.transform='rotate('+(gridSpins*90)+'deg)';
  gi.querySelectorAll('rect').forEach(r=>{r.style.transition='fill .3s ease';r.setAttribute('fill',gridMode?'#fff':'#C15B72')});
  render();
};document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.getElementById('pdfBtn').onclick=()=>{buildPrintArea();document.body.classList.add('print-all');setTimeout(()=>window.print(),60)};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
document.getElementById('slidesBtn').onclick=exportPptx;
document.getElementById('wishToggle').onclick=async()=>{
  wishMode=!wishMode;
  render();
  if(wishMode){ await loadWishlist(); renderWishlistTable(); }
};
render();
loadWishlist().then(()=>{wlBadge();if(wishMode)renderWishlistTable()});
</script></body></html>
