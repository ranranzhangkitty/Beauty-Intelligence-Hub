ect Hair Day Dry Shampoo","points": ["Emphasizes cleansing over masking as functional difference","Targeted nozzle avoids white residue","Price and channel lean more on the brand's prestige positioning"]},{"name": "Klorane Dry Shampoo (Oat)","points": ["More focused on scalp cleansing for protective styles","Stronger ritual brand positioning","French pharmacy positioning reads as more everyday-affordable by comparison"]}]},"evidenceStats": {"zh": ["第三方临床研究：35名受试者，使用1次后评估","宣称：分解堆积、中和异味、不打乱造型","局限：完整测试方法与统计结果未公开"],"en": ["Third-party clinical study: 35 participants, evaluated after 1 use","Claims: breaks down buildup, neutralizes odor, doesn't disturb style","Limitation: full protocol and statistics not disclosed"]},"experienceItems": {"zh": ["质地：喷雾","用法：摇匀后喷于目标头皮区域，无需冲洗","进阶：重度堆积可用干毛巾擦拭","场景：可用于护发造型拆除前准备"],"en": ["Texture: spray","Usage: shake well, spray on target scalp area, no rinse needed","Pairing: wipe with a dry towel for heavy buildup","Occasion: also used before removing a protective style"]},"packagingItems": {"zh": ["视觉：小巧喷雾瓶，定向喷头设计","规格：TSA友好旅行装","联想：便携、精准、日常护理","弱点：具体成分表未公开，透明度略低"],"en": ["Visual: compact spray bottle with a targeted nozzle","Size: TSA-friendly travel format","Association: portable, precise, everyday care","Weakness: full ingredient list not disclosed, slightly lower transparency"]},"productType": "mist","keyTechnology": {"zh": [{"title": "六年周期研发流程","desc": "由前Living Proof CEO主导，历经六年配方打磨才正式上市，而非快速上市的产品。"},{"title": "沙龙实测配方方法论","desc": "依托Tina Knowles数十年沙龙实操经验，配方经过真实沙龙场景反复验证。"}],"en": [{"title": "Six-Year R&D Development Process","desc": "Led by a former Living Proof CEO, the formula spent six years in development before launch rather than rushing to market."},{"title": "Salon-Tested Formulation Methodology","desc": "Draws on Tina Knowles' decades of real salon practice, with formulas validated repeatedly in actual salon settings."}]},"addedAt": 7},{"id": "cecred-silkglaze","category": "usa","name": {"zh": "Cécred Heat Activated Silk Glaze","en": "Cécred Heat Activated Silk Glaze"},"brand": {"zh": "Cécred","en": "Cécred"},"company": {"zh": "Cécred（Beyoncé Knowles-Carter）","en": "Cécred (Beyoncé Knowles-Carter)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2026年3月17日上市（品牌首个造型系列Styling Collection的核心单品）","en": "Launched Mar 17, 2026 as a hero item of the brand's first Styling Collection"},"market": {"zh": "DTC官网 + Ulta Beauty（官网售价US$34，Ulta同价，常有5%首单折扣）","en": "DTC (cecred.com) + Ulta Beauty (US$34 at both; Ulta often runs a 5% first-order discount)"},"capacity": {"zh": "148 mL / 5 fl oz","en": "148 mL / 5 fl oz"},"price": {"zh": "US$34（约合 US$0.23/mL）","en": "US$34 (approx. US$0.23/mL)"},"positioning": {"zh": "面向所有发质、尤其是做Silk Press的卷发/卷曲发人群的「热激活丝滑造型精华」——定位为凝胶与精华的混合新品类（gel-serum hybrid）：吹风时靠热与张力激活成膜，用更少的加热次数做出玻璃感直发，同时抗湿气抗毛躁，且可洗净还原自然卷度。","en": "A heat-activated silkening styler for all hair types, aimed above all at the silk-press ritual in curly and coily hair. Positioned as a new gel-serum hybrid category: it activates under blow-dry heat and tension to form a weightless film, delivering glass-like straight styles with fewer heat passes while resisting humidity and frizz — and it washes out so natural texture returns."},"target": {"zh": "做Silk Press／拉直造型的卷发与卷曲发人群；担心高温损伤但仍想要顺滑光泽的消费者；佩戴真人发假发/接发、以及做过化学处理头发的使用者。","en": "Curly and coily consumers who silk-press or blow out their hair; users who want sleekness and shine but fear heat damage; wearers of human-hair wigs and weaves and those with chemically treated hair."},"ingredients": {"zh": "水基配方，核心为品牌新技术StemShield Complex（形状记忆聚合物＋植物干细胞脂质＋黑蜂蜜发酵物），配合水解丝蛋白、Thermal Gloss Blend沙漠油混合（西瓜籽油/Mongongo油/野李籽油）、荷荷巴油、芦荟、泛醇，以及Polyquaternium-68与Polyquaternium-11两种成膜阳离子聚合物、瓜尔胶与黄原胶增稠体系。含香精（芳樟醇、香茅醇、香豆素等致敏物申报）。","en": "Water-based, built on the brand's new StemShield Complex (shape-memory polymers + plant stem-cell lipids + black honey fermentation), with Hydrolyzed Silk, a 'Thermal Gloss Blend' of desert oils (Kalahari melon seed, mongongo, wild plum), jojoba oil, aloe leaf juice and panthenol, plus two film-forming cationic polymers (Polyquaternium-68, Polyquaternium-11) and a guar/xanthan thickening system. Fragranced (linalool, citronellol, coumarin and other declared allergens)."},"evidence": {"zh": "官方宣称450°F/232°C耐热保护与抗湿气防护，标注为「专利申请中」的StemShield Complex；官网提供「有/无StemShield Complex」的对比视觉。截至2026年7月官网评分4.8/5（66条评价），100%推荐率。未见公开的仪器测量方法、样本量或对照组设计，属于品牌自述宣称层级。","en": "Brand claims 450°F/232°C heat protection and humidity protection from a patent-pending StemShield Complex, illustrated with a with/without visual on the PDP. As of Jul 2026 the official page shows 4.8/5 from 66 reviews with a 100% recommend rate. No instrumental protocol, sample size or control design is published — these remain brand-level claims."},"experience": {"zh": "泵头质地，轻盈不压发。用法要求严格：必须在洗净的湿发上分4区使用，每区2泵、梳匀后立刻带张力吹干，中途变干需补水雾；全干后再用夹板定型。品牌明确提示「必须按步骤操作」，操作门槛高于普通热防护喷雾。","en": "A pump gel-serum that stays lightweight and does not weigh hair down. Usage is strict: apply to clean damp hair in 4 sections, 2 pumps per section, comb through, then blow-dry that section immediately with tension; re-mist if a section dries out, and flat-iron only once fully dry. The brand explicitly warns that exact steps must be followed — a higher execution barrier than a standard heat-protectant spray."},"packaging": {"zh": "5 fl oz泵头瓶，延续品牌米白＋金色仪式感视觉；单笔订单限购5件。造型系列共7个SKU，与Thermal Shield Mist（US$30）、Strong Hold Gel（US$32）等构成可叠加的「不堆积」造型组合。","en": "A 5 fl oz pump bottle in the brand's cream-and-gold ritual aesthetic; capped at 5 units per order. It sits in a 7-SKU styling collection alongside Thermal Shield Mist (US$30) and Strong Hold Gel (US$32), designed to layer without buildup."},"insight": {"zh": "这支产品把「热损伤」从风险话术转成了可购买的性能承诺：同类产品通常停留在提醒减少热工具使用，它则承诺用更少的加热次数达成同样效果——对做Silk Press的消费者来说，减少加热次数本身就是护发。对我们的启示是，热防护品类的价值主张可以从「防护率数字」转向「减少操作次数」这种消费者能直接感知的效率语言；同时Cécred用专有技术命名（StemShield Complex）把一组常规成膜聚合物＋油脂包装成不可复制的资产，这与Biopeptide-5是同一套做法。","en": "This product converts heat damage from a risk message into a purchasable performance promise: where comparable products stop at advising less heat use, it promises the same result with fewer passes — and for silk-press users, fewer passes is itself hair care. The takeaway is that heat-protection propositions can shift from protection percentages to an efficiency language consumers feel directly. Cécred also repeats the same approach it used for Biopeptide-5, packaging a fairly conventional film-former-plus-oil system as a proprietary, hard-to-copy asset named StemShield Complex."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_02_2048x2048_c0858524-5c98-4d34-a6a2-b66163b6482f.jpg?v=1773336765","https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_03_2048x2048_f5080f31-2402-459c-b102-addb705844cc.jpg?v=1773337041","https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_04_2048x2048_1a00aaad-0f22-4cc9-871d-04c59e301db8.jpg?v=1773439237"],"sources": [["Official product page","https://cecred.com/products/heat-activated-silk-glaze"],["StemShield Complex (brand)","https://cecred.com/pages/stemshield-complex"],["Ulta Beauty listing","https://www.ulta.com/p/heat-activated-silk-glaze-pimprod2057960"]],"targetUsers": {"zh": ["做Silk Press／拉直造型的卷发·卷曲发人群","担心高温损伤但仍追求玻璃感顺滑的消费者","佩戴真人发假发/接发者","化学处理（染烫/松弛）过头发的使用者"],"en": ["Curly and coily users who silk-press or blow out hair","Consumers who want glass-like sleekness but fear heat damage","Wearers of human-hair wigs and weaves","Users with chemically treated (colored/relaxed) hair"]},"keyClaims": {"zh": ["450°F/232°C 耐热保护","抗湿气、抗毛躁，直发造型更持久","更少加热次数即可做出玻璃感直发","易洗净，可还原自然卷度；不压发","适用于真人发假发/接发与化学处理发"],"en": ["450°F/232°C heat protection","Humidity and frizz resistance for longer-lasting straight styles","Glass-like straight styles with fewer heat passes","Washes out easily so natural texture returns; does not weigh hair down","Safe for human-hair wigs/weaves and chemically treated hair"]},"heroIngredients": {"zh": [{"name": "StemShield Complex","tag": "专利申请中·核心防护技术","desc": "形状记忆聚合物＋植物干细胞脂质＋黑蜂蜜发酵物，宣称保护毛发屏障对抗450°F高温、湿气、污染与造型损伤"},{"name": "Hydrolyzed Silk","tag": "水解丝蛋白","desc": "深入发丝补充水分，提升柔顺度与可梳理性"},{"name": "Thermal Gloss Blend","tag": "耐高温沙漠油混合","desc": "西瓜籽油、Mongongo油、野李籽油——耐极端高温干燥的油脂，成膜隔热并带来健康光泽"},{"name": "Polyquaternium-68 / -11","tag": "成膜阳离子聚合物","desc": "构成轻薄定型膜，是「热激活成膜」质感与抗湿气表现的实际载体"}],"en": [{"name": "StemShield Complex","tag": "Patent-pending core defense tech","desc": "Shape-memory polymers + plant stem-cell lipids + black honey fermentation, claimed to protect the hair barrier against 450°F heat, humidity, pollution and styling damage"},{"name": "Hydrolyzed Silk","tag": "Silk protein","desc": "Delivers moisture through the hair shaft for softness and improved manageability"},{"name": "Thermal Gloss Blend","tag": "Heat-resilient desert oils","desc": "Kalahari melon seed, mongongo and wild plum oils — oils built for extreme heat and dryness — forming a barrier while adding healthy shine"},{"name": "Polyquaternium-68 / -11","tag": "Film-forming cationic polymers","desc": "The actual carriers of the heat-set film: they deliver the sleek hold and humidity resistance behind the marketing story"}]},"ingredientsNote": {"zh": "配方为水/甘油基底，辅以荷荷巴油、芦荟汁、泛醇与瓜尔胶·黄原胶体系。含香精并申报芳樟醇、香茅醇、香豆素、乙酸芳樟酯等致敏成分，敏感头皮需留意。整体成分表并不罕见——真正的差异在于技术命名与用法设计，而非单一新成分。","en": "A water/glycerin base rounded out with jojoba oil, aloe juice, panthenol and a guar/xanthan system. It is fragranced, with linalool, citronellol, coumarin and linalyl acetate declared — worth noting for sensitive scalps. The INCI itself is not unusual; the differentiation lies in the naming of the technology and the prescribed application ritual, not in a single novel ingredient."},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Celebrity Prestige"},"en": {"tier": "premium","label": "Premium Celebrity Prestige"}},"marketChannel": {"zh": {"global": ["品牌DTC官网（cecred.com）","Ulta Beauty（美国全渠道）"],"japan": ["未正式进入日本市场；日本消费者主要通过转运/代购获取"],"channelLabel": "DTC + Prestige Retail","channelDesc": "官网首发后同步进入Ulta，依托造型系列7个SKU做组合销售与「不堆积叠加」的连带话术"},"en": {"global": ["Brand DTC (cecred.com)","Ulta Beauty (US omnichannel)"],"japan": ["No official Japan distribution; reached mainly via forwarding/proxy purchase"],"channelLabel": "DTC + Prestige Retail","channelDesc": "Launched DTC and at Ulta simultaneously, sold as part of a 7-SKU styling collection with a 'layer without buildup' cross-sell story"}},"brandConceptRich": {"zh": {"tagline": "更少的加热，更快的顺滑。","concept": "CÉCRED把Silk Press这一在黑人发型文化中承载社交与仪式意义的技法，重新表述为可被配方缩短、且不必以损伤为代价的过程——护发的承诺从「修复之后」前移到「造型当下」。"},"en": {"tagline": "Less heat. Faster sleek.","concept": "CÉCRED reframes the silk press — a technique carrying real social and ritual weight in Black hair culture — as something formulation can shorten without charging damage as the price, moving the care promise from 'after the repair' to 'during the style'."}},"competitiveAdvantage": {"zh": [{"name": "Olaplex No.9 Bond Protector Nourishing Hair Serum","points": ["更聚焦Silk Press单一场景，用法说明细到分区与张力","耐热标称450°F，高于Olaplex No.9的450°F同级但强调「更少加热次数」的效率主张","缺少Olaplex的键结修护循证资产与专业沙龙渠道积累"]},{"name": "Mielle Organics Mongongo Oil Thermal & Heat Protectant Spray","points": ["同样主打Mongongo油，但为凝胶精华质地而非喷雾，成膜与抗湿气更强","价格约为Mielle的2倍以上，明确走prestige而非drugstore","Mielle在美妆连锁与大众渠道的铺货密度和价格亲和力仍更占优"]},{"name": "Pattern Beauty Blow Dry Cream / Heat Protectant","points": ["同为面向卷发人群的名人创立品牌，但Cécred技术命名（StemShield）更强","定位在造型系列整体可叠加，连带购买设计更完整","Pattern的价格带更低，入门门槛更友好"]}],"en": [{"name": "Olaplex No.9 Bond Protector Nourishing Hair Serum","points": ["Far more focused on the single silk-press occasion, with instructions down to sectioning and tension","Rated to 450°F like No.9, but sells an efficiency proposition — fewer heat passes — rather than protection alone","Lacks Olaplex's bond-repair evidence base and professional-salon heritage"]},{"name": "Mielle Organics Mongongo Oil Thermal & Heat Protectant Spray","points": ["Uses the same mongongo oil story but as a gel-serum, giving stronger film-forming and humidity resistance","Priced at more than 2x Mielle, deliberately prestige rather than drugstore","Mielle still wins on mass-channel distribution density and price accessibility"]},{"name": "Pattern Beauty Blow Dry Cream / Heat Protectant","points": ["Also a founder-led brand for textured hair, but Cécred's named technology (StemShield) lands harder","Designed as part of a layerable styling system, so the cross-sell architecture is more complete","Pattern sits at a lower price band with an easier entry point"]}]},"evidenceStats": {"zh": ["官方宣称：450°F/232°C 耐热保护、湿气防护（StemShield Complex，专利申请中）","官网评分：4.8/5，66条评价，100%推荐率（2026年7月）","视觉证据：官网提供「有/无StemShield Complex」对比演示","局限：未公开仪器测量方法、样本量与对照组设计，属品牌自述宣称"],"en": ["Brand claims: 450°F/232°C heat protection and humidity protection (patent-pending StemShield Complex)","Official site rating: 4.8/5 from 66 reviews, 100% would recommend (Jul 2026)","Visual evidence: with/without StemShield Complex demonstration on the PDP","Limitation: no instrumental method, sample size or control design disclosed — brand-level claims"]},"experienceItems": {"zh": ["质地：泵头凝胶精华（gel-serum hybrid），轻盈不压发","用法：湿发分4区，每区2泵→梳匀→立即带张力吹干→全干后夹板定型","关键限制：必须湿发使用、必须分区、变干需补水雾，操作门槛偏高","卖点感知：官方与用户反馈集中在光泽、顺滑与抗湿气，「亮而不腻」","提示：品牌自身提示频繁高温可能松弛天然卷型"],"en": ["Texture: pump gel-serum hybrid, lightweight and non-weighing","Usage: damp hair in 4 sections, 2 pumps each → comb through → blow-dry immediately with tension → flat-iron once fully dry","Key constraints: must be damp hair, must be sectioned, re-mist if it dries — a high execution barrier","Perceived benefit: shine, slip and humidity resistance dominate both brand and user language — 'glossy, not greasy'","Caveat: the brand itself warns that frequent high heat may loosen the natural curl pattern"]},"packagingItems": {"zh": ["视觉：5 fl oz 泵头瓶，米白＋金色，延续品牌仪式感体系","组合：造型系列7个SKU，主打可叠加不堆积","限购：单笔订单限购5件","弱点：泵头瓶体积较大，不适合随身补涂；且本品并非补妆型产品，使用场景集中在洗后造型当次"],"en": ["Visual: 5 fl oz pump bottle in cream and gold, consistent with the brand's ritual system","System: part of a 7-SKU styling collection built to layer without buildup","Limit: capped at 5 units per order","Weakness: a bulky pump bottle unsuited to on-the-go touch-ups — and by design it is a wash-day styling product, not a refresher"]},"productType": "gel","keyTechnology": {"zh": [{"title": "StemShield Complex（专利申请中）","desc": "把形状记忆聚合物、植物干细胞脂质与黑蜂蜜发酵物打包命名为一套「屏障防护」技术，作为整个造型系列的共同技术底座，而非单品成分。"},{"title": "热与张力双激活的成膜设计","desc": "配方不在涂抹时成型，而是依靠吹风的热量与梳子/圆梳的张力共同激活定型，因此产品说明把「分区、立即吹干、变干补水」写成必须遵守的步骤。"},{"title": "可洗净的可逆造型策略","desc": "刻意设计为易洗净、卷度可还原，把「造型」与「化学拉直」区隔开——降低消费者对永久性改变发质的顾虑。"},{"title": "系列级可叠加验证","desc": "造型系列7个SKU以「层层叠加不堆积」为共同开发前提，技术评估单位是组合而非单品。"}],"en": [{"title": "StemShield Complex (patent-pending)","desc": "Bundles shape-memory polymers, plant stem-cell lipids and black honey fermentation into one named barrier-protection technology that anchors the whole styling collection rather than a single SKU."},{"title": "Dual heat-and-tension activation","desc": "The formula does not set on application; it is activated by blow-dryer heat together with comb or round-brush tension, which is why sectioning, immediate drying and re-misting are written as mandatory steps."},{"title": "Reversible, washes-out styling strategy","desc": "Deliberately engineered to rinse out and let curl return, separating 'styling' from 'chemical straightening' and lowering the fear of permanently altering hair."},{"title": "Collection-level layering validation","desc": "All 7 styling SKUs were developed against a shared 'layer without buildup' requirement, so the unit of technical evaluation is the routine, not the product."}]},"addedAt": 14},{"id": "honeyque","category": "japan","name": {"zh": "HONEYQUE Rich Gloss Treatment","en": "HONEYQUE Rich Gloss Treatment"},"brand": {"zh": "HONEYQUE","en": "HONEYQUE"},"company": {"zh": "Bottle Works","en": "Bottle Works"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2023 年 9 月 13 日","en": "September 13, 2023"},"market": {"zh": "日本药妆、电商及生活方式零售","en": "Japanese drugstores, e-commerce and lifestyle retail"},"capacity": {"zh": "本体 450 mL / 替换装 400 mL","en": "450 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,650 / 替换装 ¥1,210","en": "¥1,650 bottle / ¥1,210 refill"},"positioning": {"zh": "围绕“貯水リペア”和“蜜髪”构建光泽修护定位。产品把有机麦卢卡蜂蜜的保水故事、三种胶原蛋白的空洞损伤修护、角质层护理和热保护整合在一起，主打毛躁、粗硬、内部空洞化和光泽不足。","en": "Positioned around water-retention repair and glossy “honey hair.” Organic Manuka honey, three collagen types, cuticle care and heat protection are combined to address frizz, coarse texture, internal hollow damage and lack of shine."},"target": {"zh": "主要面向染烫、吹风和夹板使用频繁、发丝干燥粗糙、缺乏光泽及难以服帖的人群。视觉和香味偏女性化，但官方没有严格限定年龄。","en": "For consumers with color, perm and heat-tool damage who experience dryness, roughness, poor shine and difficult manageability. The visual and fragrance direction is feminine, though the brand does not impose a strict age limit."},"distribution": {"zh": "本体 450 mL / ¥1,650；替换装 400 mL / ¥1,210。属于日本大众高机能洗护的主流价位。药妆和电商是核心渠道，替换装有利于维持复购。","en": "450 mL at ¥1,650 and a 400 mL refill at ¥1,210. It occupies the mainstream Japanese mass-premium haircare price band, relying on drugstores and e-commerce for reach."},"ingredients": {"zh": "核心故事包括有机麦卢卡蜂蜜、三种胶原蛋白、透明质酸衍生物、神经酰胺、角蛋白和水解丝。官方还提到 γ-Docosalactone 与水解芝麻蛋白衍生物作为热保护相关成分。","en": "Organic Manuka honey, three collagen types, a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk. Heat-care ingredients support a story of retaining internal moisture and smoothing the cuticle."},"evidence": {"zh": "官方公开页面主要提供成分功能、产品特征和热保护成分说明，未见完整公开的人体临床方案、仪器测试数据或样本量。其支撑更偏向成分机理与品牌内部产品开发逻辑。","en": "Official communication mainly provides ingredient functions and product-development logic. No complete public human clinical protocol, instrumental data set or sample size was found."},"experience": {"zh": "450 mL 泵瓶，浅奶油色与蜂蜜琥珀色组合，强调甜润、柔软和高光泽。香型为 Aqua Blossom Honey。护发素定位强调包裹感、湿发顺滑、冲洗后的柔软度以及吹干后的服帖和光泽。","en": "A 450 mL pump bottle in soft cream and honey-amber tones. Aqua Blossom Honey fragrance. The conditioner emphasizes coating, wet detangling, softness after rinsing, and smooth glossy hair after drying."},"packaging": {"zh": "柔和浅色瓶身、蜂蜜色液滴与圆润泵头形成明显的甜润感。相比 &honey 的装饰性包装，HONEYQUE 更简洁成熟；相比专业沙龙品牌，则更亲和。","en": "Soft colors, honey-toned details and a rounded pump create a rich but approachable look. It is simpler and more mature than highly decorative honey brands, while remaining more friendly than salon-professional packaging."},"insight": {"zh": "核心优势是把蜂蜜故事从“天然保湿”推进到“发丝空洞化修护”，因此比单纯的蜂蜜香氛产品更具技术感。较容易复制的是成分组合；较难复制的是蜜感视觉、香味、顺滑触感和全系列传播的一致性。","en": "Its strength is extending honey from a natural-moisture story into internal hollow-damage repair. The ingredient combination is easy to copy; the difficult part is achieving consistent scent, slip, gloss and visual identity across the line."},"notes": {"zh": "","en": ""},"images": ["https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml1.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml2.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml3.png?v=1745527002&width=1024"],"sources": [["Official product page","https://honeyque.jp/products/rich-gloss-treatment/"],["MAQUIA","https://maquia.hpplus.jp/cosme/170297/"],["Brand concept","https://honeyque.jp/"]],"targetUsers": {"zh": ["染烫、吹风、夹板等热工具使用频繁人群","发丝干燥粗糙、缺乏光泽人群","难以服帖、内部空洞化受损发质","视觉与香味偏好女性化护理体验的消费者"],"en": ["Frequent users of coloring, blow-drying and flat irons","Dry, rough, dull hair","Hard-to-manage hair with internal hollow damage","Consumers who prefer a feminine visual and fragrance experience"]},"keyClaims": {"zh": ["有机麦卢卡蜂蜜“貯水リペア”保水修护","三种胶原蛋白修护空洞化损伤","角质层护理+热保护成分","替换装设计，利于维持复购"],"en": ["Organic Manuka honey “water-retention repair” (chosui repair)","Three collagen types repair internally hollowed-out damage","Cuticle care plus heat-protection ingredients","Refill pack design supports repeat purchase"]},"heroIngredients": {"zh": [{"name": "有机麦卢卡蜂蜜","tag": "保水修护核心","desc": "“貯水リペア”故事，锁住发丝内部水分"},{"name": "三种胶原蛋白","tag": "空洞化损伤修护","desc": "修护发丝内部空洞化损伤，提升光泽与柔顺度"}],"en": [{"name": "Organic Manuka Honey","tag": "Core water-retention repair","desc": "The “water-retention repair” story that locks moisture inside the hair"},{"name": "Three Collagen Types","tag": "Hollow-damage repair","desc": "Repairs internally hollowed-out damage, boosting shine and smoothness"}]},"ingredientsNote": {"zh": "官方还提到γ-Docosalactone与水解芝麻蛋白衍生物作为热保护相关成分，搭配透明质酸衍生物、神经酰胺、角蛋白和水解丝。","en": "The brand also cites γ-Docosalactone and a hydrolyzed sesame protein derivative as heat-care ingredients, alongside a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk."},"pricePositioning": {"zh": {"tier": "masstige","label": "大众高机能主流价位"},"en": {"tier": "masstige","label": "Mainstream Mass-Premium"}},"marketChannel": {"zh": {"global": ["品牌官网","海外电商（LAMOUR等）"],"japan": ["药妆","生活方式零售"],"channelLabel": "Drugstore & E-commerce","channelDesc": "药妆与电商为核心，替换装利于维持复购"},"en": {"global": ["Official website","Overseas e-commerce (LAMOUR, etc.)"],"japan": ["Drugstores","Lifestyle retail"],"channelLabel": "Drugstore & E-commerce","channelDesc": "Core distribution via drugstores and e-commerce; refill packs support repeat purchase"}},"brandConceptRich": {"zh": {"tagline": "蜂蜜胶原，让头发记住水分。","concept": "HONEYQUE定位为更亲民的蜂蜜修护替代品，用有机麦卢卡蜂蜜与胶原蛋白专门修护发丝内部空洞化损伤，而非仅仅解决表层干燥。"},"en": {"tagline": "Honey Collagen, for hair that remembers water.","concept": "HONEYQUE positions itself as the accessible honey-repair alternative, using organic Manuka honey and collagen to target internally hollowed-out damage rather than surface dryness alone."}},"competitiveAdvantage": {"zh": [{"name": "Gisou","points": ["价格更亲民，购买门槛远低于Gisou的高端定价","更强调“空洞化修护”技术宣称，而非纯粹蜂蜜香氛联想","药妆/电商渠道更易触达，无需依赖精品美妆专柜"]},{"name": "OUAI","points": ["更强调具体功效成分（胶原蛋白、神经酰胺）而非生活方式营销","日本本土渠道覆盖更深，海外零售仍处起步阶段","香调走“甜美蜂蜜”路线，与OUAI的中性香氛调性形成差异化"]},{"name": "Briogeo","points": ["同样主打胶原蛋白修护，但更强调“蜜感”体验与日系包装美学","替换装设计更利于日常复购，Briogeo更依赖单瓶定价","价格带更贴近大众高机能，Briogeo定位略高"]}],"en": [{"name": "Gisou","points": ["More accessible price, far below Gisou's prestige positioning","Leads with a “hollow-damage repair” technology claim rather than a purely honey-fragrance association","Easier to reach via drugstore/e-commerce, without relying on prestige beauty counters"]},{"name": "OUAI","points": ["Leans on specific functional ingredients (collagen, ceramides) rather than lifestyle-driven marketing","Deeper penetration in Japan's domestic channels, though still early-stage in overseas retail","Sweet honey scent direction differentiates from OUAI's more neutral fragrance tone"]},{"name": "Briogeo","points": ["Also centers on collagen repair, but leans more into a “honey-touch” sensorial experience and J-beauty packaging aesthetic","Refill pack design better supports everyday repeat purchase; Briogeo relies more on single-bottle pricing","Sits closer to the mass-premium price band, while Briogeo is positioned slightly higher"]}]},"evidenceStats": {"zh": ["公开页面主要提供成分功能与产品特征说明","未见完整公开的人体临床方案或仪器测试数据","支撑逻辑偏向成分机理与品牌内部开发逻辑"],"en": ["Official page mainly provides ingredient function and product-feature descriptions","No complete public human clinical protocol or instrumental data set was found","Support logic leans on ingredient mechanism and internal brand development logic"]},"experienceItems": {"zh": ["瓶身：450 mL泵瓶，浅奶油+蜂蜜琥珀配色","香调：Aqua Blossom Honey","洗感：湿发顺滑，冲洗后柔软","吹干后：服帖有光泽"],"en": ["Bottle: 450 mL pump, soft cream + honey-amber tones","Scent: Aqua Blossom Honey","Feel: smooth detangling wet, soft after rinsing","After drying: sleek and glossy"]},"packagingItems": {"zh": ["视觉：柔和浅色瓶身+蜂蜜色液滴+圆润泵头","定位：比&honey更简洁成熟，比沙龙品牌更亲和","规格：本体450 mL+替换装400 mL","优势：替换装降低复购门槛"],"en": ["Visual: soft-colored bottle + honey-toned droplet motif + rounded pump","Positioning: simpler/more mature than &honey, friendlier than salon brands","Sizes: 450 mL bottle + 400 mL refill","Strength: refill pack lowers the repeat-purchase barrier"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "貯水リペア保水修护技术","desc": "品牌自有命名的保水修护技术体系，专门针对发丝内部空洞化损伤设计。"},{"title": "三重胶原复合技术","desc": "组合三种不同类型的胶原蛋白协同修护，而非依赖单一胶原成分。"}],"en": [{"title": "Water-Retention Repair (Chosui Repair) System","desc": "A brand-named repair technology specifically engineered to address internally hollowed-out hair damage."},{"title": "Triple Collagen Complex","desc": "Combines three distinct collagen types working together, rather than relying on a single collagen ingredient."}]},"addedAt": 4},{"id": "kinkycurly-knottoday","category": "usa","name": {"zh": "Kinky-Curly Knot Today","en": "Kinky-Curly Knot Today"},"brand": {"zh": "Kinky-Curly","en": "Kinky-Curly"},"company": {"zh": "Kinky-Curly Hair Care","en": "Kinky-Curly Hair Care"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "天然发社群经典长青单品（早年推出，长期在售）","en": "A natural-hair community classic, launched years ago and still a staple"},"market": {"zh": "品牌官网、Sally Beauty、CVS、Meijer等美国零售渠道","en": "Brand website, Sally Beauty, CVS, Meijer and other US retail channels"},"capacity": {"zh": "8 fl oz / 236 mL","en": "8 fl oz / 236 mL"},"price": {"zh": "约US$14","en": "~US$14"},"positioning": {"zh": "打结今日终结，奶油质地的草本护发素/免洗顺发乳，专为浓密纠结的卷发/紧致纹理发梳理设计，可作冲洗型护发素或免洗使用。","en": "Knot Today (a play on 'not today'), a creamy herbal conditioner/detangler for thick, tangle-prone curly and coily hair, usable as either a rinse-out conditioner or a leave-in."},"target": {"zh": "浓密卷发/紧致纹理发、拆卸编发/延伸发后急需梳理的人群；天然发社群中配方极简的忠实拥趸。","en": "Thick, curly/coily hair, especially post-braid or post-extension detangling needs; loyal natural-hair community members who favor minimalist formulas."},"ingredients": {"zh": "有机芒果果提取物、有机榆树皮提取物、有机蜀葵根提取物、有机柠檬草提取物、鲸蜡醇、双十八烷基甲基硫酸铵甲基硫酸盐（Behentrimonium Methosulfate）、柠檬酸、苯氧乙醇、天然香精。","en": "Organic mango fruit extract, organic slippery elm, organic marshmallow root, organic lemongrass, cetyl alcohol, behentrimonium methosulfate, citric acid, phenoxyethanol, natural fragrance."},"evidence": {"zh": "宣称主要基于成分描述与十余年的消费者口碑（天然发博主评测、社群评价），未见公开的独立临床或仪器测试数据。","en": "Claims rest mainly on ingredient descriptions and over a decade of consumer word-of-mouth (natural-hair blogger reviews, community reviews); no public independent clinical or instrumental data found."},"experience": {"zh": "奶油质地，洗发后大量涂抹并用宽齿梳分区梳理；也可作免洗护发素用于浓密卷发。用户反馈滑感极佳但保湿力对干发需搭配其他产品。","en": "Creamy texture; apply generously after shampooing and detangle in sections with a wide-tooth comb. Can also be used as a leave-in for thick curly hair. Users report excellent slip, though it should be paired with a separate moisturizer for dry hair."},"packaging": {"zh": "简约塑料瓶身，粉色系视觉与手写体品牌名，走亲和、怀旧的天然发社群美学，识别度高但不算精品化。","en": "Simple plastic bottle with a pink color scheme and a handwritten-style logo, an approachable, nostalgic natural-hair community aesthetic, recognizable but not premium in feel."},"insight": {"zh": "Knot Today长期稳居天然发社群必入清单，证明极简、聚焦单一痛点（打结/梳理）的产品，凭借持续口碑传播也能在拥挤市场中占据长期心智份额，而不依赖频繁的产品迭代或营销投入。","en": "Knot Today's long-standing place on natural-hair must-buy lists shows that a minimalist product solving one clear pain point (tangles/detangling) can hold durable mindshare in a crowded market through sustained word-of-mouth, without frequent reformulation or heavy marketing spend."},"notes": {"zh": "","en": ""},"images": ["https://kinky-curly.com/cdn/shop/products/Kinky-CurlyKnotToday_1200x1200.png?v=1606339935"],"sources": [["Official product page","https://kinky-curly.com/products/knot-today"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/kinky-curly-knot-today-odzywka-bez-splukiwania"]],"targetUsers": {"zh": ["浓密卷发/紧致纹理发人群","拆卸编发、延伸发后需要梳理的人群","偏好极简成分配方的天然发社群成员","习惯在CVS/Sally Beauty等渠道购买的消费者"],"en": ["Thick, curly/coily hair","Post-braid or post-extension detangling needs","Natural-hair community members who prefer minimalist formulas","Shoppers who buy at CVS/Sally Beauty channels"]},"keyClaims": {"zh": ["顺滑梳理，减少打结与拉扯","可作冲洗型护发素或免洗使用","适合浓密卷发/紧致纹理发","天然草本成分，配方简洁"],"en": ["Smooth detangling, reduces knots and pulling","Usable as rinse-out conditioner or leave-in","Suited to thick curly/coily hair","Natural herbal ingredients, minimalist formula"]},"heroIngredients": {"zh": [{"name": "有机芒果果提取物","tag": "顺滑保湿","desc": "提供丝滑梳理感与轻盈保湿"},{"name": "有机蜀葵根+榆树皮提取物","tag": "顺发滑感来源","desc": "天然黏滑质地成分，赋予护发素标志性滑感"}],"en": [{"name": "Organic Mango Fruit Extract","tag": "Slip & moisture","desc": "Provides silky detangling slip and light hydration"},{"name": "Organic Marshmallow Root + Slippery Elm","tag": "Signature slip","desc": "Naturally mucilaginous extracts that give the conditioner its signature slip"}]},"ingredientsNote": {"zh": "配方还含柠檬草提取物提供清新香调，双十八烷基甲基硫酸铵甲基硫酸盐作为调理剂主力成分，整体配方成分数量精简，是该品牌极简定位的直接体现。","en": "The formula also includes lemongrass extract for a fresh scent, with behentrimonium methosulfate as the primary conditioning agent, an overall short ingredient list that directly reflects the brand's minimalist positioning."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Community Staple"},"en": {"tier": "mass","label": "Mass Community Staple"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "美国药妆与大众零售渠道为核心分销路径"},"en": {"global": ["Brand website","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "US drugstore and mass retail are the core distribution channels"}},"brandConceptRich": {"zh": {"tagline": "干净、简单、Wash-and-Go。","concept": "作为最早的天然清洁配方品牌之一，Kinky-Curly靠极简成分表和专注于卷发/紧卷发wash-and-go造型解结的单一定位建立口碑。"},"en": {"tagline": "Clean, simple, wash-and-go.","concept": "One of the original clean natural-hair brands, Kinky-Curly built its reputation on short, minimal ingredient lists and a singular focus on detangling for wash-and-go kinky and curly styling."}},"competitiveAdvantage": {"zh": [{"name": "Uncle Funky's Daughter系列","points": ["更聚焦梳理/打结这一单一场景，而非造型定型","价格更亲民","渠道覆盖(CVS/Meijer)比UFD更下沉"]},{"name": "Cantu Shea Butter Leave-In","points": ["草本滑感成分组合更独特（芒果+蜀葵根+榆树皮）","品牌社群忠诚度历史更悠久","Cantu渠道覆盖与营销投入更大"]},{"name": "Jessicurl","points": ["价格更具竞争力，渠道更广泛（CVS等大众药妆）","配方更极简，学习成本更低","Jessicurl保湿力评价通常更高"]}],"en": [{"name": "Uncle Funky's Daughter line","points": ["More narrowly focused on detangling vs. styling/hold","More accessible price","Broader mass-retail reach (CVS/Meijer) than UFD"]},{"name": "Cantu Shea Butter Leave-In","points": ["More distinctive slip-ingredient blend (mango + marshmallow root + slippery elm)","Longer community loyalty history","Cantu has broader retail reach and marketing spend"]},{"name": "Jessicurl","points": ["More competitive pricing, broader retail reach (CVS etc.)","Simpler formula, lower learning curve for users","Jessicurl is generally rated higher for moisture"]}]},"evidenceStats": {"zh": ["宣称主要基于十余年消费者口碑与博主评测","未见独立第三方临床或仪器测试数据","部分评论指出保湿力对干发需搭配其他产品"],"en": ["Claims rest mainly on over a decade of consumer word-of-mouth and blogger reviews","No independent third-party clinical or instrumental data found","Some reviews note it needs pairing with another product for dry hair moisture"]},"experienceItems": {"zh": ["质地：奶油状护发素","用法：冲洗型或免洗均可，宽齿梳分区梳理","场景：拆卸编发/延伸发后梳理首选","反馈：滑感佳，保湿力对干发略弱"],"en": ["Texture: creamy conditioner","Usage: works as rinse-out or leave-in, detangle in sections with a wide-tooth comb","Occasion: a go-to after removing braids/extensions","Feedback: great slip, moisture may be light for very dry hair"]},"packagingItems": {"zh": ["视觉：简约瓶身+粉色系配色+手写体logo","联想：亲和、怀旧的天然发社群美学","规格：8oz家用装为主","优势：识别度高，长期在售形成信任资产"],"en": ["Visual: simple bottle, pink color scheme, handwritten-style logo","Association: approachable, nostalgic natural-hair community aesthetic","Size: mainly 8oz household size","Strength: high recognition, long tenure builds trust as a brand asset"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "极简顺滑剂配方技术","desc": "围绕少数高效顺滑/解结成分构建配方，而非堆砌长长的成分列表。"},{"title": "Wash-and-Go适配测试","desc": "专门针对wash-and-go造型方法进行配方适配与测试。"}],"en": [{"title": "Minimalist Slip-Agent Formulation","desc": "Built around a small number of high-performing slip and detangling agents rather than a long ingredient list."},{"title": "Wash-and-Go Compatibility Testing","desc": "Formulated and tested specifically for compatibility with the wash-and-go styling method."}]},"addedAt": 10},{"id": "loreal","category": "europe","name": {"zh": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo","en": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo"},"brand": {"zh": "L’Oréal Professionnel","en": "L’Oréal Professionnel"},"company": {"zh": "L’Oréal","en": "L’Oréal"},"origin": {"zh": "法国","en": "France"},"launch": {"zh": "Scalp Advanced 系列现行版本","en": "Current Scalp Advanced range"},"market": {"zh": "全球专业沙龙、品牌官网与授权零售；日本以进口电商为主","en": "Professional salons, official channels and authorized retail; mainly import e-commerce in Japan"},"capacity": {"zh": "300 mL / 500 mL","en": "300 mL / 500 mL"},"price": {"zh": "日本进口价约 ¥3,490–¥4,620（300 mL）","en": "Approx. ¥3,490–¥4,620 in Japan (300 mL)"},"positioning": {"zh": "欧莱雅专业线针对头屑与头皮微生态失衡人群推出的沙龙级治疗型洗发产品。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。","en": "A salon-grade treatment shampoo from L'Oréal Professionnel, developed for people with dandruff and scalp micro-ecology imbalance. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations."},"target": {"zh": "核心消费者是反复出现可见头屑、同时担心头皮干燥、油腻或不适的人群。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。官方未限定性别；产品覆盖干性与油性头屑场景。","en": "Designed for consumers with recurring visible dandruff who may also experience dryness, oiliness or discomfort. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations. Official communication is gender-neutral and covers both dry and oily dandruff."},"distribution": {"zh": "300 mL 与 500 mL 两种规格，主要依赖专业沙龙、L’Oréal Professionnel 官方渠道及各国授权零售。日本并非其最强本土渠道，进口电商价格差异较大，因此价格竞争力不如日本本土药妆洗护，但专业品牌形象和针对性头皮功效支撑了溢价。","en": "Available in 300 mL and 500 mL sizes through professional salons, official L’Oréal Professionnel channels and authorized retailers. In Japan, import pricing varies considerably, so it is less price-competitive than domestic drugstore products. Its premium is supported by professional branding and targeted scalp efficacy."},"ingredients": {"zh": "核心活性为 Piroctone Olamine，用于去屑及抑制与头屑相关的微生物；配方中还可见 Salicylic Acid、Glycerin、Coco-Betaine、Guar Hydroxypropyltrimonium Chloride 等。整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The key active is Piroctone Olamine for dandruff control. The formula also includes Salicylic Acid, Glycerin, Coco-Betaine and Guar Hydroxypropyltrimonium Chloride. The cleansing base is conventional, while humectants, conditioning polymers and sensorial modifiers improve the professional-use experience. The broader Scalp Advanced range frames these ingredients within a scalp-skinification story."},"evidence": {"zh": "官方公开资料给出了较清晰的测试层级：首次使用后“最多去除 100% 可见头屑”为消费者测试；“最长 72 小时去屑保护”为临床测试；另有 44 名受试者、每周使用 3 次的临床测试描述，用于支持头屑外观减少。公开页面仍未完整披露各测试的详细设计、对照组和统计方法，因此适合归类为“有消费者与临床支持，但完整研究报告未公开”。","en": "Official materials describe consumer and clinical testing, including removal of up to 100% visible dandruff after first use and protection lasting up to 72 hours. A 44-subject clinical test used three applications per week. However, full protocols, control design and statistical details are not publicly available."},"experience": {"zh": "轻盈乳霜型洗发质地，目标是兼顾去屑清洁和头皮舒适度。官方建议在湿发与头皮上均匀涂抹，用指腹轻柔起泡后冲洗，油性头屑可先搭配同系列深层净化产品。香气被描述为中性、清新、具有洁净感和专业护理基调。包装为白色专业线瓶身，搭配淡蓝绿色区块和黑色瓶盖，视觉接近皮肤科与沙龙专业护理。","en": "A lightweight cream shampoo designed to combine anti-dandruff cleansing with scalp comfort. It is applied to wet hair and scalp, gently lathered with fingertips, then rinsed. The scent is clean, neutral and professional. White packaging with pale blue-green accents creates a dermatological salon-care impression."},"packaging": {"zh": "白色大面积留白、黑色专业品牌标识、浅蓝绿色功能标签，强化“临床、洁净、专业”的视觉联想。300 mL / 500 mL 规格便于区分家用和沙龙需求。优势是专业感强、功能识别直接；弱点是与其他 Scalp Advanced 单品外观接近，消费者需要仔细阅读功能名称。","en": "Large white areas, a black professional logo and pale blue-green functional labels communicate clinical cleanliness and expertise. The 300 mL and 500 mL formats serve home and salon use. The design is professional and clear, although products within the range look similar and require close label reading."},"insight": {"zh": "其真正竞争力是把经典去屑活性 Piroctone Olamine 放进专业沙龙与头皮皮肤学的说法体系中，并用可量化功效、专家共创和更精致的质地完成品牌升级——活性本身是成熟成分，价值来自这套包装方式。最值得学习的是“功能问题—专业诊断—方案组合”的完整路径。较容易被复制的是基础表活和去屑活性组合；较难复制的是全球沙龙网络、品牌权威和成套产品协议。","en": "Its real advantage is the way a classic anti-dandruff active, Piroctone Olamine, is elevated through professional salon authority, scalp-skinification language and quantified claims. The active itself is mature; the value comes from how it is framed. The easiest elements to replicate are the cleansing and active system; the hardest are the global salon network, brand authority and protocol-led portfolio."},"notes": {"zh": "","en": ""},"images": ["https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/1-slider.jpg?rev=efaa1ce17fbc46e89231df450630a23c&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=3C7CB343DD83CA74C193FAC4DD71971D","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/2-slider.jpg?rev=fc2f59083a7441b2ba529fec034b0952&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=EA207AAB5C9EC015B416591B12F0BB8C","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/3-slider.jpg?rev=a86a74bd0af444e5af9c0945b5b5270d&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=2D01FDE06D41407D4C65FA6D849910BB"],"sources": [["L’Oréal Professionnel Official","https://www.lorealprofessionnel.com/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["L’Oréal Professionnel UK","https://www.lorealprofessionnel.co.uk/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["Japan retail reference","https://makeup.jp/product/730063/"]],"targetUsers": {"zh": ["中度至重度头屑人群","头皮敏感、瘙痒人群","经常染烫、头皮受损人群","追求沙龙级专业护理的消费者"],"en": ["Moderate to severe dandruff","Sensitive, itchy scalp","Frequently colored/permed, damaged scalp","Consumers seeking salon-grade professional care"]},"keyClaims": {"zh": ["有效去屑，长效抑制头屑再生","舒缓头皮不适，减少瘙痒","平衡头皮微生态","专业沙龙级配方，温和不刺激","皮肤学测试，安全有效"],"en": ["Effective dandruff removal, long-lasting recurrence control","Soothes scalp discomfort, reduces itching","Balances scalp micro-ecology","Professional salon-grade formula, gentle","Dermatologically tested, safe and effective"]},"heroIngredients": {"zh": [{"name": "Piroctone Olamine","tag": "高效去屑因子","desc": "抑制马拉色菌，减少头屑生成"},{"name": "Niacinamide（烟酰胺）","tag": "舒缓修护头皮","desc": "强韧屏障，减少头皮不适"}],"en": [{"name": "Piroctone Olamine","tag": "High-efficacy anti-dandruff agent","desc": "Inhibits Malassezia, reduces dandruff formation"},{"name": "Niacinamide","tag": "Soothes & repairs scalp","desc": "Strengthens barrier, reduces scalp discomfort"}]},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Professional","desc": "沙龙专业护理 · 高端专业线"},"en": {"tier": "premium","label": "Premium Professional","desc": "Salon professional care · High-end line"}},"marketChannel": {"zh": {"global": ["专业沙龙","品牌官网","Amazon","授权零售渠道"],"japan": ["乐天","Amazon JP","Yahoo! Shopping","美容院渠道"],"channelLabel": "Salon Professional","channelDesc": "专业沙龙护理渠道为核心"},"en": {"global": ["Professional salons","Official website","Amazon","Authorized retail"],"japan": ["Rakuten","Amazon JP","Yahoo! Shopping","Salon channel"],"channelLabel": "Salon Professional","channelDesc": "Professional salon care channel as core"}},"brandConceptRich": {"zh": {"tagline": "头皮即肌肤。","concept": "用护肤级的严谨对待头皮，将皮肤学科学与欧莱雅专业线的沙龙权威结合，把去屑护理从速效方案重新定义为专业、仪式化的护理过程。"},"en": {"tagline": "Scalp is skin.","concept": "Treats the scalp with the same rigor as skincare, combining dermatological science with L'Oréal Professionnel's salon authority to reframe dandruff care as expert, ritualized treatment rather than a quick fix."}},"competitiveAdvantage": {"zh": [{"name": "Head & Shoulders","points": ["更专业的沙龙定位","更关注头皮微生态平衡","配方更温和，兼顾护理体验"]},{"name": "Kérastase","points": ["价格更具竞争力","针对头屑问题更聚焦","日常护理更易坚持"]},{"name": "Aveda","points": ["更强调医学化头皮护理","去屑功效更明确","渠道覆盖更广泛"]}],"en": [{"name": "Head & Shoulders","points": ["More professional salon positioning","Greater focus on scalp micro-ecology balance","Gentler formula with better care experience"]},{"name": "Kérastase","points": ["More competitive pricing","More focused on dandruff specifically","Easier to maintain as daily routine"]},{"name": "Aveda","points": ["Stronger medicalized scalp-care framing","Clearer anti-dandruff efficacy claims","Broader channel coverage"]}]},"ingredientsNote": {"zh": "整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The cleansing base follows a classic anionic + amphoteric surfactant framework, with pearlizers, humectants, conditioning polymers and cooling agents improving the professional-use experience. The brand places it within the Scalp Advanced dermatological-active lineup, alongside Niacinamide, AHA and Clay, to build a broader scalp-“skinification” story."},"evidenceStats": {"zh": ["首次使用：最多去除100%可见头屑（消费者测试）","持效：最长72小时去屑保护（临床测试）","临床样本：44名受试者，每周使用3次","局限：完整测试设计、对照组与统计方法未公开"],"en": ["First use: up to 100% visible dandruff removal (consumer test)","Duration: up to 72-hour dandruff protection (clinical test)","Clinical sample: 44 subjects, 3 applications/week","Limitation: full protocol, control group and statistics not disclosed"]},"experienceItems": {"zh": ["质地：轻盈乳霜型洗发水","用法：湿发湿头皮涂抹，指腹轻柔起泡后冲洗","进阶：油性头屑可先用同系列深层净化产品","香调：中性清新，专业护理感"],"en": ["Texture: lightweight cream shampoo","Usage: apply to wet hair/scalp, lather gently with fingertips, then rinse","Pairing: oily dandruff can pre-treat with the deep-purifying product in the range","Scent: clean, neutral, professional"]},"packagingItems": {"zh": ["视觉：大面积留白 + 黑色品牌标识 + 浅蓝绿功能标签","联想：强化“临床、洁净、专业”印象","规格：300 mL / 500 mL，区分家用与沙龙场景","弱点：系列内单品外观接近，需仔细看标签区分"],"en": ["Visual: large white space, black logo, pale blue-green functional labels","Association: reinforces a “clinical, clean, professional” impression","Sizes: 300 mL / 500 mL for home vs. salon use","Weakness: products within the range look similar, requiring close label reading"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "皮肤学净化科技","desc": "将活性成分与皮肤学级洁净配方结合，在抑制马拉色菌的同时避免过度破坏头皮屏障。"},{"title": "临床验证方法论","desc": "功效宣称依托结构化的消费者与临床测试体系（44名受试者，每周3次），而非单纯依赖成分宣称。"}],"en": [{"title": "Dermo-Clarifier Technology","desc": "Combines active ingredients with a dermatological-grade cleansing base to disrupt Malassezia without over-stripping the scalp barrier."},{"title": "Clinically Validated Protocol","desc": "Efficacy claims rest on a structured consumer and clinical testing framework — 44 subjects, 3x weekly use — not ingredient claims alone."}]},"addedAt": 1},{"id": "thedoux-moussedef","category": "usa","name": {"zh": "The Doux Mousse Def Texture Foam","en": "The Doux Mousse Def Texture Foam"},"brand": {"zh": "The Doux","en": "The Doux"},"company": {"zh": "The Doux（黑人及退伍军人创立）","en": "The Doux (Black- and Veteran-owned)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌奠基性单品，让The Doux获得广泛关注的招牌产品","en": "The brand's foundational hero product, the one that put The Doux on the map"},"market": {"zh": "品牌官网、Target、Sally Beauty等美国零售渠道","en": "Brand website, Target, Sally Beauty and other US retail channels"},"capacity": {"zh": "7 fl oz / 207 mL（另有3.4oz旅行装）","en": "7 fl oz / 207 mL (also 3.4oz travel size)"},"price": {"zh": "约US$16.99","en": "~US$16.99"},"positioning": {"zh": "双用途定型泡沫，主打零结块的中至强定型力，既能定义卷发又能抚平直发边缘，强调不结块、不留白屑的专利聚合物技术。","en": "A dual-use styling foam positioned around medium-to-firm hold without the crunch, defining curls or smoothing straight edges alike, built on a proprietary polymer for a no-flake, no-crunch finish."},"target": {"zh": "追求手感柔软但持牢的卷发造型人群，也覆盖需要抚平边缘、抗湿度的直发/编发造型场景。","en": "Curl stylers who want soft, touchable hold without stiffness, as well as those smoothing edges or fighting humidity for sleek/braided styles."},"ingredients": {"zh": "水、聚季铵盐-55（Polyquaternium-55，核心定型聚合物）、椰油酰胺丙基羟基磺基甜菜碱、芦荟叶、PVP、生育酚乙酸酯、柠檬酸、丝氨基酸、聚山梨醇酯20、乙基己基甘油、Oleth-20、香精、甘油醚-2椰油酸酯、异硬脂酰胺丙基吗啉乳酸酯、苯氧乙醇、苯甲酸、依地酸二钠。","en": "Water, Polyquaternium-55 (the core styling polymer), cocamidopropyl hydroxysultaine, aloe vera leaf, PVP, tocopheryl acetate, citric acid, silk amino acids, polysorbate 20, ethylhexylglycerin, oleth-20, fragrance, glycereth-2 cocoate, isostearamidopropyl morpholine lactate, phenoxyethanol, benzoic acid, disodium EDTA."},"evidence": {"zh": "宣称主要基于品牌自述的pH平衡配方与聚合物技术描述，未见公开的独立第三方临床或仪器测试数据；获多个行业奖项认可（品牌官网列为award-winning）。","en": "Claims rest mainly on the brand's own description of a pH-balanced formula and polymer technology; no public independent third-party clinical or instrumental data found. The brand cites multiple industry awards (award-winning per the official site)."},"experience": {"zh": "泡沫质地，卷发造型时湿发大量涂抹梳理定型，直发造型时少量用于发际边缘吹干前使用；无结块、无白屑残留，风干或吹干均可。","en": "Foam texture; for curls, apply liberally to damp hair and comb through; for sleek styles, use a small amount on edges before blow-drying. No crunch or white flaking; works air- ary styling polymer","desc": "The brand's core technology for flexible hold without crunch"},{"name": "Silk Amino Acids + Aloe Vera Leaf","tag": "Strengthening & moisturizing","desc": "Strengthens strands while keeping a soft touchable feel"}]},"ingredientsNote": {"zh": "配方整体是温和洁净剂（椰油酰胺丙基羟基磺基甜菜碱）搭配定型聚合物与保湿/调理成分（生育酚乙酸酯、丝氨基酸），走pH平衡不刺激的技术宣称。","en": "The formula pairs a mild surfactant (cocamidopropyl hydroxysultaine) with a styling polymer plus moisturizing/conditioning agents (tocopheryl acetate, silk amino acids), built around a pH-balanced, gentle technical claim."},"pricePositioning": {"zh": {"tier": "masstige","label": "Masstige Styling"},"en": {"tier": "masstige","label": "Masstige Styling"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "美国大众零售与美妆用品店渠道并重"},"en": {"global": ["Brand website","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "Balanced distribution across US mass retail and beauty supply stores"}},"brandConceptRich": {"zh": {"tagline": "定型不结块。","concept": "由黑人与退伍军人创立，直接采纳一线沙龙师的意见，The Doux的定型产品以灵活聚合物技术著称，避免老式慕斯的僵硬结块感。"},"en": {"tagline": "Hold, without the crunch.","concept": "Founded by Black and veteran business owners with direct stylist input, The Doux formulates flexible-hold styling products that avoid the stiff, crunchy finish of older mousses."}},"competitiveAdvantage": {"zh": [{"name": "DevaCurl 定型泡沫","points": ["价格更亲民，渠道覆盖更广（Target等大众渠道）","品牌文化定位更鲜明（黑人及退伍军人创立）","DevaCurl专业沙龙渠道认知度更高"]},{"name": "Eco Style Gel","points": ["泡沫质地手感更柔软，非胶状结块感","品牌视觉更年轻化","Eco Style价格更具下沉市场优势"]},{"name": "Cantu泡沫系列","points": ["聚合物技术宣称更专利感","抗湿度定型宣称更聚焦","Cantu渠道规模与品牌知名度更大"]}],"en": [{"name": "DevaCurl Styling Foam","points": ["More accessible price, broader mass retail reach (Target etc.)","Sharper brand-culture positioning (Black- and Veteran-owned)","DevaCurl has stronger recognition in professional salon he scalp while providing hold and hydration"},{"name": "Nettle + Horsetail Extract","tag": "Stimulating & strengthening","desc": "Nettle supports scalp vitality; horsetail strengthens weak, brittle strands"}]},"ingredientsNote": {"zh": "配方还含水解小麦蛋白（增强梳理顺滑度）与荷荷巴籽油（轻质保湿），维生素E作为抗氧化辅助成分。","en": "The formula also includes hydrolyzed wheat protein (for smoother detangling) and jojoba seed oil (lightweight moisture), with vitamin E as a supporting antioxidant."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Community Staple"},"en": {"tier": "mass","label": "Mass Community Staple"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "美国大众零售与美妆用品店为核心渠道"},"en": {"global": ["Brand website","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "Core distribution via US mass retail and beauty supply stores"}},"brandConceptRich": {"zh": {"tagline": "激活你的卷发，而非重塑它。","concept": "靠天然发社区数十年的信任积累而非广告投放成长起来，Uncle Funky's Daughter的配方理念是增强你原本的卷发纹理。"},"en": {"tagline": "Activate your curl, don't reshape it.","concept": "Grown through decades of trust inside the natural-hair community rather than advertising, Uncle Funky's Daughter formulates to enhance the curl pattern you already have."}},"competitiveAdvantage": {"zh": [{"name": "Kinky-Curly Curling Custard","points": ["更强调刺激唤醒卷度而非单纯定型剂","官网/社群渠道认知度接近，直接竞争","价格带略高于Curling Custard"]},{"name": "Eco Style Gel","points": ["草本组合概念更丰富，非单一芦荟","品牌走精品天然发定位而非纯平价","持牢度定位与Eco Style有细分差异"]},{"name": "DevaCurl B'Leave-In","points": ["价格显著更亲民","渠道更依赖美妆用品店而非沙龙专柜","品牌历史与社群忠诚度不及DevaCurl悠久"]}],"en": [{"name": "Kinky-Curly Curling Custard","points": ["Emphasizes activating the curl rather than just holding it","Similar community/online recognition, direct competitor","Slightly higher price than Curling Custard"]},{"name": "Eco Style Gel","points": ["Richer herbal-blend concept vs. a single-aloe claim","Positioned as boutique natural rather than pure mass value","Distinct hold-level positioning vs. Eco Style"]},{"name": "DevaCurl B'Leave-In","points": ["Notably more accessible pricing","Relies more on beauty supply stores than salon channels","Shorter brand history and community loyalty than DevaCurl"]}]},"evidenceStats": {"zh": ["宣称主要基于草本成分传统功效描述","未见独立第三方临床或仪器测试数据","支撑逻辑：长期社群口碑与配方一致性忠诚度"],"en": ["Claims rest mainly on traditional herbal-ingredient function descriptions","No independent third-party clinical or instrumental data found","Support logic: long-standing community word-of-mouth and loyalty to formula consistency"]},"experienceItems": {"zh": ["质地：果冻状定型啫喱","用法：湿发涂抹，手指梳理刺激卷度","风干：可自然晾干或用扩散器","叠加：官方建议搭配Supercurl/Extra Butter使用"],"en": ["Texture: jelly-like styling gel","Usage: apply to wet hair, finger-comb to stimulate curls","Drying: air dry or diffuse","Layering: brand recommends pairing with Supercurl/Extra Butter"]},"packagingItems": {"zh": ["视觉：塑料泵头瓶，简洁功能性标签","联想：天然发社群熟悉的日常平价感","规格：12oz/18oz/32oz多种家用装","优势：长期在售形成强社群信任资产"],"en": ["Visual: plastic pump bottle, simple functional label","Association: familiar everyday, affordable feel for the natural-hair community","Sizes: 12oz/18oz/32oz household sizes","Strength: long tenure has built strong community trust as a brand asset"]},"productType": "gel","keyTechnology": {"zh": [{"title": "草本活化配方技术","desc": "以特定植萃活性成分组合，目标是激活而非改变原本的卷发纹理。"},{"title": "社区反馈驱动的配方迭代","desc": "曾因社区反弹撤回成分改动，形成持续倾听社区的迭代机制。"}],"en": [{"title": "Herbal Activator Formulation","desc": "A specific blend of botanical actives designed to activate, not override, the curl pattern you already have."},{"title": "Community Feedback-Driven Reformulation","desc": "Has reversed ingredient changes in response to community backlash, forming an ongoing feedback loop."}]},"addedAt": 9},{"id": "ouai-detox","category": "usa","name": {"zh": "OUAI Detox Clarifying Hair Shampoo","en": "OUAI Detox Clarifying Hair Shampoo"},"brand": {"zh": "OUAI","en": "OUAI"},"company": {"zh": "OUAI（创始人Jen Atkin，2022年1月被宝洁P&G收购）","en": "OUAI (founded by Jen Atkin; acquired by Procter & Gamble in Jan 2022)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌2016年创立；本品自2020年起在售，为长青畅销单品","en": "Brand founded 2016; this SKU has been on sale since 2020 and is an evergreen bestseller"},"market": {"zh": "DTC官网 + Sephora + Ulta；四种规格（3/10/16/32 oz）覆盖试用到家庭补充装","en": "DTC + Sephora + Ulta; four sizes (3/10/16/32 oz) spanning trial to household refill"},"capacity": {"zh": "295 mL / 10 fl oz（另有89 mL旅行装、473 mL大装、946 mL补充装）","en": "295 mL / 10 fl oz (also 3 oz travel, 16 oz jumbo, 32 oz refill)"},"price": {"zh": "US$34（正装）/ US$16（旅行装）；订阅立减10%","en": "US$34 full size / US$16 travel; 10% off with subscription"},"positioning": {"zh": "以苹果醋为核心概念的高端清洁洗发水，定位为「每周一次的重置」而非日常洗发水：面向频繁使用干洗喷雾、造型品堆积、硬水地区的都市消费者，主打去除残留同时靠水解角蛋白保留强韧感。","en": "A prestige clarifying shampoo built around an apple-cider-vinegar concept, positioned as a weekly reset rather than a daily wash: aimed at urban consumers heavy on dry shampoo, styling buildup and hard water, promising to strip residue while hydrolyzed keratin keeps hair feeling strong."},"target": {"zh": "频繁使用干洗喷雾和造型品的都市消费者；硬水地区居民；头皮易出油、发丝暗沉的人群；被名人造型师背书吸引的年轻女性。","en": "City consumers who lean on dry shampoo and styling products; people in hard-water areas; oily scalps and dull-looking hair; younger women drawn in by celebrity-stylist credibility."},"ingredients": {"zh": "清洁体系为Sodium C14-16 Olefin Sulfonate（主表活）＋Sodium Lauroyl Methyl Isethionate＋Cocamidopropyl Betaine＋Decyl Glucoside的复配，属中强清洁；含Vinegar（醋）承接「苹果醋」概念，Hydrolyzed Keratin提供修护感，另有甘油、Polyquaternium-7调理。含香精（芳樟醇、香茅醇）与三种色素（Red 4 / Yellow 5 / Green 5）。标榜无Paraben、无邻苯二甲酸盐、无SLS/SLES、无麸质、不做动物实验。","en": "A medium-strong cleansing system of Sodium C14-16 Olefin Sulfonate (primary surfactant) with Sodium Lauroyl Methyl Isethionate, Cocamidopropyl Betaine and Decyl Glucoside. 'Vinegar' appears on the INCI to carry the apple-cider-vinegar concept, with Hydrolyzed Keratin for a repair cue plus glycerin and Polyquaternium-7 for conditioning. Fragranced (linalool, citronellol) and dyed with three colorants (Red 4 / Yellow 5 / Green 5). Marketed as paraben-, phthalate-, SLS/SLES- and gluten-free, cruelty-free."},"evidence": {"zh": "官方页面未列出量化临床数据，宣称层级以功能描述为主（去除污垢、油脂、造型品残留与硬水沉积）。品牌反而用使用频次指引替代数据：干性发质建议每周1次起步，油性发质可1-2次/周。属于「用法建议＋感官承诺」而非循证支撑。","en": "The official page publishes no quantified clinical data; claims stay descriptive (removes dirt, oil, product buildup and hard-water deposits). Instead of data the brand offers frequency guidance — start at once a week for dry hair, 1-2x weekly for oily hair. This is a usage-guidance-plus-sensory promise rather than evidence-led support."},"experience": {"zh": "浓缩配方，一元硬币大小即可起泡；用法要求涂抹于头皮后停留1-3分钟再冲洗，最后冷水冲洗闭合毛鳞片。香型为Melrose Place（香槟、粉胡椒、荔枝＋牡丹玫瑰＋琥珀檀香），香气是OUAI最被讨论的记忆点之一。","en": "A concentrated formula that lathers from a quarter-sized amount; instructions call for applying at the scalp, leaving on 1-3 minutes, then a cold-water rinse to close the cuticle. Scented in Melrose Place (champagne, pink peppercorn, lychee over peony and rose, on amber and sandalwood) — the fragrance is one of the most-discussed things about OUAI."},"packaging": {"zh": "绿色半透明瓶身与极简无衬线字体，是货架上高辨识度的品牌资产；瓶身标注可完全回收。四规格阶梯（3/10/16/32 oz）把试用装与家庭补充装同时纳入，补充装同时服务环保宣称与客单价。","en": "A green translucent bottle with minimal sans-serif type — a highly recognizable shelf asset — labeled fully recyclable. The four-size ladder (3/10/16/32 oz) covers trial through household refill, with the refill serving both the sustainability claim and basket size."},"insight": {"zh": "这支产品说明清洁洗发水可以靠「场景频次」而不是「成分强度」来卖：OUAI没有给任何量化数据，却用「干洗喷雾用多了之后的重置」这一具体生活场景，把一个本质上是常规阴离子表活配方的产品卖到US$34。对我们的启示是——清洁类产品的溢价来源正在从配方转向使用仪式与嗅觉记忆；同时也要注意，含合成色素在成分党社群中已成为该产品最常被攻击的点。","en": "This product shows a clarifying shampoo can be sold on occasion and frequency rather than ingredient strength: OUAI publishes no numbers, yet sells what is essentially a conventional anionic surfactant system at US$34 by owning one concrete life moment — the reset after a dry-shampoo binge. The lesson is that premium in the cleansing category is migrating from formula to ritual and scent memory. Worth noting on the risk side: the synthetic colorants are now the single most attacked point among ingredient-literate consumers."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/1043/7322/files/Update_2_DetoxShampoo_260611-17-23_Site_Asset_PDP_Product_Thumbnail_1440x1780_11.jpg?v=1783623478","https://cdn.shopify.com/s/files/1/1043/7322/files/Detox_Shampoo_PDP_Asset_Thumbnail_Hover.jpg?v=1782764654","https://cdn.shopify.com/s/files/1/1043/7322/files/Detox_Shampoo_PDP_Asset_Image_Carousel_4.jpg?v=1782764664"],"sources": [["Official product page","https://theouai.com/products/detox-shampoo"],["Brand story","https://theouai.com/pages/about-us"]],"targetUsers": {"zh": ["频繁使用干洗喷雾/造型品的人群","硬水地区居民","头皮易出油、发丝暗沉者","被名人造型师背书吸引的年轻消费者"],"en": ["Heavy users of dry shampoo and styling products","Residents of hard-water areas","Oily scalps with dull-looking hair","Younger consumers drawn by celebrity-stylist credibility"]},"keyClaims": {"zh": ["深层清除污垢、油脂与造型品残留","去除硬水沉积","苹果醋去角质感清洁","水解角蛋白强韧发丝","无Paraben／邻苯二甲酸盐／SLS·SLES／麸质，不做动物实验"],"en": ["Deeply cleanses dirt, oil and product buildup","Removes hard-water deposits","Apple-cider-vinegar clarifying cleanse","Hydrolyzed keratin to strengthen hair","Free of parabens, phthalates, SLS/SLES and gluten; cruelty-free"]},"heroIngredients": {"zh": [{"name": "Apple Cider Vinegar（Vinegar）","tag": "品类核心概念","desc": "承担「排毒清洁」的传播主线，INCI中以Vinegar形式出现，位置靠后"},{"name": "Hydrolyzed Keratin","tag": "水解角蛋白","desc": "在强清洁配方中提供「洗完不空」的强韧感，平衡清洁力带来的粗糙印象"},{"name": "Sodium C14-16 Olefin Sulfonate","tag": "主清洁表活","desc": "实际承担清洁力的成分，属中强阴离子表活，是本品「clarifying」定位的技术底层"},{"name": "Polyquaternium-7 / Glycerin","tag": "调理与保湿","desc": "降低强清洁后的涩感，维持梳理性"}],"en": [{"name": "Apple Cider Vinegar (Vinegar)","tag": "Core concept ingredient","desc": "Carries the whole detox-cleanse concept in communication, though it appears well down the INCI as 'Vinegar'"},{"name": "Hydrolyzed Keratin","tag": "Hydrolyzed keratin","desc": "Supplies the 'strong, not stripped' cue that offsets the roughness a strong cleanse can leave"},{"name": "Sodium C14-16 Olefin Sulfonate","tag": "Primary cleansing surfactant","desc": "The ingredient actually doing the cleaning — a medium-strong anionic surfactant and the technical basis of the clarifying claim"},{"name": "Polyquaternium-7 / Glycerin","tag": "Conditioning and humectancy","desc": "Cuts the squeaky drag after a deep cleanse and keeps hair combable"}]},"ingredientsNote": {"zh": "值得注意的是，苹果醋在成分表中位置靠后，主要承担传播功能而非清洁主力；真正的清洁力来自烯烃磺酸盐体系。此外配方含三种合成色素（Red 4 / Yellow 5 / Green 5）来实现绿色瓶内液体的视觉一致性，这在近年成分透明化趋势下是明显的舆情风险点。","en": "Note that the apple cider vinegar sits low on the INCI and functions mainly as communication; the actual cleansing comes from the olefin sulfonate system. The formula also carries three synthetic colorants (Red 4 / Yellow 5 / Green 5) purely to keep the liquid visually on-brand inside the green bottle — an obvious reputational exposure in today's ingredient-transparency climate."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Lifestyle Haircare"},"en": {"tier": "premium","label": "Prestige Lifestyle Haircare"}},"marketChannel": {"zh": {"global": ["品牌DTC官网","Sephora","Ulta Beauty","Amazon"],"japan": ["未正式进入日本市场；主要通过跨境电商与代购"],"channelLabel": "Prestige Retail + DTC","channelDesc": "依托Sephora/Ulta的高端货架，同时用订阅制（立减10%）绑定复购"},"en": {"global": ["Brand DTC","Sephora","Ulta Beauty","Amazon"],"japan": ["No official Japan distribution; reached via cross-border e-commerce and proxy buying"],"channelLabel": "Prestige Retail + DTC","channelDesc": "Sits on prestige shelves at Sephora and Ulta while locking in repeat purchase through a 10%-off subscription"}},"brandConceptRich": {"zh": {"tagline": "给你赢下这一天的自信。","concept": "由为卡戴珊家族做造型的Jen Atkin于2016年创立，OUAI把沙龙级配方翻译成带香水属性的生活方式产品；2022年被宝洁收购后，仍保留创始人主导的语调与嗅觉资产。"},"en": {"tagline": "The confidence to win the day.","concept": "Founded in 2016 by Jen Atkin, the stylist behind the Kardashians, OUAI translates salon-grade formulas into lifestyle products with the sensibility of fine fragrance; acquired by P&G in 2022, it has kept its founder-led voice and scent assets intact."}},"competitiveAdvantage": {"zh": [{"name": "Kérastase Bain Clarifiant","points": ["价格更低、渠道更年轻化，Sephora触达Z世代更直接","嗅觉与包装的生活方式属性更强","缺乏Kérastase的沙龙专业背书与实验室数据"]},{"name": "Briogeo Scalp Revival Charcoal Shampoo","points": ["以苹果醋对位活性炭，说法同样简明易懂","补充装（32 oz）在环保与客单价上更有优势","Briogeo的「clean beauty」定位更硬，OUAI含合成色素是短板"]},{"name": "Olaplex Nº.4C Bond Maintenance Clarifying Shampoo","points": ["定位为生活方式而非修护科技，客群重叠但购买动机不同","香型体验是明显差异点","缺少键结修护这类可专利化的技术资产"]}],"en": [{"name": "Kérastase Bain Clarifiant","points": ["Lower price and a younger channel mix, reaching Gen Z directly through Sephora","Far stronger lifestyle equity in scent and packaging","Lacks Kérastase's salon-professional endorsement and lab data"]},{"name": "Briogeo Scalp Revival Charcoal Shampoo","points": ["Answers charcoal with apple cider vinegar — an equally legible one-line claim","The 32 oz refill wins on both sustainability and basket size","Briogeo's clean-beauty position is stricter; OUAI's synthetic dyes are a weak spot"]},{"name": "Olaplex Nº.4C Bond Maintenance Clarifying Shampoo","points": ["Sells lifestyle rather than repair technology — overlapping shopper, different motivation","Fragrance experience is the clearest point of difference","Has no patentable technology asset comparable to bond repair"]}]},"evidenceStats": {"zh": ["官方未公布量化临床数据，宣称以功能描述为主","替代性指引：干性发质每周1次起步、油性发质1-2次/周","可回收包装（品牌自述）","局限：无第三方测试、无对照组数据公开"],"en": ["No quantified clinical data published; claims remain descriptive","Frequency guidance stands in for data: 1x weekly for dry hair, 1-2x for oily","Fully recyclable packaging (brand statement)","Limitation: no third-party testing or control-group data disclosed"]},"experienceItems": {"zh": ["质地：浓缩型，一元硬币量即可起泡","用法：涂于头皮停留1-3分钟，冷水收尾","香型：Melrose Place（香槟·粉胡椒·荔枝／牡丹·玫瑰／琥珀·檀香）","定位提醒：干性发质需控制频次，避免过度清洁"],"en": ["Texture: concentrated — a quarter-sized amount lathers fully","Usage: apply at the scalp, leave 1-3 minutes, finish with a cold rinse","Scent: Melrose Place (champagne, pink peppercorn, lychee / peony, rose / amber, sandalwood)","Caution: dry hair types should limit frequency to avoid over-cleansing"]},"packagingItems": {"zh": ["视觉：绿色半透明瓶＋极简无衬线字体，货架辨识度高","规格：3 / 10 / 16 / 32 oz 四档，覆盖试用到家庭补充","可持续：标注完全可回收，32 oz补充装承担环保宣称","弱点：为维持瓶内液体色彩使用三种合成色素"],"en": ["Visual: green translucent bottle with minimal sans-serif type, highly shelf-visible","Sizes: 3 / 10 / 16 / 32 oz, from trial to household refill","Sustainability: labeled fully recyclable, with the 32 oz refill carrying the eco claim","Weakness: three synthetic colorants used purely to keep the liquid on-brand"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "造型师主导的配方开发","desc": "由一线名人造型师而非实验室主导需求定义，配方目标来自沙龙现场遇到的实际问题（干洗喷雾残留、造型品堆积）。"},{"title": "香水级嗅觉开发流程","desc": "香型按前中后调的香水结构开发并单独命名（Melrose Place等），香气作为独立品牌资产跨品类复用到身体护理与家居香氛。"},{"title": "规格阶梯与订阅制留存设计","desc": "用四档规格＋订阅立减10%把「每周一次」的低频使用场景转化为可预测的复购模型。"}],"en": [{"title": "Stylist-Led Formulation Briefing","desc": "Requirements are defined by a working celebrity stylist rather than a lab, so formula targets come from problems seen on the salon floor — dry-shampoo residue, styling buildup."},{"title": "Fragrance-Grade Scent Development","desc": "Scents are built with a top/heart/base structure, individually named (Melrose Place and others), and reused across body care and home fragrance as standalone brand assets."},{"title": "Size-Ladder and Subscription Retention Design","desc": "Four sizes plus a 10% subscription discount convert a low-frequency, once-a-week occasion into a predictable repeat-purchase model."}]},"addedAt": 15},{"id": "thedoux-breakdown","category": "usa","name": {"zh": "The Doux BREAKDOWN Clarifying Shampoo","en": "The Doux BREAKDOWN Clarifying Shampoo"},"brand": {"zh": "The Doux","en": "The Doux"},"company": {"zh": "The Doux（创始人Maya Smith，黑人及退伍军人创立，总部美国乔治亚州Macon）","en": "The Doux (founded by Maya Smith; Black- and veteran-owned, based in Macon, Georgia)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2024年2月上市，属品牌Classics系列的清洁位产品","en": "Launched Feb 2024 as the clarifying slot in the brand's Classics line"},"market": {"zh": "品牌官网 + Target + Sally Beauty + Amazon；英国等地有本地经销商","en": "Brand DTC + Target + Sally Beauty + Amazon; local distributors in markets such as the UK"},"capacity": {"zh": "355 mL / 12 fl oz","en": "355 mL / 12 fl oz"},"price": {"zh": "US$16.99（约合 US$0.048/mL）","en": "US$16.99 (approx. US$0.048/mL)"},"positioning": {"zh": "面向卷发与天然发人群的「不剥夺式深层清洁」洗发水：明确针对造型品堆积、油脂残留导致卷型塌陷的问题，主张洗到「squeaky clean」但仍保持柔软，是护理循环中的重置步骤而非日常洗发水。","en": "A non-stripping deep-cleanse shampoo for curly and natural hair: explicitly aimed at product buildup and oil residue that flatten curl definition, promising squeaky-clean without the harsh strip. It is the reset step in a routine, not the daily wash."},"target": {"zh": "卷发·卷曲发人群，尤其大量使用发油、发蜡、慕斯等造型品者；卷型因残留而失去弹性和定义度的人；寻找沙龙级但价格亲和产品的黑人消费者。","en": "Curly and coily consumers, especially heavy users of oils, butters and mousses; those whose curl definition and bounce have collapsed under residue; Black consumers seeking salon-grade performance at an accessible price."},"ingredients": {"zh": "清洁体系为Sodium C14-16 Olefin Sulfonate＋Cocamidopropyl Betaine的经典双表活组合，配方极简（仅约15个成分）：含PEG-6 Caprylic/Capric Glycerides增溶、Polyquaternium-10调理、洋甘菊与迷迭香叶提取物、维生素E乙酸酯（Tocopheryl Acetate）、甘油。不含硅油与蛋白质。","en": "A classic two-surfactant system of Sodium C14-16 Olefin Sulfonate plus Cocamidopropyl Betaine in a notably short INCI (about 15 ingredients): PEG-6 Caprylic/Capric Glycerides as solubilizer, Polyquaternium-10 for conditioning, chamomile and rosemary leaf extracts, tocopheryl acetate and glycerin. No silicones, no protein."},"evidence": {"zh": "无量化临床数据，宣称建立在「沙龙实测（salon tested）」与「stylist created」的从业者背书上——品牌创始人本人是持证美容师并经营沙龙，配方经真实客户操作检验。这是一种以专业实践替代实验室数据的证据策略，在天然发社群中可信度高于数字。","en": "No quantified clinical data; the claim base rests on practitioner endorsement — 'salon tested' and 'stylist created'. The founder is a licensed cosmetologist running her own salon, so formulas are validated against real clients. This substitutes professional practice for lab data, and in the natural-hair community that carries more credibility than numbers."},"experience": {"zh": "泡沫丰富，冲洗后有明确的「干净感」但不发涩发硬；配方无硅油无蛋白，避免了蛋白过载导致的僵硬。因主表活为烯烃磺酸盐，属真正的clarifying强度，品牌建议作为周期性重置而非每次洗发使用。","en": "A generous lather that leaves a clearly 'clean' feel without squeaky drag or stiffness; being silicone- and protein-free it avoids the rigidity of protein overload. Because the primary surfactant is an olefin sulfonate this is a genuinely clarifying strength, and the brand frames it as a periodic reset rather than every wash."},"packaging": {"zh": "12 oz瓶装，采用品牌标志性的高饱和度色块与街头风字体；产品全部以90年代嘻哈歌曲命名（BREAKDOWN、Mousse Def、Chief Rocka、Bananas），命名体系本身就是品牌资产与社群识别码。","en": "A 12 oz bottle in the brand's signature high-saturation color blocking and street-style type. Every product is named after a 90s hip-hop reference (BREAKDOWN, Mousse Def, Chief Rocka, Bananas) — the naming system is itself a brand asset and an in-group signal."},"insight": {"zh": "The Doux证明了在天然发赛道，文化归属可以直接替代技术宣称：同价位竞品在拼活性炭、氨基酸表活，而BREAKDOWN用一张只有15个成分的极简配方＋90年代嘻哈命名体系，靠「这个品牌懂我的头发和我的文化」完成说服。对我们的启示是，面向特定族群或亚文化的产品，命名与语调的投资回报可能高于成分升级；另一面的风险是，纯文化驱动的差异化容易被同族群新品牌复制。","en": "The Doux proves that in textured hair care, cultural belonging can substitute directly for technology claims: rivals at this price fight over charcoal and amino-acid surfactants, while BREAKDOWN persuades with a 15-ingredient formula and a 90s hip-hop naming system that says 'this brand understands both my hair and my culture'. The lesson is that for products aimed at a specific community or subculture, investment in naming and voice can out-return ingredient upgrades. The risk is the mirror image: purely cultural differentiation is easy for the next in-community brand to copy."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD1.jpg?v=1748800670","https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD2.jpg?v=1748800723","https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD4.jpg?v=1748800723"],"sources": [["Official product page","https://thedoux.com/products/break-down"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/the-doux-breakdown-clarifying-shampoo"]],"targetUsers": {"zh": ["卷发·卷曲发人群","大量使用发油／发蜡／慕斯等造型品者","卷型因残留失去定义度和弹性的人","寻找沙龙级但价格亲和产品的消费者"],"en": ["Curly and coily hair","Heavy users of oils, butters and mousses","Those whose curl definition and bounce have collapsed under residue","Shoppers seeking salon-grade results at an accessible price"]},"keyClaims": {"zh": ["深层清除造型品堆积与油脂残留","清洁但不剥夺，洗后依然柔软","头皮重置，恢复卷型弹性","无硅油、无蛋白（避免蛋白过载）","Stylist created / Salon tested"],"en": ["Deeply removes product buildup and oil residue","Deep clean without the harsh strip — hair stays soft","Resets the scalp and restores curl bounce","Silicone-free and protein-free (no protein overload)","Stylist created / salon tested"]},"heroIngredients": {"zh": [{"name": "Sodium C14-16 Olefin Sulfonate","tag": "主清洁表活","desc": "提供真正clarifying级别的清洁力，是本品定位的技术底层"},{"name": "Cocamidopropyl Betaine","tag": "两性辅表活","desc": "提升泡沫质感并缓和主表活的刺激性，是「不剥夺」体感的关键"},{"name": "Chamomile / Rosemary Leaf Extract","tag": "植物舒缓","desc": "洋甘菊与迷迭香提取物，承担头皮舒缓与「重置」的感官诉求"},{"name": "Tocopheryl Acetate","tag": "维生素E","desc": "抗氧化，在极简配方中提供护理感"}],"en": [{"name": "Sodium C14-16 Olefin Sulfonate","tag": "Primary cleansing surfactant","desc": "Delivers genuinely clarifying-strength cleansing — the technical basis of the positioning"},{"name": "Cocamidopropyl Betaine","tag": "Amphoteric co-surfactant","desc": "Builds lather quality and softens the primary surfactant — the key to the non-stripping feel"},{"name": "Chamomile / Rosemary Leaf Extract","tag": "Botanical soothing","desc": "Carries the scalp-comfort and 'reset' sensory appeal"},{"name": "Tocopheryl Acetate","tag": "Vitamin E","desc": "Antioxidant that supplies a care cue inside a very short formula"}]},"ingredientsNote": {"zh": "配方仅约15个成分，是同类中最简洁的之一。刻意不含硅油与蛋白质——这在天然发社群有明确意义：蛋白过载导致的僵硬和硅油残留是该人群最常抱怨的两个问题，因此「不含」本身就是卖点。反面是配方无任何可专利化的技术资产，竞争壁垒完全依赖品牌与社群。","en": "At roughly 15 ingredients this is one of the shortest formulas in its class. The deliberate absence of silicones and protein is meaningful in the natural-hair community: protein-overload stiffness and silicone residue are that audience's two most common complaints, so 'without' is itself the selling point. The flip side is that the formula holds no patentable technology asset — the competitive barrier is entirely brand and community."},"pricePositioning": {"zh": {"tier": "masstige","label": "Masstige Textured-Hair Care"},"en": {"tier": "masstige","label": "Masstige Textured-Hair Care"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon","CVS"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "以Target进入大众渠道，同时保有Sally Beauty等美妆用品店的专业感"},"en": {"global": ["Brand DTC","Amazon","CVS"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "Reaches mass shoppers through Target while keeping professional credibility in beauty-supply channels like Sally Beauty"}},"brandConceptRich": {"zh": {"tagline": "100% Sucka Free。","concept": "由持证美容师Maya Smith创立并与丈夫共同经营，The Doux把90年代嘻哈的态度与命名方式带进天然发护理：产品全部以嘻哈经典命名，配方在自家沙龙的真实客户身上验证。"},"en": {"tagline": "100% Sucka Free.","concept": "Founded by licensed cosmetologist Maya Smith and run with her husband, The Doux brings the attitude and naming language of 90s hip-hop into textured hair care: every product is named after a hip-hop classic, and every formula is proven on real clients in their own salon."}},"competitiveAdvantage": {"zh": [{"name": "Mielle Organics Rosemary Mint Clarifying Shampoo","points": ["文化归属与命名体系的辨识度更强，社群黏性更高","配方更简洁，明确无蛋白无硅油，规避蛋白过载抱怨","Mielle被宝洁收购后渠道铺货与营销预算规模远超The Doux"]},{"name": "SheaMoisture African Black Soap Deep Cleansing Shampoo","points": ["价格接近但沙龙专业背书更硬（创始人本人是执业美容师）","造型品残留这一具体场景切得更准","SheaMoisture在大众渠道的价格与货架份额优势明显"]},{"name": "Camille Rose Sweet Ginger Cleansing Rinse","points": ["清洁力更强，定位为周期性重置而非温和日常","品牌语调更年轻、更具街头文化辨识度","Camille Rose在成分「食品级」说法上更有溢价能力"]}],"en": [{"name": "Mielle Organics Rosemary Mint Clarifying Shampoo","points": ["Stronger cultural identity and naming system, with tighter community loyalty","Shorter formula, explicitly protein- and silicone-free, sidestepping protein-overload complaints","Since P&G acquired Mielle, its distribution and marketing budget dwarf The Doux's"]},{"name": "SheaMoisture African Black Soap Deep Cleansing Shampoo","points": ["Similar price point but harder professional credibility — the founder is a practicing cosmetologist","Cuts the specific occasion of styling-product residue more precisely","SheaMoisture holds a clear advantage in mass-channel price and shelf share"]},{"name": "Camille Rose Sweet Ginger Cleansing Rinse","points": ["Stronger cleansing, positioned as a periodic reset rather than a gentle daily wash","Younger brand voice with sharper street-culture recognition","Camille Rose commands more premium through its food-grade ingredient claim"]}]},"evidenceStats": {"zh": ["无量化临床数据公开","证据策略：Stylist created / Salon tested（创始人为持证美容师并经营沙龙）","配方无硅油、无蛋白，规避蛋白过载","局限：无第三方测试、无仪器测量数据"],"en": ["No quantified clinical data published","Evidence strategy: stylist created / salon tested (the founder is a licensed cosmetologist with her own salon)","Silicone-free and protein-free, avoiding protein overload","Limitation: no third-party testing or instrumental data"]},"experienceItems": {"zh": ["质地：泡沫丰富，冲洗顺畅","体感：明确的清洁感但不发涩不僵硬","强度：真正clarifying级别，建议周期性使用而非每次洗发","命名：BREAKDOWN取自90年代嘻哈语汇，与Mousse Def等构成同一命名宇宙"],"en": ["Texture: generous lather, rinses cleanly","Feel: a clear clean without squeaky drag or stiffness","Strength: genuinely clarifying — intended for periodic use, not every wash","Naming: BREAKDOWN comes from 90s hip-hop vocabulary, part of the same universe as Mousse Def"]},"packagingItems": {"zh": ["视觉：高饱和色块＋街头风字体，与主流天然发品牌区隔明显","命名体系：全线以90年代嘻哈经典命名，构成社群识别码","规格：单一12 oz，SKU管理简单","弱点：仅一个规格，缺少旅行装与大容量补充装的价格阶梯"],"en": ["Visual: high-saturation color blocking and street-style type, clearly set apart from mainstream natural-hair brands","Naming system: the whole line references 90s hip-hop classics, functioning as an in-group signal","Sizes: a single 12 oz SKU, simple to manage","Weakness: one size only — no travel or jumbo refill to build a price ladder"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "沙龙实测的配方验证流程","desc": "创始人为持证美容师并经营自有沙龙，配方在真实客户操作中反复验证，以从业者实践替代实验室数据作为主要证据来源。"},{"title": "极简配方的减法策略","desc": "刻意压缩至约15个成分并排除硅油与蛋白，把「不含什么」作为面向天然发社群的核心技术主张。"},{"title": "文化命名体系作为产品架构","desc": "全线产品以90年代嘻哈经典命名，使产品线本身具备叙事结构与收藏感，命名先于配方定义产品在系列中的角色。"}],"en": [{"title": "Salon-Proven Validation Process","desc": "The founder is a licensed cosmetologist running her own salon, so formulas are validated repeatedly on real clients — practitioner practice replaces lab data as the primary evidence source."},{"title": "Subtractive Minimal-Formula Strategy","desc": "Deliberately compressed to about 15 ingredients with silicones and protein excluded, making 'what it leaves out' the central technical claim to the natural-hair community."},{"title": "Cultural Naming System as Product Architecture","desc": "Naming every product after a 90s hip-hop classic gives the range its own narrative structure and collectibility — the name, ahead of the formula, defines each product's role in the line."}]},"addedAt": 16},{"id": "olaplex-no4","category": "usa","name": {"zh": "OLAPLEX Nº.4 Bond Maintenance Shampoo","en": "OLAPLEX Nº.4 Bond Maintenance Shampoo"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2018年上市；据Circana为美国高端市场销量第一的洗发水（2024年1-12月）","en": "Launched 2018; the US #1 prestige shampoo by Circana (Jan-Dec 2024)"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon；全球多市场本地站点","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon, with localized sites across global markets"},"capacity": {"zh": "250 mL / 8.5 fl oz（另有100 mL、1000 mL、2000 mL Jumbo）","en": "250 mL / 8.5 fl oz (also 100 mL, 1000 mL and 2000 mL jumbo)"},"price": {"zh": "US$34（250 mL）/ US$16（100 mL）","en": "US$34 (250 mL) / US$16 (100 mL)"},"positioning": {"zh": "键结修护品类的定义者，面向中至粗发质、各种卷度与孔隙度的受损发：以专利分子在分子层面重建二硫键，把「一次清洗即修复日常损伤」作为核心承诺，是从沙龙后台走向家用日常的旗舰洗发水。","en": "The product that defined bond maintenance. Aimed at damaged hair from medium to coarse across all curl patterns and porosities, it rebuilds disulfide bonds at the molecular level and promises to repair everyday damage in a single wash — the flagship shampoo that carried bond repair from the salon backroom into daily home use."},"target": {"zh": "染烫、漂发等化学处理后受损人群；频繁热造型者；追求「洗护即修护」而非额外护理步骤的消费者；沙龙客户的家庭延续护理。","en": "Consumers with chemical damage from color, perming or bleaching; frequent heat stylists; those who want repair built into washing rather than as an extra step; salon clients continuing treatment at home."},"ingredients": {"zh": "核心为专利分子Bis-Aminopropyl Diglycol Dimaleate（OLAPLEX Bond Building Technology）。清洁体系刻意避开SLS/SLES，采用Sodium Lauroyl Methyl Isethionate、Potassium Cocoyl Glycinate、Disodium Cocoyl Glutamate等椰油衍生温和表活复配；辅以Amodimethicone、Polyquaternium-10调理，透明质酸钠、泛醇、生物素、多种果提取物与向日葵籽油。无硫酸盐、SLS/SLES、邻苯二甲酸盐、MIC/MIT、Paraben；纯素、染发安全。","en": "Built on the patented Bis-Aminopropyl Diglycol Dimaleate (OLAPLEX Bond Building Technology). The cleansing base deliberately avoids SLS/SLES, using coconut-derived mild surfactants such as Sodium Lauroyl Methyl Isethionate, Potassium Cocoyl Glycinate and Disodium Cocoyl Glutamate, with amodimethicone and Polyquaternium-10 for conditioning plus sodium hyaluronate, panthenol, biotin, several fruit extracts and sunflower seed oil. Free of sulfates, SLS/SLES, phthalates, MIC/MIT and parabens; vegan and color-safe."},"evidence": {"zh": "官方公布量化临床结果：与Nº.5搭配使用时90%更顺滑·更易梳理·更滋润，断裂减少49%，保湿提升73%；皮肤科测试。市场地位引用Circana美国高端市场2024年1-12月数据。需要注意的是，OLAPLEX的临床数据均由品牌自行委托，且2023年曾因用户脱发投诉引发集体诉讼与舆情危机，公司自2023年起营收持续承压（2026年Q1营收9,940万美元，同比+2.5%，全年指引为-2%至+3%）。","en": "Quantified clinical results are published: used as a system with Nº.5, 90% smoother, better detangling and more conditioned, 49% less breakage and 73% more hydration; dermatologist tested. Market position cites Circana US prestige data for Jan-Dec 2024. Two caveats: all clinical data is brand-commissioned, and a 2023 class action over consumer hair-loss complaints triggered a reputational crisis. Revenue has been under pressure since — Q1 2026 net sales were US$99.4M (+2.5% YoY) against full-year guidance of -2% to +3%."},"experience": {"zh": "高浓缩配方，250 mL标称可用约100次（按2.5 mL/次计）。泡沫丰富但不涩，洗后不留厚重感。品牌香型为葡萄柚皮、糖渍薄荷、生姜与鼠尾草，香味独特，跨全线统一使用。","en": "A highly concentrated formula: 250 mL is rated for around 100 applications at 2.5 mL each. The lather is generous without drag and leaves no heaviness. The signature scent — grapefruit zest, sugared mint, ginger and crushed sage — is distinctive and used consistently across the whole line."},"packaging": {"zh": "极简白瓶＋巨大编号「Nº.4」的编号体系，是护发领域最成功的产品架构设计之一：编号本身承担了「按步骤组建护理系统」的教育功能，让消费者自发追求集齐。规格从100 mL到2000 mL覆盖试用到沙龙后台。","en": "A minimal white bottle dominated by the huge 'Nº.4' — one of the most successful product architectures in hair care. The numbering itself does the educational work of 'build a system step by step', prompting consumers to collect the range. Sizes run from 100 mL to 2000 mL, covering trial through salon backbar."},"insight": {"zh": "Nº.4最值得学习的是编号体系：把产品线变成一套有顺序的系统后，交叉销售不需要话术——消费者会自
