rter)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2026年3月17日上市（品牌首个造型系列Styling Collection的核心单品）","en": "Launched Mar 17, 2026 as a hero item of the brand's first Styling Collection"},"market": {"zh": "DTC官网 + Ulta Beauty（官网售价US$34，Ulta同价，常有5%首单折扣）","en": "DTC (cecred.com) + Ulta Beauty (US$34 at both; Ulta often runs a 5% first-order discount)"},"capacity": {"zh": "148 mL / 5 fl oz","en": "148 mL / 5 fl oz"},"price": {"zh": "US$34（约合 US$0.23/mL）","en": "US$34 (approx. US$0.23/mL)"},"positioning": {"zh": "面向所有发质、尤其是做Silk Press的卷发/卷曲发人群的「热激活丝滑造型精华」——定位为凝胶与精华的混合新品类（gel-serum hybrid）：吹风时靠热与张力激活成膜，用更少的加热次数做出玻璃感直发，同时抗湿气抗毛躁，且可洗净还原自然卷度。","en": "A heat-activated silkening styler for all hair types, aimed above all at the silk-press ritual in curly and coily hair. Positioned as a new gel-serum hybrid category: it activates under blow-dry heat and tension to form a weightless film, delivering glass-like straight styles with fewer heat passes while resisting humidity and frizz — and it washes out so natural texture returns."},"target": {"zh": "做Silk Press／拉直造型的卷发与卷曲发人群；担心高温损伤但仍想要顺滑光泽的消费者；佩戴真人发假发/接发、以及做过化学处理头发的使用者。","en": "Curly and coily consumers who silk-press or blow out their hair; users who want sleekness and shine but fear heat damage; wearers of human-hair wigs and weaves and those with chemically treated hair."},"ingredients": {"zh": "水基配方，核心为品牌新技术StemShield Complex（形状记忆聚合物＋植物干细胞脂质＋黑蜂蜜发酵物），配合水解丝蛋白、Thermal Gloss Blend沙漠油混合（西瓜籽油/Mongongo油/野李籽油）、荷荷巴油、芦荟、泛醇，以及Polyquaternium-68与Polyquaternium-11两种成膜阳离子聚合物、瓜尔胶与黄原胶增稠体系。含香精（芳樟醇、香茅醇、香豆素等致敏物申报）。","en": "Water-based, built on the brand's new StemShield Complex (shape-memory polymers + plant stem-cell lipids + black honey fermentation), with Hydrolyzed Silk, a 'Thermal Gloss Blend' of desert oils (Kalahari melon seed, mongongo, wild plum), jojoba oil, aloe leaf juice and panthenol, plus two film-forming cationic polymers (Polyquaternium-68, Polyquaternium-11) and a guar/xanthan thickening system. Fragranced (linalool, citronellol, coumarin and other declared allergens)."},"evidence": {"zh": "官方宣称450°F/232°C耐热保护与抗湿气防护，标注为「专利申请中」的StemShield Complex；官网提供「有/无StemShield Complex」的对比视觉。截至2026年7月官网评分4.8/5（66条评价），100%推荐率。未见公开的仪器测量方法、样本量或对照组设计，属于品牌自述宣称层级。","en": "Brand claims 450°F/232°C heat protection and humidity protection from a patent-pending StemShield Complex, illustrated with a with/without visual on the PDP. As of Jul 2026 the official page shows 4.8/5 from 66 reviews with a 100% recommend rate. No instrumental protocol, sample size or control design is published — these remain brand-level claims."},"experience": {"zh": "泵头质地，轻盈不压发。用法要求严格：必须在洗净的湿发上分4区使用，每区2泵、梳匀后立刻带张力吹干，中途变干需补水雾；全干后再用夹板定型。品牌明确提示「必须按步骤操作」，操作门槛高于普通热防护喷雾。","en": "A pump gel-serum that stays lightweight and does not weigh hair down. Usage is strict: apply to clean damp hair in 4 sections, 2 pumps per section, comb through, then blow-dry that section immediately with tension; re-mist if a section dries out, and flat-iron only once fully dry. The brand explicitly warns that exact steps must be followed — a higher execution barrier than a standard heat-protectant spray."},"packaging": {"zh": "5 fl oz泵头瓶，延续品牌米白＋金色仪式感视觉；单笔订单限购5件。造型系列共7个SKU，与Thermal Shield Mist（US$30）、Strong Hold Gel（US$32）等构成可叠加的「不堆积」造型组合。","en": "A 5 fl oz pump bottle in the brand's cream-and-gold ritual aesthetic; capped at 5 units per order. It sits in a 7-SKU styling collection alongside Thermal Shield Mist (US$30) and Strong Hold Gel (US$32), designed to layer without buildup."},"insight": {"zh": "这支产品把「热损伤」从风险话术转成了可购买的性能承诺：不是劝人少用热工具，而是承诺用更少的加热次数达成同样效果——对做Silk Press的消费者来说，减少加热次数本身就是护发。对我们的启示是，热防护品类的价值主张可以从「防护率数字」转向「减少操作次数」这种消费者能直接感知的效率语言；同时Cécred用专有技术命名（StemShield Complex）把一组常规成膜聚合物＋油脂包装成不可复制的资产，这与Biopeptide-5是同一套打法。","en": "This product converts heat damage from a risk message into a purchasable performance promise: rather than telling people to use less heat, it promises the same result with fewer passes — and for silk-press users, fewer passes is itself hair care. The takeaway is that heat-protection propositions can shift from protection percentages to an efficiency language consumers feel directly. Cécred also repeats its Biopeptide-5 playbook here, packaging a fairly conventional film-former-plus-oil system as a proprietary, hard-to-copy asset named StemShield Complex."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_02_2048x2048_c0858524-5c98-4d34-a6a2-b66163b6482f.jpg?v=1773336765","https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_03_2048x2048_f5080f31-2402-459c-b102-addb705844cc.jpg?v=1773337041","https://cdn.shopify.com/s/files/1/0705/9842/6922/files/Cecred_PDP_SilkGlaze_04_2048x2048_1a00aaad-0f22-4cc9-871d-04c59e301db8.jpg?v=1773439237"],"sources": [["Official product page","https://cecred.com/products/heat-activated-silk-glaze"],["StemShield Complex (brand)","https://cecred.com/pages/stemshield-complex"],["Ulta Beauty listing","https://www.ulta.com/p/heat-activated-silk-glaze-pimprod2057960"]],"targetUsers": {"zh": ["做Silk Press／拉直造型的卷发·卷曲发人群","担心高温损伤但仍追求玻璃感顺滑的消费者","佩戴真人发假发/接发者","化学处理（染烫/松弛）过头发的使用者"],"en": ["Curly and coily users who silk-press or blow out hair","Consumers who want glass-like sleekness but fear heat damage","Wearers of human-hair wigs and weaves","Users with chemically treated (colored/relaxed) hair"]},"keyClaims": {"zh": ["450°F/232°C 耐热保护","抗湿气、抗毛躁，直发造型更持久","更少加热次数即可做出玻璃感直发","易洗净，可还原自然卷度；不压发","适用于真人发假发/接发与化学处理发"],"en": ["450°F/232°C heat protection","Humidity and frizz resistance for longer-lasting straight styles","Glass-like straight styles with fewer heat passes","Washes out easily so natural texture returns; does not weigh hair down","Safe for human-hair wigs/weaves and chemically treated hair"]},"heroIngredients": {"zh": [{"name": "StemShield Complex","tag": "专利申请中·核心防护技术","desc": "形状记忆聚合物＋植物干细胞脂质＋黑蜂蜜发酵物，宣称保护毛发屏障对抗450°F高温、湿气、污染与造型损伤"},{"name": "Hydrolyzed Silk","tag": "水解丝蛋白","desc": "深入发丝补充水分，提升柔顺度与可梳理性"},{"name": "Thermal Gloss Blend","tag": "耐高温沙漠油混合","desc": "西瓜籽油、Mongongo油、野李籽油——耐极端高温干燥的油脂，成膜隔热并带来健康光泽"},{"name": "Polyquaternium-68 / -11","tag": "成膜阳离子聚合物","desc": "构成轻薄定型膜，是「热激活成膜」质感与抗湿气表现的实际载体"}],"en": [{"name": "StemShield Complex","tag": "Patent-pending core defense tech","desc": "Shape-memory polymers + plant stem-cell lipids + black honey fermentation, claimed to protect the hair barrier against 450°F heat, humidity, pollution and styling damage"},{"name": "Hydrolyzed Silk","tag": "Silk protein","desc": "Delivers moisture through the hair shaft for softness and improved manageability"},{"name": "Thermal Gloss Blend","tag": "Heat-resilient desert oils","desc": "Kalahari melon seed, mongongo and wild plum oils — oils built for extreme heat and dryness — forming a barrier while adding healthy shine"},{"name": "Polyquaternium-68 / -11","tag": "Film-forming cationic polymers","desc": "The actual carriers of the heat-set film: they deliver the sleek hold and humidity resistance behind the marketing story"}]},"ingredientsNote": {"zh": "配方为水/甘油基底，辅以荷荷巴油、芦荟汁、泛醇与瓜尔胶·黄原胶体系。含香精并申报芳樟醇、香茅醇、香豆素、乙酸芳樟酯等致敏成分，敏感头皮需留意。整体成分表并不罕见——真正的差异在于技术命名与用法设计，而非单一新成分。","en": "A water/glycerin base rounded out with jojoba oil, aloe juice, panthenol and a guar/xanthan system. It is fragranced, with linalool, citronellol, coumarin and linalyl acetate declared — worth noting for sensitive scalps. The INCI itself is not unusual; the differentiation lies in the naming of the technology and the prescribed application ritual, not in a single novel ingredient."},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Celebrity Prestige"},"en": {"tier": "premium","label": "Premium Celebrity Prestige"}},"marketChannel": {"zh": {"global": ["品牌DTC官网（cecred.com）","Ulta Beauty（美国全渠道）"],"japan": ["未正式进入日本市场；日本消费者主要通过转运/代购获取"],"channelLabel": "DTC + Prestige Retail","channelDesc": "官网首发后同步进入Ulta，依托造型系列7个SKU做组合销售与「不堆积叠加」的连带话术"},"en": {"global": ["Brand DTC (cecred.com)","Ulta Beauty (US omnichannel)"],"japan": ["No official Japan distribution; reached mainly via forwarding/proxy purchase"],"channelLabel": "DTC + Prestige Retail","channelDesc": "Launched DTC and at Ulta simultaneously, sold as part of a 7-SKU styling collection with a 'layer without buildup' cross-sell story"}},"brandConceptRich": {"zh": {"tagline": "更少的加热，更快的顺滑。","concept": "CÉCRED把Silk Press这一在黑人发型文化中承载社交与仪式意义的技法，重新表述为可被配方缩短、且不必以损伤为代价的过程——护发的承诺从「修复之后」前移到「造型当下」。"},"en": {"tagline": "Less heat. Faster sleek.","concept": "CÉCRED reframes the silk press — a technique carrying real social and ritual weight in Black hair culture — as something formulation can shorten without charging damage as the price, moving the care promise from 'after the repair' to 'during the style'."}},"competitiveAdvantage": {"zh": [{"name": "Olaplex No.9 Bond Protector Nourishing Hair Serum","points": ["更聚焦Silk Press单一场景，用法说明细到分区与张力","耐热标称450°F，高于Olaplex No.9的450°F同级但强调「更少加热次数」的效率叙事","缺少Olaplex的键结修护循证资产与专业沙龙渠道积累"]},{"name": "Mielle Organics Mongongo Oil Thermal & Heat Protectant Spray","points": ["同样主打Mongongo油，但为凝胶精华质地而非喷雾，成膜与抗湿气更强","价格约为Mielle的2倍以上，明确走prestige而非drugstore","Mielle在美妆连锁与大众渠道的铺货密度和价格亲和力仍更占优"]},{"name": "Pattern Beauty Blow Dry Cream / Heat Protectant","points": ["同为面向卷发人群的名人创立品牌，但Cécred技术命名（StemShield）更强","定位在造型系列整体可叠加，连带购买设计更完整","Pattern的价格带更低，入门门槛更友好"]}],"en": [{"name": "Olaplex No.9 Bond Protector Nourishing Hair Serum","points": ["Far more focused on the single silk-press occasion, with instructions down to sectioning and tension","Rated to 450°F like No.9, but sells an efficiency story — fewer heat passes — rather than protection alone","Lacks Olaplex's bond-repair evidence base and professional-salon heritage"]},{"name": "Mielle Organics Mongongo Oil Thermal & Heat Protectant Spray","points": ["Uses the same mongongo oil story but as a gel-serum, giving stronger film-forming and humidity resistance","Priced at more than 2x Mielle, deliberately prestige rather than drugstore","Mielle still wins on mass-channel distribution density and price accessibility"]},{"name": "Pattern Beauty Blow Dry Cream / Heat Protectant","points": ["Also a founder-led brand for textured hair, but Cécred's named technology (StemShield) lands harder","Designed as part of a layerable styling system, so the cross-sell architecture is more complete","Pattern sits at a lower price band with an easier entry point"]}]},"evidenceStats": {"zh": ["官方宣称：450°F/232°C 耐热保护、湿气防护（StemShield Complex，专利申请中）","官网评分：4.8/5，66条评价，100%推荐率（2026年7月）","视觉证据：官网提供「有/无StemShield Complex」对比演示","局限：未公开仪器测量方法、样本量与对照组设计，属品牌自述宣称"],"en": ["Brand claims: 450°F/232°C heat protection and humidity protection (patent-pending StemShield Complex)","Official site rating: 4.8/5 from 66 reviews, 100% would recommend (Jul 2026)","Visual evidence: with/without StemShield Complex demonstration on the PDP","Limitation: no instrumental method, sample size or control design disclosed — brand-level claims"]},"experienceItems": {"zh": ["质地：泵头凝胶精华（gel-serum hybrid），轻盈不压发","用法：湿发分4区，每区2泵→梳匀→立即带张力吹干→全干后夹板定型","关键限制：必须湿发使用、必须分区、变干需补水雾，操作门槛偏高","卖点感知：官方与用户反馈集中在光泽、顺滑与抗湿气，「亮而不腻」","提示：品牌自身提示频繁高温可能松弛天然卷型"],"en": ["Texture: pump gel-serum hybrid, lightweight and non-weighing","Usage: damp hair in 4 sections, 2 pumps each → comb through → blow-dry immediately with tension → flat-iron once fully dry","Key constraints: must be damp hair, must be sectioned, re-mist if it dries — a high execution barrier","Perceived benefit: shine, slip and humidity resistance dominate both brand and user language — 'glossy, not greasy'","Caveat: the brand itself warns that frequent high heat may loosen the natural curl pattern"]},"packagingItems": {"zh": ["视觉：5 fl oz 泵头瓶，米白＋金色，延续品牌仪式感体系","组合：造型系列7个SKU，主打可叠加不堆积","限购：单笔订单限购5件","弱点：泵头瓶体积较大，不适合随身补涂；且本品并非补妆型产品，使用场景集中在洗后造型当次"],"en": ["Visual: 5 fl oz pump bottle in cream and gold, consistent with the brand's ritual system","System: part of a 7-SKU styling collection built to layer without buildup","Limit: capped at 5 units per order","Weakness: a bulky pump bottle unsuited to on-the-go touch-ups — and by design it is a wash-day styling product, not a refresher"]},"productType": "gel","keyTechnology": {"zh": [{"title": "StemShield Complex（专利申请中）","desc": "把形状记忆聚合物、植物干细胞脂质与黑蜂蜜发酵物打包命名为一套「屏障防护」技术，作为整个造型系列的共同技术底座，而非单品成分。"},{"title": "热与张力双激活的成膜设计","desc": "配方不在涂抹时成型，而是依靠吹风的热量与梳子/圆梳的张力共同激活定型，因此产品说明把「分区、立即吹干、变干补水」写成必须遵守的步骤。"},{"title": "可洗净的可逆造型策略","desc": "刻意设计为易洗净、卷度可还原，把「造型」与「化学拉直」区隔开——降低消费者对永久性改变发质的顾虑。"},{"title": "系列级可叠加验证","desc": "造型系列7个SKU以「层层叠加不堆积」为共同开发前提，技术评估单位是组合而非单品。"}],"en": [{"title": "StemShield Complex (patent-pending)","desc": "Bundles shape-memory polymers, plant stem-cell lipids and black honey fermentation into one named barrier-protection technology that anchors the whole styling collection rather than a single SKU."},{"title": "Dual heat-and-tension activation","desc": "The formula does not set on application; it is activated by blow-dryer heat together with comb or round-brush tension, which is why sectioning, immediate drying and re-misting are written as mandatory steps."},{"title": "Reversible, washes-out styling strategy","desc": "Deliberately engineered to rinse out and let curl return, separating 'styling' from 'chemical straightening' and lowering the fear of permanently altering hair."},{"title": "Collection-level layering validation","desc": "All 7 styling SKUs were developed against a shared 'layer without buildup' requirement, so the unit of technical evaluation is the routine, not the product."}]},"addedAt": 14},{"id": "honeyque","category": "japan","name": {"zh": "HONEYQUE Rich Gloss Treatment","en": "HONEYQUE Rich Gloss Treatment"},"brand": {"zh": "HONEYQUE","en": "HONEYQUE"},"company": {"zh": "Bottle Works","en": "Bottle Works"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2023 年 9 月 13 日","en": "September 13, 2023"},"market": {"zh": "日本药妆、电商及生活方式零售","en": "Japanese drugstores, e-commerce and lifestyle retail"},"capacity": {"zh": "本体 450 mL / 替换装 400 mL","en": "450 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,650 / 替换装 ¥1,210","en": "¥1,650 bottle / ¥1,210 refill"},"positioning": {"zh": "围绕“貯水リペア”和“蜜髪”构建光泽修护定位。产品把有机麦卢卡蜂蜜的保水故事、三种胶原蛋白的空洞损伤修护、角质层护理和热保护整合在一起，主打毛躁、粗硬、内部空洞化和光泽不足。","en": "Positioned around water-retention repair and glossy “honey hair.” Organic Manuka honey, three collagen types, cuticle care and heat protection are combined to address frizz, coarse texture, internal hollow damage and lack of shine."},"target": {"zh": "主要面向染烫、吹风和夹板使用频繁、发丝干燥粗糙、缺乏光泽及难以服帖的人群。视觉和香味偏女性化，但官方没有严格限定年龄。","en": "For consumers with color, perm and heat-tool damage who experience dryness, roughness, poor shine and difficult manageability. The visual and fragrance direction is feminine, though the brand does not impose a strict age limit."},"distribution": {"zh": "本体 450 mL / ¥1,650；替换装 400 mL / ¥1,210。属于日本大众高机能洗护的主流价位。药妆和电商是核心渠道，替换装有利于维持复购。","en": "450 mL at ¥1,650 and a 400 mL refill at ¥1,210. It occupies the mainstream Japanese mass-premium haircare price band, relying on drugstores and e-commerce for reach."},"ingredients": {"zh": "核心故事包括有机麦卢卡蜂蜜、三种胶原蛋白、透明质酸衍生物、神经酰胺、角蛋白和水解丝。官方还提到 γ-Docosalactone 与水解芝麻蛋白衍生物作为热保护相关成分。","en": "Organic Manuka honey, three collagen types, a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk. Heat-care ingredients support a story of retaining internal moisture and smoothing the cuticle."},"evidence": {"zh": "官方公开页面主要提供成分功能、产品特征和热保护成分说明，未见完整公开的人体临床方案、仪器测试数据或样本量。其支撑更偏向成分机理与品牌内部产品开发逻辑。","en": "Official communication mainly provides ingredient functions and product-development logic. No complete public human clinical protocol, instrumental data set or sample size was found."},"experience": {"zh": "450 mL 泵瓶，浅奶油色与蜂蜜琥珀色组合，强调甜润、柔软和高光泽。香型为 Aqua Blossom Honey。护发素定位强调包裹感、湿发顺滑、冲洗后的柔软度以及吹干后的服帖和光泽。","en": "A 450 mL pump bottle in soft cream and honey-amber tones. Aqua Blossom Honey fragrance. The conditioner emphasizes coating, wet detangling, softness after rinsing, and smooth glossy hair after drying."},"packaging": {"zh": "柔和浅色瓶身、蜂蜜色液滴与圆润泵头形成明显的甜润感。相比 &honey 的装饰性包装，HONEYQUE 更简洁成熟；相比专业沙龙品牌，则更亲和。","en": "Soft colors, honey-toned details and a rounded pump create a rich but approachable look. It is simpler and more mature than highly decorative honey brands, while remaining more friendly than salon-professional packaging."},"insight": {"zh": "核心优势是把蜂蜜故事从“天然保湿”推进到“发丝空洞化修护”，因此比单纯的蜂蜜香氛产品更具技术感。较容易复制的是成分组合；较难复制的是蜜感视觉、香味、顺滑触感和全系列传播的一致性。","en": "Its strength is extending honey from a natural-moisture story into internal hollow-damage repair. The ingredient combination is easy to copy; the difficult part is achieving consistent scent, slip, gloss and visual identity across the line."},"notes": {"zh": "","en": ""},"images": ["https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml1.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml2.png?v=1745527002&width=1024","https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml3.png?v=1745527002&width=1024"],"sources": [["Official product page","https://honeyque.jp/products/rich-gloss-treatment/"],["MAQUIA","https://maquia.hpplus.jp/cosme/170297/"],["Brand concept","https://honeyque.jp/"]],"targetUsers": {"zh": ["染烫、吹风、夹板等热工具使用频繁人群","发丝干燥粗糙、缺乏光泽人群","难以服帖、内部空洞化受损发质","视觉与香味偏好女性化护理体验的消费者"],"en": ["Frequent users of coloring, blow-drying and flat irons","Dry, rough, dull hair","Hard-to-manage hair with internal hollow damage","Consumers who prefer a feminine visual and fragrance experience"]},"keyClaims": {"zh": ["有机麦卢卡蜂蜜“貯水リペア”保水修护","三种胶原蛋白修护空洞化损伤","角质层护理+热保护成分","替换装设计，利于维持复购"],"en": ["Organic Manuka honey “water-retention repair” (chosui repair)","Three collagen types repair internally hollowed-out damage","Cuticle care plus heat-protection ingredients","Refill pack design supports repeat purchase"]},"heroIngredients": {"zh": [{"name": "有机麦卢卡蜂蜜","tag": "保水修护核心","desc": "“貯水リペア”故事，锁住发丝内部水分"},{"name": "三种胶原蛋白","tag": "空洞化损伤修护","desc": "修护发丝内部空洞化损伤，提升光泽与柔顺度"}],"en": [{"name": "Organic Manuka Honey","tag": "Core water-retention repair","desc": "The “water-retention repair” story that locks moisture inside the hair"},{"name": "Three Collagen Types","tag": "Hollow-damage repair","desc": "Repairs internally hollowed-out damage, boosting shine and smoothness"}]},"ingredientsNote": {"zh": "官方还提到γ-Docosalactone与水解芝麻蛋白衍生物作为热保护相关成分，搭配透明质酸衍生物、神经酰胺、角蛋白和水解丝。","en": "The brand also cites γ-Docosalactone and a hydrolyzed sesame protein derivative as heat-care ingredients, alongside a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk."},"pricePositioning": {"zh": {"tier": "masstige","label": "大众高机能主流价位"},"en": {"tier": "masstige","label": "Mainstream Mass-Premium"}},"marketChannel": {"zh": {"global": ["品牌官网","海外电商（LAMOUR等）"],"japan": ["药妆","生活方式零售"],"channelLabel": "Drugstore & E-commerce","channelDesc": "药妆与电商为核心，替换装利于维持复购"},"en": {"global": ["Official website","Overseas e-commerce (LAMOUR, etc.)"],"japan": ["Drugstores","Lifestyle retail"],"channelLabel": "Drugstore & E-commerce","channelDesc": "Core distribution via drugstores and e-commerce; refill packs support repeat purchase"}},"brandConceptRich": {"zh": {"tagline": "蜂蜜胶原，让头发记住水分。","concept": "HONEYQUE定位为更亲民的蜂蜜修护替代品，用有机麦卢卡蜂蜜与胶原蛋白专门修护发丝内部空洞化损伤，而非仅仅解决表层干燥。"},"en": {"tagline": "Honey Collagen, for hair that remembers water.","concept": "HONEYQUE positions itself as the accessible honey-repair alternative, using organic Manuka honey and collagen to target internally hollowed-out damage rather than surface dryness alone."}},"competitiveAdvantage": {"zh": [{"name": "Gisou","points": ["价格更亲民，购买门槛远低于Gisou的高端定价","更强调“空洞化修护”技术叙事，而非纯粹蜂蜜香氛联想","药妆/电商渠道更易触达，无需依赖精品美妆专柜"]},{"name": "OUAI","points": ["更强调具体功效成分（胶原蛋白、神经酰胺）而非生活方式营销","日本本土渠道覆盖更深，海外零售仍处起步阶段","香调走“甜美蜂蜜”路线，与OUAI的中性香氛调性形成差异化"]},{"name": "Briogeo","points": ["同样主打胶原蛋白修护，但更强调“蜜感”体验与日系包装美学","替换装设计更利于日常复购，Briogeo更依赖单瓶定价","价格带更贴近大众高机能，Briogeo定位略高"]}],"en": [{"name": "Gisou","points": ["More accessible price, far below Gisou's prestige positioning","Leads with a “hollow-damage repair” technology story rather than a purely honey-fragrance association","Easier to reach via drugstore/e-commerce, without relying on prestige beauty counters"]},{"name": "OUAI","points": ["Leans on specific functional ingredients (collagen, ceramides) rather than lifestyle-driven marketing","Deeper penetration in Japan's domestic channels, though still early-stage in overseas retail","Sweet honey scent direction differentiates from OUAI's more neutral fragrance tone"]},{"name": "Briogeo","points": ["Also centers on collagen repair, but leans more into a “honey-touch” sensorial experience and J-beauty packaging aesthetic","Refill pack design better supports everyday repeat purchase; Briogeo relies more on single-bottle pricing","Sits closer to the mass-premium price band, while Briogeo is positioned slightly higher"]}]},"evidenceStats": {"zh": ["公开页面主要提供成分功能与产品特征说明","未见完整公开的人体临床方案或仪器测试数据","支撑逻辑偏向成分机理与品牌内部开发逻辑"],"en": ["Official page mainly provides ingredient function and product-feature descriptions","No complete public human clinical protocol or instrumental data set was found","Support logic leans on ingredient mechanism and internal brand development logic"]},"experienceItems": {"zh": ["瓶身：450 mL泵瓶，浅奶油+蜂蜜琥珀配色","香调：Aqua Blossom Honey","洗感：湿发顺滑，冲洗后柔软","吹干后：服帖有光泽"],"en": ["Bottle: 450 mL pump, soft cream + honey-amber tones","Scent: Aqua Blossom Honey","Feel: smooth detangling wet, soft after rinsing","After drying: sleek and glossy"]},"packagingItems": {"zh": ["视觉：柔和浅色瓶身+蜂蜜色液滴+圆润泵头","定位：比&honey更简洁成熟，比沙龙品牌更亲和","规格：本体450 mL+替换装400 mL","优势：替换装降低复购门槛"],"en": ["Visual: soft-colored bottle + honey-toned droplet motif + rounded pump","Positioning: simpler/more mature than &honey, friendlier than salon brands","Sizes: 450 mL bottle + 400 mL refill","Strength: refill pack lowers the repeat-purchase barrier"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "貯水リペア保水修护技术","desc": "品牌自有命名的保水修护技术体系，专门针对发丝内部空洞化损伤设计。"},{"title": "三重胶原复合技术","desc": "组合三种不同类型的胶原蛋白协同修护，而非依赖单一胶原成分。"}],"en": [{"title": "Water-Retention Repair (Chosui Repair) System","desc": "A brand-named repair technology specifically engineered to address internally hollowed-out hair damage."},{"title": "Triple Collagen Complex","desc": "Combines three distinct collagen types working together, rather than relying on a single collagen ingredient."}]},"addedAt": 4},{"id": "kinkycurly-knottoday","category": "usa","name": {"zh": "Kinky-Curly Knot Today","en": "Kinky-Curly Knot Today"},"brand": {"zh": "Kinky-Curly","en": "Kinky-Curly"},"company": {"zh": "Kinky-Curly Hair Care","en": "Kinky-Curly Hair Care"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "天然发社群经典长青单品（早年推出，长期在售）","en": "A natural-hair community classic, launched years ago and still a staple"},"market": {"zh": "品牌官网、Sally Beauty、CVS、Meijer等美国零售渠道","en": "Brand website, Sally Beauty, CVS, Meijer and other US retail channels"},"capacity": {"zh": "8 fl oz / 236 mL","en": "8 fl oz / 236 mL"},"price": {"zh": "约US$14","en": "~US$14"},"positioning": {"zh": "打结今日终结，奶油质地的草本护发素/免洗顺发乳，专为浓密纠结的卷发/紧致纹理发梳理设计，可作冲洗型护发素或免洗使用。","en": "Knot Today (a play on 'not today'), a creamy herbal conditioner/detangler for thick, tangle-prone curly and coily hair, usable as either a rinse-out conditioner or a leave-in."},"target": {"zh": "浓密卷发/紧致纹理发、拆卸编发/延伸发后急需梳理的人群；天然发社群中配方极简的忠实拥趸。","en": "Thick, curly/coily hair, especially post-braid or post-extension detangling needs; loyal natural-hair community members who favor minimalist formulas."},"ingredients": {"zh": "有机芒果果提取物、有机榆树皮提取物、有机蜀葵根提取物、有机柠檬草提取物、鲸蜡醇、双十八烷基甲基硫酸铵甲基硫酸盐（Behentrimonium Methosulfate）、柠檬酸、苯氧乙醇、天然香精。","en": "Organic mango fruit extract, organic slippery elm, organic marshmallow root, organic lemongrass, cetyl alcohol, behentrimonium methosulfate, citric acid, phenoxyethanol, natural fragrance."},"evidence": {"zh": "宣称主要基于成分描述与十余年的消费者口碑（天然发博主评测、社群评价），未见公开的独立临床或仪器测试数据。","en": "Claims rest mainly on ingredient descriptions and over a decade of consumer word-of-mouth (natural-hair blogger reviews, community reviews); no public independent clinical or instrumental data found."},"experience": {"zh": "奶油质地，洗发后大量涂抹并用宽齿梳分区梳理；也可作免洗护发素用于浓密卷发。用户反馈滑感极佳但保湿力对干发需搭配其他产品。","en": "Creamy texture; apply generously after shampooing and detangle in sections with a wide-tooth comb. Can also be used as a leave-in for thick curly hair. Users report excellent slip, though it should be paired with a separate moisturizer for dry hair."},"packaging": {"zh": "简约塑料瓶身，粉色系视觉与手写体品牌名，走亲和、怀旧的天然发社群美学，识别度高但不算精品化。","en": "Simple plastic bottle with a pink color scheme and a handwritten-style logo, an approachable, nostalgic natural-hair community aesthetic, recognizable but not premium in feel."},"insight": {"zh": "Knot Today长期稳居天然发社群必入清单，证明极简、聚焦单一痛点（打结/梳理）的产品，凭借持续口碑传播也能在拥挤市场中占据长期心智份额，而不依赖频繁的产品迭代或营销投入。","en": "Knot Today's long-standing place on natural-hair must-buy lists shows that a minimalist product solving one clear pain point (tangles/detangling) can hold durable mindshare in a crowded market through sustained word-of-mouth, without frequent reformulation or heavy marketing spend."},"notes": {"zh": "","en": ""},"images": ["https://kinky-curly.com/cdn/shop/products/Kinky-CurlyKnotToday_1200x1200.png?v=1606339935"],"sources": [["Official product page","https://kinky-curly.com/products/knot-today"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/kinky-curly-knot-today-odzywka-bez-splukiwania"]],"targetUsers": {"zh": ["浓密卷发/紧致纹理发人群","拆卸编发、延伸发后需要梳理的人群","偏好极简成分配方的天然发社群成员","习惯在CVS/Sally Beauty等渠道购买的消费者"],"en": ["Thick, curly/coily hair","Post-braid or post-extension detangling needs","Natural-hair community members who prefer minimalist formulas","Shoppers who buy at CVS/Sally Beauty channels"]},"keyClaims": {"zh": ["顺滑梳理，减少打结与拉扯","可作冲洗型护发素或免洗使用","适合浓密卷发/紧致纹理发","天然草本成分，配方简洁"],"en": ["Smooth detangling, reduces knots and pulling","Usable as rinse-out conditioner or leave-in","Suited to thick curly/coily hair","Natural herbal ingredients, minimalist formula"]},"heroIngredients": {"zh": [{"name": "有机芒果果提取物","tag": "顺滑保湿","desc": "提供丝滑梳理感与轻盈保湿"},{"name": "有机蜀葵根+榆树皮提取物","tag": "顺发滑感来源","desc": "天然黏滑质地成分，赋予护发素标志性滑感"}],"en": [{"name": "Organic Mango Fruit Extract","tag": "Slip & moisture","desc": "Provides silky detangling slip and light hydration"},{"name": "Organic Marshmallow Root + Slippery Elm","tag": "Signature slip","desc": "Naturally mucilaginous extracts that give the conditioner its signature slip"}]},"ingredientsNote": {"zh": "配方还含柠檬草提取物提供清新香调，双十八烷基甲基硫酸铵甲基硫酸盐作为调理剂主力成分，整体配方成分数量精简，是该品牌极简定位的直接体现。","en": "The formula also includes lemongrass extract for a fresh scent, with behentrimonium methosulfate as the primary conditioning agent, an overall short ingredient list that directly reflects the brand's minimalist positioning."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Community Staple"},"en": {"tier": "mass","label": "Mass Community Staple"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "美国药妆与大众零售渠道为核心分销路径"},"en": {"global": ["Brand website","Amazon"],"japan": ["CVS","Sally Beauty","Meijer"],"channelLabel": "Mass & Drugstore Retail","channelDesc": "US drugstore and mass retail are the core distribution channels"}},"brandConceptRich": {"zh": {"tagline": "干净、简单、Wash-and-Go。","concept": "作为最早的天然清洁配方品牌之一，Kinky-Curly靠极简成分表和专注于卷发/紧卷发wash-and-go造型解结的单一定位建立口碑。"},"en": {"tagline": "Clean, simple, wash-and-go.","concept": "One of the original clean natural-hair brands, Kinky-Curly built its reputation on short, minimal ingredient lists and a singular focus on detangling for wash-and-go kinky and curly styling."}},"competitiveAdvantage": {"zh": [{"name": "Uncle Funky's Daughter系列","points": ["更聚焦梳理/打结这一单一场景，而非造型定型","价格更亲民","渠道覆盖(CVS/Meijer)比UFD更下沉"]},{"name": "Cantu Shea Butter Leave-In","points": ["草本滑感成分组合更独特（芒果+蜀葵根+榆树皮）","品牌社群忠诚度历史更悠久","Cantu渠道覆盖与营销投入更大"]},{"name": "Jessicurl","points": ["价格更具竞争力，渠道更广泛（CVS等大众药妆）","配方更极简，学习成本更低","Jessicurl保湿力评价通常更高"]}],"en": [{"name": "Uncle Funky's Daughter line","points": ["More narrowly focused on detangling vs. styling/hold","More accessible price","Broader mass-retail reach (CVS/Meijer) than UFD"]},{"name": "Cantu Shea Butter Leave-In","points": ["More distinctive slip-ingredient blend (mango + marshmallow root + slippery elm)","Longer community loyalty history","Cantu has broader retail reach and marketing spend"]},{"name": "Jessicurl","points": ["More competitive pricing, broader retail reach (CVS etc.)","Simpler formula, lower learning curve for users","Jessicurl is generally rated higher for moisture"]}]},"evidenceStats": {"zh": ["宣称主要基于十余年消费者口碑与博主评测","未见独立第三方临床或仪器测试数据","部分评论指出保湿力对干发需搭配其他产品"],"en": ["Claims rest mainly on over a decade of consumer word-of-mouth and blogger reviews","No independent third-party clinical or instrumental data found","Some reviews note it needs pairing with another product for dry hair moisture"]},"experienceItems": {"zh": ["质地：奶油状护发素","用法：冲洗型或免洗均可，宽齿梳分区梳理","场景：拆卸编发/延伸发后梳理首选","反馈：滑感佳，保湿力对干发略弱"],"en": ["Texture: creamy conditioner","Usage: works as rinse-out or leave-in, detangle in sections with a wide-tooth comb","Occasion: a go-to after removing braids/extensions","Feedback: great slip, moisture may be light for very dry hair"]},"packagingItems": {"zh": ["视觉：简约瓶身+粉色系配色+手写体logo","联想：亲和、怀旧的天然发社群美学","规格：8oz家用装为主","优势：识别度高，长期在售形成信任资产"],"en": ["Visual: simple bottle, pink color scheme, handwritten-style logo","Association: approachable, nostalgic natural-hair community aesthetic","Size: mainly 8oz household size","Strength: high recognition, long tenure builds trust as a brand asset"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "极简顺滑剂配方技术","desc": "围绕少数高效顺滑/解结成分构建配方，而非堆砌长长的成分列表。"},{"title": "Wash-and-Go适配测试","desc": "专门针对wash-and-go造型方法进行配方适配与测试。"}],"en": [{"title": "Minimalist Slip-Agent Formulation","desc": "Built around a small number of high-performing slip and detangling agents rather than a long ingredient list."},{"title": "Wash-and-Go Compatibility Testing","desc": "Formulated and tested specifically for compatibility with the wash-and-go styling method."}]},"addedAt": 10},{"id": "loreal","category": "europe","name": {"zh": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo","en": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo"},"brand": {"zh": "L’Oréal Professionnel","en": "L’Oréal Professionnel"},"company": {"zh": "L’Oréal","en": "L’Oréal"},"origin": {"zh": "法国","en": "France"},"launch": {"zh": "Scalp Advanced 系列现行版本","en": "Current Scalp Advanced range"},"market": {"zh": "全球专业沙龙、品牌官网与授权零售；日本以进口电商为主","en": "Professional salons, official channels and authorized retail; mainly import e-commerce in Japan"},"capacity": {"zh": "300 mL / 500 mL","en": "300 mL / 500 mL"},"price": {"zh": "日本进口价约 ¥3,490–¥4,620（300 mL）","en": "Approx. ¥3,490–¥4,620 in Japan (300 mL)"},"positioning": {"zh": "欧莱雅专业线针对头屑与头皮微生态失衡人群推出的沙龙级治疗型洗发产品。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。","en": "A salon-grade treatment shampoo from L'Oréal Professionnel, developed for people with dandruff and scalp micro-ecology imbalance. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations."},"target": {"zh": "核心消费者是反复出现可见头屑、同时担心头皮干燥、油腻或不适的人群。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。官方未限定性别；产品覆盖干性与油性头屑场景。","en": "Designed for consumers with recurring visible dandruff who may also experience dryness, oiliness or discomfort. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations. Official communication is gender-neutral and covers both dry and oily dandruff."},"distribution": {"zh": "300 mL 与 500 mL 两种规格，主要依赖专业沙龙、L’Oréal Professionnel 官方渠道及各国授权零售。日本并非其最强本土渠道，进口电商价格差异较大，因此价格竞争力不如日本本土药妆洗护，但专业品牌形象和针对性头皮功效支撑了溢价。","en": "Available in 300 mL and 500 mL sizes through professional salons, official L’Oréal Professionnel channels and authorized retailers. In Japan, import pricing varies considerably, so it is less price-competitive than domestic drugstore products. Its premium is supported by professional branding and targeted scalp efficacy."},"ingredients": {"zh": "核心活性为 Piroctone Olamine，用于去屑及抑制与头屑相关的微生物；配方中还可见 Salicylic Acid、Glycerin、Coco-Betaine、Guar Hydroxypropyltrimonium Chloride 等。整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The key active is Piroctone Olamine for dandruff control. The formula also includes Salicylic Acid, Glycerin, Coco-Betaine and Guar Hydroxypropyltrimonium Chloride. The cleansing base is conventional, while humectants, conditioning polymers and sensorial modifiers improve the professional-use experience. The broader Scalp Advanced range frames these ingredients within a scalp-skinification story."},"evidence": {"zh": "官方公开资料给出了较清晰的测试层级：首次使用后“最多去除 100% 可见头屑”为消费者测试；“最长 72 小时去屑保护”为临床测试；另有 44 名受试者、每周使用 3 次的临床测试描述，用于支持头屑外观减少。公开页面仍未完整披露各测试的详细设计、对照组和统计方法，因此适合归类为“有消费者与临床支持，但完整研究报告未公开”。","en": "Official materials describe consumer and clinical testing, including removal of up to 100% visible dandruff after first use and protection lasting up to 72 hours. A 44-subject clinical test used three applications per week. However, full protocols, control design and statistical details are not publicly available."},"experience": {"zh": "轻盈乳霜型洗发质地，目标是兼顾去屑清洁和头皮舒适度。官方建议在湿发与头皮上均匀涂抹，用指腹轻柔起泡后冲洗，油性头屑可先搭配同系列深层净化产品。香气被描述为中性、清新、具有洁净感和专业护理基调。包装为白色专业线瓶身，搭配淡蓝绿色区块和黑色瓶盖，视觉接近皮肤科与沙龙专业护理。","en": "A lightweight cream shampoo designed to combine anti-dandruff cleansing with scalp comfort. It is applied to wet hair and scalp, gently lathered with fingertips, then rinsed. The scent is clean, neutral and professional. White packaging with pale blue-green accents creates a dermatological salon-care impression."},"packaging": {"zh": "白色大面积留白、黑色专业品牌标识、浅蓝绿色功能标签，强化“临床、洁净、专业”的视觉联想。300 mL / 500 mL 规格便于区分家用和沙龙需求。优势是专业感强、功能识别直接；弱点是与其他 Scalp Advanced 单品外观接近，消费者需要仔细阅读功能名称。","en": "Large white areas, a black professional logo and pale blue-green functional labels communicate clinical cleanliness and expertise. The 300 mL and 500 mL formats serve home and salon use. The design is professional and clear, although products within the range look similar and require close label reading."},"insight": {"zh": "其真正竞争力不是单一的 Piroctone Olamine，而是把经典去屑活性放进专业沙龙与头皮皮肤学叙事中，并用可量化功效、专家共创和更精致的质地完成品牌升级。最值得学习的是“功能问题—专业诊断—方案组合”的完整路径。较容易被复制的是基础表活和去屑活性组合；较难复制的是全球沙龙网络、品牌权威和成套产品协议。","en": "Its advantage is not Piroctone Olamine alone, but the way a classic anti-dandruff active is elevated through professional salon authority, scalp-skinification and quantified claims. The easiest elements to replicate are the cleansing and active system; the hardest are the global salon network, brand authority and protocol-led portfolio."},"notes": {"zh": "","en": ""},"images": ["https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/1-slider.jpg?rev=efaa1ce17fbc46e89231df450630a23c&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=3C7CB343DD83CA74C193FAC4DD71971D","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/2-slider.jpg?rev=fc2f59083a7441b2ba529fec034b0952&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=EA207AAB5C9EC015B416591B12F0BB8C","https://www.lorealprofessionnel.com/-/media/project/loreal/brand-sites/lp/emea/inter/hair-care/scalp-advanced/pdp/anti-dandruff-dermo-clarifier-shampoo/3-slider.jpg?rev=a86a74bd0af444e5af9c0945b5b5270d&cx=0.53&cy=0.58&cw=1920&ch=1920&hash=2D01FDE06D41407D4C65FA6D849910BB"],"sources": [["L’Oréal Professionnel Official","https://www.lorealprofessionnel.com/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["L’Oréal Professionnel UK","https://www.lorealprofessionnel.co.uk/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"],["Japan retail reference","https://makeup.jp/product/730063/"]],"targetUsers": {"zh": ["中度至重度头屑人群","头皮敏感、瘙痒人群","经常染烫、头皮受损人群","追求沙龙级专业护理的消费者"],"en": ["Moderate to severe dandruff","Sensitive, itchy scalp","Frequently colored/permed, damaged scalp","Consumers seeking salon-grade professional care"]},"keyClaims": {"zh": ["有效去屑，长效抑制头屑再生","舒缓头皮不适，减少瘙痒","平衡头皮微生态","专业沙龙级配方，温和不刺激","皮肤学测试，安全有效"],"en": ["Effective dandruff removal, long-lasting recurrence control","Soothes scalp discomfort, reduces itching","Balances scalp micro-ecology","Professional salon-grade formula, gentle","Dermatologically tested, safe and effective"]},"heroIngredients": {"zh": [{"name": "Piroctone Olamine","tag": "高效去屑因子","desc": "抑制马拉色菌，减少头屑生成"},{"name": "Niacinamide（烟酰胺）","tag": "舒缓修护头皮","desc": "强韧屏障，减少头皮不适"}],"en": [{"name": "Piroctone Olamine","tag": "High-efficacy anti-dandruff agent","desc": "Inhibits Malassezia, reduces dandruff formation"},{"name": "Niacinamide","tag": "Soothes & repairs scalp","desc": "Strengthens barrier, reduces scalp discomfort"}]},"pricePositioning": {"zh": {"tier": "premium","label": "Premium Professional","desc": "沙龙专业护理 · 高端专业线"},"en": {"tier": "premium","label": "Premium Professional","desc": "Salon professional care · High-end line"}},"marketChannel": {"zh": {"global": ["专业沙龙","品牌官网","Amazon","授权零售渠道"],"japan": ["乐天","Amazon JP","Yahoo! Shopping","美容院渠道"],"channelLabel": "Salon Professional","channelDesc": "专业沙龙护理渠道为核心"},"en": {"global": ["Professional salons","Official website","Amazon","Authorized retail"],"japan": ["Rakuten","Amazon JP","Yahoo! Shopping","Salon channel"],"channelLabel": "Salon Professional","channelDesc": "Professional salon care channel as core"}},"brandConceptRich": {"zh": {"tagline": "头皮即肌肤。","concept": "用护肤级的严谨对待头皮，将皮肤学科学与欧莱雅专业线的沙龙权威结合，把去屑护理从速效方案重新定义为专业、仪式化的护理过程。"},"en": {"tagline": "Scalp is skin.","concept": "Treats the scalp with the same rigor as skincare, combining dermatological science with L'Oréal Professionnel's salon authority to reframe dandruff care as expert, ritualized treatment rather than a quick fix."}},"competitiveAdvantage": {"zh": [{"name": "Head & Shoulders","points": ["更专业的沙龙定位","更关注头皮微生态平衡","配方更温和，兼顾护理体验"]},{"name": "Kérastase","points": ["价格更具竞争力","针对头屑问题更聚焦","日常护理更易坚持"]},{"name": "Aveda","points": ["更强调医学化头皮护理","去屑功效更明确","渠道覆盖更广泛"]}],"en": [{"name": "Head & Shoulders","points": ["More professional salon positioning","Greater focus on scalp micro-ecology balance","Gentler formula with better care experience"]},{"name": "Kérastase","points": ["More competitive pricing","More focused on dandruff specifically","Easier to maintain as daily routine"]},{"name": "Aveda","points": ["Stronger medicalized scalp-care framing","Clearer anti-dandruff efficacy claims","Broader channel coverage"]}]},"ingredientsNote": {"zh": "整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。","en": "The cleansing base follows a classic anionic + amphoteric surfactant framework, with pearlizers, humectants, conditioning polymers and cooling agents improving the professional-use experience. The brand places it within the Scalp Advanced dermatological-active lineup, alongside Niacinamide, AHA and Clay, to build a broader scalp-“skinification” story."},"evidenceStats": {"zh": ["首次使用：最多去除100%可见头屑（消费者测试）","持效：最长72小时去屑保护（临床测试）","临床样本：44名受试者，每周使用3次","局限：完整测试设计、对照组与统计方法未公开"],"en": ["First use: up to 100% visible dandruff removal (consumer test)","Duration: up to 72-hour dandruff protection (clinical test)","Clinical sample: 44 subjects, 3 applications/week","Limitation: full protocol, control group and statistics not disclosed"]},"experienceItems": {"zh": ["质地：轻盈乳霜型洗发水","用法：湿发湿头皮涂抹，指腹轻柔起泡后冲洗","进阶：油性头屑可先用同系列深层净化产品","香调：中性清新，专业护理感"],"en": ["Texture: lightweight cream shampoo","Usage: apply to wet hair/scalp, lather gently with fingertips, then rinse","Pairing: oily dandruff can pre-treat with the deep-purifying product in the range","Scent: clean, neutral, professional"]},"packagingItems": {"zh": ["视觉：大面积留白 + 黑色品牌标识 + 浅蓝绿功能标签","联想：强化“临床、洁净、专业”印象","规格：300 mL / 500 mL，区分家用与沙龙场景","弱点：系列内单品外观接近，需仔细看标签区分"],"en": ["Visual: large white space, black logo, pale blue-green functional labels","Association: reinforces a “clinical, clean, professional” impression","Sizes: 300 mL / 500 mL for home vs. salon use","Weakness: products within the range look similar, requiring close label reading"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "皮肤学净化科技","desc": "将活性成分与皮肤学级洁净配方结合，在抑制马拉色菌的同时避免过度破坏头皮屏障。"},{"title": "临床验证方法论","desc": "功效宣称依托结构化的消费者与临床测试体系（44名受试者，每周3次），而非单纯依赖成分宣称。"}],"en": [{"title": "Dermo-Clarifier Technology","desc": "Combines active ingredients with a dermatological-grade cleansing base to disrupt Malassezia without over-stripping the scalp barrier."},{"title": "Clinically Validated Protocol","desc": "Efficacy claims rest on a structured consumer and clinical testing framework — 44 subjects, 3x weekly use — not ingredient claims alone."}]},"addedAt": 1},{"id": "thedoux-moussedef","category": "usa","name": {"zh": "The Doux Mousse Def Texture Foam","en": "The Doux Mousse Def Texture Foam"},"brand": {"zh": "The Doux","en": "The Doux"},"company": {"zh": "The Doux（黑人及退伍军人创立）","en": "The Doux (Black- and Veteran-owned)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌奠基性单品，让The Doux出圈的招牌产品","en": "The brand's foundational hero product, the one that put The Doux on the map"},"market": {"zh": "品牌官网、Target、Sally Beauty等美国零售渠道","en": "Brand website, Target, Sally Beauty and other US retail channels"},"capacity": {"zh": "7 fl oz / 207 mL（另有3.4oz旅行装）","en": "7 fl oz / 207 mL (also 3.4oz travel size)"},"price": {"zh": "约US$16.99","en": "~US$16.99"},"positioning": {"zh": "双用途定型泡沫，主打零结块的中至强定型力，既能定义卷发又能抚平直发边缘，强调不结块、不留白屑的专利聚合物技术。","en": "A dual-use styling foam positioned around medium-to-firm hold without the crunch, defining curls or smoothing straight edges alike, built on a proprietary polymer for a no-flake, no-crunch finish."},"target": {"zh": "追求手感柔软但持牢的卷发造型人群，也覆盖需要抚平边缘、抗湿度的直发/编发造型场景。","en": "Curl stylers who want soft, touchable hold without stiffness, as well as those smoothing edges or fighting humidity for sleek/braided styles."},"ingredients": {"zh": "水、聚季铵盐-55（Polyquaternium-55，核心定型聚合物）、椰油酰胺丙基羟基磺基甜菜碱、芦荟叶、PVP、生育酚乙酸酯、柠檬酸、丝氨基酸、聚山梨醇酯20、乙基己基甘油、Oleth-20、香精、甘油醚-2椰油酸酯、异硬脂酰胺丙基吗啉乳酸酯、苯氧乙醇、苯甲酸、依地酸二钠。","en": "Water, Polyquaternium-55 (the core styling polymer), cocamidopropyl hydroxysultaine, aloe vera leaf, PVP, tocopheryl acetate, citric acid, silk amino acids, polysorbate 20, ethylhexylglycerin, oleth-20, fragrance, glycereth-2 cocoate, isostearamidopropyl morpholine lactate, phenoxyethanol, benzoic acid, disodium EDTA."},"evidence": {"zh": "宣称主要基于品牌自述的pH平衡配方与聚合物技术描述，未见公开的独立第三方临床或仪器测试数据；获多个行业奖项认可（品牌官网列为award-winning）。","en": "Claims rest mainly on the brand's own description of a pH-balanced formula and polymer technology; no public independent third-party clinical or instrumental data found. The brand cites multiple industry awards (award-winning per the official site)."},"experience": {"zh": "泡沫质地，卷发造型时湿发大量涂抹梳理定型，直发造型时少量用于发际边缘吹干前使用；无结块、无白屑残留，风干或吹干均可。","en": "Foam texture; for curls, apply liberally to damp hair and comb through; for sleek styles, use a small amount on edges before blow-drying. No crunch or white flaking; works air-dried or blow-dried."},"packaging": {"zh": "黑白撞色瓶身，品牌名与MOUSSE DEF产品名突出，走年轻、街头文化调性的视觉语言，区别于传统天然发品牌的草本包装美学。","en": "Black-and-white bottle design with bold brand and product name typography, a youthful, street-culture visual language, distinct from the herbal-aesthetic packaging typical of traditional natural-hair brands."},"insight": {"zh": "The Doux证明技术叙事+文化认同可以在拥挤的泡沫定型剂品类里建立差异化，聚季铵盐-55这一专利感成分命名和黑人及退伍军人创立的品牌故事，共同构成了比单纯功能诉求更强的购买理由。","en": "The Doux shows that combining a technical narrative with cultural identity can differentiate within the crowded styling-foam category, the patent-feel naming of Polyquaternium-55 plus the Black- and Veteran-owned founding story together form a stronger purchase rationale than functional claims alone."},"notes": {"zh": "","en": ""},"images": ["https://thedoux.com/cdn/shop/files/1_3_720x.jpg?v=1748803353","https://thedoux.com/cdn/shop/files/2_4_720x.jpg?v=1748803353","https://thedoux.com/cdn/shop/files/MousseDef_720x.jpg?v=1770389659"],"sources": [["Official product page","https://thedoux.com/products/mousse-def-texture-foam"],["Ingredients (CVS)","https://www.cvs.com/shop/ingredients/the-doux-mousse-def-texture-foam-7-oz-prodid-336256"]],"targetUsers": {"zh": ["追求柔软手感但持牢定型的卷发人群","需要抚平边缘、抗湿度的直发/编发造型场景","偏好年轻街头文化视觉调性的消费者","支持黑人及退伍军人创立品牌的购物者"],"en": ["Curly-hair stylers who want soft yet lasting hold","Sleek/braided styles needing edge control and humidity resistance","Consumers drawn to a youthful, street-culture visual identity","Shoppers who support Black- and Veteran-owned brands"]},"keyClaims": {"zh": ["中至强定型力，零结块","抗湿度，持久定型","双用途：卷发定义+直发边缘抚平","获多项行业奖项认可"],"en": ["Medium-to-firm hold, no crunch","Humidity-resistant, long-lasting hold","Dual-use: curl definition + sleek edge control","Recognized with multiple industry awards"]},"heroIngredients": {"zh": [{"name": "Polyquaternium-55","tag": "专利定型聚合物","desc": "品牌核心技术，实现柔韧定型不结块"},{"name": "丝氨基酸+芦荟叶","tag": "强韧滋润","desc": "强化发丝并保持柔软触感"}],"en": [{"name": "Polyquaternium-55","tag": "Proprietary styling polymer","desc": "The brand's core technology for flexible hold without crunch"},{"name": "Silk Amino Acids + Aloe Vera Leaf","tag": "Strengthening & moisturizing","desc": "Strengthens strands while keeping a soft touchable feel"}]},"ingredientsNote": {"zh": "配方整体是温和洁净剂（椰油酰胺丙基羟基磺基甜菜碱）搭配
