己问「那Nº.5呢」。但OLAPLEX同时也给出了警示：当品牌把全部资产押在单一专利分子上，一旦该分子在社群中出现安全性质疑（2023年脱发集体诉讼），整个品牌无处可退，营收连续多年承压至今。技术壁垒越深，声誉风险的集中度也越高。","en": "The most instructive thing about Nº.4 is the numbering: once a line becomes an ordered system, cross-sell needs no script — shoppers ask for Nº.5 themselves. But OLAPLEX is also a cautionary case: when a brand stakes everything on one patented molecule, a safety controversy around that molecule (the 2023 hair-loss class action) leaves nowhere to retreat, and revenue has been under pressure ever since. The deeper the technology barrier, the more concentrated the reputational risk."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/2025_No4_250ml_Product_Packshot_01_GBL_1440x1440_1_8bd8f43c-86fd-4ca1-a39f-bf17f6734a94.png?v=1740499372","https://cdn.shopify.com/s/files/1/0434/1661/files/N.4_hover_958-988_6e114837-8ea7-478f-9e56-a2f6404ec9d6.png?v=1755869199","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N4_benefit1_1440_d7558c47-1a04-47de-8bc6-f9841241e47a.jpg?v=1755869200"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-4-bond-maintenance-shampoo-us"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/olaplex-no-4-bond-maintenance-shampoo-2"]],"targetUsers": {"zh": ["染烫漂等化学处理受损发","频繁使用热造型工具者","中至粗发质、各种卷度与孔隙度","希望在洗发步骤内完成修护的消费者"],"en": ["Chemically damaged hair from color, perms or bleach","Frequent heat-styling users","Medium to coarse textures across all curl patterns and porosities","Consumers who want repair to happen inside the wash step"]},"keyClaims": {"zh": ["1次清洗修复日常损伤","分子层面重建二硫键，强化发丝韧性","温和清洁不剥夺，补充水分","与Nº.5搭配：90%更顺滑·更易梳理·更滋润","断裂减少49%，保湿提升73%","无硫酸盐/SLS·SLES/邻苯二甲酸盐/Paraben，纯素、染发安全"],"en": ["Repairs everyday damage in one wash","Rebuilds disulfide bonds at the molecular level for resilience","Cleanses gently without stripping and replenishes hydration","As a system with Nº.5: 90% smoother, better detangling, more conditioned","49% less breakage, 73% more hydration","Sulfate-, SLS/SLES-, phthalate- and paraben-free; vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "OLAPLEX Bond Building Technology的核心，重建断裂的二硫键，是整个键结护理品类的起点"},{"name": "椰油衍生温和表活复配","tag": "无硫酸盐清洁体系","desc": "甲基月桂酰基牛磺酸钠等复配，实现丰富泡沫的同时避免SLS/SLES的剥夺感"},{"name": "Sodium Hyaluronate / Panthenol","tag": "保湿修护","desc": "支撑「保湿提升73%」的宣称，平衡清洁后的水分流失"},{"name": "Amodimethicone","tag": "调理硅","desc": "沉积型调理硅，提供顺滑与光泽，是「洗后不厚重」体感的关键"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "The core of OLAPLEX Bond Building Technology, rebuilding broken disulfide bonds — the origin point of the whole bond-care category"},{"name": "Coconut-derived mild surfactant blend","tag": "Sulfate-free cleansing system","desc": "Sodium lauroyl methyl isethionate and others deliver abundant lather without the stripped feel of SLS/SLES"},{"name": "Sodium Hyaluronate / Panthenol","tag": "Hydration and repair","desc": "Underpins the 73% hydration claim and offsets moisture loss after cleansing"},{"name": "Amodimethicone","tag": "Conditioning silicone","desc": "A depositing silicone that provides slip and shine — key to the non-heavy after-feel"}]},"ingredientsNote": {"zh": "专利分子在成分表中位置靠前（Glycereth-26之后），说明添加量并非象征性。整体配方复杂度远高于同类，包含发酵滤液、多种果提取物与生物素等辅助成分。需要提醒的是，Nº.4含硅（Amodimethicone），对追求无硅的卷发人群不适用。","en": "The patented molecule sits high on the INCI (right after glycereth-26), indicating a functional rather than token level. The overall formula is far more complex than peers, with ferment filtrates, multiple fruit extracts and biotin. Note that Nº.4 does contain silicone (amodimethicone), so it does not suit curly consumers following a silicone-free routine."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Amazon"],"japan": ["Sephora","Ulta Beauty","日本正规代理（olaplex.jp）"],"channelLabel": "Professional + Prestige Retail","channelDesc": "沙龙专业渠道建立信任，再向高端零售与DTC放量，是键结护理教育-变现的标准路径"},"en": {"global": ["Professional salon channel","Brand DTC","Amazon"],"japan": ["Sephora","Ulta Beauty","Official Japan distribution (olaplex.jp)"],"channelLabel": "Professional + Prestige Retail","channelDesc": "Trust is built in the salon channel then scaled through prestige retail and DTC — the textbook educate-then-monetize path for bond care"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "K18 Peptide Prep Detox Shampoo","points": ["专利分子先发优势与品类定义权，认知度远高于K18","沙龙渠道积累深厚，专业背书更强","K18的肽技术宣称更新，在专业圈层被视为「下一代」"]},{"name": "Kérastase Première Bond Repair Shampoo","points": ["价格更低，家用日常化程度更高","编号体系让系统性购买更自然","欧莱雅集团的研发与渠道资源规模远超OLAPLEX单一品牌"]},{"name": "Redken Acidic Bonding Concentrate Shampoo","points": ["品牌资产集中在单一技术上，消费者认知更清晰","独立品牌调性，不受集团多品牌定位牵制","Redken背靠欧莱雅，沙龙渠道议价能力更强，价格也更亲和"]}],"en": [{"name": "K18 Peptide Prep Detox Shampoo","points": ["First-mover patent and category-definition authority, with far higher awareness than K18","Deep salon-channel history and stronger professional endorsement","K18's peptide claim is newer and is treated as 'next generation' inside professional circles"]},{"name": "Kérastase Première Bond Repair Shampoo","points": ["Lower price and more established as an everyday home product","The numbering system makes system-buying feel natural","L'Oréal's R&D and distribution scale dwarfs OLAPLEX as a single brand"]},{"name": "Redken Acidic Bonding Concentrate Shampoo","points": ["Brand equity concentrated on one technology, so consumer understanding is clearer","Independent brand voice, unconstrained by a group's multi-brand architecture","Redken's L'Oréal backing gives it stronger salon leverage and a friendlier price"]}]},"evidenceStats": {"zh": ["与Nº.5系统使用：90%更顺滑、更易梳理、更滋润","断裂减少49%","保湿提升73%","市场地位：Circana美国高端市场2024年销量第一的洗发水","局限：临床数据均为品牌自行委托；2023年脱发集体诉讼后营收持续承压"],"en": ["As a system with Nº.5: 90% smoother, better detangling, more conditioned","49% reduction in breakage","73% increase in hydration","Market position: #1 prestige shampoo in the US per Circana, 2024","Limitation: all clinical data is brand-commissioned; revenue has been under pressure since the 2023 hair-loss class action"]},"experienceItems": {"zh": ["浓缩度：250 mL约100次用量（2.5 mL/次）","泡沫：丰富绵密，冲洗后不涩","香型：葡萄柚皮·糖渍薄荷·生姜·鼠尾草（全线统一）","用法：与Nº.5搭配使用为官方推荐的系统方案"],"en": ["Concentration: 250 mL rated for about 100 applications at 2.5 mL each","Lather: rich and dense, rinses without drag","Scent: grapefruit zest, sugared mint, ginger, crushed sage (consistent across the line)","Usage: officially recommended as a system with Nº.5"]},"packagingItems": {"zh": ["视觉：极简白瓶＋超大编号，货架识别度极高","架构：编号体系本身承担产品线教育与交叉销售功能","规格：100 / 250 / 1000 / 2000 mL，覆盖试用到沙龙后台","弱点：白瓶设计被大量平价品牌模仿，视觉差异化正在被稀释"],"en": ["Visual: minimal white bottle with an oversized number, extremely shelf-legible","Architecture: the numbering system itself carries range education and cross-sell","Sizes: 100 / 250 / 1000 / 2000 mL, from trial to salon backbar","Weakness: the white-bottle look is now widely imitated by value brands, diluting its visual distinctiveness"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "专利分子的品类创造策略","desc": "由材料科学家发明并申请专利的单一分子，使OLAPLEX创造了「键结护理」这一新品类并长期占据定义权——在此之前，护发修护的主流路径是硅油与阳离子调理剂等表面调理，作用停留在毛鳞片外层。"},{"title": "编号式产品架构","desc": "以Nº.0至Nº.9的编号取代功能命名，把产品线转化为有顺序的护理系统，使交叉销售内生于产品架构而非依赖营销话术。"},{"title": "沙龙先行的技术教育路径","desc": "先在专业沙龙后台建立技术可信度，由造型师完成消费者教育，再向零售端放量——这是键结护理能被大众理解的关键前置步骤。"},{"title": "系统级临床测试设计","desc": "关键数据以「Nº.4＋Nº.5系统使用」为测试条件而非单品，既提升数据表现，也在结构上引导连带购买。"}],"en": [{"title": "Category Creation Through a Patented Molecule","desc": "A single molecule invented and patented by materials scientists let OLAPLEX create the bond care category and hold definitional authority ever since. Before it, repair claims rested on silicones and cationic conditioners acting on the cuticle surface."},{"title": "Numbered Product Architecture","desc": "Replacing functional names with Nº.0 through Nº.9 turns the range into an ordered system, making cross-sell intrinsic to the architecture rather than dependent on marketing scripts."},{"title": "Salon-First Technology Education","desc": "Credibility was established in professional backbars first, with stylists doing the consumer education before retail scale-up — the prerequisite that made bond repair legible to the mass market."},{"title": "System-Level Clinical Test Design","desc": "Headline data is generated with Nº.4 and Nº.5 used together rather than as single products, which both improves the numbers and structurally steers shoppers toward buying the pair."}]},"addedAt": 17},{"id": "olaplex-no5","category": "usa","name": {"zh": "OLAPLEX Nº.5 Bond Maintenance Conditioner","en": "OLAPLEX Nº.5 Bond Maintenance Conditioner"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2018年与Nº.4同步上市；据Circana为美国高端市场销量第一的护发素（2024年1-12月）","en": "Launched alongside Nº.4 in 2018; the US #1 prestige conditioner by Circana (Jan-Dec 2024)"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon"},"capacity": {"zh": "250 mL / 8.5 fl oz（另有100 mL、1000 mL、2000 mL Jumbo）","en": "250 mL / 8.5 fl oz (also 100 mL, 1000 mL and 2000 mL jumbo)"},"price": {"zh": "US$34（250 mL）/ US$16（100 mL）","en": "US$34 (250 mL) / US$16 (100 mL)"},"positioning": {"zh": "与Nº.4构成系统的键结护发素，面向中至粗发质受损发：在提供顺滑与易梳理的同时把专利分子带入调理步骤，核心差异化是明确宣称「无蛋白」——直接回应键结修护人群最担心的蛋白过载僵硬问题。","en": "The conditioner half of the Nº.4 system for damaged medium-to-coarse hair: it delivers slip and detangling while carrying the patented molecule into the conditioning step. Its sharpest differentiator is an explicit protein-free claim, answering the stiffness from protein overload that bond-repair users fear most."},"target": {"zh": "化学处理与热造型受损人群；打结严重、梳理困难的中粗发质；已使用Nº.4希望完成系统的用户；担心蛋白过载导致发丝僵硬的消费者。","en": "Users with chemical and heat damage; medium-to-coarse hair that tangles badly; Nº.4 users completing the system; consumers worried that protein overload will leave hair stiff."},"ingredients": {"zh": "核心同为Bis-Aminopropyl Diglycol Dimaleate。调理体系以Cetearyl Alcohol、Behentrimonium Chloride、Cetrimonium Chloride等阳离子调理剂为主，配合Quaternium-91、多种硅（Divinyldimethicone/Dimethicone Copolymer、Amodimethicone、Polysilicone-15）；护理成分含水解透明质酸、泛醇、磷脂、鳄梨油、葡萄籽油、绿茶籽油与生物素。明确无蛋白，同时无硫酸盐、SLS/SLES、邻苯二甲酸盐、磷酸盐、MIC/MIT、Paraben。","en": "Also built on Bis-Aminopropyl Diglycol Dimaleate. The conditioning base leads with cetearyl alcohol, behentrimonium chloride and cetrimonium chloride, joined by Quaternium-91 and several silicones (divinyldimethicone/dimethicone copolymer, amodimethicone, polysilicone-15). Care actives include hydrolyzed hyaluronic acid, panthenol, phospholipids, avocado oil, grape seed oil, green tea seed oil and biotin. Explicitly protein-free, and free of sulfates, SLS/SLES, phthalates, phosphates, MIC/MIT and parabens."},"evidence": {"zh": "官方公布：即时减少断裂66%并防护未来断裂，保湿提升91%，梳理性提升91%；皮肤科测试。市场地位引用Circana美国高端市场2024年1-12月数据。与Nº.4相同的局限：数据由品牌自行委托，未公开样本量与对照设计；且母公司自2023年舆情危机后营收持续承压。","en": "Published claims: 66% less breakage instantly with defense against future breakage, 91% more hydration and 91% easier detangling; dermatologist tested. Market position cites Circana US prestige data for Jan-Dec 2024. Same caveats as Nº.4 — brand-commissioned data with no disclosed sample size or control design, against a parent company whose revenue has been under pressure since the 2023 reputational crisis."},"experience": {"zh": "质地浓稠奶霜状但冲洗后不压发；250 mL标称约50次用量（5 mL/次），单次用量是Nº.4的两倍。停留1-3分钟即可，无需长时间敷用。香型与全线统一。","en": "A thick, creamy texture that nonetheless rinses without weighing hair down; 250 mL is rated for about 50 applications at 5 mL each — double the per-use dose of Nº.4. It only needs 1-3 minutes, with no long masking time. Scent is consistent with the rest of the line."},"packaging": {"zh": "与Nº.4完全一致的白瓶＋编号视觉，两支并列在货架与浴室里形成视觉配对，是「必须成套购买」暗示最直接的设计手段。规格阶梯同样覆盖100 mL至2000 mL。","en": "Visually identical to Nº.4 — white bottle, big number — so the pair reads as a set on shelf and in the shower, the most direct design device for implying they must be bought together. The same 100 mL to 2000 mL size ladder applies."},"insight": {"zh": "Nº.5最值得注意的是「无蛋白」这一反向卖点：在一个所有人都在加蛋白、加肽的品类里，OLAPLEX把「不加」写成了明确宣称，精准命中了受损发人群反复经历蛋白过载后的真实痛点。这提示我们——当品类共识过度集中在某个成分方向时，明确的减法宣称本身就是差异化空间。另外，官方把Nº.4的关键数据设定为「与Nº.5系统使用」的测试条件，在结构上让单品购买显得不完整，是值得研究的连带设计。","en": "The notable thing about Nº.5 is its inverse selling point: in a category where everyone is adding protein and peptides, OLAPLEX turned 'without' into an explicit claim, landing precisely on the real pain of damaged-hair users who have cycled through protein overload. The lesson: when category consensus over-concentrates on one ingredient direction, an explicit subtractive claim is itself differentiation space. Worth studying too is how Nº.4's headline data is defined under 'used as a system with Nº.5' — structurally making a single-product purchase feel incomplete."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/2025_No5_250ml_Product_Packshot_01_GBL_1440x1440_622d30f9-640f-4df4-b33e-97cd3d5ed514.png?v=1762274328","https://cdn.shopify.com/s/files/1/0434/1661/files/N.5_hover_958-988_a07c176a-c5a6-439a-9ec9-562300163a09.png?v=1740500601","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N5_benefit1_1440_f0563b87-feee-4422-8927-02cc4563a20c.jpg?v=1740500601"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-5-bond-maintenance-conditioner-us"],["Circana prestige ranking (brand citation)","https://olaplex.com/products/olaplex-n-5-bond-maintenance-conditioner-us"]],"targetUsers": {"zh": ["化学处理与热造型受损发","打结严重、梳理困难的中粗发质","已使用Nº.4、希望完成系统的用户","担心蛋白过载导致僵硬的消费者"],"en": ["Chemically and heat-damaged hair","Medium-to-coarse hair that tangles badly","Nº.4 users completing the system","Consumers wary of protein-overload stiffness"]},"keyClaims": {"zh": ["1次清洗修复日常损伤，防护未来断裂","即时减少断裂66%","保湿提升91%","梳理性提升91%","明确无蛋白，避免蛋白过载","无硫酸盐/磷酸盐/邻苯二甲酸盐/Paraben，纯素、染发安全"],"en": ["Repairs everyday damage in one wash and defends against future breakage","66% less breakage instantly","91% increase in hydration","91% easier detangling","Explicitly protein-free to avoid protein overload","Sulfate-, phosphate-, phthalate- and paraben-free; vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "与Nº.4同源，把键结修护延伸到调理步骤，构成完整系统"},{"name": "Behentrimonium / Cetrimonium Chloride","tag": "阳离子调理体系","desc": "实际承担顺滑与解结的成分，是「梳理性提升91%」的技术底层"},{"name": "Hydrolyzed Hyaluronic Acid / Panthenol","tag": "保湿","desc": "小分子透明质酸配合泛醇，支撑「保湿提升91%」的宣称"},{"name": "Avocado / Grape Seed / Green Tea Seed Oil","tag": "植物油脂复配","desc": "提供柔软度与光泽，平衡阳离子调理剂的单薄感"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "Shared with Nº.4, extending bond repair into the conditioning step to complete the system"},{"name": "Behentrimonium / Cetrimonium Chloride","tag": "Cationic conditioning system","desc": "The ingredients actually delivering slip and detangling — the technical basis of the 91% easier detangling claim"},{"name": "Hydrolyzed Hyaluronic Acid / Panthenol","tag": "Hydration","desc": "Low-molecular-weight HA with panthenol, underpinning the 91% hydration claim"},{"name": "Avocado / Grape Seed / Green Tea Seed Oil","tag": "Plant oil blend","desc": "Adds softness and shine, offsetting the thinness of a purely cationic system"}]},"ingredientsNote": {"zh": "「无蛋白」是本品最重要的宣称设计：键结修护人群往往同时使用多个修护产品，蛋白叠加导致的僵硬和断裂是高频抱怨，因此在护发素这一必用步骤上明确无蛋白，实际是在为整个护理系统做风险控制。配方含多种硅，追求无硅routine的卷发人群需注意。","en": "The protein-free claim is this product's most important design choice: bond-repair users typically stack several treatments, and the resulting protein overload — stiffness and snapping — is a frequent complaint. Declaring the mandatory conditioning step protein-free is effectively risk management for the whole routine. The formula does contain several silicones, so silicone-free curly routines should note this."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Amazon"],"japan": ["Sephora","Ulta Beauty","日本正规代理（olaplex.jp）"],"channelLabel": "Professional + Prestige Retail","channelDesc": "与Nº.4同渠道同价格并列陈列，形成事实上的强制配对购买"},"en": {"global": ["Professional salon channel","Brand DTC","Amazon"],"japan": ["Sephora","Ulta Beauty","Official Japan distribution (olaplex.jp)"],"channelLabel": "Professional + Prestige Retail","channelDesc": "Merchandised beside Nº.4 at the same price, creating a de facto mandatory pairing"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "K18 Damage Shield Conditioner","points": ["「无蛋白」明确宣称，直接回避K18肽路线的过载顾虑","与Nº.4的系统绑定让复购路径更确定","K18主张更短的作用时间与更新的技术宣称"]},{"name": "Kérastase Résistance Ciment Thermique","points": ["价格更低，不需沙龙购买即可获得","编号体系降低了选择成本，消费者不必理解发质细分","Kérastase按发质细分的产品线在专业沙龙推荐中更精准"]},{"name": "Redken Acidic Bonding Concentrate Conditioner","points": ["品牌资产集中于单一专利分子，认知更清晰","无蛋白定位在受损发社群中口碑优势明显","Redken的酸性pH说法在染后护色场景更有说服力，价格也更低"]}],"en": [{"name": "K18 Damage Shield Conditioner","points": ["The explicit protein-free claim sidesteps overload concerns around K18's peptide route","System lock-in with Nº.4 makes the repeat-purchase path more certain","K18 counters with shorter contact time and a newer technology claim"]},{"name": "Kérastase Résistance Ciment Thermique","points": ["Lower price and available without a salon visit","The numbering system lowers decision cost — no need to understand hair-type segmentation","Kérastase's type-segmented range is more precise for salon recommendation"]},{"name": "Redken Acidic Bonding Concentrate Conditioner","points": ["Brand equity concentrated on one patented molecule, so comprehension is clearer","Protein-free positioning enjoys strong word of mouth in damaged-hair communities","Redken's acidic-pH claim is more persuasive for color retention, and it costs less"]}]},"evidenceStats": {"zh": ["即时减少断裂66%，并防护未来断裂","保湿提升91%","梳理性提升91%","市场地位：Circana美国高端市场2024年销量第一的护发素","局限：品牌自行委托测试，未公开样本量与对照组设计"],"en": ["66% less breakage instantly, with defense against future breakage","91% increase in hydration","91% easier detangling","Market position: #1 prestige conditioner in the US per Circana, 2024","Limitation: brand-commissioned testing with no disclosed sample size or control design"]},"experienceItems": {"zh": ["质地：浓稠奶霜状，冲洗后不压发","浓缩度：250 mL约50次用量（5 mL/次），为Nº.4的两倍单次量","用法：涂于中段至发尾，停留1-3分钟","定位提醒：官方明确要求在Nº.4之后使用"],"en": ["Texture: thick and creamy yet rinses without weighing hair down","Concentration: 250 mL for about 50 applications at 5 mL — double Nº.4's per-use dose","Usage: mid-lengths to ends, leave 1-3 minutes","Note: officially specified for use after Nº.4"]},"packagingItems": {"zh": ["视觉：与Nº.4完全一致的白瓶＋编号，形成货架配对","架构：编号相邻使成套购买成为默认选项","规格：100 / 250 / 1000 / 2000 mL","弱点：与Nº.4难以视觉区分，淋浴间内易拿错"],"en": ["Visual: identical white bottle and numbering to Nº.4, reading as a shelf pair","Architecture: adjacent numbers make buying the set the default option","Sizes: 100 / 250 / 1000 / 2000 mL","Weakness: hard to tell apart from Nº.4 at a glance — easy to grab the wrong bottle in the shower"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "减法式宣称设计（无蛋白）","desc": "在一个普遍加蛋白与肽的品类里，把「不含蛋白」写成正式宣称，用于对冲用户在多产品叠加下的蛋白过载风险。"},{"title": "系统级配对开发","desc": "Nº.4与Nº.5在同一测试条件下开发与验证，关键数据以系统使用为前提，使配对购买成为技术上的必要而非营销建议。"},{"title": "单次用量差异化的用量设计","desc": "洗发2.5 mL、护发5 mL的官方用量设定，使同规格瓶身的消耗速度不同，形成错位补货节奏。"}],"en": [{"title": "Subtractive Claim Design (Protein-Free)","desc": "In a category that reflexively adds protein and peptides, 'contains no protein' is elevated to a formal claim, hedging the overload risk users run when stacking multiple treatments."},{"title": "System-Level Paired Development","desc": "Nº.4 and Nº.5 are developed and validated under the same test conditions, with headline data premised on system use — making the pairing a technical necessity rather than a marketing suggestion."},{"title": "Differentiated Dose Design","desc": "Official doses of 2.5 mL for shampoo and 5 mL for conditioner mean identically sized bottles deplete at different rates, creating a staggered replenishment rhythm."}]},"addedAt": 18},{"id": "olaplex-no7","category": "usa","name": {"zh": "OLAPLEX Nº.7 Bonding Oil","en": "OLAPLEX Nº.7 Bonding Oil"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2019年上市（日本2020年3月）；Allure Readers' Choice 2026获奖单品","en": "Launched 2019 (Japan Mar 2020); an Allure Readers' Choice 2026 award winner"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon"},"capacity": {"zh": "30 mL / 1 fl oz（另有60 mL）","en": "30 mL / 1 fl oz (also 60 mL)"},"price": {"zh": "US$32（30 mL）/ US$56（60 mL）","en": "US$32 (30 mL) / US$56 (60 mL)"},"positioning": {"zh": "把键结修护带入免洗造型环节的高浓缩美发油：2-3滴即可，同时承担光泽、抗毛躁、减少断裂与450°F热防护四重功能，是OLAPLEX编号系统里唯一的日常造型型产品，也是全线中最容易被非受损发人群接受的入口单品。","en": "A highly concentrated styling oil that carries bond repair into the leave-in step: 2-3 drops deliver shine, frizz control, breakage reduction and 450°F heat protection at once. It is the only everyday styling product in the OLAPLEX numbering system and the easiest entry point in the line for people whose hair is not visibly damaged."},"target": {"zh": "所有发质；频繁使用吹风机与直发夹板的人群；追求光泽与色彩鲜艳度的染发人群；希望以一支产品同时完成造型与热防护的消费者。","en": "All hair types; frequent blow-dryer and flat-iron users; color clients chasing shine and vibrancy; consumers who want one product to handle both styling and heat protection."},"ingredients": {"zh": "无水配方，基底为Dimethicone、Isohexadecane、C13-14 Isoparaffin、Coco-Caprylate与Phenyl Trimethicone的挥发性／成膜硅油体系；专利分子Bis-Aminopropyl Diglycol Dimaleate位列第六。护理成分含玉米油、β-胡萝卜素、向日葵籽油、石榴籽油、维生素E与绿茶籽油发酵滤液。无硫酸盐、磷酸盐、邻苯二甲酸盐、Paraben、无蛋白；纯素、染发安全。","en": "A waterless formula built on a volatile and film-forming silicone system — dimethicone, isohexadecane, C13-14 isoparaffin, coco-caprylate and phenyl trimethicone — with the patented Bis-Aminopropyl Diglycol Dimaleate sixth on the INCI. Care ingredients include corn oil, beta-carotene, sunflower seed oil, pomegranate seed oil, vitamin E and a green tea seed oil ferment filtrate. Free of sulfates, phosphates, phthalates, parabens and protein; vegan and color-safe."},"evidence": {"zh": "官方公布：光泽提升125%（对照未使用本品的漂发）、72小时抗毛躁与抗湿气、断裂减少77%、450°F/232°C热防护。对照条件被明确写出（vs. 未使用本品的漂发），透明度高于同类；但仍为品牌自行委托测试，未公开样本量与仪器方法。","en": "Published claims: 125% more shine (versus bleached hair without the product), 72-hour frizz and humidity control, 77% reduction in breakage and 450°F/232°C heat protection. The comparator is stated explicitly — more transparent than most peers — though the testing remains brand-commissioned with no disclosed sample size or instrumental method."},"experience": {"zh": "极度浓缩，官方用法为倒置瓶身、轻敲瓶底滴出定量液滴，2-3滴即可；干湿发皆可用，热造型前后均可。质地极轻不油腻，30 mL可用数月，实际单次成本远低于售价给人的印象。","en": "Extremely concentrated: the official method is to invert the bottle and tap the base for a metered drop, using just 2-3 drops. It works on damp or dry hair, before or after heat. The texture is exceptionally light and non-greasy, and 30 mL lasts months — making the real cost per use far lower than the price implies."},"packaging": {"zh": "透明玻璃瓶展示金黄色油体（β-胡萝卜素带来的视觉色），配合白色标签与编号，是全线中视觉最具「珍贵感」的一支。定量滴取的瓶口设计既控制用量、又强化「高浓缩」认知，是包装参与产品故事的典型案例。","en": "A clear glass bottle showing the golden oil — the color comes from beta-carotene — with the white label and number, making it the most precious-looking product in the line. The metered-drop neck both controls dosage and reinforces the 'highly concentrated' perception: a textbook case of packaging participating in the product story."},"insight": {"zh": "Nº.7是OLAPLEX编号体系里最聪明的一步棋：Nº.4/Nº.5要求消费者先承认自己头发受损，而Nº.7卖的是光泽和热防护——不需要承认损伤就能购买，因此成为整个系统最宽的入口。同时它把「β-胡萝卜素带来的金黄色」这种视觉线索直接转化为高浓缩感知，几乎不增加成本。对我们的启示是，修护型品牌需要至少一支「不以承认问题为前提」的引流单品，否则客群天花板会被自我认知锁死。","en": "Nº.7 is the smartest move in the OLAPLEX numbering system: Nº.4 and Nº.5 require the shopper to first admit their hair is damaged, whereas Nº.7 sells shine and heat protection — buyable without that admission, making it the widest entry point into the system. It also converts a visual cue (the golden color from beta-carotene) directly into perceived concentration at almost no cost. The lesson: a repair-led brand needs at least one hero that does not require admitting a problem, or its addressable audience stays capped by consumer self-perception."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/ClosetoFinal_Transparent_No7-Bottle_30ml_Product-Packshot_WS_FRONT_FPO_0040_MAIN.png?v=1762285968","https://cdn.shopify.com/s/files/1/0434/1661/files/N.7_hover_958-988_91b4dc2d-add6-48e9-82cb-1c5dcafddc89.png?v=1740486833","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N7_Benefit1_1440_85349bf3-13f6-4b32-9411-47213ba62bca.jpg?v=1740486833"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-7-bonding-oil-us"],["Sephora listing","https://www.sephora.com/product/no-7-bonding-oil-P447376"]],"targetUsers": {"zh": ["所有发质（全线中适用面最广的一支）","频繁使用吹风机与夹板的人群","追求光泽与染后色彩鲜艳度的消费者","希望一支产品兼顾造型与热防护的用户"],"en": ["All hair types — the broadest fit in the line","Frequent blow-dryer and flat-iron users","Consumers chasing shine and color vibrancy","Users who want one product for both styling and heat protection"]},"keyClaims": {"zh": ["光泽提升125%（vs. 未使用本品的漂发）","72小时抗毛躁与抗湿气","断裂减少77%","450°F/232°C 热防护","即时提升柔软度与染后色彩鲜艳度","无蛋白、纯素、染发安全"],"en": ["125% more shine (vs. bleached hair without it)","72-hour frizz and humidity control","77% reduction in breakage","450°F/232°C heat protection","Instantly boosts softness and color vibrancy","Protein-free, vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "把键结修护带入免洗造型步骤，是本品与普通美发油的根本区别"},{"name": "Dimethicone / Phenyl Trimethicone","tag": "成膜与光泽硅油","desc": "实际承担光泽、抗毛躁与热防护的成分，是「125%光泽」的技术底层"},{"name": "Isohexadecane / C13-14 Isoparaffin","tag": "挥发性轻质基底","desc": "提供极轻不油腻的铺展性，让高硅配方不显厚重"},{"name": "β-Carotene / Pomegranate Seed Oil / Vitamin E","tag": "抗氧化与视觉线索","desc": "β-胡萝卜素既提供抗氧化也带来金黄色油体，直接强化高浓缩的视觉感知"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "Brings bond repair into the leave-in step — the fundamental difference from an ordinary hair oil"},{"name": "Dimethicone / Phenyl Trimethicone","tag": "Film-forming and shine silicones","desc": "The ingredients actually delivering shine, frizz control and heat protection — the basis of the 125% shine claim"},{"name": "Isohexadecane / C13-14 Isoparaffin","tag": "Volatile lightweight base","desc": "Gives the exceptionally light, non-greasy spread that keeps a silicone-heavy formula from feeling thick"},{"name": "β-Carotene / Pomegranate Seed Oil / Vitamin E","tag": "Antioxidant plus visual cue","desc": "Beta-carotene provides antioxidant function and the golden oil color, directly reinforcing the perception of concentration"}]},"ingredientsNote": {"zh": "这是一支以硅油为主体的产品：无水配方，前五位全为硅油与挥发性烷烃。对追求无硅routine的卷发人群不适用，但正是硅膜体系才使450°F热防护与72小时抗湿气成为可能——在热防护品类里，无硅与高性能目前仍难兼得。专利分子位列第六，添加量具备功能意义。","en": "This is fundamentally a silicone product: waterless, with the top five slots all silicones and volatile alkanes. It does not suit silicone-free curly routines — but it is precisely the silicone film that makes 450°F protection and 72-hour humidity resistance possible; in heat protection, silicone-free and high performance remain hard to reconcile. The patented molecule sits sixth, at a functionally meaningful level."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Sephora","Amazon"],"japan": ["日本正规代理（olaplex.jp）","@cosme等日本美妆平台有较高讨论度"],"channelLabel": "Professional + Prestige Retail","channelDesc": "作为编号系统中门槛最低的单品，承担从零售端引流进入整个系统的角色"},"en": {"global": ["Professional salon channel","Brand DTC","Sephora","Amazon"],"japan": ["Official Japan distribution (olaplex.jp)","High discussion volume on Japanese platforms such as @cosme"],"channelLabel": "Professional + Prestige Retail","channelDesc": "As the lowest-barrier product in the numbering system, it functions as the retail funnel into the whole range"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "CÉCRED Heat Activated Silk Glaze","points": ["用法极简（2-3滴，干湿发皆可），无严格分区吹干要求","一支同时覆盖光泽、抗毛躁、断裂与热防护四个诉求","Cécred在Silk Press这一具体场景的针对性更强，文化归属更明确"]},{"name": "Moroccanoil Treatment","points": ["含专利键结修护分子，宣称减少断裂而非仅表面调理","热防护温度明确标称450°F，数据披露更完整","Moroccanoil的香型辨识度与沙龙渠道历史更悠久"]},{"name": "K18 Molecular Repair Hair Oil","points": ["价格更低且规格更小，试用门槛低","编号体系带来的系统联想是K18不具备的资产","K18的肽技术在专业圈层被视为更新一代，且宣称四分钟起效"]}],"en": [{"name": "CÉCRED Heat Activated Silk Glaze","points": ["Radically simpler use — 2-3 drops on damp or dry hair, with no strict sectioning and drying protocol","One product covering shine, frizz, breakage and heat protection at once","Cécred is sharper on the specific silk-press occasion and clearer on cultural belonging"]},{"name": "Moroccanoil Treatment","points": ["Contains a patented bond-repair molecule, claiming reduced breakage rather than surface conditioning alone","States a specific 450°F heat rating with fuller data disclosure","Moroccanoil's scent recognition and salon-channel history run deeper"]},{"name": "K18 Molecular Repair Hair Oil","points": ["Lower price in a smaller size, so the trial barrier is low","The system association created by the numbering is an asset K18 lacks","K18's peptide technology reads as a newer generation professionally, and claims results in four minutes"]}]},"evidenceStats": {"zh": ["光泽提升125%（对照：未使用本品的漂发）","72小时抗毛躁与抗湿气","断裂减少77%","450°F/232°C 热防护","透明度：明确写出对照条件；局限：品牌自行委托，未公开样本量与仪器方法"],"en": ["125% more shine (comparator: bleached hair without the product)","72-hour frizz and humidity control","77% reduction in breakage","450°F/232°C heat protection","Transparency: the comparator is stated; limitation: brand-commissioned, no sample size or instrumental method disclosed"]},"experienceItems": {"zh": ["用量：2-3滴即可，倒置轻敲瓶底定量滴取","适用：干发湿发皆可，热造型前后均可，可每日使用","质地：极轻不油腻，无水配方铺展性极佳","经济性：30 mL可用数月，实际单次成本远低于售价印象"],"en": ["Dose: just 2-3 drops, dispensed by inverting and tapping the base","Use: damp or dry hair, before or after heat, suitable daily","Texture: exceptionally light and non-greasy with excellent spread from the waterless base","Economy: 30 mL lasts months, so real cost per use is far below what the price suggests"]},"packagingItems": {"zh": ["视觉：透明玻璃瓶展示金黄色油体，全线中最具珍贵感","功能：定量滴取瓶口控制用量并强化高浓缩认知","规格：30 mL / 60 mL 两档","弱点：玻璃瓶易碎，旅行携带需注意；定量滴取上手需要适应"],"en": ["Visual: clear glass showing the golden oil — the most precious-looking product in the line","Function: the metered-drop neck controls dosage and reinforces the concentration story","Sizes: 30 mL and 60 mL","Weakness: glass is fragile for travel, and the metered-drop method takes a moment to learn"]},"productType": "oil","keyTechnology": {"zh": [{"title": "无需承认损伤的入口型产品设计","desc": "以光泽与热防护而非「修复」为主诉求，使不认为自己头发受损的消费者也能进入品牌系统，突破修护型品牌固有的客群天花板。"},{"title": "无水高浓缩配方设计","desc": "完全去水的硅油基底使单次用量压缩到2-3滴，既支撑「高浓缩」的价值主张，也让30 mL的小规格具备数月使用周期。"},{"title": "包装参与浓度感知的设计","desc": "定量滴取瓶口与β-胡萝卜素带来的金黄色油体共同构建「珍贵·高浓缩」认知，几乎不增加配方成本。"},{"title": "明确对照条件的宣称披露","desc": "关键数据标注对照组（未使用本品的漂发），在自行委托测试的行业惯例中提供了相对更高的可验证性。"}],"en": [{"title": "Entry-Product Design That Requires No Admission of Damage","desc": "Leading on shine and heat protection rather than repair lets consumers who do not consider their hair damaged enter the brand system, breaking the audience ceiling inherent to repair-led brands."},{"title": "Waterless High-Concentration Formulation","desc": "A fully anhydrous silicone base compresses the dose to 2-3 drops, supporting the concentration value claim while giving a small 30 mL size a multi-month life."},{"title": "Packaging as a Concentration Cue","desc": "The metered-drop neck and the beta-carotene golden oil together build a precious, highly-concentrated perception at almost no formulation cost."},{"title": "Claim Disclosure With a Stated Comparator","desc": "Headline data names its control (bleached hair without the product), offering relatively higher verifiability within an industry norm of brand-commissioned testing."}]},"addedAt": 19},{"id": "kundal-airy-volume-hyaluron", "category": "korea", "productType": "shampoo", "addedAt": 20, "name": {"zh": "KUNDAL Airy Volume Hyaluron Shampoo", "en": "KUNDAL Airy Volume Hyaluron Shampoo"}, "brand": {"zh": "KUNDAL（쿤달）", "en": "KUNDAL"}, "company": {"zh": "THE SKINFACTORY Co., Ltd.（韩国首尔，2016年10月成立）", "en": "THE SKINFACTORY Co., Ltd. (Seoul, Korea; founded Oct 2016)"}, "origin": {"zh": "韩国", "en": "South Korea"}, "launch": {"zh": "Airy Volume Hyaluron系列（洗发水／护发素双支线）", "en": "Airy Volume Hyaluron line (shampoo + treatment)"}, "capacity": {"zh": "300 mL / 500 mL", "en": "300 mL / 500 mL"}, "price": {"zh": "US$20.90（500 mL，Stylevana）；洗护套装US$41.99（Amazon）", "en": "US$20.90 (500 mL, Stylevana); US$41.99 for the shampoo+treatment set on Amazon"}, "market": {"zh": "韩国、日本、东南亚跨境电商为主", "en": "Korea, Japan and Southeast Asian cross-border e-commerce"}, "images": ["https://cdn.store-assets.com/s/1376072/i/84403640.png", "https://cdn.store-assets.com/s/1376072/i/84671527.png"], "sources": [["KUNDAL official store — Airy Volume Hyaluron", "https://www.kundalofficial.com/collections/airy-volume-hyaluron"], ["INCIDecoder full ingredient list", "https://incidecoder.com/products/kundal-airy-volume-hyaluron-shampoo"], ["Hwahae ingredient analysis", "https://www.hwahae.com/en/products/KUNDAL-AIRY-VOLUME-HYALURON-SHAMPOO-BLOSSOM-BREEZE/2122437/ingredients"]], "positioning": {"zh": "面向细软塌发质与头皮容易出油人群的丰盈型洗发水：用8种形态的透明质酸做保湿，同时靠PHA与水杨酸衍生物清理头皮堆积，把「保湿」与「蓬松」这一对通常互相冲突的诉求放进同一支产品。定价在US$20上下，属于韩系大众线中偏上的位置。", "en": "A volumising shampoo for fine, limp hair and oil-prone scalps. It pairs eight forms of hyaluronic acid for hydration with a PHA and a salicylic-acid derivative to clear scalp buildup, putting two usually conflicting promises — moisture and lift — in one bottle. At around US$20 it sits at the upper end of the Korean mass tier."}, "target": {"zh": "细软发、扁塌发顶、头皮易出油但发梢干燥的消费者", "en": "Fine, flat-at-the-root hair with an oily scalp but dry ends"}, "targetUsers": {"zh": ["细软发质、发根容易扁塌的人群", "头皮易出油但发梢干燥的混合型头皮", "偏好韩系香氛型个护、看重香味的消费者", "希望免硫酸盐但仍要清爽洗净感的用户"], "en": ["Fine hair that goes flat at the roots", "Combination scalps — oily roots, dry ends", "Shoppers who buy Korean personal care for fragrance", "Users who want sulfate-free but still a clean-rinse feel"]}, "keyClaims": {"zh": ["8种形态透明质酸复合保湿", "AHA・PHA温和去角质，清理头皮堆积", "免硫酸盐洗净基剂", "专业调香师打造的signature香型", "7种海藻提取物与6种植物水解蛋白"], "en": ["Eight forms of hyaluronic acid", "AHA/PHA gentle exfoliation to clear scalp buildup", "Sulfate-free cleansing base", "Signature fragrance developed with professional perfumers", "Seven seaweed extracts and six hydrolysed plant proteins"]}, "ingredients": {"zh": "洗净基剂为Disodium Laureth Sulfosuccinate配合Lauryl Betaine与Cocamide MIPA，属温和的磺基琥珀酸酯体系，无SLS/SLES。透明质酸以8种形态出现：Sodium Hyaluronate（标注110ppb）、Hydroxypropyltrimonium Hyaluronate（阳离子化，可吸附于发丝）、Sodium Acetylated Hyaluronate、Hydrolyzed Hyaluronic Acid、Hyaluronic Acid、Sodium Hyaluronate Crosspolymer、Hydrolyzed Sodium Hyaluronate、Potassium Hyaluronate。海洋成分包括裙带菜、海带、羊栖菜、Ecklonia cava、石莼、马尾藻、石花菜共7种提取物，另配海水（Maris Aqua）。蛋白部分为大豆、大米、豌豆、榛子、大麦共5种植物水解蛋白，加甘氨酸、谷氨酸、精氨酸三种游离氨基酸与生物素。", "en": "The cleansing base is disodium laureth sulfosuccinate with lauryl betaine and cocamide MIPA — a mild sulfosuccinate system with no SLS or SLES. Hyaluronic acid appears in eight forms: sodium hyaluronate (labelled 110 ppb), hydroxypropyltrimonium hyaluronate (cationised, so it deposits on the fibre), sodium acetylated hyaluronate, hydrolysed hyaluronic acid, hyaluronic acid, sodium hyaluronate crosspolymer, hydrolysed sodium hyaluronate and potassium hyaluronate. Marine content covers seven extracts — wakame, kombu, hijiki, Ecklonia cava, Codium fragile, Sargassum and Gelidium — plus sea water. Proteins are five hydrolysed plant proteins (soy, rice, pea, hazelnut, barley) with glycine, glutamic acid, arginine and biotin."}, "ingredientsNote": {"zh": "品牌宣传写「AHA & PHA」，但全成分中只有Gluconolactone（PHA）与Capryloyl Salicylic Acid（水杨酸衍生物，通常归类为LHA），并没有甘醇酸、乳酸这类严格意义上的AHA。这一点在做同类宣称时需要留意合规边界。", "en": "Marketing says “AHA & PHA,” but the INCI list contains only gluconolactone (a PHA) and capryloyl salicylic acid (a salicylic derivative usually classed as LHA). There is no glycolic or lactic acid — no AHA in the strict sense. Worth noting when writing comparable claims."}, "heroIngredients": {"zh": [{"name": "8形态透明质酸复合物", "tag": "保湿・附着", "desc": "从小分子水解型到交联型再到阳离子化型，覆盖不同分子量与附着方式。其中Hydroxypropyltrimonium Hyaluronate带正电，是唯一能在冲洗后仍附着于发丝的形态。"}, {"name": "Gluconolactone（PHA）", "tag": "温和去角质", "desc": "分子量大于AHA，渗透慢、刺激低，同时具吸湿性。承担清理头皮堆积的角色。"}, {"name": "Capryloyl Salicylic Acid", "tag": "头皮清理", "desc": "水杨酸的脂溶性衍生物（LHA），亲油性强，针对头皮皮脂堆积。"}, {"name": "7种海藻提取物 + 海水", "tag": "品牌资产", "desc": "裙带菜、海带、羊栖菜、Ecklonia cava等，构成KUNDAL区别于其他韩系品牌的成分识别点。"}], "en": [{"name": "Eight-form hyaluronic complex", "tag": "Hydration / deposition", "desc": "From low-molecular hydrolysed to crosspolymer to cationised, covering different molecular weights and deposition routes. Hydroxypropyltrimonium hyaluronate is the only positively charged form, so it is the one that stays on the fibre after rinsing."}, {"name": "Gluconolactone (PHA)", "tag": "Gentle exfoliation", "desc": "Larger molecule than an AHA, so it penetrates slowly with less irritation while also acting as a humectant. Handles the scalp-buildup job."}, {"name": "Capryloyl salicylic acid", "tag": "Scalp clearing", "desc": "An oil-soluble salicylic derivative (LHA) that targets sebum buildup on the scalp."}, {"name": "Seven seaweed extracts + sea water", "tag": "Brand signature", "desc": "Wakame, kombu, hijiki, Ecklonia cava and others — the ingredient signature that separates KUNDAL from other Korean mass brands."}]}, "keyTechnology": {"zh": [{"title": "多形态同成分堆叠", "desc": "把同一种功效成分拆成8种分子形态同时投料。单看每一种的添加量都不高（Sodium Hyaluronate标注110ppb），但成分表上连续出现8个hyaluronate词根，形成了强烈的视觉说服力。这是韩系大众线常见的成分表设计手法。"}, {"title": "酸类分工：PHA管头皮、HA管发丝", "desc": "用大分子PHA与脂溶性LHA处理头皮侧的堆积，用阳离子化HA处理发丝侧的保湿，两条路径在同一支洗发水里分工，避免了「洗得干净就不保湿」的矛盾。"}, {"title": "香氛前置的产品开发", "desc": "KUNDAL全线以专业调香师开发的signature香型作为核心识别，Airy Volume Hyaluron也有Blossom Breeze等多个香型分支。对这个品牌来说香型是SKU分化的主轴，功效是次轴。"}], "en": [{"title": "Stacking one active in multiple forms", "desc": "The same functional ingredient is split into eight molecular forms and dosed together. Individually the levels are modest (sodium hyaluronate is labelled at 110 ppb), but eight consecutive “hyaluronate” entries on the INCI list carry real visual persuasion. This is a common INCI-design tactic in the Korean mass tier."}, {"title": "Divided acid duties: PHA for scalp, HA for fibre", "desc": "A large-molecule PHA and an oil-soluble LHA handle buildup on the scalp side while cationised HA handles hydration on the fibre side. Splitting the two jobs inside one shampoo avoids the usual trade-off between a clean rinse and moisture."}, {"title": "Fragrance-first development", "desc": "KUNDAL builds its whole range around signature scents developed with professional perfumers, and Airy Volume Hyaluron branches into variants such as Blossom Breeze. For this brand fragrance is the primary axis of SKU differentiation and efficacy is the secondary one."}]}, "evidence": {"zh": "没有公开的临床或消费者测试数据，也没有第三方机构报告。可验证的只有全成分表本身（INCIDecoder与Hwahae均可查证，48个成分）与「110ppb」这一个具体数字。品牌宣称中的「AHA & PHA」与实际成分表存在偏差。整体属于成分表驱动型的说服结构，而非数据驱动型。", "en": "No published clinical or consumer test data and no third-party reports. The only verifiable material is the INCI list itself (48 ingredients, checkable on INCIDecoder and Hwahae) and the single “110 ppb” figure. The “AHA & PHA” claim does not match the actual list. Persuasion here rests on the ingredient list, not on data."}, "evidenceStats": {"zh": ["Sodium Hyaluronate 110ppb（唯一公开的具体浓度数字）", "全成分48项，第三方数据库可查证", "无临床测试、无消费者测试、无第三方报告", "宣称与成分表偏差：标示AHA但实际只有PHA与LHA"], "en": ["Sodium hyaluronate at 110 ppb — the only concentration figure published", "48 ingredients, verifiable on third-party databases", "No clinical test, no consumer test, no third-party report", "Claim/INCI gap: labelled AHA but only PHA and LHA are present"]}, "experience": {"zh": "磺基琥珀酸酯体系起泡量中等，泡沫细密，冲洗后不带涩感。定位「airy volume」意味着配方刻意避开重型硅油与阳离子调理剂，发丝干后偏轻盈，但受损发可能觉得润度不足，需要搭配同系列护发素。香型是品牌主打，Blossom Breeze为花香调。500 mL大容量在韩系品牌中属常规规格。", "en": "The sulfosuccinate base gives moderate, fine lather and rinses without squeak. The “airy volume” positioning means the formula deliberately avoids heavy silicones and cationic conditioners, so hair dries light — but damaged hair may find it under-conditioned and need the matching treatment. Fragrance is the headline: Blossom Breeze is a floral. The 500 mL size is standard for the Korean market."}, "experienceItems": {"zh": ["泡沫：中等泡量，细密，冲洗顺畅无涩感", "干后手感：轻盈蓬松，刻意不留厚重包覆感", "局限：受损发单用可能润度不足，设计上依赖同系列护发素", "香型：Blossom Breeze等多个花香分支，是SKU分化的主轴", "规格：300 mL / 500 mL，大容量为主"], "en": ["Lather: moderate volume, fine bubbles, rinses clean without squeak", "Dry feel: light and lifted, deliberately no heavy coating", "Limitation: damaged hair may find it under-conditioned on its own — the design assumes the matching treatment", "Fragrance: several floral variants such as Blossom Breeze, the main axis of SKU split", "Sizes: 300 mL / 500 mL, weighted to the large size"]}, "packaging": {"zh": "细长按压瓶身，配色随香型变化，属于韩系个护常见的「香型即配色」设计。500 mL为主推规格，视觉上强调容量与性价比。瓶身信息以韩英双语为主，跨境电商销售时不额外做本地化。", "en": "Slim pump bottle with colour keyed to the fragrance variant — the standard “scent equals colourway” design of Korean personal care. The 500 mL size leads, and the packaging visually emphasises volume for money. Copy is Korean/English, with no extra localisation for cross-border channels."}, "packagingItems": {"zh": ["瓶型：细长按压瓶，500 mL主推", "配色：随香型变化，货架上以色块区分SKU", "信息：韩英双语，跨境销售不额外本地化", "定位表达：视觉强调大容量与性价比，而非高端感"], "en": ["Format: slim pump bottle, 500 mL leading", "Colour: keyed to fragrance, SKUs distinguished by colour block on shelf", "Copy: Korean/English, no extra localisation for cross-border", "Message: the visual emphasis is volume-for-money, not premium"]}, "distribution": {"zh": "韩国本土线上为主，日本Qoo10、东南亚跨境电商，欧美通过Stylevana、YesStyle、Amazon等转售渠道", "en": "Mostly online in Korea, Qoo10 in Japan, Southeast Asian cross-border, and Stylevana / YesStyle / Amazon resale in the West"}, "marketChannel": {"zh": {"global": ["韩国本土线上直营", "Stylevana、YesStyle等K-beauty跨境平台", "Amazon（洗护套装形式）", "欧洲小众K-beauty零售商"], "japan": ["Qoo10 Japan为主力渠道，品牌曾公开介绍日本市场进入策略", "日本市场以香型与性价比为主要卖点"], "channelLabel": "K-Beauty Cross-border Mass", "channelDesc": "不依赖线下沙龙或药妆店，几乎全部销售来自跨境电商平台，渠道成本低但品牌控制力弱"}, "en": {"global": ["Direct online in Korea", "K-beauty cross-border platforms such as Stylevana and YesStyle", "Amazon (mostly as a shampoo+treatment set)", "Niche K-beauty retailers in Europe"], "japan": ["Qoo10 Japan is the main channel; the brand has publicly discussed its Japan entry strategy", "Fragrance and value for money are the lead arguments in Japan"], "channelLabel": "K-Beauty Cross-border Mass", "channelDesc": "No salon or drugstore dependency — almost all sales come through cross-border e-commerce, which keeps channel cost low but brand control weak"}}, "pricePositioning": {"zh": {"tier": "mass", "label": "K-Beauty Value Volume"}, "en": {"tier": "mass", "label": "K-Beauty Value Volume"}}, "brandConceptRich": {"zh": {"tagline": "Nature meets science", "concept": "KUNDAL以澳洲坚果油为基底，把植物提取物与配方技术结合，做面向大众的个护产品。品牌名取自德语与英语的组合，2016年在首尔创立，以香型开发与高性价比大容量规格快速扩张，是韩国增长最快的个护品牌之一。"}, "en": {"tagline": "Nature meets science", "concept": "KUNDAL builds mass personal care on a macadamia oil base, combining botanical extracts with formulation technology. Founded in Seoul in 2016 with a name coined from German and English, it scaled fast on fragrance development and large-format value sizing, and is now one of Korea's fastest-growing personal care brands."}}, "competitiveAdvantage": {"zh": [{"name": "Ryo（吕）", "points": ["Ryo以韩方草本与头皮功效为主，KUNDAL以香型与保湿为主，诉求不重叠", "Ryo有线下药妆与商超渠道，KUNDAL几乎全部依赖线上", "价格带接近，但Ryo的功效背书更成体系"]}, {"name": "Mise en Scène", "points": ["同为韩系大众线，Mise en Scène以损伤修护与免洗产品见长", "KUNDAL在香型开发与大容量规格上更激进", "Mise en Scène有爱茉莉太平洋的渠道与研发支撑，KUNDAL为独立公司"]}, {"name": "&honey（日本）", "points": ["两者都以「保湿+香型+高颜值包装」构建卖点，是最直接的可比对象", "&honey用蜂蜜做单一核心概念，KUNDAL用透明质酸多形态堆叠，说服路径不同", "&honey单价更高、规格更小，KUNDAL主打大容量性价比"]}], "en": [{"name": "Ryo", "points": ["Ryo leads with Korean herbal medicine and scalp efficacy; KUNDAL leads with fragrance and hydration — the claims do not overlap", "Ryo has drugstore and mass-retail distribution; KUNDAL is almost entirely online", "Similar price band, but Ryo's efficacy support is far more systematic"]}, {"name": "Mise en Scène", "points": ["Also Korean mass, but strongest in damage repair and leave-in products", "KUNDAL is more aggressive on fragrance development and large formats", "Mise en Scène has Amorepacific's channel and R&D behind it; KUNDAL is independent"]}, {"name": "&honey (Japan)", "points": ["Both build on hydration plus fragrance plus attractive packaging — the closest direct comparison", "&honey uses honey as a single central concept; KUNDAL stacks multiple forms of hyaluronic acid. Different persuasion routes", "&honey is pricier in smaller sizes; KUNDAL leads on large-format value"]}]}, "insight": {"zh": "KUNDAL值得研究的是成分表的写法。把透明质酸拆成8种形态同时投料，让消费者在INCI表上连续看到8个hyaluronate，说服力来自视觉密度而不是浓度——唯一公开的具体数字是110ppb，量级很小。这套手法在中国和韩国的大众线里很常见，成本可控，且不需要临床数据支撑。\n\n但要照做需要注意合规边界。品牌宣称写「AHA & PHA」，成分表里只有PHA和水杨酸衍生物，没有真正的AHA。在NMPA备案的语境下，这种宣称与成分不一致的写法会直接卡住。可以学的是分子形态堆叠的呈现方式，不能学的是把成分类别写宽。", "en": "What is worth studying at KUNDAL is how the ingredient list is written. Splitting hyaluronic acid into eight forms puts eight consecutive “hyaluronate” entries in front of the shopper, and the persuasion comes from visual density rather than concentration — the only figure published is 110 ppb, which is very small. The tactic is common in the Chinese and Korean mass tiers: cost-controlled, and it needs no clinical data.\n\nCopying it does mean watching the compliance line. The brand says “AHA & PHA” while the list holds only a PHA and a salicylic derivative — no true AHA. Under NMPA filing that kind of claim-to-INCI mismatch stops the submission. The presentation of stacked molecular forms is learnable; broadening an ingredient category in the claim is not."}, "notes": {"zh": "资料采集日 2026-07-31。价格随跨境平台波动较大，以官方商城与Stylevana为准。", "en": "Researched 2026-07-31. Prices swing across cross-border platforms; the official store and Stylevana are the reference points."}},{"id": "kerastase-chronologiste", "category": "europe", "productType": "shampoo", "addedAt": 21, "name": {"zh": "Kérastase Chronologiste Bain Régénérant", "en": "Kérastase Chronologiste Bain Régénérant"}, "brand": {"zh": "Kérastase（卡诗）", "en": "Kérastase"}, "company": {"zh": "L'Oréal Professional Products Division（法国，Kérastase创立于1964年）", "en": "L'Oréal Professional Products Division (France; Kérastase founded 1964)"}, "origin": {"zh": "法国", "en": "France"}, "launch": {"zh": "Chronologiste为品牌顶级抗老线，Bain Régénérant为该线洗发单品（现行配方为restage版本）", "en": "Chronologiste is the brand's top-tier anti-ageing line; Bain Régénérant is its shampoo (current formula is the restage version)"}, "capacity": {"zh": "80 mL / 250 mL / 500 mL", "en": "80 mL / 250 mL / 500 mL"}, "price": {"zh": "US$23（80 mL）/ US$48（250 mL）/ US$73（500 mL），美国官网价；英国£33.50（250 mL）", "en": "US$23 (80 mL) / US$48 (250 mL) / US$73 (500 mL) on the US site; £33.50 (250 mL) in the UK"}, "market": {"zh": "全球沙龙渠道与高端百货，Sephora等美妆零售", "en": "Global salon channel, prestige department stores and beauty retail such as Sephora"}, "images": ["https://www.kerastase.com.au/dw/image/v2/BFZM_PRD/on/demandware.static/-/Sites-kerastase-master-catalog/en_AU/dwee9bcdd9/2023/Shampoos/KER_CHRONOLOGISTE_3474636728268_PACKSHOT.jpg?sw=800&sh=800&sm=cut&sfrm=jpg&q=85", "https://www.kerastase.com.au/dw/image/v2/BFZM_PRD/on/demandware.static/-/Sites-kerastase-master-catalog/default/dwbdcbb6f4/2021/chronologiste/KER_CHRONOLOGISTE_3474636728268_ECOMM.jpg?sw=800&sh=800&sm=cut&sfrm=jpg&q=85"], "sources": [["Kérastase US — Bain Régénérant", "https://www.kerastase-usa.com/collections/chronologiste/bain-regenerant-shampoo.html"], ["Sephora US product page", "https://www.sephora.com/product/kerastase-chronologiste-shampoo-dull-brittle-hair-P466880"], ["INCIDecoder full ingredient list", "https://incidecoder.com/products/kerastase-bain-regenerant-shampoo"]], "positioning": {"zh": "Kérastase价格带最高的Chronologiste线中的洗发单品，面向被定义为「老化」的头发与头皮：以透明质酸、Abyssine与维生素E为核心，针对光泽流失、密度下降、纤维脆弱等被归纳为「五个可见老化征兆」的问题。250 mL售价US$48，单毫升成本约US$0.19，是本库中单价最高的洗发水。渠道以沙龙与高端零售为主，靠专业背书而非成分新颖度定价。", "en": "The shampoo in Chronologiste, Kérastase's highest-priced line, aimed at hair and scalp framed as ageing. Hyaluronic acid, Abyssine and vitamin E address what the brand groups into “five visible signs of ageing” — lost shine, reduced density, fragile fibre. At US$48 for 250 mL, roughly US$0.19 per mL, it is the most expensive shampoo in this library. Distribution runs through salons and prestige retail, and the price rests on professional endorsement rather than ingredient novelty."}, "target": {"zh": "40岁以上、感受到发量与光泽变化的高消费力人群，以及沙龙客单价较高的客户", "en": "High-spend consumers over 40 who notice changes in density and shine, and salon clients at the top of the ticket"}, "targetUsers": {"zh": ["感受到发量、光泽、纤维强度下降的中年以上人群", "沙龙推荐驱动的高客单价客户", "已经在使用高端护肤抗老产品、愿意把同一逻辑延伸到头发的消费者", "对香氛与使用仪式有要求的用户"], "en": ["Older consumers noticing loss of density, shine and fibre strength", "High-ticket salon clients who buy on stylist recommendation", "People already using prestige anti-ageing skincare who extend the same logic to hair", "Users who care about fragrance and the ritual of use"]}, "keyClaims": {"zh": ["针对头发与头皮的「五个可见老化征兆」", "透明质酸深层保湿并使发丝显得更丰盈", "Abyssine强化并活化发纤维", "维生素E抗氧化", "洗后更强韧、柔软、顺滑，带弹性"], "en": ["Targets the “five visible signs of ageing” in hair and scalp", "Hyaluronic acid hydrates deeply and plumps strands for a fuller look", "Abyssine revitalises and strengthens the fibre", "Vitamin E provides antioxidant support", "Leaves hair stronger, softer, smoother and with more bounce"]}, "ingredients": {"zh": "洗净基剂为Sodium Laureth Sulfate配Coco-Betaine与Cocamide MIPA，是传统的硫酸盐体系——在这个价格带里属于少见的选择。功效成分为Sodium Hyaluronate与Hyaluronic Acid（双形态）、Alteromonas Ferment Extract（即品牌所称Abyssine，一种深海嗜极菌发酵产物）、Tocopherol与Bisabolol。另含Salicylic Acid与Glycolic Acid做头皮角质更新，Amodimethicone与Dimethicone做顺滑，2-Oleamido-1,3-Octadecanediol为神经酰胺类似物。香精成分包括Benzyl Salicylate、Hexyl Cinnamal、Limonene、Citronellol、Geraniol、Linalool、Hydroxycitronellal，对应ベルガモット・玫瑰・广藿香的香调。", "en": "The cleansing base is sodium laureth sulfate with coco-betaine and cocamide MIPA — a conventional sulfate system, which is an unusual choice at this price. Actives are sodium hyaluronate and hyaluronic acid (two forms), Alteromonas ferment extract (the brand's Abyssine, from a deep-sea extremophile), tocopherol and bisabolol. Salicylic and glycolic acid handle scalp renewal, amodimethicone and dimethicone handle slip, and 2-oleamido-1,3-octadecanediol is a ceramide analogue. Fragrance allergens — benzyl salicylate, hexyl cinnamal, limonene, citronellol, geraniol, linalool, hydroxycitronellal — correspond to the bergamot, rose and patchouli accord."}, "ingredientsNote": {"zh": "值得注意的是，在US$48这个价格带上，Kérastase仍然使用SLES作为主洗净剂，而本库中US$10.99的CeraVe与US$20的KUNDAL都是免硫酸盐配方。这说明在专业沙龙线的语境下，「免硫酸盐」并不是溢价的必要条件——溢价来自品牌与渠道，不来自基剂选择。", "en": "Note that at US$48 Kérastase still uses SLES as the primary surfactant, while the US$10.99 CeraVe and the US$20 KUNDAL in this library are both sulfate-free. In the professional salon context, sulfate-free is evidently not a precondition for a premium price — the premium comes from brand and channel, not from the base."}, "heroIngredients": {"zh": [{"name": "Abyssine（Alteromonas Ferment Extract）", "tag": "品牌专属成分", "desc": "深海热泉嗜极菌的发酵提取物，原本以抗刺激与修护为主要功效被开发。Kérastase以专属命名的方式使用，是Chronologiste线区别于其他线的核心标识。"}, {"name": "透明质酸（双形态）", "tag": "保湿・丰盈", "desc": "Sodium Hyaluronate与Hyaluronic Acid同时投料，承担「让发丝看起来更饱满」的视觉诉求。"}, {"name": "Glycolic Acid + Salicylic Acid", "tag": "头皮角质更新", "desc": "AHA与BHA同时使用，处理头皮角质堆积。这是把护肤的酸类护理逻辑直接移植到头皮的做法。"}, {"name": "Tocopherol + Bisabolol", "tag": "抗氧化・舒缓", "desc": "维生素E负责抗氧化，红没药醇负责头皮舒缓，二者共同支撑「抗老」的整体表达。"}], "en": [{"name": "Abyssine (Alteromonas ferment extract)", "tag": "Proprietary name", "desc": "A ferment from a deep-sea hydrothermal extremophile, originally developed for anti-irritation and repair. Kérastase uses it under a proprietary name, and it is the marker that separates Chronologiste from the brand's other lines."}, {"name": "Hyaluronic acid (two forms)", "tag": "Hydration / plumping", "desc": "Sodium hyaluronate and hyaluronic acid dosed together, carrying the visual promise of fuller-looking strands."}, {"name": "Glycolic acid + salicylic acid", "tag": "Scalp renewal", "desc": "An AHA and a BHA together to handle scalp buildup — skincare acid protocols transplanted directly onto the scalp."}, {"name": "Tocopherol + bisabolol", "tag": "Antioxidant / soothing", "desc": "Vitamin E for antioxidant support and bisabolol for scalp comfort, jointly supporting the overall anti-ageing message."}]}, "keyTechnology": {"zh": [{"title": "「五个可见老化征兆」的问题框架", "desc": "把光泽、密度、强度等分散的诉求整合成一个可命名、可计数的框架。消费者不需要理解成分机理，只需要在五项里认领自己的问题。这个框架本身比配方更难复制。"}, {"title": "成分专属命名（Abyssine）", "desc": "Alteromonas Ferment Extract是可采购的原料，但以Abyssine之名出现后就成为Kérastase的资产。用命名建立独占感，而不依赖专利——这条路径成本远低于分子专利。"}, {"title": "护肤逻辑向头皮的移植", "desc": "抗老、酸类角质更新、抗氧化，三条都是护肤的成熟叙述框架，被整体搬到头皮场景。L'Oréal集团内部护肤与护发的技术共享是这套移植的基础。"}, {"title": "沙龙背书驱动的定价", "desc": "通过发型师推荐建立专业性认知，再由零售渠道承接。价格支撑来自渠道结构而非成分成本，这一点从配方仍使用SLES可以看出。"}], "en": [{"title": "The “five visible signs of ageing” frame", "desc": "Shine, density and strength are gathered into one nameable, countable frame. The shopper does not need to follow any mechanism — only to recognise their own problem among the five. The frame is harder to copy than the formula."}, {"title": "Proprietary ingredient naming (Abyssine)", "desc": "Alteromonas ferment extract is a purchasable raw material, but under the name Abyssine it becomes a Kérastase asset. Exclusivity built by naming rather than patent — far cheaper than a molecular patent."}, {"title": "Skincare logic moved onto the scalp", "desc": "Anti-ageing, acid renewal and antioxidant support are three mature skincare frames transplanted wholesale to the scalp. Technology sharing between L'Oréal's skincare and haircare divisions is what makes the transplant possible."}, {"title": "Pricing carried by salon endorsement", "desc": "Stylist recommendation establishes professional credibility, and retail picks up the volume. The price is supported by channel structure rather than ingredient cost — visible in the fact that the formula still uses SLES."}]}, "evidence": {"zh": "没有公开的量化临床数据。官网与零售页面提供的是功效描述（更强韧、更柔软、更顺滑、更有弹性）与成分功能说明，未见百分比数字、样本量或测试方法。可引用性低。真正支撑购买的是Sephora上超过2000条评价与4.6的评分，以及沙龙渠道的口碑，属于社会证据而非实验证据。", "en": "No published quantitative clinical data. The official and retail pages offer benefit descriptions — stronger, softer, smoother, bouncier — and ingredient function copy, with no percentages, sample sizes or test methods. Citability is low. What actually supports purchase is over 2,000 reviews at 4.6 stars on Sephora plus salon word of mouth: social proof rather than experimental proof."}, "evidenceStats": {"zh": ["无量化临床数据公开，未见百分比、样本量或测试方法", "Sephora评分4.6，评价数逾2000条（社会证据）", "Kérastase澳洲站评分4.4，73条评价", "支撑逻辑：沙龙专业背书 + 用户口碑 + 品牌历史（1964年创立）", "可引用性：低。做对标资料时只能引用成分与定价，不能引用功效数字"], "en": ["No quantitative clinical data published — no percentages, sample sizes or methods", "4.6 stars with over 2,000 reviews on Sephora (social proof)", "4.4 stars with 73 reviews on the Kérastase Australia site", "Support rests on salon endorsement, user word of mouth and brand history (founded 1964)", "Citability: low. For benchmarking, only ingredients and pricing can be quoted — not efficacy figures"]}, "experience": {"zh": "SLES体系起泡丰富，洗净感明确，与免硫酸盐产品相比冲洗后头皮更清爽。质地为半透明凝胶状。香调为佛手柑、玫瑰、广藿香，是Chronologiste全线统一的香型，留香时间较长，属于品牌重要的使用体验组成。80 mL旅行装的存在说明品牌意识到该价位需要试用门槛。", "en": "The SLES base lathers generously with a clear sense of cleansing; the scalp feels fresher after rinsing than with sulfate-free products. Texture is a translucent gel. The bergamot–rose–patchouli accord runs across the whole Chronologiste line and lingers, forming a significant part of the experience. The existence of an 80 mL travel size shows the brand recognises that this price needs a trial entry point."}, "experienceItems": {"zh": ["泡沫：SLES体系，泡量丰富，洗净感明确", "质地：半透明凝胶状", "香调：佛手柑・玫瑰・广藿香，Chronologiste全线统一，留香明显", "规格设计：80 mL旅行装承担试用入口，500 mL承担复购", "单次成本：250 mL约US$0.19/mL，为本库洗发水中最高"], "en": ["Lather: SLES base, generous foam, clear cleansing feel", "Texture: translucent gel", "Scent: bergamot, rose and patchouli — consistent across Chronologiste and noticeably long-lasting", "Size strategy: the 80 mL travel size is the trial entry, the 500 mL is for repeat purchase", "Unit cost: about US$0.19/mL at 250 mL, the highest of any shampoo in this library"]}, "packaging": {"zh": "深金色瓶身配黑色瓶盖，是Chronologiste线的固定配色，与Kérastase其他线的配色体系区分明确。瓶型为方肩圆柱，重量感强。三档规格（80/250/500 mL）覆盖试用、常规与家庭装，是沙龙渠道的标准规格结构。", "en": "Deep gold bottle with a black cap — the fixed colourway of Chronologiste, clearly separated from Kérastase's other lines. The bottle is a square-shouldered cylinder with a substantial feel. Three sizes (80/250/500 mL) cover trial, standard and household, the standard structure for salon distribution."}, "packagingItems": {"zh": ["配色：深金＋黑，Chronologiste线专属，货架上与其他Kérastase线区分", "瓶型：方肩圆柱，握持有重量感", "规格：80 / 250 / 500 mL 三档，覆盖试用到家庭装", "渠道适配：三档结构是沙龙推荐＋零售复购的标准配置"], "en": ["Colour: deep gold and black, exclusive to Chronologiste and distinct from other Kérastase lines on shelf", "Format: square-shouldered cylinder with a weighty feel", "Sizes: 80 / 250 / 500 mL, from trial to household", "Channel fit: the three-size structure is standard for salon recommendation plus retail repeat"]}, "distribution": {"zh": "全球沙龙专业渠道、Sephora、Ulta、高端百货、品牌官网DTC", "en": "Global salon channel, Sephora, Ulta, prestige department stores and brand DTC"}, "marketChannel": {"zh": {"global": ["沙龙专业渠道（核心）", "Sephora（美国、英国、中东）", "Ulta Beauty", "品牌官网DTC", "Amazon品牌旗舰"], "japan": ["日本为Kérastase重要市场，沙龙渠道成熟", "Chronologiste在日本定位为顶级抗老线"], "channelLabel": "Professional Salon Prestige", "channelDesc": "以发型师推荐建立专业性，再由高端零售承接销量。价格支撑来自渠道结构，不来自成分成本"}, "en": {"global": ["Professional salon channel (core)", "Sephora (US, UK, Middle East)", "Ulta Beauty", "Brand DTC", "Amazon brand store"], "japan": ["Japan is a major Kérastase market with a mature salon channel", "Chronologiste sits as the top-tier anti-ageing line there"], "channelLabel": "Professional Salon Prestige", "channelDesc": "Stylist recommendation builds the professional case and prestige retail carries the volume. The price is supported by channel structure, not ingredient cost"}}, "pricePositioning": {"zh": {"tier": "luxury", "label": "Salon Anti-Ageing Luxury"}, "en": {"tier": "luxury", "label": "Salon Anti-Ageing Luxury"}}, "brandConceptRich": {"zh": {"tagline": "Luxury care for exceptional hair since 1964", "concept": "Kérastase由L'Oréal于1964年创立，把沙龙专业诊断的方法带入家用护发。品牌以「先诊断、后配方」的结构组织产品线，每条线对应一类头发状态。Chronologiste是其中价格最高的一条，把护肤的抗老框架整体移植到头发与头皮。"}, "en": {"tagline": "Luxury care for exceptional hair since 1964", "concept": "Founded by L'Oréal in 1964, Kérastase brought salon diagnostic method into home haircare. The range is organised around diagnosis first, formula second, with each line matched to a hair condition. Chronologiste is the most expensive of them, transplanting the anti-ageing frame of skincare wholesale onto hair and scalp."}}, "competitiveAdvantage": {"zh": [{"name": "OLAPLEX", "points": ["OLAPLEX靠专利分子建立技术壁垒，Kérastase靠沙龙渠道与命名策略建立壁垒", "OLAPLEX有公开的量化数据，Kérastase几乎没有——但价格更高", "OLAPLEX的编号体系驱动交叉销售，Kérastase的分线诊断体系驱动的是客单价"]}, {"name": "Aveda Invati", "points": ["同为沙龙渠道的抗老/密度线，Aveda以植物性与可持续为主要说法", "Aveda公布了具体的减少脱发百分比，Kérastase没有", "Kérastase的香氛与包装质感更强，Aveda的环保定位更明确"]}, {"name": "Shiseido SUBLIMIC（日本）", "points": ["同为集团背景的沙龙专业线，SUBLIMIC以日本沙龙渠道为主战场", "SUBLIMIC按发质细分而非按老化征兆细分，问题框架不同", "价格带低于Chronologiste，在日本市场对Kérastase形成直接竞争"]}], "en": [{"name": "OLAPLEX", "points": ["OLAPLEX builds its barrier on a patented molecule; Kérastase builds it on salon channel and naming", "OLAPLEX publishes quantified data and Kérastase publishes almost none — yet Kérastase costs more", "OLAPLEX's numbering drives cross-sell; Kérastase's diagnostic line structure drives basket size"]}, {"name": "Aveda Invati", "points": ["Also a salon anti-ageing/density line, but built on botanical and sustainability arguments", "Aveda publishes a specific hair-loss reduction figure; Kérastase does not", "Kérastase is stronger on fragrance and packaging feel; Aveda is clearer on environmental positioning"]}, {"name": "Shiseido SUBLIMIC (Japan)", "points": ["Another group-backed salon professional line, fighting mainly in the Japanese salon channel", "SUBLIMIC segments by hair type rather than by signs of ageing — a different problem frame", "Priced below Chronologiste and a direct competitor to Kérastase in Japan"]}]}, "insight": {"zh": "Chronologiste最值得研究的是「五个可见老化征兆」这个框架。它把光泽、密度、强度这些分散且难以量化的问题整合成一个可命名、可计数的清单，消费者不需要理解任何机理，只要在五项里认领自己的问题就完成了说服。框架本身不涉及配方，因此不需要专利保护，也不需要临床数据。\n\n配方层面反而暴露了这条线的真实结构：US$48的产品仍用SLES做主洗净剂，而US$10.99的CeraVe是免硫酸盐。这说明溢价来自沙龙背书与命名策略（Abyssine是可采购原料Alteromonas Ferment Extract），不来自原料成本。\n\n对我们的启发是命名策略这条路径——用专属命名建立独占感，成本远低于分子专利，且不受专利到期影响。但要成立的前提是有渠道背书支撑，纯电商品牌单靠命名撑不起这个价格带。", "en": "The part of Chronologiste worth studying is the “five visible signs of ageing” frame. It gathers shine, density and strength — scattered, hard-to-quantify problems — into one nameable, countable list. The shopper needs no mechanism, only to recognise their own problem among the five, and the persuasion is done. The frame touches no formula, so it needs neither patent protection nor clinical data.\n\nThe formula in fact exposes the real structure of the line: a US$48 product still uses SLES as its main surfactant while the US$10.99 CeraVe is sulfate-free. The premium comes from salon endorsement and naming — Abyssine is the purchasable raw material Alteromonas ferment extract — not from raw material cost.\n\nThe transferable lesson is the naming route: proprietary naming creates a sense of exclusivity at far lower cost than a molecular patent, and it never expires. It only works with channel endorsement behind it, though — a pure e-commerce brand cannot hold this price band on naming alone."}, "notes": {"zh": "资料采集日 2026-07-31。美国官网价格为US$23/48/73三档，英国250 mL为£33.50。Sephora US常有5%订阅折扣（US$45.60）。", "en": "Researched 2026-07-31. US site lists US$23/48/73; the UK 250 mL is £33.50. Sephora US commonly shows a 5% subscription price of US$45.60."}},{"id": "unove-deep-damage-ex", "category": "korea", "productType": "mask", "addedAt": 22, "name": {"zh": "UNOVE Deep Damage Treatment EX", "en": "UNOVE Deep Damage Treatment EX"}, "brand": {"zh": "UNOVE（어노브／анов）", "en": "UNOVE"}, "company": {"zh": "由韩国头皮护理品牌Dr.ForHair的技术开发，UNOVE为其损伤护理专线", "en": "Developed on the technology of Korean scalp-care brand Dr.ForHair; UNOVE is its damage-care line"}, "origin": {"zh": "韩国", "en": "South Korea"}, "launch": {"zh": "Olive Young护发品类2022–2025连续获奖；2025年成为首个进入美国Sephora的韩国护发品牌", "en": "Olive Young haircare award winner 2022–2025; in 2025 became the first Korean haircare brand to enter Sephora US"}, "capacity": {"zh": "40 mL / 207 mL / 320 mL", "en": "40 mL / 207 mL / 320 mL"}, "price": {"zh": "US$11（40 mL）/ US$26（207 mL）/ US$36（320 mL），官方全球商城价", "en": "US$11 (40 mL) / US$26 (207 mL) / US$36 (320 mL) on the official global store"}, "market": {"zh": "韩国Olive Young为核心，日本、美国Sephora、东南亚跨境", "en": "Olive Young in Korea at the core, plus Japan, Sephora US and Southeast Asian cross-border"}, "images": ["https://cdn.shopify.com/s/files/1/0659/4104/5383/files/8103375831175_40ml_1.jpg", "https://cdn.shopify.com/s/files/1/0659/4104/5383/files/8103375831175_40ml_2.jpg", "https://cdn.shopify.com/s/files/1/0659/4104/5383/files/8103375831175_40ml_3.jpg"], "sources": [["UNOVE official global store", "https://www.unoveglobal.com/products/unove-deep-damage-repair-hair-mask"], ["UNOVE brand page", "https://www.unoveglobal.com/pages/about-us"], ["Amazon Japan official store", "https://www.amazon.co.jp/-/en/UNOVE-Damage-Treatment-Rinse-Tender/dp/B0BLT7NY2M"]], "positioning": {"zh": "面向染烫热损伤发质的高浓度蛋白发膜：以30,000 ppm的Keratin-PF为核心数字，配合36种蛋白质与氨基酸，主打「非现实的柔软」这一感官承诺。207 mL售价US$26，单毫升约US$0.13，在韩系发膜中属中高价位。产品在韩国由Olive Young渠道建立起量，再以「韩国销量第一」的身份进入海外。", "en": "A high-concentration protein mask for heat- and chemically-damaged hair. Keratin-PF at 30,000 ppm is the headline number, backed by 36 proteins and amino acids, and the promise is sensory: “surreal softness.” At US$26 for 207 mL, about US$0.13 per mL, it sits mid-to-upper in the Korean mask field. Volume was built through Olive Young in Korea, then exported on the strength of a number-one-in-Korea claim."}, "target": {"zh": "频繁染烫、使用热工具的受损发人群；追求即时柔顺手感的消费者", "en": "Frequently coloured, permed and heat-styled damaged hair; consumers chasing immediate softness"}, "targetUsers": {"zh": ["频繁染发、烫发的重度受损发", "每日使用吹风机与直发夹板的人群", "追求洗后立刻能感知柔顺变化的消费者", "关注K-beauty话题、通过Olive Young或Sephora接触品牌的用户"], "en": ["Heavily damaged hair from frequent colouring and perming", "Daily blow-dryer and flat-iron users", "Consumers who want a softness change they can feel immediately after rinsing", "K-beauty followers who meet the brand at Olive Young or Sephora"]}, "keyClaims": {"zh": ["Keratin-PF 高浓度30,000 ppm", "36种蛋白质与营养成分", "DeepCore™ Bond Technology", "减少高温造成的损伤", "专业调香打造的花香调"], "en": ["Keratin-PF at a high concentration of 30,000 ppm", "36 proteins and nutritional ingredients", "DeepCore™ Bond Technology", "Reduces damage caused by high heat", "A floral accord refined through expert perfumery"]}, "ingredients": {"zh": "配方骨架为Water、Glycerin、Dimethicone、Cetyl Alcohol、Behentrimonium Chloride、Cetearyl Alcohol——即高级脂肪醇加阳离子表面活性剂加硅油的经典重型调理体系，冲洗后的顺滑感主要由这一层贡献。功效层为水解角蛋白（Keratin-PF）、水解胶原蛋白、水解丝蛋白、丝氨基酸，以及丝氨酸、天冬氨酸、丙氨酸、组氨酸、精氨酸、苏氨酸等游离氨基酸，另配泛醇与摩洛哥坚果油、橄榄果油、澳洲坚果油。品牌宣称的「36种蛋白质与营养成分」即由上述水解蛋白与氨基酸合计而来。", "en": "The backbone is water, glycerin, dimethicone, cetyl alcohol, behentrimonium chloride and cetearyl alcohol — the classic heavy conditioning system of fatty alcohols, a cationic surfactant and silicone. Most of the post-rinse slip comes from this layer. The functional layer is hydrolysed keratin (Keratin-PF), hydrolysed collagen, hydrolysed silk and silk amino acids, plus free amino acids including serine, aspartic acid, alanine, histidine, arginine and threonine, with panthenol and argan, olive and macadamia oils. The claimed “36 proteins and nutritional ingredients” is the sum of these hydrolysates and amino acids."}, "ingredientsNote": {"zh": "需要区分两件事：30,000 ppm即3%的水解角蛋白，在发膜类产品中确实是较高的添加量；但使用时感受到的柔顺，主要来自Behentrimonium Chloride与Dimethicone构成的调理层，而非角蛋白。把感官结果直接归因于角蛋白浓度，是这个产品说服结构中最需要留意的一处。", "en": "Two things need separating. Thirty thousand ppm is 3% hydrolysed keratin, which is genuinely high for a mask. But the softness users feel comes mainly from the conditioning layer of behentrimonium chloride and dimethicone, not from the keratin. Attributing the sensory result directly to keratin concentration is the part of this product's persuasion structure that most needs watching."}, "heroIngredients": {"zh": [{"name": "Keratin-PF 30,000 ppm", "tag": "核心数字", "desc": "水解角蛋白，30,000 ppm即3%。以ppm为单位表述是这个品牌的标志性做法——数字看起来比「3%」大得多，说服力更强。"}, {"name": "Behentrimonium Chloride", "tag": "实际手感来源", "desc": "长链阳离子表面活性剂，是发膜柔顺感的主要贡献者。虽然不在宣传前排，但在成分表中位置靠前。"}, {"name": "水解胶原蛋白・水解丝蛋白・丝氨基酸", "tag": "蛋白组合", "desc": "与角蛋白共同构成「36种蛋白质」的计数基础。不同分子量的蛋白覆盖发丝表面与皮质层不同位置。"}, {"name": "摩洛哥坚果油・橄榄果油・澳洲坚果油", "tag": "油脂层", "desc": "提供封闭性与光泽，同时支撑「营养」的整体表达。"}], "en": [{"name": "Keratin-PF at 30,000 ppm", "tag": "Headline number", "desc": "Hydrolysed keratin; 30,000 ppm is 3%. Expressing it in ppm is this brand's signature move — the number looks far larger than “3%” and reads as more convincing."}, {"name": "Behentrimonium chloride", "tag": "Where the feel comes from", "desc": "A long-chain cationic surfactant and the main contributor to the mask's slip. It is not in the front row of the marketing but it is high in the INCI list."}, {"name": "Hydrolysed collagen, hydrolysed silk, silk amino acids", "tag": "Protein set", "desc": "Together with keratin these form the count behind “36 proteins.” Different molecular weights address different positions on the surface and in the cortex."}, {"name": "Argan, olive and macadamia oils", "tag": "Lipid layer", "desc": "Provide occlusion and shine while supporting the overall nourishment message."}]}, "keyTechnology": {"zh": [{"title": "ppm单位的数字表达", "desc": "3%的水解角蛋白写成30,000 ppm。同一个事实，后者在货架和详情页上的视觉冲击远大于前者。这是最低成本的差异化手法之一，不需要任何配方改动。"}, {"title": "DeepCore™ Bond Technology", "desc": "品牌命名的技术体系，用于对接近年来的键结护理话题。与OLAPLEX的专利分子不同，这是一个命名而非专利，具体机理未公开。"}, {"title": "成分种类计数（36种）", "desc": "把水解蛋白与游离氨基酸合并计数，形成一个具体的数字。计数式表达在韩系产品中很常见，其作用是把「成分丰富」这一模糊印象转化为可记忆的数字。"}, {"title": "渠道排名转化为品牌资产", "desc": "Olive Young护发品类2022–2025连续获奖，被转化为「韩国销量第一」的对外表述，成为进入海外市场时的主要背书。"}], "en": [{"title": "Expressing concentration in ppm", "desc": "Three percent hydrolysed keratin written as 30,000 ppm. Same fact, but the second version lands far harder on a shelf or a product page. It is one of the cheapest differentiation moves available and requires no formula change."}, {"title": "DeepCore™ Bond Technology", "desc": "A brand-named technology system that connects the product to the bond-care conversation. Unlike OLAPLEX's patented molecule this is a name rather than a patent, and the mechanism is not disclosed."}, {"title": "Counting ingredient types (36)", "desc": "Hydrolysates and free amino acids are counted together to produce one concrete number. Count-based expression is common in Korean products; it converts the vague impression of a rich formula into something memorable."}, {"title": "Turning a channel ranking into a brand asset", "desc": "Winning the Olive Young haircare category from 2022 to 2025 is converted into a “number one in Korea” statement, and that becomes the main endorsement when entering overseas markets."}]}, "evidence": {"zh": "可验证的是浓度数字（30,000 ppm）与渠道奖项（Olive Young 2022–2025），二者都属于可查证的事实。但没有公开的临床或仪器测试数据支撑「减少高温损伤」这一功效宣称，也未见断裂强度、光泽度等常见指标。DeepCore™ Bond Technology未公开机理。此外，Reddit上有用户报告长期使用后头发变干、变脆，与品牌宣称方向相反——蛋白类产品在缺少足够油脂平衡时确实可能导致这一结果，属于品类内的已知风险。", "en": "The concentration figure (30,000 ppm) and the channel awards (Olive Young 2022–2025) are both verifiable facts. But there is no published clinical or instrumental data behind the heat-damage claim, and no breakage-strength or shine measurements. The mechanism of DeepCore™ Bond Technology is undisclosed. Separately, Reddit users report hair becoming dry and brittle after prolonged use — the opposite of the claim. Protein products without enough lipid balance genuinely can produce that outcome; it is a known risk within the category."}, "evidenceStats": {"zh": ["Keratin-PF 30,000 ppm（＝3%），可验证的浓度表述", "36种蛋白质与营养成分（计数式表达，非功效数据）", "Olive Young护发品类2022–2025连续获奖（渠道事实）", "2025年首个进入美国Sephora的韩国护发品牌（渠道事实）", "无临床数据、无仪器测试、DeepCore™机理未公开", "用户端反向反馈：长期使用后干燥脆化的报告（蛋白过量风险）"], "en": ["Keratin-PF at 30,000 ppm (= 3%), a verifiable concentration statement", "36 proteins and nutritional ingredients (a count, not efficacy data)", "Olive Young haircare category winner 2022–2025 (channel fact)", "First Korean haircare brand into Sephora US in 2025 (channel fact)", "No clinical data, no instrumental testing, DeepCore™ mechanism undisclosed", "Counter-signal from users: reports of dryness and brittleness after prolonged use (protein overload risk)"]}, "experience": {"zh": "质地厚重，接近护发素与发膜之间，取用需要一定量。涂抹后停留数分钟冲洗，洗后即时柔顺感明显，这是产品口碑的主要来源。香型为花香调，品牌以「专业调香」作为宣传点之一，另有Tender Bloom、Warm Petal等香型分支。40 mL小规格的存在覆盖了旅行与试用场景。需要注意的是，高蛋白配方不适合每次洗发都使用，建议与保湿型产品交替。", "en": "Thick texture, between a conditioner and a mask, and it takes a decent amount per use. Left on for a few minutes then rinsed, it delivers an immediate softness that is the main source of its word of mouth. The scent is floral, with the brand advertising expert perfumery and offering variants such as Tender Bloom and Warm Petal. The 40 mL size covers travel and trial. Worth noting: a high-protein formula is not for every wash and is better alternated with a moisture-led product."}, "experienceItems": {"zh": ["质地：厚重，介于护发素与发膜之间，单次用量较大", "即时效果：冲洗后柔顺感明显，是口碑的主要来源", "香型：花香调，Tender Bloom、Warm Petal等分支", "规格：40 / 207 / 320 mL，小规格覆盖试用", "使用注意：高蛋白配方不宜每次洗发使用，建议与保湿型产品交替"], "en": ["Texture: thick, between conditioner and mask, needs a generous dose", "Immediate effect: clear softness after rinsing — the source of its word of mouth", "Scent: floral, with Tender Bloom and Warm Petal variants", "Sizes: 40 / 207 / 320 mL, with the small size covering trial", "Caution: a high-protein formula is not for every wash and is better alternated with a moisture product"]}, "packaging": {"zh": "软管与罐装两种形态随规格变化，配色随香型分支变化。视觉上强调「30,000 ppm」这一数字，包装正面即以数字作为主视觉元素之一，这与欧美同类产品把成分名放在正面的做法不同——数字比成分名更容易跨语言传达。", "en": "Tube or jar depending on size, with colour keyed to the fragrance variant. The visual design puts “30,000 ppm” on the front as a primary element — different from Western equivalents, which usually front the ingredient name. A number travels across languages more easily than an ingredient does."}, "packagingItems": {"zh": ["形态：软管与罐装随规格变化", "主视觉：正面直接放「30,000 ppm」数字，而非成分名", "配色：随香型分支变化，货架上以色块区分", "跨语言考量：数字比成分名更易跨市场传达，利于出海"], "en": ["Format: tube or jar depending on size", "Front-of-pack: the number “30,000 ppm” rather than an ingredient name", "Colour: keyed to fragrance variant, SKUs read as colour blocks on shelf", "Cross-language design: a number carries across markets more easily than an ingredient name, which helps export"]}, "distribution": {"zh": "Olive Young（韩国核心）、Sephora美国、Amazon日本官方店、Watsons东南亚、跨境电商", "en": "Olive Young (core in Korea), Sephora US, official Amazon Japan store, Watsons in Southeast Asia and cross-border e-commerce"}, "marketChannel": {"zh": {"global": ["Olive Young（韩国，核心渠道）", "Sephora美国（2025年进入，韩国护发品牌首例）", "Watsons东南亚", "品牌官方全球商城"], "japan": ["Amazon日本官方店为主要渠道，207 mL约¥2,399–2,630", "日本市场以「韩国销量第一」与柔顺手感为主要卖点"], "channelLabel": "K-Beauty Channel Champion", "channelDesc": "先在Olive Young单一渠道做到品类第一，再把渠道排名转化为出海时的品牌背书"}, "en": {"global": ["Olive Young (Korea, core channel)", "Sephora US (entered 2025, the first Korean haircare brand)", "Watsons in Southeast Asia", "Official global brand store"], "japan": ["The official Amazon Japan store is the main channel; 207 mL runs about ¥2,399–2,630", "Japan sells on the number-one-in-Korea claim and on softness"], "channelLabel": "K-Beauty Channel Champion", "channelDesc": "Become category number one inside a single channel — Olive Young — then convert that ranking into brand endorsement for export"}}, "pricePositioning": {"zh": {"tier": "masstige", "label": "K-Beauty Protein Mask"}, "en": {"tier": "masstige", "label": "K-Beauty Protein Mask"}}, "brandConceptRich": {"zh": {"tagline": "Surreal softness", "concept": "UNOVE由韩国头皮护理品牌Dr.ForHair的技术孵化，专注损伤发护理。品牌把「非现实的柔软」作为唯一的核心承诺，所有产品线都围绕这一个感官目标组织，不做多方向诉求。2022年起连续获得Olive Young护发品类奖项，2025年成为首个进入美国Sephora的韩国护发品牌。"}, "en": {"tagline": "Surreal softness", "concept": "UNOVE was incubated on the technology of Korean scalp-care brand Dr.ForHair and focuses on damaged hair. The brand holds a single core promise — surreal softness — and organises every line around that one sensory goal rather than spreading across claims. It has won the Olive Young haircare category since 2022 and in 2025 became the first Korean haircare brand to enter Sephora US."}}, "competitiveAdvantage": {"zh": [{"name": "OLAPLEX Nº.3 / Nº.8", "points": ["OLAPLEX有专利分子与公开数据，UNOVE有渠道排名与浓度数字", "OLAPLEX强调结构性修复，UNOVE强调即时柔顺手感，说服路径完全不同", "UNOVE价格更低、用量更慷慨，OLAPLEX单价高但技术背书强"]}, {"name": "K18", "points": ["K18主打4分钟见效与肽技术，UNOVE主打高浓度与感官", "K18有第三方可查的分子研究，UNOVE的DeepCore™未公开机理", "K18定位专业沙龙，UNOVE定位大众药妆渠道"]}, {"name": "Mise en Scène Perfect Serum系列", "points": ["同为韩系损伤护理，Mise en Scène以免洗精华起家", "UNOVE在冲洗型发膜的浓度表达上更激进", "Mise en Scène有爱茉莉太平洋支撑，UNOVE靠Olive Young单渠道打穿"]}], "en": [{"name": "OLAPLEX Nº.3 / Nº.8", "points": ["OLAPLEX has a patented molecule and published data; UNOVE has a channel ranking and a concentration number", "OLAPLEX argues structural repair, UNOVE argues immediate softness — entirely different persuasion routes", "UNOVE is cheaper and more generous per use; OLAPLEX costs more but carries stronger technical endorsement"]}, {"name": "K18", "points": ["K18 leads on four-minute results and peptide technology; UNOVE leads on concentration and feel", "K18's molecular research is checkable by third parties; UNOVE's DeepCore™ mechanism is undisclosed", "K18 is positioned in professional salons, UNOVE in mass drugstore channels"]}, {"name": "Mise en Scène Perfect Serum range", "points": ["Also Korean damage care, but Mise en Scène was built on leave-in serums", "UNOVE is more aggressive about concentration claims in rinse-off masks", "Mise en Scène has Amorepacific behind it; UNOVE broke through on a single channel"]}]}, "insight": {"zh": "UNOVE最值得学习的是单位选择。3%的水解角蛋白写成30,000 ppm，事实完全相同，但后者在包装正面的视觉冲击大得多，且数字比成分名更容易跨语言传达——这一点直接支撑了品牌出海。改一个单位，零配方成本，零合规风险。\n\n第二点是渠道策略。UNOVE没有铺开渠道，而是在Olive Young一个渠道内做到品类第一，再把「韩国销量第一」这个排名转化为进入Sephora和日本市场时的背书。对预算有限的品牌来说，单渠道做深比多渠道做浅更能积累可对外表述的资产。\n\n需要警惕的是感
