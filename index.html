midity-resistance claim","Cantu has larger retail scale and brand awareness"]}]},"evidenceStats": {"zh": ["宣称基于品牌自述的pH平衡配方与聚合物技术","未见独立第三方临床或仪器测试数据公开","获多项行业奖项认可（官网列为award-winning）"],"en": ["Claims based on the brand's own pH-balanced formula and polymer technology description","No independent third-party clinical or instrumental data publicly disclosed","Recognized with multiple industry awards (listed as award-winning on the official site)"]},"experienceItems": {"zh": ["质地：轻盈泡沫，无结块无白屑","用法：卷发湿发大量涂抹，直发边缘少量使用","风干/吹干：均适用","叠加：可与凝胶叠加增强定型力"],"en": ["Texture: lightweight foam, no crunch or flaking","Usage: liberal on damp curly hair; small amount on edges for sleek styles","Drying: works air-dried or blow-dried","Layering: can be layered over gels for extra hold"]},"packagingItems": {"zh": ["视觉：黑白撞色瓶身，品牌名突出","联想：年轻、街头文化、技术感","规格：7oz正装/3.4oz旅行装","优势：黑人及退伍军人创立故事强化品牌认同"],"en": ["Visual: black-and-white bottle with bold branding","Association: youthful, street-culture, tech-forward","Sizes: 7oz full size / 3.4oz travel size","Strength: Black- and Veteran-owned story reinforces brand identity"]},"productType": "gel","keyTechnology": {"zh": [{"title": "灵活定型聚合物技术","desc": "特定聚合物组合实现定型效果的同时避免僵硬结块感。"},{"title": "沙龙师共创研发流程","desc": "配方研发过程中直接采纳一线沙龙从业者的实操反馈。"}],"en": [{"title": "Flexible-Hold Polymer Technology","desc": "A specific polymer blend delivers hold while avoiding the stiff, crunchy finish of older formulas."},{"title": "Stylist Co-Development Process","desc": "Formulation development incorporates direct, hands-on feedback from working salon stylists."}]},"addedAt": 11},{"id": "ufd-curlymagic","category": "usa","name": {"zh": "Uncle Funky's Daughter Curly Magic","en": "Uncle Funky's Daughter Curly Magic"},"brand": {"zh": "Uncle Funky's Daughter","en": "Uncle Funky's Daughter"},"company": {"zh": "Uncle Funky's Daughter","en": "Uncle Funky's Daughter"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌经典长青单品，配方历经调整后回归原版","en": "A long-standing brand classic; formula was reverted back to the original after a period of reformulation"},"market": {"zh": "Target、Sally Beauty、品牌官网及美国天然发社群渠道","en": "Target, Sally Beauty, brand website and US natural-hair community retail"},"capacity": {"zh": "18 fl oz / 532 mL（另有12oz、32oz等规格）","en": "18 fl oz / 532 mL (also available in 12oz, 32oz)"},"price": {"zh": "约US$26.99","en": "~US$26.99"},"positioning": {"zh": "芦荟基底的卷发刺激剂定型啫喱，专为湿发时卷曲、干发后毛躁扁塌的发质设计，主打唤醒你本来的卷度。","en": "An aloe-based curl stimulator styling gel designed for hair that curls when wet but frizzes/falls flat when dry, positioned around activating the curl pattern you already have."},"target": {"zh": "3a-4c卷发/纹理发人群，尤其是Wash-and-Go造型爱好者与天然发社群成员；追求配方多年不变的忠实回头客。","en": "3a-4c curly/textured hair, especially wash-and-go stylers and natural-hair community members; loyal repeat buyers who value formula consistency over the years."},"ingredients": {"zh": "水、甘油、芦荟叶汁、荷荷巴籽油、水解小麦蛋白、蜀葵根提取物、荨麻提取物、木贼（问荆）提取物、维生素E、苯氧乙醇、乙基己基甘油、香精。","en": "Water, glycerin, aloe vera leaf juice, jojoba seed oil, hydrolyzed wheat protein, marshmallow root extract, nettle extract, horsetail extract, vitamin E, phenoxyethanol, ethylhexylglycerin, fragrance."},"evidence": {"zh": "宣称主要基于成分传统功效描述（芦荟舒缓、木贼强健、荨麻刺激头皮）与长期消费者口碑，未见公开的独立临床测试数据。","en": "Claims rest mainly on traditional ingredient-function descriptions (soothing aloe, strengthening horsetail, scalp-stimulating nettle) and long-standing consumer word-of-mouth; no public independent clinical data found."},"experience": {"zh": "啫喱质地，湿发涂抹后手指梳理定型，风干或用扩散器吹干；官方建议可与同品牌Supercurl、Extra Butter等叠加使用以增强保湿。","en": "Gel texture, applied to wet hair and finger-styled, then air-dried or diffused; the brand recommends layering with its own Supercurl or Extra Butter for extra moisture."},"packaging": {"zh": "塑料泵头瓶，简洁功能性标签设计，走天然发社群熟悉的平价日常路线，而非精品化视觉。","en": "A plastic pump bottle with a simple, functional label, the familiar everyday look of the natural-hair community rather than a prestige aesthetic."},"insight": {"zh": "Curly Magic的案例说明：天然发社群对配方一致性极度敏感，品牌曾调整配方引发用户强烈反弹，最终回归原版才挽回忠诚度，这是社群驱动型品牌管理产品变更时的重要警示。","en": "The Curly Magic case shows how sensitive the natural-hair community is to formula consistency, a past reformulation triggered strong backlash, and only reverting to the original formula restored loyalty. A cautionary example for community-driven brands managing product changes."},"notes": {"zh": "","en": ""},"images": ["https://unclefunkysdaughter.store/cdn/shop/files/Untitled_design_61.png?v=1782416676","https://unclefunkysdaughter.store/cdn/shop/files/1_414137fc-38e7-4f80-b707-e2131990a49b.png?v=1782413860","https://unclefunkysdaughter.store/cdn/shop/files/2_736ad88e-62e7-48d0-9569-ff9f5a38cecb.png?v=1782413874"],"sources": [["Ingredients (INCIDecoder)","https://incidecoder.com/products/uncle-funkys-daughter-curly-magic-curl-stimulator"],["Retail listing (Shopify store)","https://unclefunkysdaughter.store/products/curly-magic"]],"targetUsers": {"zh": ["3a-4c卷发/纹理发人群","Wash-and-Go造型爱好者","天然发社群资深用户","偏好芦荟基底、成分透明配方的消费者"],"en": ["3a-4c curly/textured hair","Wash-and-go styling enthusiasts","Long-time natural-hair community members","Consumers who prefer aloe-based, transparent formulas"]},"keyClaims": {"zh": ["唤醒天然卷度，减少毛躁","芦荟+蜀葵根+荨麻+木贼草本组合","坚牢定型不结块","官方明确建议叠加使用增强保湿"],"en": ["Activates natural curl pattern, reduces frizz","Aloe + marshmallow root + nettle + horsetail herbal blend","Firm hold without crunch","Brand explicitly recommends layering for extra moisture"]},"heroIngredients": {"zh": [{"name": "有机芦荟叶汁","tag": "舒缓保湿","desc": "缓解头皮问题并保湿定型"},{"name": "荨麻+木贼提取物","tag": "强健刺激","desc": "荨麻促进头皮活力、木贼强健脆弱发丝"}],"en": [{"name": "Organic Aloe Vera Leaf Juice","tag": "Soothing & moisturizing","desc": "Soothes the scalp while providing hold and hydration"},{"name": "Nettle + Horsetail Extract","tag": "Stimulating & strengthening","desc": "Nettle supports scalp vitality; horsetail strengthens weak, brittle strands"}]},"ingredientsNote": {"zh": "配方还含水解小麦蛋白（增强梳理顺滑度）与荷荷巴籽油（轻质保湿），维生素E作为抗氧化辅助成分。","en": "The formula also includes hydrolyzed wheat protein (for smoother detangling) and jojoba seed oil (lightweight moisture), with vitamin E as a supporting antioxidant."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Community Staple"},"en": {"tier": "mass","label": "Mass Community Staple"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "美国大众零售与美妆用品店为核心渠道"},"en": {"global": ["Brand website","Amazon"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "Core distribution via US mass retail and beauty supply stores"}},"brandConceptRich": {"zh": {"tagline": "激活你的卷发，而非重塑它。","concept": "靠天然发社区数十年的信任积累而非广告投放成长起来，Uncle Funky's Daughter的配方理念是增强你原本的卷发纹理。"},"en": {"tagline": "Activate your curl, don't reshape it.","concept": "Grown through decades of trust inside the natural-hair community rather than advertising, Uncle Funky's Daughter formulates to enhance the curl pattern you already have."}},"competitiveAdvantage": {"zh": [{"name": "Kinky-Curly Curling Custard","points": ["更强调刺激唤醒卷度而非单纯定型剂","官网/社群渠道认知度接近，直接竞争","价格带略高于Curling Custard"]},{"name": "Eco Style Gel","points": ["草本组合叙事更丰富，非单一芦荟","品牌走精品天然发定位而非纯平价","持牢度定位与Eco Style有细分差异"]},{"name": "DevaCurl B'Leave-In","points": ["价格显著更亲民","渠道更依赖美妆用品店而非沙龙专柜","品牌历史与社群忠诚度不及DevaCurl悠久"]}],"en": [{"name": "Kinky-Curly Curling Custard","points": ["Emphasizes activating the curl rather than just holding it","Similar community/online recognition, direct competitor","Slightly higher price than Curling Custard"]},{"name": "Eco Style Gel","points": ["Richer herbal-blend narrative vs. a single aloe story","Positioned as boutique natural rather than pure mass value","Distinct hold-level positioning vs. Eco Style"]},{"name": "DevaCurl B'Leave-In","points": ["Notably more accessible pricing","Relies more on beauty supply stores than salon channels","Shorter brand history and community loyalty than DevaCurl"]}]},"evidenceStats": {"zh": ["宣称主要基于草本成分传统功效描述","未见独立第三方临床或仪器测试数据","支撑逻辑：长期社群口碑与配方一致性忠诚度"],"en": ["Claims rest mainly on traditional herbal-ingredient function descriptions","No independent third-party clinical or instrumental data found","Support logic: long-standing community word-of-mouth and loyalty to formula consistency"]},"experienceItems": {"zh": ["质地：果冻状定型啫喱","用法：湿发涂抹，手指梳理刺激卷度","风干：可自然晾干或用扩散器","叠加：官方建议搭配Supercurl/Extra Butter使用"],"en": ["Texture: jelly-like styling gel","Usage: apply to wet hair, finger-comb to stimulate curls","Drying: air dry or diffuse","Layering: brand recommends pairing with Supercurl/Extra Butter"]},"packagingItems": {"zh": ["视觉：塑料泵头瓶，简洁功能性标签","联想：天然发社群熟悉的日常平价感","规格：12oz/18oz/32oz多种家用装","优势：长期在售形成强社群信任资产"],"en": ["Visual: plastic pump bottle, simple functional label","Association: familiar everyday, affordable feel for the natural-hair community","Sizes: 12oz/18oz/32oz household sizes","Strength: long tenure has built strong community trust as a brand asset"]},"productType": "gel","keyTechnology": {"zh": [{"title": "草本活化配方技术","desc": "以特定植萃活性成分组合，目标是激活而非改变原本的卷发纹理。"},{"title": "社区反馈驱动的配方迭代","desc": "曾因社区反弹撤回成分改动，形成持续倾听社区的迭代机制。"}],"en": [{"title": "Herbal Activator Formulation","desc": "A specific blend of botanical actives designed to activate, not override, the curl pattern you already have."},{"title": "Community Feedback-Driven Reformulation","desc": "Has reversed ingredient changes in response to community backlash, forming an ongoing feedback loop."}]},"addedAt": 9},{"id": "ouai-detox","category": "usa","name": {"zh": "OUAI Detox Clarifying Hair Shampoo","en": "OUAI Detox Clarifying Hair Shampoo"},"brand": {"zh": "OUAI","en": "OUAI"},"company": {"zh": "OUAI（创始人Jen Atkin，2022年1月被宝洁P&G收购）","en": "OUAI (founded by Jen Atkin; acquired by Procter & Gamble in Jan 2022)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌2016年创立；本品自2020年起在售，为长青畅销单品","en": "Brand founded 2016; this SKU has been on sale since 2020 and is an evergreen bestseller"},"market": {"zh": "DTC官网 + Sephora + Ulta；四种规格（3/10/16/32 oz）覆盖试用到家庭补充装","en": "DTC + Sephora + Ulta; four sizes (3/10/16/32 oz) spanning trial to household refill"},"capacity": {"zh": "295 mL / 10 fl oz（另有89 mL旅行装、473 mL大装、946 mL补充装）","en": "295 mL / 10 fl oz (also 3 oz travel, 16 oz jumbo, 32 oz refill)"},"price": {"zh": "US$34（正装）/ US$16（旅行装）；订阅立减10%","en": "US$34 full size / US$16 travel; 10% off with subscription"},"positioning": {"zh": "以苹果醋为叙事核心的高端清洁洗发水，定位为「每周一次的重置」而非日常洗发水：面向频繁使用干洗喷雾、造型品堆积、硬水地区的都市消费者，主打去除残留同时靠水解角蛋白保留强韧感。","en": "A prestige clarifying shampoo built around an apple-cider-vinegar story, positioned as a weekly reset rather than a daily wash: aimed at urban consumers heavy on dry shampoo, styling buildup and hard water, promising to strip residue while hydrolyzed keratin keeps hair feeling strong."},"target": {"zh": "频繁使用干洗喷雾和造型品的都市消费者；硬水地区居民；头皮易出油、发丝暗沉的人群；被名人造型师背书吸引的年轻女性。","en": "City consumers who lean on dry shampoo and styling products; people in hard-water areas; oily scalps and dull-looking hair; younger women drawn in by celebrity-stylist credibility."},"ingredients": {"zh": "清洁体系为Sodium C14-16 Olefin Sulfonate（主表活）＋Sodium Lauroyl Methyl Isethionate＋Cocamidopropyl Betaine＋Decyl Glucoside的复配，属中强清洁；含Vinegar（醋）承接「苹果醋」叙事，Hydrolyzed Keratin提供修护感，另有甘油、Polyquaternium-7调理。含香精（芳樟醇、香茅醇）与三种色素（Red 4 / Yellow 5 / Green 5）。标榜无Paraben、无邻苯二甲酸盐、无SLS/SLES、无麸质、不做动物实验。","en": "A medium-strong cleansing system of Sodium C14-16 Olefin Sulfonate (primary surfactant) with Sodium Lauroyl Methyl Isethionate, Cocamidopropyl Betaine and Decyl Glucoside. 'Vinegar' appears on the INCI to carry the apple-cider-vinegar story, with Hydrolyzed Keratin for a repair cue plus glycerin and Polyquaternium-7 for conditioning. Fragranced (linalool, citronellol) and dyed with three colorants (Red 4 / Yellow 5 / Green 5). Marketed as paraben-, phthalate-, SLS/SLES- and gluten-free, cruelty-free."},"evidence": {"zh": "官方页面未列出量化临床数据，宣称层级以功能描述为主（去除污垢、油脂、造型品残留与硬水沉积）。品牌反而用使用频次指引替代数据：干性发质建议每周1次起步，油性发质可1-2次/周。属于「用法建议＋感官承诺」而非循证叙事。","en": "The official page publishes no quantified clinical data; claims stay descriptive (removes dirt, oil, product buildup and hard-water deposits). Instead of data the brand offers frequency guidance — start at once a week for dry hair, 1-2x weekly for oily hair. This is a usage-guidance-plus-sensory promise rather than an evidence-led story."},"experience": {"zh": "浓缩配方，一元硬币大小即可起泡；用法要求涂抹于头皮后停留1-3分钟再冲洗，最后冷水冲洗闭合毛鳞片。香型为Melrose Place（香槟、粉胡椒、荔枝＋牡丹玫瑰＋琥珀檀香），香气是OUAI最被讨论的记忆点之一。","en": "A concentrated formula that lathers from a quarter-sized amount; instructions call for applying at the scalp, leaving on 1-3 minutes, then a cold-water rinse to close the cuticle. Scented in Melrose Place (champagne, pink peppercorn, lychee over peony and rose, on amber and sandalwood) — the fragrance is one of the most-discussed things about OUAI."},"packaging": {"zh": "绿色半透明瓶身与极简无衬线字体，是货架上高辨识度的品牌资产；瓶身标注可完全回收。四规格阶梯（3/10/16/32 oz）把试用装与家庭补充装同时纳入，补充装是环保叙事与客单价的双重抓手。","en": "A green translucent bottle with minimal sans-serif type — a highly recognizable shelf asset — labeled fully recyclable. The four-size ladder (3/10/16/32 oz) covers trial through household refill, with the refill doing double duty as sustainability story and basket-size lever."},"insight": {"zh": "这支产品说明清洁洗发水可以靠「场景频次」而不是「成分强度」来卖：OUAI没有给任何量化数据，却用「干洗喷雾用多了之后的重置」这一具体生活场景，把一个本质上是常规阴离子表活配方的产品卖到US$34。对我们的启示是——清洁类产品的溢价来源正在从配方转向使用仪式与嗅觉记忆；同时也要注意，含合成色素在成分党社群中已成为该产品最常被攻击的点。","en": "This product shows a clarifying shampoo can be sold on occasion and frequency rather than ingredient strength: OUAI publishes no numbers, yet sells what is essentially a conventional anionic surfactant system at US$34 by owning one concrete life moment — the reset after a dry-shampoo binge. The lesson is that premium in the cleansing category is migrating from formula to ritual and scent memory. Worth noting on the risk side: the synthetic colorants are now the single most attacked point among ingredient-literate consumers."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/1043/7322/files/Update_2_DetoxShampoo_260611-17-23_Site_Asset_PDP_Product_Thumbnail_1440x1780_11.jpg?v=1783623478","https://cdn.shopify.com/s/files/1/1043/7322/files/Detox_Shampoo_PDP_Asset_Thumbnail_Hover.jpg?v=1782764654","https://cdn.shopify.com/s/files/1/1043/7322/files/Detox_Shampoo_PDP_Asset_Image_Carousel_4.jpg?v=1782764664"],"sources": [["Official product page","https://theouai.com/products/detox-shampoo"],["Brand story","https://theouai.com/pages/about-us"]],"targetUsers": {"zh": ["频繁使用干洗喷雾/造型品的人群","硬水地区居民","头皮易出油、发丝暗沉者","被名人造型师背书吸引的年轻消费者"],"en": ["Heavy users of dry shampoo and styling products","Residents of hard-water areas","Oily scalps with dull-looking hair","Younger consumers drawn by celebrity-stylist credibility"]},"keyClaims": {"zh": ["深层清除污垢、油脂与造型品残留","去除硬水沉积","苹果醋去角质感清洁","水解角蛋白强韧发丝","无Paraben／邻苯二甲酸盐／SLS·SLES／麸质，不做动物实验"],"en": ["Deeply cleanses dirt, oil and product buildup","Removes hard-water deposits","Apple-cider-vinegar clarifying cleanse","Hydrolyzed keratin to strengthen hair","Free of parabens, phthalates, SLS/SLES and gluten; cruelty-free"]},"heroIngredients": {"zh": [{"name": "Apple Cider Vinegar（Vinegar）","tag": "品类叙事核心","desc": "承担「排毒清洁」的传播主线，INCI中以Vinegar形式出现，位置靠后"},{"name": "Hydrolyzed Keratin","tag": "水解角蛋白","desc": "在强清洁配方中提供「洗完不空」的强韧感，平衡清洁力带来的粗糙印象"},{"name": "Sodium C14-16 Olefin Sulfonate","tag": "主清洁表活","desc": "实际承担清洁力的成分，属中强阴离子表活，是本品「clarifying」定位的技术底层"},{"name": "Polyquaternium-7 / Glycerin","tag": "调理与保湿","desc": "降低强清洁后的涩感，维持梳理性"}],"en": [{"name": "Apple Cider Vinegar (Vinegar)","tag": "Core narrative ingredient","desc": "Carries the whole detox-cleanse story in communication, though it appears well down the INCI as 'Vinegar'"},{"name": "Hydrolyzed Keratin","tag": "Hydrolyzed keratin","desc": "Supplies the 'strong, not stripped' cue that offsets the roughness a strong cleanse can leave"},{"name": "Sodium C14-16 Olefin Sulfonate","tag": "Primary cleansing surfactant","desc": "The ingredient actually doing the cleaning — a medium-strong anionic surfactant and the technical basis of the clarifying claim"},{"name": "Polyquaternium-7 / Glycerin","tag": "Conditioning and humectancy","desc": "Cuts the squeaky drag after a deep cleanse and keeps hair combable"}]},"ingredientsNote": {"zh": "值得注意的是，苹果醋在成分表中位置靠后，主要承担传播功能而非清洁主力；真正的清洁力来自烯烃磺酸盐体系。此外配方含三种合成色素（Red 4 / Yellow 5 / Green 5）来实现绿色瓶内液体的视觉一致性，这在近年成分透明化趋势下是明显的舆情风险点。","en": "Note that the apple cider vinegar sits low on the INCI and functions mainly as communication; the actual cleansing comes from the olefin sulfonate system. The formula also carries three synthetic colorants (Red 4 / Yellow 5 / Green 5) purely to keep the liquid visually on-brand inside the green bottle — an obvious reputational exposure in today's ingredient-transparency climate."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Lifestyle Haircare"},"en": {"tier": "premium","label": "Prestige Lifestyle Haircare"}},"marketChannel": {"zh": {"global": ["品牌DTC官网","Sephora","Ulta Beauty","Amazon"],"japan": ["未正式进入日本市场；主要通过跨境电商与代购"],"channelLabel": "Prestige Retail + DTC","channelDesc": "依托Sephora/Ulta的高端货架，同时用订阅制（立减10%）绑定复购"},"en": {"global": ["Brand DTC","Sephora","Ulta Beauty","Amazon"],"japan": ["No official Japan distribution; reached via cross-border e-commerce and proxy buying"],"channelLabel": "Prestige Retail + DTC","channelDesc": "Sits on prestige shelves at Sephora and Ulta while locking in repeat purchase through a 10%-off subscription"}},"brandConceptRich": {"zh": {"tagline": "给你赢下这一天的自信。","concept": "由为卡戴珊家族做造型的Jen Atkin于2016年创立，OUAI把沙龙级配方翻译成带香水属性的生活方式产品；2022年被宝洁收购后，仍保留创始人主导的语调与嗅觉资产。"},"en": {"tagline": "The confidence to win the day.","concept": "Founded in 2016 by Jen Atkin, the stylist behind the Kardashians, OUAI translates salon-grade formulas into lifestyle products with the sensibility of fine fragrance; acquired by P&G in 2022, it has kept its founder-led voice and scent assets intact."}},"competitiveAdvantage": {"zh": [{"name": "Kérastase Bain Clarifiant","points": ["价格更低、渠道更年轻化，Sephora触达Z世代更直接","嗅觉与包装的生活方式属性更强","缺乏Kérastase的沙龙专业背书与实验室数据"]},{"name": "Briogeo Scalp Revival Charcoal Shampoo","points": ["以苹果醋对位活性炭，叙事同样简明易懂","补充装（32 oz）在环保与客单价上更有优势","Briogeo的「clean beauty」定位更硬，OUAI含合成色素是短板"]},{"name": "Olaplex Nº.4C Bond Maintenance Clarifying Shampoo","points": ["定位为生活方式而非修护科技，客群重叠但购买动机不同","香型体验是明显差异点","缺少键结修护这类可专利化的技术资产"]}],"en": [{"name": "Kérastase Bain Clarifiant","points": ["Lower price and a younger channel mix, reaching Gen Z directly through Sephora","Far stronger lifestyle equity in scent and packaging","Lacks Kérastase's salon-professional endorsement and lab data"]},{"name": "Briogeo Scalp Revival Charcoal Shampoo","points": ["Answers charcoal with apple cider vinegar — an equally legible one-line story","The 32 oz refill wins on both sustainability and basket size","Briogeo's clean-beauty position is stricter; OUAI's synthetic dyes are a weak spot"]},{"name": "Olaplex Nº.4C Bond Maintenance Clarifying Shampoo","points": ["Sells lifestyle rather than repair technology — overlapping shopper, different motivation","Fragrance experience is the clearest point of difference","Has no patentable technology asset comparable to bond repair"]}]},"evidenceStats": {"zh": ["官方未公布量化临床数据，宣称以功能描述为主","替代性指引：干性发质每周1次起步、油性发质1-2次/周","可回收包装（品牌自述）","局限：无第三方测试、无对照组数据公开"],"en": ["No quantified clinical data published; claims remain descriptive","Frequency guidance stands in for data: 1x weekly for dry hair, 1-2x for oily","Fully recyclable packaging (brand statement)","Limitation: no third-party testing or control-group data disclosed"]},"experienceItems": {"zh": ["质地：浓缩型，一元硬币量即可起泡","用法：涂于头皮停留1-3分钟，冷水收尾","香型：Melrose Place（香槟·粉胡椒·荔枝／牡丹·玫瑰／琥珀·檀香）","定位提醒：干性发质需控制频次，避免过度清洁"],"en": ["Texture: concentrated — a quarter-sized amount lathers fully","Usage: apply at the scalp, leave 1-3 minutes, finish with a cold rinse","Scent: Melrose Place (champagne, pink peppercorn, lychee / peony, rose / amber, sandalwood)","Caution: dry hair types should limit frequency to avoid over-cleansing"]},"packagingItems": {"zh": ["视觉：绿色半透明瓶＋极简无衬线字体，货架辨识度高","规格：3 / 10 / 16 / 32 oz 四档，覆盖试用到家庭补充","可持续：标注完全可回收，32 oz补充装承担环保叙事","弱点：为维持瓶内液体色彩使用三种合成色素"],"en": ["Visual: green translucent bottle with minimal sans-serif type, highly shelf-visible","Sizes: 3 / 10 / 16 / 32 oz, from trial to household refill","Sustainability: labeled fully recyclable, with the 32 oz refill carrying the eco story","Weakness: three synthetic colorants used purely to keep the liquid on-brand"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "造型师主导的配方开发","desc": "由一线名人造型师而非实验室主导需求定义，配方目标来自沙龙现场遇到的实际问题（干洗喷雾残留、造型品堆积）。"},{"title": "香水级嗅觉开发流程","desc": "香型按前中后调的香水结构开发并单独命名（Melrose Place等），香气作为独立品牌资产跨品类复用到身体护理与家居香氛。"},{"title": "规格阶梯与订阅制留存设计","desc": "用四档规格＋订阅立减10%把「每周一次」的低频使用场景转化为可预测的复购模型。"}],"en": [{"title": "Stylist-Led Formulation Briefing","desc": "Requirements are defined by a working celebrity stylist rather than a lab, so formula targets come from problems seen on the salon floor — dry-shampoo residue, styling buildup."},{"title": "Fragrance-Grade Scent Development","desc": "Scents are built with a top/heart/base structure, individually named (Melrose Place and others), and reused across body care and home fragrance as standalone brand assets."},{"title": "Size-Ladder and Subscription Retention Design","desc": "Four sizes plus a 10% subscription discount convert a low-frequency, once-a-week occasion into a predictable repeat-purchase model."}]},"addedAt": 15},{"id": "thedoux-breakdown","category": "usa","name": {"zh": "The Doux BREAKDOWN Clarifying Shampoo","en": "The Doux BREAKDOWN Clarifying Shampoo"},"brand": {"zh": "The Doux","en": "The Doux"},"company": {"zh": "The Doux（创始人Maya Smith，黑人及退伍军人创立，总部美国乔治亚州Macon）","en": "The Doux (founded by Maya Smith; Black- and veteran-owned, based in Macon, Georgia)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2024年2月上市，属品牌Classics系列的清洁位产品","en": "Launched Feb 2024 as the clarifying slot in the brand's Classics line"},"market": {"zh": "品牌官网 + Target + Sally Beauty + Amazon；英国等地有本地经销商","en": "Brand DTC + Target + Sally Beauty + Amazon; local distributors in markets such as the UK"},"capacity": {"zh": "355 mL / 12 fl oz","en": "355 mL / 12 fl oz"},"price": {"zh": "US$16.99（约合 US$0.048/mL）","en": "US$16.99 (approx. US$0.048/mL)"},"positioning": {"zh": "面向卷发与天然发人群的「不剥夺式深层清洁」洗发水：明确针对造型品堆积、油脂残留导致卷型塌陷的问题，主张洗到「squeaky clean」但仍保持柔软，是护理循环中的重置步骤而非日常洗发水。","en": "A non-stripping deep-cleanse shampoo for curly and natural hair: explicitly aimed at product buildup and oil residue that flatten curl definition, promising squeaky-clean without the harsh strip. It is the reset step in a routine, not the daily wash."},"target": {"zh": "卷发·卷曲发人群，尤其大量使用发油、发蜡、慕斯等造型品者；卷型因残留而失去弹性和定义度的人；寻找沙龙级但价格亲和产品的黑人消费者。","en": "Curly and coily consumers, especially heavy users of oils, butters and mousses; those whose curl definition and bounce have collapsed under residue; Black consumers seeking salon-grade performance at an accessible price."},"ingredients": {"zh": "清洁体系为Sodium C14-16 Olefin Sulfonate＋Cocamidopropyl Betaine的经典双表活组合，配方极简（仅约15个成分）：含PEG-6 Caprylic/Capric Glycerides增溶、Polyquaternium-10调理、洋甘菊与迷迭香叶提取物、维生素E乙酸酯（Tocopheryl Acetate）、甘油。不含硅油与蛋白质。","en": "A classic two-surfactant system of Sodium C14-16 Olefin Sulfonate plus Cocamidopropyl Betaine in a notably short INCI (about 15 ingredients): PEG-6 Caprylic/Capric Glycerides as solubilizer, Polyquaternium-10 for conditioning, chamomile and rosemary leaf extracts, tocopheryl acetate and glycerin. No silicones, no protein."},"evidence": {"zh": "无量化临床数据，宣称建立在「沙龙实测（salon tested）」与「stylist created」的从业者背书上——品牌创始人本人是持证美容师并经营沙龙，配方经真实客户操作检验。这是一种以专业实践替代实验室数据的证据策略，在天然发社群中可信度高于数字。","en": "No quantified clinical data; the claim base rests on practitioner endorsement — 'salon tested' and 'stylist created'. The founder is a licensed cosmetologist running her own salon, so formulas are validated against real clients. This substitutes professional practice for lab data, and in the natural-hair community that carries more credibility than numbers."},"experience": {"zh": "泡沫丰富，冲洗后有明确的「干净感」但不发涩发硬；配方无硅油无蛋白，避免了蛋白过载导致的僵硬。因主表活为烯烃磺酸盐，属真正的clarifying强度，品牌建议作为周期性重置而非每次洗发使用。","en": "A generous lather that leaves a clearly 'clean' feel without squeaky drag or stiffness; being silicone- and protein-free it avoids the rigidity of protein overload. Because the primary surfactant is an olefin sulfonate this is a genuinely clarifying strength, and the brand frames it as a periodic reset rather than every wash."},"packaging": {"zh": "12 oz瓶装，采用品牌标志性的高饱和度色块与街头风字体；产品全部以90年代嘻哈歌曲命名（BREAKDOWN、Mousse Def、Chief Rocka、Bananas），命名体系本身就是品牌资产与社群识别码。","en": "A 12 oz bottle in the brand's signature high-saturation color blocking and street-style type. Every product is named after a 90s hip-hop reference (BREAKDOWN, Mousse Def, Chief Rocka, Bananas) — the naming system is itself a brand asset and an in-group signal."},"insight": {"zh": "The Doux证明了在天然发赛道，文化归属可以直接替代技术叙事：同价位竞品在拼活性炭、氨基酸表活，而BREAKDOWN用一张只有15个成分的极简配方＋90年代嘻哈命名体系，靠「这个品牌懂我的头发和我的文化」完成说服。对我们的启示是，面向特定族群或亚文化的产品，命名与语调的投资回报可能高于成分升级；另一面的风险是，纯文化驱动的差异化容易被同族群新品牌复制。","en": "The Doux proves that in textured hair care, cultural belonging can substitute directly for technology narrative: rivals at this price fight over charcoal and amino-acid surfactants, while BREAKDOWN persuades with a 15-ingredient formula and a 90s hip-hop naming system that says 'this brand understands both my hair and my culture'. The lesson is that for products aimed at a specific community or subculture, investment in naming and voice can out-return ingredient upgrades. The risk is the mirror image: purely cultural differentiation is easy for the next in-community brand to copy."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD1.jpg?v=1748800670","https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD2.jpg?v=1748800723","https://cdn.shopify.com/s/files/1/0512/9420/8178/files/BD4.jpg?v=1748800723"],"sources": [["Official product page","https://thedoux.com/products/break-down"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/the-doux-breakdown-clarifying-shampoo"]],"targetUsers": {"zh": ["卷发·卷曲发人群","大量使用发油／发蜡／慕斯等造型品者","卷型因残留失去定义度和弹性的人","寻找沙龙级但价格亲和产品的消费者"],"en": ["Curly and coily hair","Heavy users of oils, butters and mousses","Those whose curl definition and bounce have collapsed under residue","Shoppers seeking salon-grade results at an accessible price"]},"keyClaims": {"zh": ["深层清除造型品堆积与油脂残留","清洁但不剥夺，洗后依然柔软","头皮重置，恢复卷型弹性","无硅油、无蛋白（避免蛋白过载）","Stylist created / Salon tested"],"en": ["Deeply removes product buildup and oil residue","Deep clean without the harsh strip — hair stays soft","Resets the scalp and restores curl bounce","Silicone-free and protein-free (no protein overload)","Stylist created / salon tested"]},"heroIngredients": {"zh": [{"name": "Sodium C14-16 Olefin Sulfonate","tag": "主清洁表活","desc": "提供真正clarifying级别的清洁力，是本品定位的技术底层"},{"name": "Cocamidopropyl Betaine","tag": "两性辅表活","desc": "提升泡沫质感并缓和主表活的刺激性，是「不剥夺」体感的关键"},{"name": "Chamomile / Rosemary Leaf Extract","tag": "植物舒缓","desc": "洋甘菊与迷迭香提取物，承担头皮舒缓与「重置」的感官叙事"},{"name": "Tocopheryl Acetate","tag": "维生素E","desc": "抗氧化，在极简配方中提供护理感"}],"en": [{"name": "Sodium C14-16 Olefin Sulfonate","tag": "Primary cleansing surfactant","desc": "Delivers genuinely clarifying-strength cleansing — the technical basis of the positioning"},{"name": "Cocamidopropyl Betaine","tag": "Amphoteric co-surfactant","desc": "Builds lather quality and softens the primary surfactant — the key to the non-stripping feel"},{"name": "Chamomile / Rosemary Leaf Extract","tag": "Botanical soothing","desc": "Carries the scalp-comfort and 'reset' sensory story"},{"name": "Tocopheryl Acetate","tag": "Vitamin E","desc": "Antioxidant that supplies a care cue inside a very short formula"}]},"ingredientsNote": {"zh": "配方仅约15个成分，是同类中最简洁的之一。刻意不含硅油与蛋白质——这在天然发社群有明确意义：蛋白过载导致的僵硬和硅油残留是该人群最常抱怨的两个问题，因此「不含」本身就是卖点。反面是配方无任何可专利化的技术资产，护城河完全依赖品牌与社群。","en": "At roughly 15 ingredients this is one of the shortest formulas in its class. The deliberate absence of silicones and protein is meaningful in the natural-hair community: protein-overload stiffness and silicone residue are that audience's two most common complaints, so 'without' is itself the selling point. The flip side is that the formula holds no patentable technology asset — the moat is entirely brand and community."},"pricePositioning": {"zh": {"tier": "masstige","label": "Masstige Textured-Hair Care"},"en": {"tier": "masstige","label": "Masstige Textured-Hair Care"}},"marketChannel": {"zh": {"global": ["品牌官网","Amazon","CVS"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "以Target进入大众渠道，同时保有Sally Beauty等美妆用品店的专业感"},"en": {"global": ["Brand DTC","Amazon","CVS"],"japan": ["Target","Sally Beauty"],"channelLabel": "Mass & Beauty Supply Retail","channelDesc": "Reaches mass shoppers through Target while keeping professional credibility in beauty-supply channels like Sally Beauty"}},"brandConceptRich": {"zh": {"tagline": "100% Sucka Free。","concept": "由持证美容师Maya Smith创立并与丈夫共同经营，The Doux把90年代嘻哈的态度与命名方式带进天然发护理：产品全部以嘻哈经典命名，配方在自家沙龙的真实客户身上验证。"},"en": {"tagline": "100% Sucka Free.","concept": "Founded by licensed cosmetologist Maya Smith and run with her husband, The Doux brings the attitude and naming language of 90s hip-hop into textured hair care: every product is named after a hip-hop classic, and every formula is proven on real clients in their own salon."}},"competitiveAdvantage": {"zh": [{"name": "Mielle Organics Rosemary Mint Clarifying Shampoo","points": ["文化归属与命名体系的辨识度更强，社群黏性更高","配方更简洁，明确无蛋白无硅油，规避蛋白过载抱怨","Mielle被宝洁收购后渠道铺货与营销预算规模远超The Doux"]},{"name": "SheaMoisture African Black Soap Deep Cleansing Shampoo","points": ["价格接近但沙龙专业背书更硬（创始人本人是执业美容师）","造型品残留这一具体场景切得更准","SheaMoisture在大众渠道的价格与货架份额优势明显"]},{"name": "Camille Rose Sweet Ginger Cleansing Rinse","points": ["清洁力更强，定位为周期性重置而非温和日常","品牌语调更年轻、更具街头文化辨识度","Camille Rose在成分「食品级」叙事上更有溢价能力"]}],"en": [{"name": "Mielle Organics Rosemary Mint Clarifying Shampoo","points": ["Stronger cultural identity and naming system, with tighter community loyalty","Shorter formula, explicitly protein- and silicone-free, sidestepping protein-overload complaints","Since P&G acquired Mielle, its distribution and marketing budget dwarf The Doux's"]},{"name": "SheaMoisture African Black Soap Deep Cleansing Shampoo","points": ["Similar price point but harder professional credibility — the founder is a practicing cosmetologist","Cuts the specific occasion of styling-product residue more precisely","SheaMoisture holds a clear advantage in mass-channel price and shelf share"]},{"name": "Camille Rose Sweet Ginger Cleansing Rinse","points": ["Stronger cleansing, positioned as a periodic reset rather than a gentle daily wash","Younger brand voice with sharper street-culture recognition","Camille Rose commands more premium through its food-grade ingredient narrative"]}]},"evidenceStats": {"zh": ["无量化临床数据公开","证据策略：Stylist created / Salon tested（创始人为持证美容师并经营沙龙）","配方无硅油、无蛋白，规避蛋白过载","局限：无第三方测试、无仪器测量数据"],"en": ["No quantified clinical data published","Evidence strategy: stylist created / salon tested (the founder is a licensed cosmetologist with her own salon)","Silicone-free and protein-free, avoiding protein overload","Limitation: no third-party testing or instrumental data"]},"experienceItems": {"zh": ["质地：泡沫丰富，冲洗顺畅","体感：明确的清洁感但不发涩不僵硬","强度：真正clarifying级别，建议周期性使用而非每次洗发","命名：BREAKDOWN取自90年代嘻哈语汇，与Mousse Def等构成同一命名宇宙"],"en": ["Texture: generous lather, rinses cleanly","Feel: a clear clean without squeaky drag or stiffness","Strength: genuinely clarifying — intended for periodic use, not every wash","Naming: BREAKDOWN comes from 90s hip-hop vocabulary, part of the same universe as Mousse Def"]},"packagingItems": {"zh": ["视觉：高饱和色块＋街头风字体，与主流天然发品牌区隔明显","命名体系：全线以90年代嘻哈经典命名，构成社群识别码","规格：单一12 oz，SKU管理简单","弱点：仅一个规格，缺少旅行装与大容量补充装的价格阶梯"],"en": ["Visual: high-saturation color blocking and street-style type, clearly set apart from mainstream natural-hair brands","Naming system: the whole line references 90s hip-hop classics, functioning as an in-group signal","Sizes: a single 12 oz SKU, simple to manage","Weakness: one size only — no travel or jumbo refill to build a price ladder"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "沙龙实测的配方验证流程","desc": "创始人为持证美容师并经营自有沙龙，配方在真实客户操作中反复验证，以从业者实践替代实验室数据作为主要证据来源。"},{"title": "极简配方的减法策略","desc": "刻意压缩至约15个成分并排除硅油与蛋白，把「不含什么」作为面向天然发社群的核心技术主张。"},{"title": "文化命名体系作为产品架构","desc": "全线产品以90年代嘻哈经典命名，使产品线本身具备叙事结构与收藏感，命名先于配方定义产品在系列中的角色。"}],"en": [{"title": "Salon-Proven Validation Process","desc": "The founder is a licensed cosmetologist running her own salon, so formulas are validated repeatedly on real clients — practitioner practice replaces lab data as the primary evidence source."},{"title": "Subtractive Minimal-Formula Strategy","desc": "Deliberately compressed to about 15 ingredients with silicones and protein excluded, making 'what it leaves out' the central technical claim to the natural-hair community."},{"title": "Cultural Naming System as Product Architecture","desc": "Naming every product after a 90s hip-hop classic gives the range its own narrative structure and collectibility — the name, ahead of the formula, defines each product's role in the line."}]},"addedAt": 16},{"id": "olaplex-no4","category": "usa","name": {"zh": "OLAPLEX Nº.4 Bond Maintenance Shampoo","en": "OLAPLEX Nº.4 Bond Maintenance Shampoo"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2018年上市；据Circana为美国高端市场销量第一的洗发水（2024年1-12月）","en": "Launched 2018; the US #1 prestige shampoo by Circana (Jan-Dec 2024)"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon；全球多市场本地站点","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon, with localized sites across global markets"},"capacity": {"zh": "250 mL / 8.5 fl oz（另有100 mL、1000 mL、2000 mL Jumbo）","en": "250 mL / 8.5 fl oz (also 100 mL, 1000 mL and 2000 mL jumbo)"},"price": {"zh": "US$34（250 mL）/ US$16（100 mL）","en": "US$34 (250 mL) / US$16 (100 mL)"},"positioning": {"zh": "键结修护品类的定义者，面向中至粗发质、各种卷度与孔隙度的受损发：以专利分子在分子层面重建二硫键，把「一次清洗即修复日常损伤」作为核心承诺，是从沙龙后台走向家用日常的旗舰洗发水。","en": "The product that defined bond maintenance. Aimed at damaged hair from medium to coarse across all curl patterns and porosities, it rebuilds disulfide bonds at the molecular level and promises to repair everyday damage in a single wash — the flagship shampoo that carried bond repair from the salon backroom into daily home use."},"target": {"zh": "染烫、漂发等化学处理后受损人群；频繁热造型者；追求「洗护即修护」而非额外护理步骤的消费者；沙龙客户的家庭延续护理。","en": "Consumers with chemical damage from color, perming or bleaching; frequent heat stylists; those who want repair built into washing rather than as an extra step; salon clients continuing treatment at home."},"ingredients": {"zh": "核心为专利分子Bis-Aminopropyl Diglycol Dimaleate（OLAPLEX Bond Building Technology）。清洁体系刻意避开SLS/SLES，采用Sodium Lauroyl Methyl Isethionate、Potassium Cocoyl Glycinate、Disodium Cocoyl Glutamate等椰油衍生温和表活复配；辅以Amodimethicone、Polyquaternium-10调理，透明质酸钠、泛醇、生物素、多种果提取物与向日葵籽油。无硫酸盐、SLS/SLES、邻苯二甲酸盐、MIC/MIT、Paraben；纯素、染发安全。","en": "Built on the patented Bis-Aminopropyl Diglycol Dimaleate (OLAPLEX Bond Building Technology). The cleansing base deliberately avoids SLS/SLES, using coconut-derived mild surfactants such as Sodium Lauroyl Methyl Isethionate, Potassium Cocoyl Glycinate and Disodium Cocoyl Glutamate, with amodimethicone and Polyquaternium-10 for conditioning plus sodium hyaluronate, panthenol, biotin, several fruit extracts and sunflower seed oil. Free of sulfates, SLS/SLES, phthalates, MIC/MIT and parabens; vegan and color-safe."},"evidence": {"zh": "官方公布量化临床结果：与Nº.5搭配使用时90%更顺滑·更易梳理·更滋润，断裂减少49%，保湿提升73%；皮肤科测试。市场地位引用Circana美国高端市场2024年1-12月数据。需要注意的是，OLAPLEX的临床数据均由品牌自行委托，且2023年曾因用户脱发投诉引发集体诉讼与舆情危机，公司自2023年起营收持续承压（2026年Q1营收9,940万美元，同比+2.5%，全年指引为-2%至+3%）。","en": "Quantified clinical results are published: used as a system with Nº.5, 90% smoother, better detangling and more conditioned, 49% less breakage and 73% more hydration; dermatologist tested. Market position cites Circana US prestige data for Jan-Dec 2024. Two caveats: all clinical data is brand-commissioned, and a 2023 class action over consumer hair-loss complaints triggered a reputational crisis. Revenue has been under pressure since — Q1 2026 net sales were US$99.4M (+2.5% YoY) against full-year guidance of -2% to +3%."},"experience": {"zh": "高浓缩配方，250 mL标称可用约100次（按2.5 mL/次计）。泡沫丰富但不涩，洗后不留厚重感。品牌香型为标志性的葡萄柚皮、糖渍薄荷、生姜与鼠尾草，是OLAPLEX跨全线的嗅觉识别资产。","en": "A highly concentrated formula: 250 mL is rated for around 100 applications at 2.5 mL each. The lather is generous without drag and leaves no heaviness. The signature scent — grapefruit zest, sugared mint, ginger and crushed sage — is an olfactory identifier used across the whole line."},"packaging": {"zh": "极简白瓶＋巨大编号「Nº.4」的编号体系，是护发领域最成功的产品架构设计之一：编号本身承担了「按步骤组建护理系统」的教育功能，让消费者自发追求集齐。规格从100 mL到2000 mL覆盖试用到沙龙后台。","en": "A minimal white bottle dominated by the huge 'Nº.4' — one of the most successful product architectures in hair care. The numbering itself does the educational work of 'build a system step by step', prompting consumers to collect the range. Sizes run from 100 mL to 2000 mL, covering trial through salon backbar."},"insight": {"zh": "Nº.4最值得学习的不是配方而是编号体系：把产品线变成一套有顺序的系统后，交叉销售不需要话术——消费者会自己问「那Nº.5呢」。但OLAPLEX同时也给出了警示：当品牌把全部资产押在单一专利分子上，一旦该分子在社群中出现安全性质疑（2023年脱发集体诉讼），整个品牌无处可退，营收连续多年承压至今。技术护城河越深，声誉风险的集中度也越高。","en": "The most instructive thing about Nº.4 is not the formula but the numbering: once a line becomes an ordered system, cross-sell needs no script — shoppers ask for Nº.5 themselves. But OLAPLEX is also a cautionary case: when a brand stakes everything on one patented molecule, a safety controversy around that molecule (the 2023 hair-loss class action) leaves nowhere to retreat, and revenue has been under pressure ever since. The deeper the technology moat, the more concentrated the reputational risk."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/2025_No4_250ml_Product_Packshot_01_GBL_1440x1440_1_8bd8f43c-86fd-4ca1-a39f-bf17f6734a94.png?v=1740499372","https://cdn.shopify.com/s/files/1/0434/1661/files/N.4_hover_958-988_6e114837-8ea7-478f-9e56-a2f6404ec9d6.png?v=1755869199","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N4_benefit1_1440_d7558c47-1a04-47de-8bc6-f9841241e47a.jpg?v=1755869200"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-4-bond-maintenance-shampoo-us"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/olaplex-no-4-bond-maintenance-shampoo-2"]],"targetUsers": {"zh": ["染烫漂等化学处理受损发","频繁使用热造型工具者","中至粗发质、各种卷度与孔隙度","希望在洗发步骤内完成修护的消费者"],"en": ["Chemically damaged hair from color, perms or bleach","Frequent heat-styling users","Medium to coarse textures across all curl patterns and porosities","Consumers who want repair to happen inside the wash step"]},"keyClaims": {"zh": ["1次清洗修复日常损伤","分子层面重建二硫键，强化发丝韧性","温和清洁不剥夺，补充水分","与Nº.5搭配：90%更顺滑·更易梳理·更滋润","断裂减少49%，保湿提升73%","无硫酸盐/SLS·SLES/邻苯二甲酸盐/Paraben，纯素、染发安全"],"en": ["Repairs everyday damage in one wash","Rebuilds disulfide bonds at the molecular level for resilience","Cleanses gently without stripping and replenishes hydration","As a system with Nº.5: 90% smoother, better detangling, more conditioned","49% less breakage, 73% more hydration","Sulfate-, SLS/SLES-, phthalate- and paraben-free; vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "OLAPLEX Bond Building Technology的核心，重建断裂的二硫键，是整个键结护理品类的起点"},{"name": "椰油衍生温和表活复配","tag": "无硫酸盐清洁体系","desc": "甲基月桂酰基牛磺酸钠等复配，实现丰富泡沫的同时避免SLS/SLES的剥夺感"},{"name": "Sodium Hyaluronate / Panthenol","tag": "保湿修护","desc": "支撑「保湿提升73%」的宣称，平衡清洁后的水分流失"},{"name": "Amodimethicone","tag": "调理硅","desc": "沉积型调理硅，提供顺滑与光泽，是「洗后不厚重」体感的关键"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "The core of OLAPLEX Bond Building Technology, rebuilding broken disulfide bonds — the origin point of the whole bond-care category"},{"name": "Coconut-derived mild surfactant blend","tag": "Sulfate-free cleansing system","desc": "Sodium lauroyl methyl isethionate and others deliver abundant lather without the stripped feel of SLS/SLES"},{"name": "Sodium Hyaluronate / Panthenol","tag": "Hydration and repair","desc": "Underpins the 73% hydration claim and offsets moisture loss after cleansing"},{"name": "Amodimethicone","tag": "Conditioning silicone","desc": "A depositing silicone that provides slip and shine — key to the non-heavy after-feel"}]},"ingredientsNote": {"zh": "专利分子在成分表中位置靠前（Glycereth-26之后），说明添加量并非象征性。整体配方复杂度远高于同类，包含发酵滤液、多种果提取物与生物素等辅助成分。需要提醒的是，Nº.4含硅（Amodimethicone），对追求无硅的卷发人群不适用。","en": "The patented molecule sits high on the INCI (right after glycereth-26), indicating a functional rather than token level. The overall formula is far more complex than peers, with ferment filtrates, multiple fruit extracts and biotin. Note that Nº.4 does contain silicone (amodimethicone), so it does not suit curly consumers following a silicone-free routine."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Amazon"],"japan": ["Sephora","Ulta Beauty","日本正规代理（olaplex.jp）"],"channelLabel": "Professional + Prestige Retail","channelDesc": "沙龙专业渠道建立信任，再向高端零售与DTC放量，是键结护理教育-变现的标准路径"},"en": {"global": ["Professional salon channel","Brand DTC","Amazon"],"japan": ["Sephora","Ulta Beauty","Official Japan distribution (olaplex.jp)"],"channelLabel": "Professional + Prestige Retail","channelDesc": "Trust is built in the salon channel then scaled through prestige retail and DTC — the textbook educate-then-monetize path for bond care"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "K18 Peptide Prep Detox Shampoo","points": ["专利分子先发优势与品类定义权，认知度远高于K18","沙龙渠道积累深厚，专业背书更强","K18的肽技术叙事更新，在专业圈层被视为「下一代」"]},{"name": "Kérastase Première Bond Repair Shampoo","points": ["价格更低，家用日常化程度更高","编号体系让系统性购买更自然","欧莱雅集团的研发与渠道资源规模远超OLAPLEX单一品牌"]},{"name": "Redken Acidic Bonding Concentrate Shampoo","points": ["品牌资产集中在单一技术上，消费者认知更清晰","独立品牌调性，不受集团多品牌定位牵制","Redken背靠欧莱雅，沙龙渠道议价能力更强，价格也更亲和"]}],"en": [{"name": "K18 Peptide Prep Detox Shampoo","points": ["First-mover patent and category-definition authority, with far higher awareness than K18","Deep salon-channel history and stronger professional endorsement","K18's peptide story is newer and is treated as 'next generation' inside professional circles"]},{"name": "Kérastase Première Bond Repair Shampoo","points": ["Lower price and more established as an everyday home product","The numbering system makes system-buying feel natural","L'Oréal's R&D and distribution scale dwarfs OLAPLEX as a single brand"]},{"name": "Redken Acidic Bonding Concentrate Shampoo","points": ["Brand equity concentrated on one technology, so consumer understanding is clearer","Independent brand voice, unconstrained by a group's multi-brand architecture","Redken's L'Oréal backing gives it stronger salon leverage and a friendlier price"]}]},"evidenceStats": {"zh": ["与Nº.5系统使用：90%更顺滑、更易梳理、更滋润","断裂减少49%","保湿提升73%","市场地位：Circana美国高端市场2024年销量第一的洗发水","局限：临床数据均为品牌自行委托；2023年脱发集体诉讼后营收持续承压"],"en": ["As a system with Nº.5: 90% smoother, better detangling, more conditioned","49% reduction in breakage","73% increase in hydration","Market position: #1 prestige shampoo in the US per Circana, 2024","Limitation: all clinical data is brand-commissioned; revenue has been under pressure since the 2023 hair-loss class action"]},"experienceItems": {"zh": ["浓缩度：250 mL约100次用量（2.5 mL/次）","泡沫：丰富绵密，冲洗后不涩","香型：葡萄柚皮·糖渍薄荷·生姜·鼠尾草（全线统一）","用法：与Nº.5搭配使用为官方推荐的系统方案"],"en": ["Concentration: 250 mL rated for about 100 applications at 2.5 mL each","Lather: rich and dense, rinses without drag","Scent: grapefruit zest, sugared mint, ginger, crushed sage (consistent across the line)","Usage: officially recommended as a system with Nº.5"]},"packagingItems": {"zh": ["视觉：极简白瓶＋超大编号，货架识别度极高","架构：编号体系本身承担产品线教育与交叉销售功能","规格：100 / 250 / 1000 / 2000 mL，覆盖试用到沙龙后台","弱点：白瓶设计被大量平价品牌模仿，视觉差异化正在被稀释"],"en": ["Visual: minimal white bottle with an oversized number, extremely shelf-legible","Architecture: the numbering system itself carries range education and cross-sell","Sizes: 100 / 250 / 1000 / 2000 mL, from trial to salon backbar","Weakness: the white-bottle look is now widely imitated by value brands, diluting its visual distinctiveness"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "专利分子的品类创造策略","desc": "由材料科学家发明并申请专利的单一分子，使OLAPLEX不是在既有品类中竞争，而是创造了「键结护理」这一新品类并长期占据定义权。"},{"title": "编号式产品架构","desc": "以Nº.0至Nº.9的编号取代功能命名，把产品线转化为有顺序的护理系统，使交叉销售内生于产品架构而非依赖营销话术。"},{"title": "沙龙先行的技术教育路径","desc": "先在专业沙龙后台建立技术可信度，由造型师完成消费者教育，再向零售端放量——这是键结护理能被大众理解的关键前置步骤。"},{"title": "系统级临床测试设计","desc": "关键数据以「Nº.4＋Nº.5系统使用」为测试条件而非单品，既提升数据表现，也在结构上引导连带购买。"}],"en": [{"title": "Category Creation Through a Patented Molecule","desc": "A single molecule invented and patented by materials scientists meant OLAPLEX never competed inside an existing category — it created bond care and has held definitional authority ever since."},{"title": "Numbered Product Architecture","desc": "Replacing functional names with Nº.0 through Nº.9 turns the range into an ordered system, making cross-sell intrinsic to the architecture rather than dependent on marketing scripts."},{"title": "Salon-First Technology Education","desc": "Credibility was established in professional backbars first, with stylists doing the consumer education before retail scale-up — the prerequisite that made bond repair legible to the mass market."},{"title": "System-Level Clinical Test Design","desc": "Headline data is generated with Nº.4 and Nº.5 used together rather than as single products, which both improves the numbers and structurally steers shoppers toward buying the pair."}]},"addedAt": 17},{"id": "olaplex-no5","category": "usa","name": {"zh": "OLAPLEX Nº.5 Bond Maintenance Conditioner","en": "OLAPLEX Nº.5 Bond Maintenance Conditioner"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2018年与Nº.4同步上市；据Circana为美国高端市场销量第一的护发素（2024年1-12月）","en": "Launched alongside Nº.4 in 2018; the US #1 prestige conditioner by Circana (Jan-Dec 2024)"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon"},"capacity": {"zh": "250 mL / 8.5 fl oz（另有100 mL、1000 mL、2000 mL Jumbo）","en": "250 mL / 8.5 fl oz (also 100 mL, 1000 mL and 2000 mL jumbo)"},"price": {"zh": "US$34（250 mL）/ US$16（100 mL）","en": "US$34 (250 mL) / US$16 (100 mL)"},"positioning": {"zh": "与Nº.4构成系统的键结护发素，面向中至粗发质受损发：在提供顺滑与易梳理的同时把专利分子带入调理步骤，核心差异化是明确宣称「无蛋白」——直接回应键结修护人群最担心的蛋白过载僵硬问题。","en": "The conditioner half of the Nº.4 system for damaged medium-to-coarse hair: it delivers slip and detangling while carrying the patented molecule into the conditioning step. Its sharpest differentiator is an explicit protein-free claim, answering the stiffness from protein overload that bond-repair users fear most."},"target": {"zh": "化学处理与热造型受损人群；打结严重、梳理困难的中粗发质；已使用Nº.4希望完成系统的用户；担心蛋白过载导致发丝僵硬的消费者。","en": "Users with chemical and heat damage; medium-to-coarse hair that tangles badly; Nº.4 users completing the system; consumers worried that protein overload will leave hair stiff."},"ingredients": {"zh": "核心同为Bis-Aminopropyl Diglycol Dimaleate。调理体系以Cetearyl Alcohol、Behentrimonium Chloride、Cetrimonium Chloride等阳离子调理剂为主，配合Quaternium-91、多种硅（Divinyldimethicone/Dimethicone Copolymer、Amodimethicone、Polysilicone-15）；护理成分含水解透明质酸、泛醇、磷脂、鳄梨油、葡萄籽油、绿茶籽油与生物素。明确无蛋白，同时无硫酸盐、SLS/SLES、邻苯二甲酸盐、磷酸盐、MIC/MIT、Paraben。","en": "Also built on Bis-Aminopropyl Diglycol Dimaleate. The conditioning base leads with cetearyl alcohol, behentrimonium chloride and cetrimonium chloride, joined by Quaternium-91 and several silicones (divinyldimethicone/dimethicone copolymer, amodimethicone, polysilicone-15). Care actives include hydrolyzed hyaluronic acid, panthenol, phospholipids, avocado oil, grape seed oil, green tea seed oil and biotin. Explicitly protein-free, and free of sulfates, SLS/SLES, phthalates, phosphates, MIC/MIT and parabens."},"evidence": {"zh": "官方公布：即时减少断裂66%并防护未来断裂，保湿提升91%，梳理性提升91%；皮肤科测试。市场地位引用Circana美国高端市场2024年1-12月数据。与Nº.4相同的局限：数据由品牌自行委托，未公开样本量与对照设计；且母公司自2023年舆情危机后营收持续承压。","en": "Published claims: 66% less breakage instantly with defense against future breakage, 91% more hydration and 91% easier detangling; dermatologist tested. Market position cites Circana US prestige data for Jan-Dec 2024. Same caveats as Nº.4 — brand-commissioned data with no disclosed sample size or control design, against a parent company whose revenue has been under pressure since the 2023 reputational crisis."},"experience": {"zh": "质地浓稠奶霜状但冲洗后不压发；250 mL标称约50次用量（5 mL/次），单次用量是Nº.4的两倍。停留1-3分钟即可，无需长时间敷用。香型与全线统一。","en": "A thick, creamy texture that nonetheless rinses without weighing hair down; 250 mL is rated for about 50 applications at 5 mL each — double the per-use dose of Nº.4. It only needs 1-3 minutes, with no long masking time. Scent is consistent with the rest of the line."},"packaging": {"zh": "与Nº.4完全一致的白瓶＋编号视觉，两支并列在货架与浴室里形成视觉配对，是「必须成套购买」暗示最直接的设计手段。规格阶梯同样覆盖100 mL至2000 mL。","en": "Visually identical to Nº.4 — white bottle, big number — so the pair reads as a set on shelf and in the shower, the most direct design device for implying they must be bought together. The same 100 mL to 2000 mL size ladder applies."},"insight": {"zh": "Nº.5最值得注意的是「无蛋白」这一反向卖点：在一个所有人都在加蛋白、加肽的品类里，OLAPLEX把「不加」写成了明确宣称，精准命中了受损发人群反复经历蛋白过载后的真实痛点。这提示我们——当品类共识过度集中在某个成分方向时，明确的减法宣称本身就是差异化空间。另外，官方把Nº.4的关键数据设定为「与Nº.5系统使用」的测试条件，在结构上让单品购买显得不完整，是值得研究的连带设计。","en": "The notable thing about Nº.5 is its inverse selling point: in a category where everyone is adding protein and peptides, OLAPLEX turned 'without' into an explicit claim, landing precisely on the real pain of damaged-hair users who have cycled through protein overload. The lesson: when category consensus over-concentrates on one ingredient direction, an explicit subtractive claim is itself differentiation space. Worth studying too is how Nº.4's headline data is defined under 'used as a system with Nº.5' — structurally making a single-product purchase feel incomplete."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/2025_No5_250ml_Product_Packshot_01_GBL_1440x1440_622d30f9-640f-4df4-b33e-97cd3d5ed514.png?v=1762274328","https://cdn.shopify.com/s/files/1/0434/1661/files/N.5_hover_958-988_a07c176a-c5a6-439a-9ec9-562300163a09.png?v=1740500601","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N5_benefit1_1440_f0563b87-feee-4422-8927-02cc4563a20c.jpg?v=1740500601"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-5-bond-maintenance-conditioner-us"],["Circana prestige ranking (brand citation)","https://olaplex.com/products/olaplex-n-5-bond-maintenance-conditioner-us"]],"targetUsers": {"zh": ["化学处理与热造型受损发","打结严重、梳理困难的中粗发质","已使用Nº.4、希望完成系统的用户","担心蛋白过载导致僵硬的消费者"],"en": ["Chemically and heat-damaged hair","Medium-to-coarse hair that tangles badly","Nº.4 users completing the system","Consumers wary of protein-overload stiffness"]},"keyClaims": {"zh": ["1次清洗修复日常损伤，防护未来断裂","即时减少断裂66%","保湿提升91%","梳理性提升91%","明确无蛋白，避免蛋白过载","无硫酸盐/磷酸盐/邻苯二甲酸盐/Paraben，纯素、染发安全"],"en": ["Repairs everyday damage in one wash and defends against future breakage","66% less breakage instantly","91% increase in hydration","91% easier detangling","Explicitly protein-free to avoid protein overload","Sulfate-, phosphate-, phthalate- and paraben-free; vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "与Nº.4同源，把键结修护延伸到调理步骤，构成完整系统"},{"name": "Behentrimonium / Cetrimonium Chloride","tag": "阳离子调理体系","desc": "实际承担顺滑与解结的成分，是「梳理性提升91%」的技术底层"},{"name": "Hydrolyzed Hyaluronic Acid / Panthenol","tag": "保湿","desc": "小分子透明质酸配合泛醇，支撑「保湿提升91%」的宣称"},{"name": "Avocado / Grape Seed / Green Tea Seed Oil","tag": "植物油脂复配","desc": "提供柔软度与光泽，平衡阳离子调理剂的单薄感"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "Shared with Nº.4, extending bond repair into the conditioning step to complete the system"},{"name": "Behentrimonium / Cetrimonium Chloride","tag": "Cationic conditioning system","desc": "The ingredients actually delivering slip and detangling — the technical basis of the 91% easier detangling claim"},{"name": "Hydrolyzed Hyaluronic Acid / Panthenol","tag": "Hydration","desc": "Low-molecular-weight HA with panthenol, underpinning the 91% hydration claim"},{"name": "Avocado / Grape Seed / Green Tea Seed Oil","tag": "Plant oil blend","desc": "Adds softness and shine, offsetting the thinness of a purely cationic system"}]},"ingredientsNote": {"zh": "「无蛋白」是本品最重要的宣称设计：键结修护人群往往同时使用多个修护产品，蛋白叠加导致的僵硬和断裂是高频抱怨，因此在护发素这一必用步骤上明确无蛋白，实际是在为整个护理系统做风险控制。配方含多种硅，追求无硅routine的卷发人群需注意。","en": "The protein-free claim is this product's most important design choice: bond-repair users typically stack several treatments, and the resulting protein overload — stiffness and snapping — is a frequent complaint. Declaring the mandatory conditioning step protein-free is effectively risk management for the whole routine. The formula does contain several silicones, so silicone-free curly routines should note this."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Amazon"],"japan": ["Sephora","Ulta Beauty","日本正规代理（olaplex.jp）"],"channelLabel": "Professional + Prestige Retail","channelDesc": "与Nº.4同渠道同价格并列陈列，形成事实上的强制配对购买"},"en": {"global": ["Professional salon channel","Brand DTC","Amazon"],"japan": ["Sephora","Ulta Beauty","Official Japan distribution (olaplex.jp)"],"channelLabel": "Professional + Prestige Retail","channelDesc": "Merchandised beside Nº.4 at the same price, creating a de facto mandatory pairing"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "K18 Damage Shield Conditioner","points": ["「无蛋白」明确宣称，直接回避K18肽路线的过载顾虑","与Nº.4的系统绑定让复购路径更确定","K18主张更短的作用时间与更新的技术叙事"]},{"name": "Kérastase Résistance Ciment Thermique","points": ["价格更低，不需沙龙购买即可获得","编号体系降低了选择成本，消费者不必理解发质细分","Kérastase按发质细分的产品线在专业沙龙推荐中更精准"]},{"name": "Redken Acidic Bonding Concentrate Conditioner","points": ["品牌资产集中于单一专利分子，认知更清晰","无蛋白定位在受损发社群中口碑优势明显","Redken的酸性pH叙事在染后护色场景更有说服力，价格也更低"]}],"en": [{"name": "K18 Damage Shield Conditioner","points": ["The explicit protein-free claim sidesteps overload concerns around K18's peptide route","System lock-in with Nº.4 makes the repeat-purchase path more certain","K18 counters with shorter contact time and a newer technology story"]},{"name": "Kérastase Résistance Ciment Thermique","points": ["Lower price and available without a salon visit","The numbering system lowers decision cost — no need to understand hair-type segmentation","Kérastase's type-segmented range is more precise for salon recommendation"]},{"name": "Redken Acidic Bonding Concentrate Conditioner","points": ["Brand equity concentrated on one patented molecule, so comprehension is clearer","Protein-free positioning enjoys strong word of mouth in damaged-hair communities","Redken's acidic-pH story is more persuasive for color retention, and it costs less"]}]},"evidenceStats": {"zh": ["即时减少断裂66%，并防护未来断裂","保湿提升91%","梳理性提升91%","市场地位：Circana美国高端市场2024年销量第一的护发素","局限：品牌自行委托测试，未公开样本量与对照组设计"],"en": ["66% less breakage instantly, with defense against future breakage","91% increase in hydration","91% easier detangling","Market position: #1 prestige conditioner in the US per Circana, 2024","Limitation: brand-commissioned testing with no disclosed sample size or control design"]},"experienceItems": {"zh": ["质地：浓稠奶霜状，冲洗后不压发","浓缩度：250 mL约50次用量（5 mL/次），为Nº.4的两倍单次量","用法：涂于中段至发尾，停留1-3分钟","定位提醒：官方明确要求在Nº.4之后使用"],"en": ["Texture: thick and creamy yet rinses without weighing hair down","Concentration: 250 mL for about 50 applications at 5 mL — double Nº.4's per-use dose","Usage: mid-lengths to ends, leave 1-3 minutes","Note: officially specified for use after Nº.4"]},"packagingItems": {"zh": ["视觉：与Nº.4完全一致的白瓶＋编号，形成货架配对","架构：编号相邻使成套购买成为默认选项","规格：100 / 250 / 1000 / 2000 mL","弱点：与Nº.4难以视觉区分，淋浴间内易拿错"],"en": ["Visual: identical white bottle and numbering to Nº.4, reading as a shelf pair","Architecture: adjacent numbers make buying the set the default option","Sizes: 100 / 250 / 1000 / 2000 mL","Weakness: hard to tell apart from Nº.4 at a glance — easy to grab the wrong bottle in the shower"]},"productType": "conditioner","keyTechnology": {"zh": [{"title": "减法式宣称设计（无蛋白）","desc": "在一个普遍加蛋白与肽的品类里，把「不含蛋白」写成正式宣称，用于对冲用户在多产品叠加下的蛋白过载风险。"},{"title": "系统级配对开发","desc": "Nº.4与Nº.5在同一测试条件下开发与验证，关键数据以系统使用为前提，使配对购买成为技术上的必要而非营销建议。"},{"title": "单次用量差异化的用量设计","desc": "洗发2.5 mL、护发5 mL的官方用量设定，使同规格瓶身的消耗速度不同，形成错位补货节奏。"}],"en": [{"title": "Subtractive Claim Design (Protein-Free)","desc": "In a category that reflexively adds protein and peptides, 'contains no protein' is elevated to a formal claim, hedging the overload risk users run when stacking multiple treatments."},{"title": "System-Level Paired Development","desc": "Nº.4 and Nº.5 are developed and validated under the same test conditions, with headline data premised on system use — making the pairing a technical necessity rather than a marketing suggestion."},{"title": "Differentiated Dose Design","desc": "Official doses of 2.5 mL for shampoo and 5 mL for conditioner mean identically sized bottles deplete at different rates, creating a staggered replenishment rhythm."}]},"addedAt": 18},{"id": "olaplex-no7","category": "usa","name": {"zh": "OLAPLEX Nº.7 Bonding Oil","en": "OLAPLEX Nº.7 Bonding Oil"},"brand": {"zh": "OLAPLEX","en": "OLAPLEX"},"company": {"zh": "Olaplex Holdings, Inc.（NASDAQ: OLPX，总部美国加州）","en": "Olaplex Holdings, Inc. (NASDAQ: OLPX, California, USA)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "2019年上市（日本2020年3月）；Allure Readers' Choice 2026获奖单品","en": "Launched 2019 (Japan Mar 2020); an Allure Readers' Choice 2026 award winner"},"market": {"zh": "沙龙专业渠道 + Sephora/Ulta + 品牌DTC + Amazon","en": "Professional salon channel + Sephora/Ulta + brand DTC + Amazon"},"capacity": {"zh": "30 mL / 1 fl oz（另有60 mL）","en": "30 mL / 1 fl oz (also 60 mL)"},"price": {"zh": "US$32（30 mL）/ US$56（60 mL）","en": "US$32 (30 mL) / US$56 (60 mL)"},"positioning": {"zh": "把键结修护带入免洗造型环节的高浓缩美发油：2-3滴即可，同时承担光泽、抗毛躁、减少断裂与450°F热防护四重功能，是OLAPLEX编号系统里唯一的日常造型型产品，也是全线中最容易被非受损发人群接受的入口单品。","en": "A highly concentrated styling oil that carries bond repair into the leave-in step: 2-3 drops deliver shine, frizz control, breakage reduction and 450°F heat protection at once. It is the only everyday styling product in the OLAPLEX numbering system and the easiest entry point in the line for people whose hair is not visibly damaged."},"target": {"zh": "所有发质；频繁使用吹风机与直发夹板的人群；追求光泽与色彩鲜艳度的染发人群；希望以一支产品同时完成造型与热防护的消费者。","en": "All hair types; frequent blow-dryer and flat-iron users; color clients chasing shine and vibrancy; consumers who want one product to handle both styling and heat protection."},"ingredients": {"zh": "无水配方，基底为Dimethicone、Isohexadecane、C13-14 Isoparaffin、Coco-Caprylate与Phenyl Trimethicone的挥发性／成膜硅油体系；专利分子Bis-Aminopropyl Diglycol Dimaleate位列第六。护理成分含玉米油、β-胡萝卜素、向日葵籽油、石榴籽油、维生素E与绿茶籽油发酵滤液。无硫酸盐、磷酸盐、邻苯二甲酸盐、Paraben、无蛋白；纯素、染发安全。","en": "A waterless formula built on a volatile and film-forming silicone system — dimethicone, isohexadecane, C13-14 isoparaffin, coco-caprylate and phenyl trimethicone — with the patented Bis-Aminopropyl Diglycol Dimaleate sixth on the INCI. Care ingredients include corn oil, beta-carotene, sunflower seed oil, pomegranate seed oil, vitamin E and a green tea seed oil ferment filtrate. Free of sulfates, phosphates, phthalates, parabens and protein; vegan and color-safe."},"evidence": {"zh": "官方公布：光泽提升125%（对照未使用本品的漂发）、72小时抗毛躁与抗湿气、断裂减少77%、450°F/232°C热防护。对照条件被明确写出（vs. 未使用本品的漂发），透明度高于同类；但仍为品牌自行委托测试，未公开样本量与仪器方法。","en": "Published claims: 125% more shine (versus bleached hair without the product), 72-hour frizz and humidity control, 77% reduction in breakage and 450°F/232°C heat protection. The comparator is stated explicitly — more transparent than most peers — though the testing remains brand-commissioned with no disclosed sample size or instrumental method."},"experience": {"zh": "极度浓缩，官方用法为倒置瓶身、轻敲瓶底滴出定量液滴，2-3滴即可；干湿发皆可用，热造型前后均可。质地极轻不油腻，30 mL可用数月，实际单次成本远低于售价给人的印象。","en": "Extremely concentrated: the official method is to invert the bottle and tap the base for a metered drop, using just 2-3 drops. It works on damp or dry hair, before or after heat. The texture is exceptionally light and non-greasy, and 30 mL lasts months — making the real cost per use far lower than the price implies."},"packaging": {"zh": "透明玻璃瓶展示金黄色油体（β-胡萝卜素带来的视觉色），配合白色标签与编号，是全线中视觉最具「珍贵感」的一支。定量滴取的瓶口设计既控制用量、又强化「高浓缩」认知，是包装参与产品叙事的典型案例。","en": "A clear glass bottle showing the golden oil — the color comes from beta-carotene — with the white label and number, making it the most precious-looking product in the line. The metered-drop neck both controls dosage and reinforces the 'highly concentrated' perception: a textbook case of packaging participating in the product story."},"insight": {"zh": "Nº.7是OLAPLEX编号体系里最聪明的一步棋：Nº.4/Nº.5要求消费者先承认自己头发受损，而Nº.7卖的是光泽和热防护——不需要承认损伤就能购买，因此成为整个系统最宽的入口。同时它把「β-胡萝卜素带来的金黄色」这种视觉线索直接转化为高浓缩感知，几乎不增加成本。对我们的启示是，修护型品牌需要至少一支「不以承认问题为前提」的引流单品，否则客群天花板会被自我认知锁死。","en": "Nº.7 is the smartest move in the OLAPLEX numbering system: Nº.4 and Nº.5 require the shopper to first admit their hair is damaged, whereas Nº.7 sells shine and heat protection — buyable without that admission, making it the widest entry point into the system. It also converts a visual cue (the golden color from beta-carotene) directly into perceived concentration at almost no cost. The lesson: a repair-led brand needs at least one hero that does not require admitting a problem, or its addressable audience stays capped by consumer self-perception."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/0434/1661/files/ClosetoFinal_Transparent_No7-Bottle_30ml_Product-Packshot_WS_FRONT_FPO_0040_MAIN.png?v=1762285968","https://cdn.shopify.com/s/files/1/0434/1661/files/N.7_hover_958-988_91b4dc2d-add6-48e9-82cb-1c5dcafddc89.png?v=1740486833","https://cdn.shopify.com/s/files/1/0434/1661/files/3-N7_Benefit1_1440_85349bf3-13f6-4b32-9411-47213ba62bca.jpg?v=1740486833"],"sources": [["Official product page","https://olaplex.com/products/olaplex-n-7-bonding-oil-us"],["Sephora listing","https://www.sephora.com/product/no-7-bonding-oil-P447376"]],"targetUsers": {"zh": ["所有发质（全线中适用面最广的一支）","频繁使用吹风机与夹板的人群","追求光泽与染后色彩鲜艳度的消费者","希望一支产品兼顾造型与热防护的用户"],"en": ["All hair types — the broadest fit in the line","Frequent blow-dryer and flat-iron users","Consumers chasing shine and color vibrancy","Users who want one product for both styling and heat protection"]},"keyClaims": {"zh": ["光泽提升125%（vs. 未使用本品的漂发）","72小时抗毛躁与抗湿气","断裂减少77%","450°F/232°C 热防护","即时提升柔软度与染后色彩鲜艳度","无蛋白、纯素、染发安全"],"en": ["125% more shine (vs. bleached hair without it)","72-hour frizz and humidity control","77% reduction in breakage","450°F/232°C heat protection","Instantly boosts softness and color vibrancy","Protein-free, vegan and color-safe"]},"heroIngredients": {"zh": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "专利键结修护分子","desc": "把键结修护带入免洗造型步骤，是本品与普通美发油的根本区别"},{"name": "Dimethicone / Phenyl Trimethicone","tag": "成膜与光泽硅油","desc": "实际承担光泽、抗毛躁与热防护的成分，是「125%光泽」的技术底层"},{"name": "Isohexadecane / C13-14 Isoparaffin","tag": "挥发性轻质基底","desc": "提供极轻不油腻的铺展性，让高硅配方不显厚重"},{"name": "β-Carotene / Pomegranate Seed Oil / Vitamin E","tag": "抗氧化与视觉线索","desc": "β-胡萝卜素既提供抗氧化也带来金黄色油体，直接强化高浓缩的视觉感知"}],"en": [{"name": "Bis-Aminopropyl Diglycol Dimaleate","tag": "Patented bond-building molecule","desc": "Brings bond repair into the leave-in step — the fundamental difference from an ordinary hair oil"},{"name": "Dimethicone / Phenyl Trimethicone","tag": "Film-forming and shine silicones","desc": "The ingredients actually delivering shine, frizz control and heat protection — the basis of the 125% shine claim"},{"name": "Isohexadecane / C13-14 Isoparaffin","tag": "Volatile lightweight base","desc": "Gives the exceptionally light, non-greasy spread that keeps a silicone-heavy formula from feeling thick"},{"name": "β-Carotene / Pomegranate Seed Oil / Vitamin E","tag": "Antioxidant plus visual cue","desc": "Beta-carotene provides antioxidant function and the golden oil color, directly reinforcing the perception of concentration"}]},"ingredientsNote": {"zh": "这是一支以硅油为主体的产品：无水配方，前五位全为硅油与挥发性烷烃。对追求无硅routine的卷发人群不适用，但正是硅膜体系才使450°F热防护与72小时抗湿气成为可能——在热防护品类里，无硅与高性能目前仍难兼得。专利分子位列第六，添加量具备功能意义。","en": "This is fundamentally a silicone product: waterless, with the top five slots all silicones and volatile alkanes. It does not suit silicone-free curly routines — but it is precisely the silicone film that makes 450°F protection and 72-hour humidity resistance possible; in heat protection, silicone-free and high performance remain hard to reconcile. The patented molecule sits sixth, at a functionally meaningful level."},"pricePositioning": {"zh": {"tier": "premium","label": "Prestige Bond Repair"},"en": {"tier": "premium","label": "Prestige Bond Repair"}},"marketChannel": {"zh": {"global": ["沙龙专业渠道","品牌DTC官网","Sephora","Amazon"],"japan": ["日本正规代理（olaplex.jp）","@cosme等日本美妆平台有较高讨论度"],"channelLabel": "Professional + Prestige Retail","channelDesc": "作为编号系统中门槛最低的单品，承担从零售端引流进入整个系统的角色"},"en": {"global": ["Professional salon channel","Brand DTC","Sephora","Amazon"],"japan": ["Official Japan distribution (olaplex.jp)","High discussion volume on Japanese platforms such as @cosme"],"channelLabel": "Professional + Prestige Retail","channelDesc": "As the lowest-barrier product in the numbering system, it functions as the retail funnel into the whole range"}},"brandConceptRich": {"zh": {"tagline": "在分子层面修复。","concept": "由材料科学家Craig Hawker与Eric Pressly发明的Bis-Aminopropyl Diglycol Dimaleate，是极少数在护发领域真正开创品类的分子——OLAPLEX把「修复」从表面调理重新定义为二硫键的化学重建，并以此建立了整个键结护理赛道。"},"en": {"tagline": "Repair at the molecular level.","concept": "Bis-Aminopropyl Diglycol Dimaleate, invented by materials scientists Craig Hawker and Eric Pressly, is one of the very few molecules to genuinely create a category in hair care — OLAPLEX redefined 'repair' from surface conditioning to the chemical rebuilding of disulfide bonds, and built the entire bond-care segment on it."}},"competitiveAdvantage": {"zh": [{"name": "CÉCRED Heat Activated Silk Glaze","points": ["用法极简（2-3滴，干湿发皆可），无严格分区吹干要求","一支同时覆盖光泽、抗毛躁、断裂与热防护四个诉求","Cécred在Silk Press这一具体场景的针对性更强，文化归属更明确"]},{"name": "Moroccanoil Treatment","points": ["含专利键结修护分子，宣称减少断裂而非仅表面调理","热防护温度明确标称450°F，数据披露更完整","Moroccanoil的香型辨识度与沙龙渠道历史更悠久"]},{"name": "K18 Molecular Repair Hair Oil","points": ["价格更低且规格更小，试用门槛低","编号体系带来的系统联想是K18不具备的资产","K18的肽技术在专业圈层被视为更新一代，且宣称四分钟起效"]}],"en": [{"name": "CÉCRED Heat Activated Silk Glaze","points": ["Radically simpler use — 2-3 drops on damp or dry hair, with no strict sectioning and drying protocol","One product covering shine, frizz, breakage and heat protection at once","Cécred is sharper on the specific silk-press occasion and clearer on cultural belonging"]},{"name": "Moroccanoil Treatment","points": ["Contains a patented bond-repair molecule, claiming reduced breakage rather than surface conditioning alone","States a specific 450°F heat rating with fuller data disclosure","Moroccanoil's scent recognition and salon-channel history run deeper"]},{"name": "K18 Molecular Repair Hair Oil","points": ["Lower price in a smaller size, so the trial barrier is low","The system association created by the numbering is an asset K18 lacks","K18's peptide technology reads as a newer generation professionally, and claims results in four minutes"]}]},"evidenceStats": {"zh": ["光泽提升125%（对照：未使用本品的漂发）","72小时抗毛躁与抗湿气","断裂减少77%","450°F/232°C 热防护","透明度：明确写出对照条件；局限：品牌自行委托，未公开样本量与仪器方法"],"en": ["125% more shine (comparator: bleached hair without the product)","72-hour frizz and humidity control","77% reduction in breakage","450°F/232°C heat protection","Transparency: the comparator is stated; limitation: brand-commissioned, no sample size or instrumental method disclosed"]},"experienceItems": {"zh": ["用量：2-3滴即可，倒置轻敲瓶底定量滴取","适用：干发湿发皆可，热造型前后均可，可每日使用","质地：极轻不油腻，无水配方铺展性极佳","经济性：30 mL可用数月，实际单次成本远低于售价印象"],"en": ["Dose: just 2-3 drops, dispensed by inverting and tapping the base","Use: damp or dry hair, before or after heat, suitable daily","Texture: exceptionally light and non-greasy with excellent spread from the waterless base","Economy: 30 mL lasts months, so real cost per use is far below what the price suggests"]},"packagingItems": {"zh": ["视觉：透明玻璃瓶展示金黄色油体，全线中最具珍贵感","功能：定量滴取瓶口控制用量并强化高浓缩认知","规格：30 mL / 60 mL 两档","弱点：玻璃瓶易碎，旅行携带需注意；定量滴取上手需要适应"],"en": ["Visual: clear glass showing the golden oil — the most precious-looking product in the line","Function: the metered-drop neck controls dosage and reinforces the concentration story","Sizes: 30 mL and 60 mL","Weakness: glass is fragile for travel, and the metered-drop method takes a moment to learn"]},"productType": "oil","keyTechnology": {"zh": [{"title": "无需承认损伤的入口型产品设计","desc": "以光泽与热防护而非「修复」为主诉求，使不认为自己头发受损的消费者也能进入品牌系统，突破修护型品牌固有的客群天花板。"},{"title": "无水高浓缩配方设计","desc": "完全去水的硅油基底使单次用量压缩到2-3滴，既支撑「高浓缩」的价值主张，也让30 mL的小规格具备数月使用周期。"},{"title": "包装参与浓度感知的设计","desc": "定量滴取瓶口与β-胡萝卜素带来的金黄色油体共同构建「珍贵·高浓缩」认知，几乎不增加配方成本。"},{"title": "明确对照条件的宣称披露","desc": "关键数据标注对照组（未使用本品的漂发），在自行委托测试的行业惯例中提供了相对更高的可验证性。"}],"en": [{"title": "Entry-Product Design That Requires No Admission of Damage","desc": "Leading on shine and heat protection rather than repair lets consumers who do not consider their hair damaged enter the brand system, breaking the audience ceiling inherent to repair-led brands."},{"title": "Waterless High-Concentration Formulation","desc": "A fully anhydrous silicone base compresses the dose to 2-3 drops, supporting the concentration value claim while giving a small 30 mL size a multi-month life."},{"title": "Packaging as a Concentration Cue","desc": "The metered-drop neck and the beta-carotene golden oil together build a precious, highly-concentrated perception at almost no formulation cost."},{"title": "Claim Disclosure With a Stated Comparator","desc": "Headline data names its control (bleached hair without the product), offering relatively higher verifiability within an industry norm of brand-commissioned testing."}]},"addedAt": 19}]; const KEY='competitor-library-v35';

function brandConceptHtml(p){

  if(tagline||statement){
    const joined=(tagline?`<span class="concept-tag">\u201c${esc(tagline)}\u201d</span>`:'')+(tagline&&statement?' \u2014 ':'')+(statement?esc(statement):'');
    return `<div class="section"><div class="section-head">${t.brandConcept}</div><div class="section-body"><p class="concept-quote">${joined}</p></div></div>`;
  }
  const bc=biObj(p.brandConceptRich);
  if(bc && bc.tagline){
    const joined=`<span class="concept-tag">\u201c${esc(bc.tagline)}\u201d</span>`+(bc.concept?` \u2014 ${esc(bc.concept)}`:'');
    return `<div class="section"><div class="section-head">${t.brandConcept}</div><div class="section-body"><p class="concept-quote">${joined}</p></div></div>`;
  }
  return section(t.brandConcept,'brandConcept',p);

function fmtDateSlash(iso){
  const d=new Date(iso);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}

function renderFeedbackItems(root,rows){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!rows.length){
    list.innerHTML=`<span class="feedback-empty">${tr().feedbackEmpty}</span>`;
    return;
  }
  list.innerHTML=rows.map(r=>`<div class="feedback-item" data-cid="${r.id}"><div class="feedback-item-head"><span class="feedback-item-name">${esc(r.name)}</span><div class="feedback-item-date-wrap"><span class="feedback-item-date">${fmtDateSlash(r.created_at)}</span><button class="feedback-item-del" data-del="${r.id}" title="Delete">✕</button></div></div><p class="feedback-item-text">${esc(r.comment)}</p></div>`).join('');
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=async()=>{
      if(!sbClient) return;
      try{
        await sbClient.from(SB_TABLE).delete().eq('id',btn.dataset.del);
        btn.closest('.feedback-item').remove();
        if(!list.querySelector('.feedback-item')) list.innerHTML=`<span class="feedback-empty">${tr().feedbackEmpty}</span>`;
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }
    };
  });
}

async function loadFeedback(root,pid){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!sbClient){
    list.innerHTML=`<span class="feedback-loading">${lang==='zh'?'评论功能未连接':'Comments not connected'}</span>`;
    return;
  }
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('*').eq('product_id',pid).order('created_at',{ascending:true});
    if(error) throw error;
    renderFeedbackItems(root,data||[]);
  }catch(err){
    console.warn(err);
    list.innerHTML=`<span class="feedback-loading">${tr().feedbackLoadErr}</span>`;
  }
  const addBtn=root.querySelector('#feedbackAddBtn');
  if(addBtn){
    addBtn.onclick=async()=>{
      const nameEl=root.querySelector('#feedbackName');
      const textEl=root.querySelector('#feedbackText');
      const name=nameEl.value.trim(), comment=textEl.value.trim();
      if(!name||!comment){ toast(tr().feedbackNeedBoth); return; }
      addBtn.disabled=true;
      try{
        const {error}=await sbClient.from(SB_TABLE).insert({product_id:pid,name,comment});
        if(error) throw error;
        nameEl.value='';textEl.value='';
        await loadFeedback(root,pid);
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }finally{
        addBtn.disabled=false;
      }
    };
  }
}

function compressImage(file,maxDim=1200,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
