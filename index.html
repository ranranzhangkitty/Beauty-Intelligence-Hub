function sdoc(p){

    const parts=bothLang(p[k]).filter(Boolean);
    if(!parts.length)return;
    const text=parts.join(' · ');
    fields.push({key:k,label,w,text,n:nrm(text)});
  });

function snip(text,raw){

  const a=Math.max(0,i-16),b=Math.min(text.length,i+raw.length+30);

  if(!has)return '';

}
function scoreProduct(p){
  if(!SQ.terms.length&&!SQ.excl.length)return{score:0,hits:[]};
  const d=sdoc(p);
  for(const e of SQ.excl){if(d.blob.includes(e.n))return null}

function fmtDateSlash(iso){
  const d=new Date(iso);
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}

function renderFeedbackItems(root,rows){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!rows.length){
    list.innerHTML=`<p class="n-body-text" style="opacity:.6">${tr().feedbackEmpty}</p>`;
    return;
  }
  list.innerHTML=rows.map(r=>`<div class="n-comment" data-cid="${r.id}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:11.5px;color:var(--n-ink)">${esc(r.name)}</b><span style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;opacity:.55;color:var(--n-soft)">${fmtDateSlash(r.created_at)}</span><button data-del="${r.id}" title="Delete" style="border:none;background:none;cursor:pointer;color:var(--n-soft);font-size:11px;padding:2px">\u2715</button></span></div><p style="margin:4px 0 0;font-size:12.5px;line-height:1.5;color:oklch(0.32 0 0)">${esc(r.comment)}</p></div>`).join('');
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=async()=>{
      if(!sbClient) return;
      try{
        await sbClient.from(SB_TABLE).delete().eq('id',btn.dataset.del);
        btn.closest('.n-comment').remove();
        if(!list.querySelector('.n-comment')) list.innerHTML=`<p class="n-body-text" style="opacity:.6">${tr().feedbackEmpty}</p>`;
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }
    };
  });
}

async function loadFeedback(root,pid){
  const list=root.querySelector('#feedbackList');
  if(!list) return;
  if(!sbClient){
    list.innerHTML=`<span class="feedback-loading">${lang==='zh'?'评论功能未连接':'Comments not connected'}</span>`;
    return;
  }
  try{
    const {data,error}=await sbClient.from(SB_TABLE).select('*').eq('product_id',pid).order('created_at',{ascending:true});
    if(error) throw error;
    renderFeedbackItems(root,data||[]);
  }catch(err){
    console.warn(err);
    list.innerHTML=`<span class="feedback-loading">${tr().feedbackLoadErr}</span>`;
  }
  const addBtn=root.querySelector('#feedbackAddBtn');
  if(addBtn){
    addBtn.onclick=async()=>{
      const nameEl=root.querySelector('#feedbackName');
      const textEl=root.querySelector('#feedbackText');
      const name=nameEl.value.trim(), comment=textEl.value.trim();
      if(!name||!comment){ toast(tr().feedbackNeedBoth); return; }
      addBtn.disabled=true;
      try{
        const {error}=await sbClient.from(SB_TABLE).insert({product_id:pid,name,comment});
        if(error) throw error;
        nameEl.value='';textEl.value='';
        await loadFeedback(root,pid);
      }catch(err){
        console.warn(err);
        toast(tr().feedbackSendErr);
      }finally{
        addBtn.disabled=false;
      }
    };
  }
}

async function exportPptx(listArg){
  if(typeof PptxGenJS==='undefined'){toast(lang==='zh'?'PPT组件加载失败，请确认网络连接':'PPT library failed to load; check your connection');return}
  const savedLang=lang;
  lang='en';
  const exportList=(listArg&&listArg.length)?listArg:(selectedForExport.size?products.filter(p=>selectedForExport.has(p.id)):products);

  function imgOpt(u){ return u&&u.startsWith('data:') ? {data:u} : {path:u}; }
  const ACCENT='C15B72';
  const INK='1A1D24';
  const GREY='8A8F9C';

  function estLines(str,charsPerLine){ return Math.max(1,Math.ceil((str||'').length/charsPerLine)); }

  // Builds the whole deck. includeImages=false is used as a fallback when a product image
  // fails to embed (e.g. the source site blocks cross-origin image loading), so the export
  // still succeeds with text-only slides rather than failing the whole download.
  function buildDeck(includeImages){
  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE';
  pptx.author='Competitor Library';
  pptx.subject='Competitive intelligence';
  pptx.title='Competitor Library';
  pptx.company='Internal';
  pptx.lang='en-US';

  exportList.forEach((p)=>{
    const slide=pptx.addSlide();
    slide.background={color:'FFFFFF'};
    slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:0.14,h:7.5,fill:{color:ACCENT},line:{type:'none'}});

    const leftX=0.55, leftW=8.5;
    slide.addText(bi(p.name),{x:leftX,y:0.32,w:leftW,h:0.55,fontFace:'Georgia',bold:true,fontSize:24,color:INK,valign:'top'});
    const catLbl=catLabel(p.category);
    slide.addText(`${catLbl} · ${typeLabel(p.productType,p.vertical)||''}`,{x:leftX,y:0.88,w:leftW,h:0.25,fontFace:'Montserrat',fontSize:11,color:GREY});

    let y=1.35;
    function label(text,x,w,y0){
      slide.addText(text,{x,y:y0!==undefined?y0:y,w,h:0.24,fontFace:'Montserrat',fontSize:10.5,bold:true,color:ACCENT,charSpacing:1});
    }
    function value(text,x,y0,w,fontSize,lines,italic){
      slide.addText(text||'—',{x,y:y0,w,h:0.24*lines+0.1,fontFace:'Montserrat',fontSize:fontSize||13,color:INK,italic:!!italic,valign:'top'});
    }

    // Row 1: Net Volume + Price | Price Position
    const halfW=(leftW-0.4)/2;
    label(lang==='zh'?'容量与价格':'Net Volume + Price',leftX,halfW);
    const npText=[bi(p.capacity),bi(p.price)].filter(Boolean).join(' · ');
    value(npText,leftX,y+0.26,halfW,13,estLines(npText,42));

    const pp=biObj(p.pricePositioning);
    if(pp){
      const tiers=['mass','masstige','premium','luxury'];
      const idx=tiers.indexOf(pp.tier);
      const segX=leftX+halfW+0.4;
      tiers.forEach((tname,i)=>{
        slide.addShape(pptx.ShapeType.rect,{x:segX+i*0.85,y:y+0.03,w:0.78,h:0.07,fill:{color:i===idx?ACCENT:'E7E9EC'},line:{type:'none'}});
      });
      slide.addText(pp.label||'',{x:segX,y:y+0.18,w:halfW,h:0.28,fontFace:'Montserrat',fontSize:12,bold:true,color:INK});
    }
    y+=0.72;

    // Brand Concept
    const bc=biObj(p.brandConceptRich);
    const taglineTxt=bc&&bc.tagline?`"${bc.tagline}"`:(bi(p.brandTagline)?`"${bi(p.brandTagline)}"`:'');
    if(taglineTxt){
      label(lang==='zh'?'品牌概念':'Brand Concept',leftX,leftW);
      y+=0.26;
      slide.addText(taglineTxt,{x:leftX,y,w:leftW,h:0.3,fontFace:'Montserrat',fontSize:13,italic:true,color:INK});
      y+=0.44;
    }

    // --- Remaining flexible-length sections: Positioning, Key Technology, Key Claims, Core Ingredients ---
    // Compute all texts up front so we can fit them into the remaining space without overflowing the slide.
    const targetPhrase=biList(p.targetUsers).slice(0,2).join(', ');
    const posText=[targetPhrase?`For ${targetPhrase}`:'',bi(p.positioning)].filter(Boolean).join(' — ');
    const techTxt=biList(p.keyTechnology).map(x=>x.title).join(' · ');
    const claimsTxt=biList(p.keyClaims).join(' · ');
    let ingTxt=biList(p.heroIngredients).map(x=>x.name).join(', ');
    if(!ingTxt) ingTxt=bi(p.ingredients);

    const sections=[
      {label:lang==='zh'?'定位':'Positioning',text:posText},
      {label:lang==='zh'?'核心技术':'Key Technology',text:techTxt},
      {label:lang==='zh'?'核心卖点':'Key Claims',text:claimsTxt},
      {label:lang==='zh'?'核心成分':'Core Ingredients',text:ingTxt}
    ].filter(s=>s.text);

    // Budget: leave room for the source line near the bottom of the slide.
    const budget=7.0-y;
    const baseFontSize=13, baseCpl=68, baseLineH=0.24, baseGap=0.26+0.22; // label height (0.26) + line height + inter-section gap

    // Find the largest font size (stepping down from 13pt) whose estimated total height fits the budget.
    const candidateSizes=[13,12,11,10,9,8.5,8];
    let chosenSize=8, chosenCpl=baseCpl*(baseFontSize/8);
    for(const fs of candidateSizes){
      const cpl=Math.round(baseCpl*(baseFontSize/fs));
      const totalH=sections.reduce((sum,s)=>sum+0.26+baseLineH*(fs/baseFontSize)*estLines(s.text,cpl)+0.22,0);
      if(totalH<=budget || fs===8){ chosenSize=fs; chosenCpl=cpl; break; }
    }
    const lineH=baseLineH*(chosenSize/baseFontSize);

    sections.forEach(s=>{
      label(s.label,leftX,leftW,y);
      y+=0.26;
      const lines=estLines(s.text,chosenCpl);
      slide.addText(s.text,{x:leftX,y,w:leftW,h:lineH*lines+0.1,fontFace:'Montserrat',fontSize:chosenSize,color:INK,valign:'top'});
      y+=lineH*lines+0.22;
    });

    // Source (link only, same color as body text)
    if(p.sources && p.sources[0]){
      slide.addText(p.sources[0][1],{x:leftX,y:Math.min(y+0.05,7.25),w:leftW,h:0.25,fontFace:'Montserrat',fontSize:9,color:INK});
    }

    // Images (right column, clean product shots, up to 3) — spans full content height for even distribution
    if(includeImages){
      const images=(p.images||[]).slice(0,3);
      const imgX=9.35, imgW=3.45;
      const imgTop=1.35, imgBottom=7.1, imgSpan=imgBottom-imgTop;
      if(images[0]){
        const h0=images.length>1?imgSpan*0.62:imgSpan;
        try{ slide.addImage({...imgOpt(images[0]),x:imgX,y:imgTop,w:imgW,h:h0,sizing:{type:'contain',w:imgW,h:h0}}); }catch(e){}
        if(images[1]){
          const y2=imgTop+h0+0.2;
          const h2=imgBottom-y2;
          const halfImgW=(imgW-0.15)/2;
          try{ slide.addImage({...imgOpt(images[1]),x:imgX,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
          if(images[2]){
            try{ slide.addImage({...imgOpt(images[2]),x:imgX+halfImgW+0.15,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
          }
        }
      }
    }
  });
  return pptx;
  }

  try{
    const pptx=buildDeck(true);
    await pptx.writeFile({fileName:'Competitor_Library_EN.pptx'});
  }catch(err){
    console.error('exportPptx with images failed, retrying without images:',err);
    try{
      const pptxNoImg=buildDeck(false);
      await pptxNoImg.writeFile({fileName:'Competitor_Library_EN.pptx'});
      toast(savedLang==='zh'?'部分产品图片加载失败，已生成不含图片的幻灯片':'Some product images failed to load; generated slides without images instead');
    }catch(err2){
      console.error('exportPptx retry without images also failed:',err2);
      toast((savedLang==='zh'?'幻灯片生成出错：':'Slide generation error: ')+(err2&&err2.message?err2.message:err2));
    }
  }finally{
    lang=savedLang;
  }
}

function notesShell(){return `<div class="notes-head"><div><div class="notes-eyebrow">TEAM SCREENSHOT LIBRARY</div><h1 class="notes-title">速记</h1><p class="notes-desc">团队共享的新品、趋势与市场截图情报库。</p></div><button class="notes-upload" id="notesUpload">＋ 上传截图</button></div><div class="notes-tools"><input id="notesSearch" placeholder="搜索品牌、产品、看点、功效或 OCR 原文"><div class="notes-pills">${noteCats.map(c=>`<button class="notes-pill${c===notesCat?' on':''}" data-ncat="${c}">${c}</button>`).join('')}</div></div><div id="notesList"></div>`}
function renderNotes(){const root=document.getElementById('notesView');if(!root||!notesMode)return;if(!notesSession){root.innerHTML='<div class="notes-empty">正在准备速记库…</div>';return}root.innerHTML=notesShell();root.querySelector('#notesUpload').onclick=openNoteUpload;root.querySelector('#notesSearch').oninput=e=>{notesQuery=e.target.value;paintNotes()};root.querySelectorAll('[data-ncat]').forEach(b=>b.onclick=()=>{notesCat=b.dataset.ncat;renderNotes()});paintNotes()}
function paintNotes(){const box=document.getElementById('notesList');if(!box)return;if(!notesLoaded){box.innerHTML='<div class="notes-empty">读取截图库…</div>';return}if(notesLoaded==='error'){box.innerHTML='<div class="notes-empty">截图库尚未连接。请先运行 Supabase 配置 SQL。</div>';return}const q=notesQuery.toLowerCase();const rows=notesRows.filter(r=>(notesCat==='全部'||r.category===notesCat)&&(!q||[r.title,r.brand,r.core_highlight,r.core_benefit,r.ocr_text,r.source].join(' ').toLowerCase().includes(q)));if(!rows.length){box.innerHTML='<div class="notes-empty">还没有匹配的截图。登录后可从手机相册批量上传。</div>';return}box.innerHTML=`<div class="notes-grid">${rows.map(r=>`<article class="note-card" data-note="${r.id}"><div class="note-thumb">${r.image_urls?.[0]?`<img src="${esc(r.image_urls[0])}">`:''}${r.image_paths?.length>1?`<span class="note-count">${r.image_paths.length} 张依据</span>`:''}</div><div class="note-body"><span class="note-kind">${esc(r.category)}</span><span style="float:right;font-size:10px;color:#888">${esc(r.status)}</span><div class="note-name">${esc(r.title||r.brand||'待整理截图')}</div>${r.core_highlight?`<div class="note-insight"><b>核心看点</b>${esc(r.core_highlight)}</div>`:''}${r.core_benefit?`<div class="note-insight"><b>核心功效</b>${esc(r.core_benefit)}</div>`:''}<div class="note-facts">${esc([r.price,r.launch_date,r.market].filter(Boolean).join(' · '))}</div><div class="note-meta">${esc([r.brand,r.source].filter(Boolean).join(' · '))}<br>录入于 ${nd(r.created_at)}</div></div></article>`).join('')}</div>`;box.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>openNoteDetail(x.dataset.note))}
function noteModal(html){const wrap=document.createElement('div');wrap.className='notes-overlay';wrap.innerHTML=`<div class="notes-modal">${html}</div>`;document.body.appendChild(wrap);wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.closest('.notes-close'))wrap.remove()});return wrap}
function fields(r,editable){const field=(key,label,type='input')=>`<label>${label}${type==='textarea'?`<textarea data-field="${key}" ${editable?'':'readonly'}>${esc(r[key]||'')}</textarea>`:`<input data-field="${key}" value="${esc(r[key]||'')}" ${editable?'':'readonly'}>`}</label>`;return `<div class="notes-fields"><label>分类<select data-field="category" ${editable?'':'disabled'}>${noteCats.slice(1).map(c=>`<option${r.category===c?' selected':''}>${c}</option>`).join('')}</select></label>${field('status','状态')}<div class="notes-wide">${field('title','标题')}</div>${field('brand','品牌')}${field('source','来源平台')}${field('price','价格 / 规格')}${field('launch_date','上市时间')}${field('market','上市市场')}<div class="notes-wide">${field('core_highlight','核心看点','textarea')}</div><div class="notes-wide">${field('core_benefit','核心功效（含功效宣称）','textarea')}</div><div class="notes-wide">${field('consumer_insight','消费者洞察','textarea')}</div><div class="notes-wide">${field('ocr_text','OCR 原文','textarea')}</div></div>`}
function openNoteDetail(id){const r=notesRows.find(x=>x.id===id);if(!r)return;let active=0,editable=notesSession?.user?.id===r.uploaded_by;const draw=()=>{modal.querySelector('.notes-modal').innerHTML=`<div class="notes-modal-top"><div><div class="note-kind">${esc(r.category)} · ${esc(r.status)}</div><h2 style="margin:5px 0">${esc(r.title||r.brand||'待整理截图')}</h2></div><button class="notes-close">关闭</button></div><div class="notes-hero">${r.image_urls?.[active]?`<img src="${esc(r.image_urls[active])}">`:''}</div><div class="notes-photos">${(r.image_urls||[]).map((u,i)=>`<button class="notes-photo${i===active?' active':''}" data-img="${i}"><img src="${esc(u)}"></button>`).join('')}</div>${fields(r,editable)}${editable?'<button class="notes-save" id="noteSave">保存修改</button>':'<p class="notes-desc">由上传者维护此条信息。</p>'}`;modal.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{active=+b.dataset.img;draw()});const save=modal.querySelector('#noteSave');if(save)save.onclick=async()=>{const patch={};modal.querySelectorAll('[data-field]').forEach(x=>patch[x.dataset.field]=x.value.trim());const {error}=await sbClient.from(NOTES_TABLE).update(patch).eq('id',r.id);if(error){toast('保存失败');return}Object.assign(r,patch);toast('已保存');draw();paintNotes()}};const modal=noteModal('');draw()}
async function compressImage(file){try{const img=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/webp',.8))}catch(e){return file}}
function openNoteUpload(){const modal=noteModal(`<div class="notes-modal-top"><div><div class="note-kind">TEAM UPLOAD</div><h2 style="margin:5px 0">上传截图</h2></div><button class="notes-close">关闭</button></div><div class="notes-upload-box"><label class="notes-file-label" for="notesFiles">选择图片（最多 20 张）</label><input id="notesFiles" type="file" accept="image/*" multiple><div id="notesFileList" class="notes-desc">图片会压缩后上传，原图仍保留在手机相册。</div></div><label style="font-size:12px"><input id="notesCombine" type="checkbox"> 将选中的图片合并为同一新品/主题（多张依据）</label><br><button class="notes-upload" id="notesStart" style="margin-top:14px">开始上传</button>`);let files=[];modal.querySelector('#notesFiles').onchange=e=>{files=[...e.target.files].slice(0,20);modal.querySelector('#notesFileList').textContent=files.length?`已选择 ${files.length} 张图片`:'请选择图片'};modal.querySelector('#notesStart').onclick=async()=>{if(!files.length){toast('请选择图片');return}const btn=modal.querySelector('#notesStart');btn.disabled=true;btn.textContent='上传中…';try{const paths=[];for(let i=0;i<files.length;i++){btn.textContent=`上传中 ${i+1} / ${files.length}`;const blob=await compressImage(files[i]);const path=`${notesSession.user.id}/${crypto.randomUUID()}.${blob.type==='image/webp'?'webp':'jpg'}`;const {error}=await sbClient.storage.from(NOTES_BUCKET).upload(path,blob,{contentType:blob.type,upsert:false});if(error)throw error;paths.push(path)}const combine=modal.querySelector('#notesCombine').checked;const rows=combine?[{image_paths:paths}]:paths.map(p=>({image_paths:[p]}));const {error}=await sbClient.from(NOTES_TABLE).insert(rows.map(x=>({...x,uploaded_by:notesSession.user.id,category:'待整理',status:'待整理'})));if(error)throw error;toast(`已上传 ${files.length} 张截图`);modal.remove();await loadNotes()}catch(e){console.warn(e);toast('上传失败，请检查 Supabase 配置')}finally{btn.disabled=false;btn.textContent='开始上传'}}}

  if(btn) btn.onclick=async()=>{
    const w=wt();
    const nameEl=root.querySelector('#wlName'),prodEl=root.querySelector('#wlProd'),whyEl=root.querySelector('#wlWhy');
    const name=nameEl.value.trim(),prodInput=prodEl.value.trim(),why=whyEl.value.trim();
    if(!name){toast(w.needName);nameEl.focus();return}
    if(!prodInput){toast(w.needProd);prodEl.focus();return}
    if(!sbClient){toast(w.notConnected);return}
    const isUrl=/^https?:\/\//i.test(prodInput);
    const prod=isUrl?'':prodInput;
    const url=isUrl?prodInput:'';
    btn.disabled=true;
    try{
      const {data,error}=await sbClient.from(SB_REQ)
        .insert({product_name:prod,product_url:url,requester_name:name,reason:why,status:'todo'}).select().single();
      if(error) throw error;
      localStorage.setItem(NAME_KEY,name);
      await sbClient.from(SB_VOTE).insert({request_id:data.id,voter_key:voterId()});
      prodEl.value='';whyEl.value='';
      wlFilter='all';
      await loadWishlist(); renderWishlistTable();
      toast(w.added);
    }catch(err){console.warn(err);toast(w.errSave)}
    finally{btn.disabled=false}
  };
  root.addEventListener('click',async e=>{
    const w=wt();
    const v=e.target.closest('[data-wv]');
    if(v){
      const id=v.dataset.wv, row=wlRows.find(r=>r.id===id);
      if(!row||!sbClient) return;
      v.disabled=true;
      try{
        if(row.mine){
          await sbClient.from(SB_VOTE).delete().eq('request_id',id).eq('voter_key',voterId());
          row.mine=false;row.votes=Math.max(0,row.votes-1);
        }else{
          await sbClient.from(SB_VOTE).insert({request_id:id,voter_key:voterId()});
          row.mine=true;row.votes+=1;
        }
        renderWishlistTable();
      }catch(err){console.warn(err);toast(w.errSave)}
      return;
    }
    const g=e.target.closest('[data-wg]');
    if(g){selected=g.dataset.wg;wishMode=false;gridMode=false;render();window.scrollTo({top:0,behavior:'smooth'});return}
    const d=e.target.closest('[data-wd]');
    if(d){
      if(!confirm(w.confirmDel)) return;
      try{
        await sbClient.from(SB_REQ).delete().eq('id',d.dataset.wd);
        wlRows=wlRows.filter(r=>r.id!==d.dataset.wd);
        renderWishlistTable(); toast(w.removed);
      }catch(err){console.warn(err);toast(w.errSave)}
    }
  });
  root.addEventListener('change',async e=>{
    const sel=e.target.closest('[data-wst]');
    if(!sel) return;
    const id=sel.dataset.wst, row=wlRows.find(r=>r.id===id);
    if(!row) return;
    const prev=row.status; row.status=sel.value;
    renderWishlistTable();
    try{
      const {error}=await sbClient.from(SB_REQ).update({status:sel.value}).eq('id',id);
      if(error) throw error;
    }catch(err){console.warn(err);row.status=prev;renderWishlistTable();toast(wt().errSave)}
  });
}

function render(){renderChrome();renderSidebar();renderDetail();renderWishlist();renderNotes();applyHighlight();
document.getElementById('wishlistOverlay').style.display=wishMode?'block':'none';
document.getElementById('wishlistView').style.display=wishMode?'block':'none';
document.getElementById('notesView').style.display=notesMode?'block':'none';
document.getElementById('workspace').style.display=(wishMode||notesMode)?'none':'flex';
document.querySelector('.n-tab-row').style.display=notesMode?'none':'';document.querySelector('.n-toolbar').style.display=notesMode?'none':'';document.getElementById('statLine').style.display=notesMode?'none':'';
if(wishMode||notesMode){const eb=document.getElementById('exportBar');if(eb)eb.style.display='none';}
const gb=document.getElementById('gridToggle');if(gb)gb.classList.toggle('on',gridMode);
const wb=document.getElementById('wishToggle');if(wb)wb.classList.toggle('active',wishMode);const nb=document.getElementById('notesToggle');if(nb)nb.classList.toggle('active',notesMode)}
document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};document.getElementById('filterType').onchange=e=>{ptype=e.target.value;render()};let gridSpins=0;
const TYPE_ORDER=['shampoo','conditioner','mask','serum','oil','mist','gel','supplement','cleanser','toner','essence','cream','sunscreen'];
function applySortAndSave(){
  if(sortMode==='brand'){
    products.sort((a,b)=>{
      const bc=bi(a.brand).toLowerCase().localeCompare(bi(b.brand).toLowerCase(),'en',{sensitivity:'base'});
      if(bc!==0) return bc;
      return TYPE_ORDER.indexOf(a.productType)-TYPE_ORDER.indexOf(b.productType);
    });
  }else{
    products.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  }
  save();
}
document.getElementById('sortBrandBtn').onclick=()=>{
  sortMode=(sortMode==='brand')?'added':'brand';
  applySortAndSave();
  render();
  toast(sortMode==='brand'?(lang==='zh'?'已按品牌排序':'Sorted by brand'):(lang==='zh'?'已按添加时间排序':'Sorted by date added'));
};
document.getElementById('gridToggle').onclick=()=>{
  if(wishMode){wishMode=false;gridMode=true;}else{gridMode=!gridMode;}
  render();
};
document.getElementById('vertBodyBtn').onclick=()=>{
  if(vertical!=='body'){vertical='body';filter='all';ptype='all';selected=null;render()}
};document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};
document.getElementById('vertHairBtn').onclick=()=>{if(vertical!=='hair'){vertical='hair';filter='all';ptype='all';selected=null;render()}};
document.getElementById('vertSkinBtn').onclick=()=>{if(vertical!=='skincare'){vertical='skincare';filter='all';ptype='all';selected=null;render()}};document.getElementById('pdfBtn').onclick=()=>{const L=exportScope();if(!L.length)return;buildPrintArea(L);document.body.classList.add('print-all');setTimeout(()=>window.print(),60)};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
document.getElementById('slidesBtn').onclick=()=>{const L=exportScope();if(!L.length)return;exportPptx(L)};
document.getElementById('wishToggle').onclick=async()=>{
  wishMode=!wishMode;notesMode=false;
  render();
  if(wishMode){ await loadWishlist(); renderWishlistTable(); }
};
document.getElementById('notesToggle').onclick=async()=>{notesMode=!notesMode;wishMode=false;render();if(notesMode){await noteSession();renderNotes();if(notesSession)loadNotes()}};
render();
loadWishlist().then(()=>{wlBadge();if(wishMode)renderWishlistTable()});

})();
</script></body></html>
