<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>竞品情报库</title>
<style>
  :root{
    --ink:#20302C;
    --ink-soft:#4B584F;
    --paper:#EFEDE2;
    --card:#FFFFFF;
    --plinth:#F5F3EA;
    --line:#DDD8C6;
    --honey:#BE8F35;
    --honey-soft:#EFDFB2;
    --sage:#5B6B4F;
    --sage-soft:#DCE3D1;
    --plum:#8B5A6B;
    --plum-soft:#E7D6DC;
    --grey:#8B8A7D;
    --grey-soft:#E7E5DA;
    --shadow: 0 1px 3px rgba(32,48,44,0.05), 0 12px 28px rgba(32,48,44,0.08);
    --serif: "Noto Serif SC","Songti SC","STSong",serif;
    --sans: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1220px;margin:0 auto;padding:44px 30px 110px;}

  header.hero{
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:20px;flex-wrap:wrap;
  }
  .hero-left .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--honey);font-weight:700;margin-bottom:10px;}
  .hero-left h1{font-family:var(--serif);font-size:38px;margin:0 0 8px;font-weight:700;letter-spacing:.01em;}
  .hero-left p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:540px;line-height:1.7;}
  .hero-right{display:flex;gap:0;flex-wrap:wrap;align-items:center;}
  .stat{font-family:var(--serif);text-align:center;padding:6px 18px;border-left:1px solid var(--line);}
  .stat b{display:block;font-size:24px;line-height:1;}
  .stat span{font-size:10px;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;}

  .notice{
    background:var(--honey-soft);color:#5C4514;border:1px solid var(--honey);
    border-radius:4px;padding:10px 14px;font-size:12px;margin-bottom:22px;display:none;line-height:1.6;
  }
  .notice.show{display:block;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;align-items:center;justify-content:space-between;}
  .toolbar-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input.search{
    font-family:var(--sans);border:1px solid var(--line);background:var(--card);border-radius:3px;
    padding:9px 12px;font-size:13px;min-width:220px;color:var(--ink);
  }
  input.search:focus{outline:2px solid var(--honey);outline-offset:1px;}
  select.filter{
    font-family:var(--sans);border:1px solid var(--line);background:var(--card);border-radius:3px;
    padding:9px 10px;font-size:13px;color:var(--ink);
  }
  button{
    font-family:var(--sans);cursor:pointer;border-radius:3px;font-size:12.5px;padding:9px 14px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{box-shadow:var(--shadow);}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--honey);outline-offset:2px;}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;}
  .btn-honey{background:var(--honey);color:#2A2109;border-color:var(--honey);font-weight:600;}
  .btn-ghost{background:transparent;}
  .btn-lang{font-weight:700;border-color:var(--ink);min-width:44px;}

  .workspace{display:flex;gap:22px;align-items:flex-start;}
  .sidebar{flex:0 0 132px;display:flex;flex-direction:column;gap:10px;}
  .side-item{
    border:1px solid var(--line);border-radius:4px;background:var(--card);padding:8px 8px 9px;
    cursor:pointer;position:relative;text-align:center;transition:box-shadow .12s, border-color .12s;
  }
  .side-item:hover{box-shadow:var(--shadow);}
  .side-item.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft) inset;}
  .side-num{
    position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--ink);
    color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);z-index:1;
  }
  .side-thumb{width:100%;height:64px;object-fit:contain;background:var(--plinth);border-radius:3px;display:block;}
  .side-thumb-empty{width:100%;height:64px;background:var(--plinth);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:18px;}
  .side-name{font-size:10.5px;line-height:1.35;margin-top:6px;color:var(--ink-soft);max-height:2.7em;overflow:hidden;}
  .side-cat-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-top:5px;}
  .side-cat-dot[data-catdot="japan"]{background:var(--honey);}
  .side-cat-dot[data-catdot="korea"]{background:var(--plum);}
  .side-cat-dot[data-catdot="usa"]{background:var(--sage);}

  .empty{text-align:center;padding:80px 20px;color:var(--grey);border:1px dashed var(--line);border-radius:6px;}
  .empty .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px;}

  .card, .detail{
    background:var(--card);border:1px solid var(--line);border-radius:4px;position:relative;
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-wrap:wrap;flex:1;min-width:0;
  }
  .card .stripe, .detail .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;z-index:2;background:var(--grey-soft);pointer-events:none;}
  [data-cat="japan"] .stripe{background:var(--honey);}
  [data-cat="korea"] .stripe{background:var(--plum);}
  [data-cat="usa"] .stripe{background:var(--sage);}

  .media{flex:1 1 260px;min-width:240px;display:flex;flex-direction:column;background:var(--plinth);border-right:1px solid var(--line);}
  .media-hero{position:relative;flex:1;min-height:300px;display:flex;align-items:center;justify-content:center;padding:26px 22px;}
  .media-hero img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(32,48,44,.14));}
  .media-hero .placeholder{
    color:var(--grey);font-size:12.5px;text-align:center;line-height:1.7;
    display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:var(--sans);
  }
  .media-hero .placeholder:hover{color:var(--honey);}
  .media-hero .placeholder .icon{font-size:26px;}
  .media-thumbs{display:flex;gap:6px;padding:10px 14px 14px;flex-wrap:wrap;}
  .thumb{
    width:42px;height:42px;border-radius:3px;overflow:hidden;border:1.5px solid transparent;background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;
  }
  .thumb img{max-width:100%;max-height:100%;object-fit:contain;}
  .thumb.active{border-color:var(--honey);}
  .thumb .thumb-remove{
    position:absolute;top:-4px;right:-4px;width:14px;height:14px;line-height:12px;
    background:var(--ink);color:#fff;border-radius:50%;font-size:9px;text-align:center;
    border:none;cursor:pointer;padding:0;opacity:0;transition:opacity .12s;
  }
  .thumb:hover .thumb-remove{opacity:1;}
  .thumb-add{
    width:42px;height:42px;border-radius:3px;border:1.5px dashed var(--line);background:none;color:var(--grey);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .thumb-add:hover{color:var(--honey);border-color:var(--honey);}

  .content{flex:2 1 320px;min-width:300px;padding:26px 28px 20px;display:flex;flex-direction:column;}
  .content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .idx{font-family:var(--serif);font-size:11px;color:var(--grey);letter-spacing:.08em;}
  select.cat-pill{
    font-size:10.5px;letter-spacing:.04em;padding:3px 10px;border-radius:20px;font-weight:700;
    border:none;cursor:pointer;background:var(--grey-soft);color:var(--ink-soft);font-family:var(--sans);
  }
  [data-cat="japan"] select.cat-pill{background:var(--honey-soft);color:#7A5A18;}
  [data-cat="korea"] select.cat-pill{background:var(--plum-soft);color:var(--plum);}
  [data-cat="usa"] select.cat-pill{background:var(--sage-soft);color:var(--sage);}

  .pname{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.28;outline:none;margin:0 0 6px;cursor:text;}
  .pname:hover, .editable-inline:hover, .chip-val:hover, .section-body:hover, .note-body:hover{background:rgba(190,143,53,.08);border-radius:2px;}
  .byline{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .byline .editable-inline{outline:none;font-weight:600;cursor:text;}
  .byline .sep{color:var(--line);}
  .byline .origin{color:var(--grey);font-weight:400;}
  [contenteditable]:empty::before{content:attr(data-ph);color:var(--grey);font-weight:400;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px;}
  .chip{background:var(--grey-soft);border-radius:4px;padding:7px 11px;min-width:76px;}
  .chip-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);font-weight:700;margin-bottom:3px;}
  .chip-val{color:var(--ink);font-size:12px;outline:none;cursor:text;line-height:1.4;}
  .chip-val:focus{background:var(--honey-soft);border-radius:2px;}

  .section-box{border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden;}
  .section-head{padding:7px 12px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--grey-soft);color:var(--ink-soft);}
  [data-cat="japan"] .section-head{background:var(--honey-soft);color:#7A5A18;}
  [data-cat="korea"] .section-head{background:var(--plum-soft);color:var(--plum);}
  [data-cat="usa"] .section-head{background:var(--sage-soft);color:var(--sage);}
  .section-body{padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--ink);outline:none;cursor:text;}
  .section-body.concept-body{font-family:var(--serif);font-style:italic;font-size:14.5px;}
  .section-body:focus{background:rgba(190,143,53,.08);}

  .note-box{background:#FBEFC4;border:1px solid #E6D28B;border-radius:4px;padding:11px 14px;margin-top:2px;color:#5C4514;}
  .note-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#8A6A1E;margin-bottom:6px;display:block;}
  .note-body{outline:none;cursor:text;min-height:16px;font-size:12px;line-height:1.6;}
  .note-body:focus{background:rgba(255,255,255,.5);border-radius:2px;}

  .content-foot{
    margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;
    align-items:center;font-size:11px;color:var(--grey);flex-wrap:wrap;gap:8px;
  }
  .src-link{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);}
  .src-link:hover{color:var(--honey);border-color:var(--honey);}
  .icon-btn{background:none;border:none;padding:2px 4px;font-size:11px;color:var(--grey);}
  .icon-btn:hover{color:#8B3A4A;box-shadow:none;text-decoration:underline;}

  .overlay{position:fixed;inset:0;background:rgba(32,48,44,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:6px;max-width:460px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;}
  .modal h2{font-family:var(--serif);margin:0 0 4px;font-size:20px;}
  .modal p.sub{margin:0 0 18px;font-size:12.5px;color:var(--grey);}
  .modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 5px;font-weight:600;}
  .modal input, .modal select, .modal textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink);
  }
  .modal textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .modal-row{display:flex;gap:12px;}
  .modal-row > div{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:4px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer.hint{text-align:center;color:var(--grey);font-size:11.5px;margin-top:44px;}

  @media print{
    body{background:#fff;}
    .toolbar, .overlay, .icon-btn, footer.hint, .thumb-add, .thumb-remove, .notice, .workspace{display:none !important;}
    header.hero{border-bottom:1px solid #999;}
    #printArea{display:block !important;}
    .card{break-inside:avoid;box-shadow:none;border:1px solid #999;margin-bottom:18px;}
    .media-hero{min-height:220px;}
  }
  @media (max-width:900px){
    .workspace{flex-direction:column;}
    .sidebar{flex-direction:row;flex-wrap:wrap;width:100%;}
    .side-item{flex:0 0 96px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="hero-left">
      <div class="eyebrow" id="txt-eyebrow">Competitive Intelligence</div>
      <h1 id="txt-title">竞品情报库</h1>
      <p id="txt-subtitle"></p>
    </div>
    <div class="hero-right">
      <div class="stat"><b id="statTotal">0</b><span id="txt-statTotal"></span></div>
      <div class="stat"><b id="statJapan">0</b><span>Japan</span></div>
      <div class="stat"><b id="statKorea">0</b><span>Korea</span></div>
      <div class="stat"><b id="statUsa">0</b><span>USA</span></div>
      <div class="stat" style="padding-left:16px;"><button class="btn-lang" id="langBtn">EN</button></div>
    </div>
  </header>

  <div class="notice" id="storageNotice"></div>

  <div class="toolbar">
    <div class="toolbar-group">
      <input class="search" id="searchInput">
      <select class="filter" id="filterCat"></select>
    </div>
    <div class="toolbar-group">
      <button class="btn-honey" id="addBtn"></button>
      <button id="pdfBtn"></button>
      <button id="pptxBtn"></button>
      <button id="shareBtn"></button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="detail" id="detail"></div>
  </div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big" id="emptyBig"></div>
    <div id="emptyDesc"></div>
  </div>
  <div id="printArea" style="display:none;"></div>

  <footer class="hint" id="footerHint"></footer>
</div>

<!-- Add Modal -->
<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2 id="addTitle"></h2>
    <p class="sub" id="addSub"></p>
    <label id="lblName"></label>
    <input id="inName">
    <div class="modal-row">
      <div><label id="lblBrand"></label><input id="inBrand"></div>
      <div><label id="lblOrigin"></label><input id="inOrigin"></div>
    </div>
    <label id="lblUrl"></label>
    <input id="inUrl" placeholder="https://...">
    <label id="lblImg"></label>
    <input id="inImg">
    <label id="lblCat"></label>
    <select id="inCat"></select>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelAdd"></button>
      <button class="btn-primary" id="confirmAdd"></button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="overlay" id="shareOverlay">
  <div class="modal">
    <h2 id="shareTitle"></h2>
    <p class="sub" id="shareDesc"></p>
    <textarea id="shareText" readonly rows="10"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="closeShare"></button>
      <button class="btn-primary" id="copyShare"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      noStorage:'Note: auto-save isn\'t connected on this page (e.g. when this file is opened directly in a browser). Edits stay while you keep browsing but reset on refresh — click "Export PDF" once you\'re done to keep a copy.',
      slideOverview:'Overview', slideDetail:'Key Data', slideCount:(n)=>`${n} competitors included`,
      langSelf:'中文'
    }
  };

  const FIELD_KEYS = ['brandName','originCountry','capacity','priceChannel','brandConcept','ingredients','notes'];

  function tr(){ return T[lang]; }
  function bi(v){
    // v is {zh,en} bilingual object -> returns current-lang string, falling back to zh
    if(!v) return '';
    return v[lang] || v.zh || v.en || '';
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function biField(zhVal, enVal){ return { zh: zhVal || '', en: enVal || '' }; }

  function normalize(c){
    c.fields = c.fields || {};
    if(typeof c.name === 'string') c.name = biField(c.name, '');
    if(c.brand && !c.fields.brandName) c.fields.brandName = biField(c.brand, '');
    delete c.brand;
    if(c.imageUrl && !(Array.isArray(c.imageUrls) && c.imageUrls.length)){ c.imageUrls = [c.imageUrl]; }
    delete c.imageUrl;
    if(!Array.isArray(c.imageUrls)) c.imageUrls = [];
    FIELD_KEYS.forEach(k=>{
      if(typeof c.fields[k] === 'string') c.fields[k] = biField(c.fields[k], '');
      if(!c.fields[k] || typeof c.fields[k] !== 'object') c.fields[k] = biField('', '');
    });
    return c;
  }

  async function loadAll(){
    const notice = document.getElementById('storageNotice');
    if(!hasStorage){
      notice.textContent = tr().noStorage;
      notice.classList.add('show');
    }
    if(hasStorage){
      try{
        const res = await window.storage.get(STORAGE_KEY, false);
        competitors = res && res.value ? JSON.parse(res.value) : [];
      }catch(e){
        competitors = [];
      }
    }else{
      competitors = [];
    }
    competitors = competitors.map(normalize);
    let added = false;
    defaultItems().forEach(item=>{
      if(!competitors.some(c=>c.name.zh === item.name.zh)){
        competitors.push(item);
        added = true;
      }
    });
    if(added) saveAll();
    renderChrome();
    render();
  }

  async function saveAll(){
    if(!hasStorage) return;
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(competitors), false);
    }catch(e){ /* silent: edits remain in-memory for this session */ }
  }

  function fmtDate(iso){
    const d = new Date(iso);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function updateStats(){
    document.getElementById('statTotal').textContent = competitors.length;
    document.getElementById('statJapan').textContent = competitors.filter(c=>c.category==='japan').length;
    document.getElementById('statKorea').textContent = competitors.filter(c=>c.category==='korea').length;
    document.getElementById('statUsa').textContent = competitors.filter(c=>c.category==='usa').length;
  }

  function matchesFilter(c){
    if(filterCat !== 'all' && c.category !== filterCat) return false;
    if(!filterText) return true;
    const hay = (bi(c.name)+' '+bi(c.fields.brandName)+' '+bi(c.fields.originCountry)+' '+CAT_LABELS[lang][c.category]).toLowerCase();
    return hay.includes(filterText.toLowerCase());
  }

  function touch(c){ c.updatedAt = new Date().toISOString(); saveAll(); }
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  // ---------------- Chrome (static UI text) ----------------

    document.getElementById('txt-title').textContent = t.title;
    document.getElementById('txt-subtitle').textContent = t.subtitle;

    document.getElementById('langBtn').textContent = t.langSelf;
    document.getElementById('searchInput').placeholder = t.searchPh;

    filterSel.innerHTML = '';
    const optAll = document.createElement('option'); optAll.value='all'; optAll.textContent=t.filterAll;

    document.getElementById('lblBrand').textContent = t.lblBrand;
    document.getElementById('inBrand').placeholder = t.phBrand;

    document.getElementById('inOrigin').placeholder = t.phOrigin;
    document.getElementById('lblUrl').textContent = t.lblUrl;

    const prevVal = inCat.value || 'japan';

  // ---------------- Sidebar + Detail (master-detail layout) ----------------
  function visibleList(){ return competitors.filter(matchesFilter); }

  function render(){
    updateStats();
    const visible = visibleList();
    const hasAny = competitors.length > 0;
    emptyState.style.display = hasAny ? 'none' : 'block';
    document.getElementById('workspace').style.display = hasAny ? 'flex' : 'none';
    if(!visible.some(c=>c.id===selectedId)){
      selectedId = visible.length ? visible[0].id : null;
    }
    renderSidebar(visible);
    renderDetail(visible);
  }

  function renderSidebar(visible){
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    visible.forEach((c, i)=>{
      const item = document.createElement('div');
      item.className = 'side-item' + (c.id === selectedId ? ' active' : '');
      item.addEventListener('click', ()=>{ selectedId = c.id; render(); });
      const num = document.createElement('div'); num.className = 'side-num'; num.textContent = i+1;
      item.appendChild(num);
      if(c.imageUrls && c.imageUrls[0]){
        const img = document.createElement('img');
        img.className = 'side-thumb'; img.src = c.imageUrls[0]; img.alt = '';
        img.onerror = ()=>{ img.outerHTML = '<div class="side-thumb-empty">🖼</div>'; };
        item.appendChild(img);
      }else{
        const ph = document.createElement('div'); ph.className = 'side-thumb-empty'; ph.textContent = '🖼';
        item.appendChild(ph);
      }
      const nm = document.createElement('div'); nm.className = 'side-name'; nm.textContent = bi(c.name);
      item.appendChild(nm);
      const dot = document.createElement('span'); dot.className = 'side-cat-dot'; dot.dataset.catdot = c.category;
      item.appendChild(dot);
      sidebar.appendChild(item);
    });
  }

  function renderDetail(visible){
    const detail = document.getElementById('detail');
    detail.innerHTML = '';
    const c = competitors.find(x=>x.id===selectedId);
    if(!c) return;
    detail.dataset.cat = c.category;
    const stripe = document.createElement('div'); stripe.className = 'stripe';
    detail.appendChild(stripe);
    detail.appendChild(buildMedia(c));
    const idx = visible.findIndex(x=>x.id===c.id);
    detail.appendChild(buildContent(c, idx >= 0 ? idx : 0));
  }

  function buildMedia(c){
    const media = document.createElement('div');
    media.className = 'media';
    const heroBox = document.createElement('div');
    heroBox.className = 'media-hero';

    function addImageUrl(){
      const url = prompt(lang==='zh' ? '粘贴产品图片链接（URL）' : 'Paste product image URL');
      if(url && url.trim()){
        if(!Array.isArray(c.imageUrls)) c.imageUrls = [];
        c.imageUrls.push(url.trim());
        touch(c); render();
      }
    }
    function renderHero(activeIdx){
      heroBox.innerHTML = '';
      if(!c.imageUrls.length){
        const ph = document.createElement('button');
        ph.className = 'placeholder';
        ph.innerHTML = '<span class="icon">🖼</span>' + (lang==='zh' ? '点击添加产品图片' : 'Click to add product image');
        ph.addEventListener('click', addImageUrl);
        heroBox.appendChild(ph);
        return;
      }
      const img = document.createElement('img');
      img.src = c.imageUrls[activeIdx] || c.imageUrls[0];
      img.alt = bi(c.name);
      img.onerror = ()=>{ heroBox.innerHTML = '<div class="placeholder"><span class="icon">✕</span>' + (lang==='zh' ? '图片链接无法加载' : 'Image failed to load') + '</div>'; };
      heroBox.appendChild(img);
    }
    renderHero(0);
    media.appendChild(heroBox);

    const thumbs = document.createElement('div');
    thumbs.className = 'media-thumbs';
    c.imageUrls.forEach((url, i)=>{
      const tEl = document.createElement('button');
      tEl.className = 'thumb' + (i===0 ? ' active' : '');
      const timg = document.createElement('img'); timg.src = url; timg.alt = '';
      tEl.appendChild(timg);
      const rm = document.createElement('button');
      rm.className = 'thumb-remove'; rm.textContent = '✕';
      rm.addEventListener('click', (e)=>{ e.stopPropagation(); c.imageUrls.splice(i,1); touch(c); render(); });
      tEl.appendChild(rm);
      tEl.addEventListener('click', ()=>{
        thumbs.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));
        tEl.classList.add('active');
        renderHero(i);
      });
      thumbs.appendChild(tEl);
    });
    const addTile = document.createElement('button');
    addTile.className = 'thumb-add'; addTile.textContent = '＋';
    addTile.addEventListener('click', addImageUrl);
    thumbs.appendChild(addTile);
    media.appendChild(thumbs);
    return media;
  }

  function buildContent(c, idx){
    const t = tr();
    const content = document.createElement('div');
    content.className = 'content';

    const head = document.createElement('div');
    head.className = 'content-head';
    const idxEl = document.createElement('span');
    idxEl.className = 'idx';
    idxEl.textContent = 'No. ' + String(idx+1).padStart(3,'0');
    head.appendChild(idxEl);
    const headRight = document.createElement('div');
    headRight.style.display = 'flex'; headRight.style.gap = '8px'; headRight.style.alignItems = 'center';
    const catSel = document.createElement('select');
    catSel.className = 'cat-pill';
    Object.entries(CAT_LABELS[lang]).forEach(([val,label])=>{
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = label;
      if(val === c.category) opt.selected = true;
      catSel.appendChild(opt);
    });
    catSel.addEventListener('change', ()=>{ c.category = catSel.value; touch(c); render(); });
    headRight.appendChild(catSel);
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.textContent = t.deleteBtn;
    delBtn.addEventListener('click', ()=>{
      if(confirm(t.confirmDelete(bi(c.name)))){
        competitors = competitors.filter(x=>x.id!==c.id);
        if(selectedId === c.id) selectedId = null;
        saveAll(); render();
        toast(t.toastDeleted);
      }
    });
    headRight.appendChild(delBtn);
    head.appendChild(headRight);
    content.appendChild(head);

    const pname = document.createElement('h2');
    pname.className = 'pname';
    pname.contentEditable = 'true';
    pname.spellcheck = false;
    pname.textContent = bi(c.name);
    pname.addEventListener('blur', ()=>{ c.name[lang] = pname.textContent.trim() || (lang==='zh'?'未命名竞品':'Untitled'); touch(c); });
    content.appendChild(pname);

    const chips = document.createElement('div');
    chips.className = 'chips';
    [['brandName', t.lblBrand, t.phBrandInline], ['originCountry', t.lblOrigin, t.phOriginInline], ['capacity', t.specCapacity, t.phCapacity]].forEach(([key,label,ph])=>{
      const chip = document.createElement('div'); chip.className = 'chip';
      const lab = document.createElement('div'); lab.className = 'chip-label'; lab.textContent = label;
      chip.appendChild(lab);
      const val = document.createElement('div'); val.className = 'chip-val';
      val.contentEditable = 'true'; val.dataset.ph = ph;
      val.textContent = bi(c.fields[key]);
      val.addEventListener('blur', ()=>{ c.fields[key][lang] = val.textContent.trim(); touch(c); });
      chip.appendChild(val);
      chips.appendChild(chip);
    });
    content.appendChild(chips);

    function section(labelText, key, ph, italic){
      const box = document.createElement('div'); box.className = 'section-box';
      const headEl = document.createElement('div'); headEl.className = 'section-head'; headEl.textContent = labelText;
      box.appendChild(headEl);
      const body = document.createElement('div');
      body.className = 'section-body' + (italic ? ' concept-body' : '');
      body.contentEditable = 'true'; body.dataset.ph = ph || '';
      body.textContent = bi(c.fields[key]);
      body.addEventListener('blur', ()=>{ c.fields[key][lang] = body.textContent.trim(); touch(c); });
      box.appendChild(body);
      return box;
    }
    content.appendChild(section(t.specPrice, 'priceChannel', t.phPrice));
    content.appendChild(section('BRAND CONCEPT', 'brandConcept', t.phConcept, true));
    content.appendChild(section(t.lblIngredients, 'ingredients', t.phIngredients));

    const noteBox = document.createElement('div');
    noteBox.className = 'note-box';
    const noteLabel = document.createElement('div'); noteLabel.className = 'note-label'; noteLabel.textContent = t.lblNotes;
    noteBox.appendChild(noteLabel);
    const noteBody = document.createElement('div');
    noteBody.className = 'note-body'; noteBody.contentEditable = 'true';
    noteBody.dataset.ph = t.phNotes;
    noteBody.textContent = bi(c.fields.notes);
    noteBody.addEventListener('blur', ()=>{ c.fields.notes[lang] = noteBody.textContent.trim(); touch(c); });
    noteBox.appendChild(noteBody);
    content.appendChild(noteBox);

    const foot = document.createElement('div');
    foot.className = 'content-foot';
    if(c.url){
      const link = document.createElement('a');
      link.href = c.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.className = 'src-link';
      link.textContent = t.productPage;
      foot.appendChild(link);
    }else{
      foot.appendChild(document.createElement('span'));
    }
    const upd = document.createElement('span');
    upd.textContent = t.updatedOn + ' ' + fmtDate(c.updatedAt);
    foot.appendChild(upd);
    content.appendChild(foot);

    return content;
  }

  function buildPrintArea(){
    const area = document.getElementById('printArea');
    area.innerHTML = '';
    competitors.forEach((c, i)=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.cat = c.category;
      const stripe = document.createElement('div'); stripe.className = 'stripe';
      card.appendChild(stripe);
      card.appendChild(buildMedia(c));
      card.appendChild(buildContent(c, i));
      area.appendChild(card);
    });
  }

  // ---------------- Language toggle ----------------
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang === 'zh' ? 'en' : 'zh';
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    renderChrome();
    render();
  });

  // ---------------- Add modal ----------------
  const overlay = document.getElementById('addOverlay');
  document.getElementById('addBtn').addEventListener('click', ()=>{
    document.getElementById('inName').value='';
    document.getElementById('inBrand').value='';
    document.getElementById('inOrigin').value='';
    document.getElementById('inUrl').value='';
    document.getElementById('inImg').value='';
    document.getElementById('inCat').value='japan';
    overlay.classList.add('show');
    setTimeout(()=>document.getElementById('inName').focus(), 50);
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=> overlay.classList.remove('show'));
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });

  document.getElementById('confirmAdd').addEventListener('click', ()=>{
    const name = document.getElementById('inName').value.trim();
    if(!name){ toast(tr().toastNameRequired); return; }
    const c = normalize({
      id: uid(),
      url: document.getElementById('inUrl').value.trim(),
      imageUrls: (document.getElementById('inImg').value.trim() ? [document.getElementById('inImg').value.trim()] : []),
      category: document.getElementById('inCat').value,
      updatedAt: new Date().toISOString(),
      name: biField(lang==='zh'?name:'', lang==='en'?name:''),
      fields: {
        brandName: biField(lang==='zh'?document.getElementById('inBrand').value.trim():'', lang==='en'?document.getElementById('inBrand').value.trim():''),
        originCountry: biField(lang==='zh'?document.getElementById('inOrigin').value.trim():'', lang==='en'?document.getElementById('inOrigin').value.trim():''),
      }
    });
    // ensure name set under current lang regardless of biField helper defaults
    c.name[lang] = name;
    c.fields.brandName[lang] = document.getElementById('inBrand').value.trim();
    c.fields.originCountry[lang] = document.getElementById('inOrigin').value.trim();
    competitors.unshift(c);
    selectedId = c.id;
    saveAll();
    render();
    overlay.classList.remove('show');
    toast(tr().toastAdded);
  });

  // ---------------- Search / filter ----------------
  document.getElementById('searchInput').addEventListener('input', (e)=>{ filterText = e.target.value; render(); });
  document.getElementById('filterCat').addEventListener('change', (e)=>{ filterCat = e.target.value; render(); });

  // ---------------- Export PDF (print) ----------------
  document.getElementById('pdfBtn').addEventListener('click', ()=>{
    buildPrintArea();
    requestAnimationFrame(()=>window.print());
  });

  // ---------------- Export Slides (self-contained HTML deck, no external deps) ----------------
  document.getElementById('pptxBtn').addEventListener('click', ()=>{
    const t = tr();
    toast(t.toastGenSlides);
    const catColor = c => c==='japan' ? '#BE8F35' : c==='korea' ? '#8B5A6B' : c==='usa' ? '#5B6B4F' : '#8B8A7D';
    let slidesHtml = '';
    let n = 0;
    competitors.forEach(c=>{
      const imgs = Array.isArray(c.imageUrls) ? c.imageUrls : [];
      const bl = [bi(c.fields.brandName), bi(c.fields.originCountry), CAT_LABELS[lang][c.category]].filter(Boolean).join('  ·  ');
      n++;
      slidesHtml += `
      <section class="slide" style="border-left-color:${catColor(c.category)}">
        <div class="slide-eyebrow">${escapeHtml(t.slideOverview)}</div>
        <h1>${escapeHtml(bi(c.name))}</h1>
        <div class="slide-byline">${escapeHtml(bl)}</div>
        <div class="slide-body">
          <div class="slide-text">
            <div class="slide-label" style="color:${catColor(c.category)}">BRAND CONCEPT</div>
            <blockquote>${escapeHtml(bi(c.fields.brandConcept) || '—')}</blockquote>
            ${c.url ? `<div class="slide-src">${lang==='zh'?'来源':'Source'}: ${escapeHtml(c.url)}</div>` : ''}
          </div>
          ${imgs[0] ? `<div class="slide-img"><img src="${escapeHtml(imgs[0])}" alt=""></div>` : ''}
        </div>
      </section>`;
      n++;
      slidesHtml += `
      <section class="slide" style="border-left-color:${catColor(c.category)}">
        <div class="slide-eyebrow">${escapeHtml(t.slideDetail)}</div>
        <h1>${escapeHtml(bi(c.name))}</h1>
        <div class="slide-body">
          <div class="slide-text">
            <div class="spec-block"><div class="slide-label" style="color:${catColor(c.category)}">${escapeHtml(t.specCapacity)}</div><p>${escapeHtml(bi(c.fields.capacity) || '—')}</p></div>
            <div class="spec-block"><div class="slide-label" style="color:${catColor(c.category)}">${escapeHtml(t.specPrice)}</div><p>${escapeHtml(bi(c.fields.priceChannel) || '—')}</p></div>
            <div class="spec-block"><div class="slide-label" style="color:${catColor(c.category)}">${escapeHtml(t.lblIngredients)}</div><p>${escapeHtml(bi(c.fields.ingredients) || '—')}</p></div>
          </div>
          ${imgs.length>1 ? `<div class="slide-thumbs">${imgs.slice(1,5).map(u=>`<img src="${escapeHtml(u)}" alt="">`).join('')}</div>` : ''}
        </div>
      </section>`;
    });

    const doc = `<!DOCTYPE html><html lang="${lang==='zh'?'zh-CN':'en'}"><head><meta charset="UTF-8">
<title>${escapeHtml(tr().title)}</title>
<style>
  :root{ --ink:#20302C; --paper:#EFEDE2; --grey:#8B8A7D; --line:#DDD8C6; }
  *{box-sizing:border-box;}
  body{margin:0;background:#2A2A24;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);}
  .deck{max-width:960px;margin:0 auto;padding:40px 0 80px;}
  .slide{
    background:#fff;width:960px;height:540px;margin:0 auto 28px;border-left:10px solid #999;
    padding:48px 56px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35);
    display:flex;flex-direction:column;
  }
  .slide-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);font-weight:700;margin-bottom:10px;}
  .slide h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;margin:0 0 6px;}
  .slide-byline{font-size:13px;color:var(--grey);margin-bottom:18px;}
  .slide-body{display:flex;gap:30px;flex:1;min-height:0;}
  .slide-text{flex:1;min-width:0;overflow:auto;}
  .slide-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  blockquote{font-family:"Noto Serif SC",serif;font-style:italic;font-size:17px;line-height:1.6;margin:0;padding-left:16px;border-left:3px solid #ddd;}
  .slide-src{margin-top:16px;font-size:11px;color:var(--grey);}
  .spec-block{margin-bottom:18px;}
  .spec-block p{margin:0;font-size:13.5px;line-height:1.6;}
  .slide-img{flex:0 0 260px;display:flex;align-items:center;justify-content:center;}
  .slide-img img{max-width:100%;max-height:420px;object-fit:contain;}
  .slide-thumbs{flex:0 0 200px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;}
  .slide-thumbs img{width:100%;height:90px;object-fit:contain;background:#F5F3EA;}
  .deck-title{color:#fff;text-align:center;padding:60px 0 20px;font-family:"Noto Serif SC",serif;}
  .deck-title h1{font-size:34px;margin:0 0 8px;}
  .deck-title p{color:#bbb;font-size:13px;}
  @media print{
    body{background:#fff;}
    .deck-title{display:none;}
    .slide{box-shadow:none;page-break-after:always;margin:0 auto;}
  }
</style></head>
<body>
  <div class="deck-title">
    <h1>${escapeHtml(tr().title)}</h1>
    <p>${escapeHtml(tr().slideCount(competitors.length))} · ${fmtDate(new Date().toISOString())}</p>
  </div>
  <div class="deck">${slidesHtml}</div>
</body></html>`;

    try{
      const blob = new Blob([doc], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (lang==='zh' ? '竞品情报库-幻灯片' : 'competitor-library-slides') + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast(t.toastSlidesDone);
    }catch(e){
      toast(lang==='zh' ? '生成失败，请重试' : 'Failed to generate, please try again');
    }
  });

  // ---------------- Share ----------------
  function buildSummary(){
    const t = tr();
    return '【' + t.title + '】' + tr().slideCount(competitors.length) + '\n\n' +
      competitors.map((c,i)=>{
        const blLine = [bi(c.fields.brandName), bi(c.fields.originCountry)].filter(Boolean).join(' · ');
        return `${i+1}. ${bi(c.name)}${blLine ? '（'+blLine+'）' : ''} — ${CAT_LABELS[lang][c.category]}${c.url ? '\n   '+(lang==='zh'?'链接':'Link')+'：'+c.url : ''}${bi(c.fields.brandConcept) ? '\n   Concept：'+bi(c.fields.brandConcept) : ''}`;
      }).join('\n\n');
  }

  const shareOverlay = document.getElementById('shareOverlay');
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    const summary = buildSummary();
    if(navigator.share){
      try{ await navigator.share({ title: tr().title, text: summary }); return; }catch(e){ /* fall through */ }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(summary);
        toast(tr().toastCopyDone);
        return;
      }catch(e){ /* fall through to manual modal */ }
    }
    openShareModal(summary);
  });

  function openShareModal(summary){
    document.getElementById('shareText').value = summary;
    shareOverlay.classList.add('show');
    setTimeout(()=>{
      const ta = document.getElementById('shareText');
      ta.focus(); ta.select();
    }, 50);
  }
  document.getElementById('closeShare').addEventListener('click', ()=> shareOverlay.classList.remove('show'));
  shareOverlay.addEventListener('click', (e)=>{ if(e.target === shareOverlay) shareOverlay.classList.remove('show'); });
  document.getElementById('copyShare').addEventListener('click', async ()=>{
    const ta = document.getElementById('shareText');
    ta.focus(); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    if(!ok && navigator.clipboard && navigator.clipboard.writeText){
      try{ await navigator.clipboard.writeText(ta.value); ok = true; }catch(e){}
    }
    toast(ok ? tr().toastCopyDone : tr().toastCopyFail);
  });

  loadAll();
})();
</script>
</body>
</html>
