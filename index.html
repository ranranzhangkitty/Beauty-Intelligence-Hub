:root{--ink:#20302C;--ink-soft:#4B584F;--paper:#EFEDE2;--card:#FFFFFF;--plinth:#F5F3EA;--line:#DDD8C6;--honey:#BE8F35;--honey-soft:#EFDFB2;--sage:#5B6B4F;--sage-soft:#DCE3D1;--plum:#8B5A6B;--plum-soft:#E7D6DC;--grey:#8B8A7D;--grey-soft:#E7E5DA;--shadow:0 1px 3px rgba(32,48,44,.05),0 12px 28px rgba(32,48,44,.08);--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}.wrap{max-width:1380px;margin:auto;padding:36px 34px 90px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:20px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--honey);font-weight:700;margin-bottom:10px}h1{font-family:var(--serif);font-size:40px;margin:0 0 8px}.hero p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.7;max-width:650px}.stats{display:flex;align-items:center}.stat{font-family:var(--serif);text-align:center;padding:6px 19px;border-left:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--grey);letter-spacing:.1em}button,input,select{font-family:var(--sans)}button{cursor:pointer;border-radius:3px;font-size:12.5px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button:hover{box-shadow:var(--shadow)}.lang{font-weight:700;border-color:var(--ink);min-width:52px}
.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 28px}.group{display:flex;gap:9px;flex-wrap:wrap}.search,.filter{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 12px;font-size:13px}.search{min-width:250px}.primary{background:var(--honey);border-color:var(--honey);font-weight:700}
.workspace{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}.side{position:relative;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px;cursor:pointer;text-align:center}.side.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft) inset}.side-num{position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:2}.side img{width:100%;height:82px;object-fit:contain;background:var(--plinth);border-radius:3px}.side-name{font-size:10.5px;line-height:1.35;margin-top:6px;color:var(--ink-soft)}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-top:5px;background:var(--honey)}.dot.europe{background:var(--sage)}.detail{background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(350px,41%) minmax(0,59%);overflow:hidden}
.media{background:var(--plinth);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:760px}.media-hero{height:650px;display:flex;align-items:center;justify-content:center;padding:28px 24px}.media-hero img{width:78%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(32,48,44,.15))}.thumbs{display:flex;justify-content:center;gap:8px;padding:12px 16px 18px;flex-wrap:wrap}.thumb{width:48px;height:62px;padding:3px;border:1.5px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center}.thumb.active{border-color:var(--honey)}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.content{padding:28px 30px 24px;min-width:0}.content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.index{font-family:var(--serif);font-size:11px;color:var(--grey);letter-spacing:.08em}.cat{font-size:10.5px;padding:4px 10px;border-radius:20px;background:var(--honey-soft);color:#7A5A18;border:0}.pname{font-family:var(--serif);font-size:27px;line-height:1.25;margin:0 0 18px;outline:none}.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}.chip{background:var(--grey-soft);padding:8px 10px;border-radius:4px}.chip-label{font-size:9px;letter-spacing:.08em;color:var(--grey);font-weight:700;text-transform:uppercase;margin-bottom:4px}.chip-val{font-size:11.5px;line-height:1.45;outline:none}.section{border:1px solid var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}.section-head{background:var(--honey-soft);color:#7A5A18;padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.section-body{padding:12px 14px;font-size:12.5px;line-height:1.72;outline:none;white-space:pre-wrap}.section-body:hover,.chip-val:hover,.pname:hover{background:rgba(190,143,53,.07)}.note{background:#FBEFC4;border:1px solid #E6D28B;border-radius:4px;padding:11px 14px;margin-top:2px}.note-label{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:#8A6A1E;margin-bottom:6px}.note-body{font-size:12px;line-height:1.6;outline:none;min-height:18px}.sources{display:flex;gap:7px;flex-wrap:wrap}.sources a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--grey);font-size:10.5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}.media{border-right:0;border-bottom:1px solid var(--line);min-height:auto}.media-hero{height:520px}}
@media(max-width:760px){.wrap{padding:20px 14px 60px}.workspace{grid-template-columns:1fr}.sidebar{position:relative;max-height:none;display:flex;flex-direction:row;overflow:auto}.side{min-width:100px}.chips{grid-template-columns:1fr 1fr}}
@media print{.toolbar,.sidebar,.lang{display:none!important}.workspace{display:block}.detail{box-shadow:none}.section{break-inside:avoid}}

.image-upload-row{display:flex;justify-content:center;gap:8px;padding:0 16px 16px;flex-wrap:wrap}

.upload-hint{font-size:9.5px;color:var(--grey);align-self:center}
.thumb-wrap{position:relative}
.thumb-delete{position:absolute;right:-4px;top:-4px;width:17px;height:17px;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;line-height:17px;display:none}
.thumb-wrap:hover .thumb-delete{display:block}
#printArea{display:none}
.print-product{page-break-after:always;background:#fff;padding:16mm;min-height:270mm}
.print-product:last-child{page-break-after:auto}
.print-title{font-family:var(--serif);font-size:25px;margin:0 0 10px}
.print-grid{display:grid;grid-template-columns:34% 66%;gap:12mm}
.print-image{height:220mm;display:flex;align-items:flex-start;justify-content:center;background:var(--plinth);padding:12mm}
.print-image img{max-width:100%;max-height:100%;object-fit:contain}
.print-section{border:1px solid var(--line);margin-bottom:6px}
.print-section h3{font-size:10px;letter-spacing:.06em;background:var(--honey-soft);color:#7A5A18;margin:0;padding:6px 8px}
.print-section p{font-size:10px;line-height:1.5;margin:0;padding:7px 8px;white-space:pre-wrap}
@media print{
  body.print-all .wrap{display:none!important}
  body.print-all #printArea{display:block!important}
  body.print-all{background:#fff}
  @page{size:A4 portrait;margin:0}
}


.thumb-add{
  width:48px;height:62px;padding:0;border:1.5px dashed var(--line);

}

.official-source{font-weight:700;color:#7A5A18!important;border-bottom-color:var(--honey)!important}

<script>
const DEFAULTS=[{"id": "loreal", "category": "europe", "name": {"zh": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo", "en": "L’Oréal Professionnel Scalp Advanced Anti-Dandruff Shampoo"}, "brand": {"zh": "L’Oréal Professionnel", "en": "L’Oréal Professionnel"}, "company": {"zh": "L’Oréal", "en": "L’Oréal"}, "origin": {"zh": "法国 / 全球专业沙龙渠道", "en": "France / Global professional salon market"}, "launch": {"zh": "Scalp Advanced 系列现行版本", "en": "Current Scalp Advanced range"}, "market": {"zh": "全球专业沙龙、品牌官网与授权零售；日本以进口电商为主", "en": "Professional salons, official channels and authorized retail; mainly import e-commerce in Japan"}, "capacity": {"zh": "300 mL / 500 mL", "en": "300 mL / 500 mL"}, "price": {"zh": "日本进口价约 ¥3,490–¥4,620（300 mL，渠道浮动）", "en": "Approx. ¥3,490–¥4,620 in Japan for 300 mL, depending on importer"}, "positioning": {"zh": "以“Scalp is skin”为核心，把传统去屑洗发水重新包装为专业头皮护理方案。产品不只强调清除头屑，而是将干性头屑、油性头屑、头皮失衡和舒缓体验纳入同一套专业沙龙叙事。与大众去屑品牌相比，差异点在于专业渠道、皮肤学活性成分语言、沙龙专家共创和轻盈乳霜质地；与药用去屑产品相比，则更强调使用体验、香味和日常护理感。", "en": "Built around the idea that the scalp should be treated like facial skin, this product reframes a conventional anti-dandruff shampoo as a professional scalp-care solution. It addresses visible flakes, scalp imbalance, dryness and oiliness within one salon-grade narrative. Compared with mass anti-dandruff brands, its distinction lies in professional distribution, dermatological actives, expert co-development and a refined cream texture."}, "target": {"zh": "核心消费者是反复出现可见头屑、同时担心头皮干燥、油腻或不适的人群。适合希望获得比大众去屑洗发水更专业、更温和、更具美容护理体验的消费者，也适合由发型师推荐、愿意在沙龙或专业渠道购买的人群。官方未限定性别；产品覆盖干性与油性头屑场景。", "en": "Designed for consumers with recurring visible dandruff who may also experience dryness, oiliness or discomfort. It suits people seeking a more professional and sensorial alternative to mass-market anti-dandruff shampoos, especially those who rely on salon recommendations. Official communication is gender-neutral and covers both dry and oily dandruff."}, "distribution": {"zh": "300 mL 与 500 mL 两种规格，主要依赖专业沙龙、L’Oréal Professionnel 官方渠道及各国授权零售。日本并非其最强本土渠道，进口电商价格差异较大，因此价格竞争力不如日本本土药妆洗护，但专业品牌形象和针对性头皮功效支撑了溢价。", "en": "Available in 300 mL and 500 mL sizes through professional salons, official L’Oréal Professionnel channels and authorized retailers. In Japan, import pricing varies considerably, so it is less price-competitive than domestic drugstore products. Its premium is supported by professional branding and targeted scalp efficacy."}, "ingredients": {"zh": "核心活性为 Piroctone Olamine，用于去屑及抑制与头屑相关的微生物；配方中还可见 Salicylic Acid、Glycerin、Coco-Betaine、Guar Hydroxypropyltrimonium Chloride 等。整体是较经典的阴离子表活 + 两性表活洗净框架，通过珠光剂、保湿剂、调理聚合物及清凉感成分改善专业使用体验。品牌将其放入 Scalp Advanced 的皮肤学活性组合中，与 Niacinamide、AHA、Clay 等系列语言共同构建头皮“skinification”。", "en": "The key active is Piroctone Olamine for dandruff control. The formula also includes Salicylic Acid, Glycerin, Coco-Betaine and Guar Hydroxypropyltrimonium Chloride. The cleansing base is conventional, while humectants, conditioning polymers and sensorial modifiers improve the professional-use experience. The broader Scalp Advanced range frames these ingredients within a scalp-skinification story."}, "evidence": {"zh": "官方公开资料给出了较清晰的测试层级：首次使用后“最多去除 100% 可见头屑”为消费者测试；“最长 72 小时去屑保护”为临床测试；另有 44 名受试者、每周使用 3 次的临床测试描述，用于支持头屑外观减少。公开页面仍未完整披露各测试的详细设计、对照组和统计方法，因此适合归类为“有消费者与临床支持，但完整研究报告未公开”。", "en": "Official materials describe consumer and clinical testing, including removal of up to 100% visible dandruff after first use and protection lasting up to 72 hours. A 44-subject clinical test used three applications per week. However, full protocols, control design and statistical details are not publicly available."}, "experience": {"zh": "轻盈乳霜型洗发质地，目标是兼顾去屑清洁和头皮舒适度。官方建议在湿发与头皮上均匀涂抹，用指腹轻柔起泡后冲洗，油性头屑可先搭配同系列深层净化产品。香气被描述为中性、清新、具有洁净感和专业护理基调。包装为白色专业线瓶身，搭配淡蓝绿色区块和黑色瓶盖，视觉接近皮肤科与沙龙专业护理。", "en": "A lightweight cream shampoo designed to combine anti-dandruff cleansing with scalp comfort. It is applied to wet hair and scalp, gently lathered with fingertips, then rinsed. The scent is clean, neutral and professional. White packaging with pale blue-green accents creates a dermatological salon-care impression."}, "packaging": {"zh": "白色大面积留白、黑色专业品牌标识、浅蓝绿色功能标签，强化“临床、洁净、专业”的视觉联想。300 mL / 500 mL 规格便于区分家用和沙龙需求。优势是专业感强、功能识别直接；弱点是与其他 Scalp Advanced 单品外观接近，消费者需要仔细阅读功能名称。", "en": "Large white areas, a black professional logo and pale blue-green functional labels communicate clinical cleanliness and expertise. The 300 mL and 500 mL formats serve home and salon use. The design is professional and clear, although products within the range look similar and require close label reading."}, "insight": {"zh": "其真正竞争力不是单一的 Piroctone Olamine，而是把经典去屑活性放进专业沙龙与头皮皮肤学叙事中，并用可量化功效、专家共创和更精致的质地完成品牌升级。最值得学习的是“功能问题—专业诊断—方案组合”的完整路径。较容易被复制的是基础表活和去屑活性组合；较难复制的是全球沙龙网络、品牌权威和成套产品协议。", "en": "Its advantage is not Piroctone Olamine alone, but the way a classic anti-dandruff active is elevated through professional salon authority, scalp-skinification and quantified claims. The easiest elements to replicate are the cleansing and active system; the hardest are the global salon network, brand authority and protocol-led portfolio."}, "notes": {"zh": "", "en": ""}, "images": ["https://u.makeup.com.ua/o/ow/owtokyuk6f6v.jpg"], "sources": [["L’Oréal Professionnel Official", "https://www.lorealprofessionnel.com/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"], ["L’Oréal Professionnel UK", "https://www.lorealprofessionnel.co.uk/all-products/hair-care/scalp-advanced-anti-dandruff-dermo-clarifier-shampoo"], ["Japan retail reference", "https://makeup.jp/product/730063/"]]}, {"id": "andhoney", "category": "japan", "name": {"zh": "&honey Deep Moist Shampoo 1.0", "en": "&honey Deep Moist Shampoo 1.0"}, "brand": {"zh": "&honey", "en": "&honey"}, "company": {"zh": "ViCREA", "en": "ViCREA"}, "origin": {"zh": "日本", "en": "Japan"}, "launch": {"zh": "2018 年 4 月 5 日", "en": "April 5, 2018"}, "market": {"zh": "日本全国药妆、综合零售、品牌电商及跨境电商", "en": "Japanese drugstores, general retail, brand e-commerce and cross-border e-commerce"}, "capacity": {"zh": "440 mL", "en": "440 mL"}, "price": {"zh": "¥1,540", "en": "¥1,540"}, "positioning": {"zh": "以“头发水分量 14%”和“保水有机美容”为核心，把蜂蜜、有机油和美容液成分组合成高保湿洗护体系。产品的核心差异不是解决单一损伤，而是让消费者相信整个洗护流程都围绕保持发丝水分展开。系列化步骤编号、香味变化和高装饰性瓶身进一步强化仪式感。", "en": "Built around “14% hair moisture” and a moisture-organic beauty proposition. Honey, organic oils and beauty-serum ingredients are organized into a hydration system, while numbered steps, changing fragrances and jewel-like packaging create ritual value."}, "target": {"zh": "面向干燥、毛躁、缺水、卷曲和希望获得明显滋润感的人群。品牌视觉年轻、甜美、适合社交媒体传播，核心用户更偏年轻女性，但实际购买人群很广。对细软、容易塌发的人群，Deep Moist 的丰润感可能偏重。", "en": "For consumers with dry, frizzy and moisture-depleted hair who want a rich conditioning feel. The brand’s visual language is young, sweet and social-media friendly, although its actual audience is broad."}, "distribution": {"zh": "440 mL / ¥1,540，与日本大众高机能洗护主流价位一致。全国药妆、Ainz & Tulpe、综合零售、电商覆盖广，渠道优势明显。长期在售与高评论量形成较强社会证明，替代成本来自品牌认知而非高技术壁垒。", "en": "440 mL at ¥1,540, aligned with Japan’s mainstream mass-premium haircare segment. Wide drugstore, lifestyle retail and e-commerce distribution gives the brand a major channel advantage."}, "ingredients": {"zh": "品牌强调 90% 以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，并使用摩洛哥有机油。蜂蜜配比故事为 Manuka 50%、Acacia 30%、日本生蜂蜜 20%。洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。", "en": "The brand emphasizes that more than 90% of the formula consists of honey, organic oils, royal jelly and other moisturizing or protective ingredients. The honey story uses a 50% Manuka, 30% Acacia and 20% Japanese raw honey blend."}, "evidence": {"zh": "公开资料主要是配方比例、成分来源、自由配方和消费者评论。没有在官方产品页看到完整临床或仪器测试方案。其证据优势来自长期市场销售、较高评论量和清晰的成分比例传播，而非公开临床研究。", "en": "Public evidence is mainly formula ratios, ingredient sourcing, free-from claims and large volumes of consumer reviews. No full clinical or instrumental study protocol was found on the official product page."}, "experience": {"zh": "浓厚的 Shea & Honey 泡沫，Peony Honey 香味，洗后追求柔软、滋润、香气持续和毛躁改善。瓶身厚重、透明、带切割感和蜂蜜色液体，视觉非常适合货架和社交媒体。使用体验偏丰润，对重度干燥发更有吸引力。", "en": "Rich Shea & Honey foam, Peony Honey fragrance and a strongly moisturized finish. The faceted transparent bottle, amber liquid and gold pump create high shelf visibility and social-media appeal."}, "packaging": {"zh": "琥珀色透明液体、几何切面瓶和金色泵头构成极强的蜂蜜高级感。步骤编号 1.0、1.5、2.0 让消费者自然理解整套使用顺序。包装是其最难被低成本复制的品牌资产之一。", "en": "Amber liquid, a geometric faceted bottle, gold hardware and numbered steps create a strong premium honey identity. Packaging is one of the brand’s hardest assets to copy cheaply."}, "insight": {"zh": "&honey 的成功说明大众洗护的竞争不一定依赖新型活性，而可以通过一个极强的单一概念——“保水”——把配方、包装、香味、步骤和渠道统一起来。研发层面容易模仿，品牌层面难以复制。", "en": "&honey shows that mass haircare can win without a new active by aligning formula, packaging, fragrance, usage steps and distribution around one powerful memory structure: moisture."}, "notes": {"zh": "", "en": ""}, "images": ["https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-1-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600", "https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-2-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600", "https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-3-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600"], "sources": [["Official product page", "https://www.and-honey.com/deep/product/"], ["@cosme", "https://www.cosme.net/variations/973782/"], ["Ainz & Tulpe", "https://ainz-tulpe.jp/products/4589546890758"]]}, {"id": "8thalasso", "category": "japan", "name": {"zh": "8 THE THALASSO Moist Shampoo", "en": "8 THE THALASSO Moist Shampoo"}, "brand": {"zh": "8 THE THALASSO", "en": "8 THE THALASSO"}, "company": {"zh": "Stella Seed", "en": "Stella Seed"}, "origin": {"zh": "日本", "en": "Japan"}, "launch": {"zh": "系列既有产品；现版本于 2025 年夏季更新", "en": "Existing range; current version renewed in summer 2025"}, "market": {"zh": "日本全国药妆、电商、Loft / PLAZA 等", "en": "Japanese drugstores, e-commerce, Loft, PLAZA and lifestyle retail"}, "capacity": {"zh": "本体 475 mL / 替换装 400 mL", "en": "475 mL bottle / 400 mL refill"}, "price": {"zh": "本体 ¥1,540 / 替换装 ¥1,210", "en": "¥1,540 bottle / ¥1,210 refill"}, "positioning": {"zh": "“护肤化的保水美容液洗发水”。把海洋来源成分、干细胞提取物概念、PPT 系洗净成分和 84% 美容液成分整合为高保湿修护叙事。差异点不是单一成分，而是“洗发步骤即美容液护理”。", "en": "A skincare-inspired moisture serum shampoo that combines marine-derived ingredients, stem-cell-extract concepts, PPT cleansing agents and an “84% beauty serum ingredients” claim. Its differentiation is not a single active but the idea that shampooing itself functions as a serum-care step."}, "target": {"zh": "核心面向干燥、毛躁、打结、缺乏光泽、有染烫或热工具损伤的人群。年龄并未在官方页面明确限定，视觉语言更接近重视成分感、简洁包装和药妆可得性的年轻至中青年消费者。", "en": "Aimed at people with dryness, frizz, tangling, dullness and damage from coloring, perming or heat tools. The minimalist packaging and ingredient-focused language appeal mainly to young and middle-aged beauty consumers."}, "distribution": {"zh": "本体 475 mL / ¥1,540；替换装 400 mL / ¥1,210。属于日本中价位大众高机能洗护，依赖药妆与大型生活方式零售触达，同时通过官方电商和平台电商覆盖。", "en": "475 mL at ¥1,540 and a 400 mL refill at ¥1,210. It sits in Japan’s mid-priced mass-premium haircare segment, with broad distribution through drugstores, lifestyle retailers and e-commerce."}, "ingredients": {"zh": "氨基酸系洗净成分 + PPT 系洗净成分；代表成分包括 Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K。Polyquaternium-51 作为保湿与顺滑强化点，“Thalasso stem-cell formula”则是品牌复合概念。新版去除了 Olefin(C12-16) Sulfonate Na，意图降低强清洁印象。", "en": "Amino-acid cleansing agents plus PPT-derived surfactants, including Cocoyl Hydrolyzed Collagen K and Cocoyl Hydrolyzed Keratin K. Polyquaternium-51 strengthens hydration and slip, while the “Thalasso stem-cell formula” acts as the brand’s composite technology story."}, "evidence": {"zh": "当前公开页面以配方、成分功能及品牌内部比较为主。公开资料明确提到产品中 84% 为美容液成分，但该比例包含水；未看到完整第三方临床报告、详细样本量或公开统计结果。", "en": "Public materials focus on formula composition, ingredient functions and internal brand comparisons. The 84% beauty-serum figure includes water. No complete third-party clinical report or detailed sample size was found."}, "experience": {"zh": "透明或半透明大容量泵瓶，银白色泵头与竖排极简标签强化“水感、洁净、实验室感”。香型为 Aqua White Floral。洗发剂型强调浓密泡沫、温和清洁、洗后湿润与“ぷるん髪”弹润感。", "en": "A transparent large pump bottle with silver-white hardware and vertical minimalist labeling. Aqua White Floral fragrance. The product emphasizes rich foam, mild cleansing, moisturized feel and bouncy, supple hair."}, "packaging": {"zh": "极简透明瓶、垂直排版和银白配色是品牌最强识别资产。视觉同时传达海洋、水感和实验室美容液。优点是货架辨识度高；风险是系列扩张后不同功效款外观相近。", "en": "The transparent bottle, vertical typography and silver-white palette strongly convey water, marine beauty and laboratory skincare. Shelf recognition is high, although multiple variants can be difficult to distinguish."}, "insight": {"zh": "真正值得研究的不是“84% 美容液”这个数字，而是如何把 PPT 洗净成分、阳离子保湿聚合物、海洋成分与干细胞概念整合成一个消费者能理解的 Skinification 故事。", "en": "The most valuable lesson is not the 84% claim itself, but the integration of PPT cleansing agents, a moisturizing polymer, marine ingredients and stem-cell language into one understandable skinification story."}, "notes": {"zh": "", "en": ""}, "images": ["https://taosbeauty.com/cdn/shop/files/72664f3e1aa7b236c00fc90563382201_a3885a1b-7e2a-42bd-8220-7212e70b320e.jpg?v=1753689513&width=1000", "https://taosbeauty.com/cdn/shop/files/c559df78-8834-48c0-b293-45944896881c.jpg?v=1753689513&width=1000", "https://taosbeauty.com/cdn/shop/files/1eb5fa63-b2b9-4e4b-b5f7-de6727f1b6f8.jpg?v=1753689513&width=1000"], "sources": [["MAQUIA renewal information", "https://maquia.hpplus.jp/cosme/170189/"], ["Retail product page", "https://taosbeauty.com/products/eight-the-thalasso-moist-shampoo"]]}, {"id": "honeyque", "category": "japan", "name": {"zh": "HONEYQUE Rich Gloss Treatment", "en": "HONEYQUE Rich Gloss Treatment"}, "brand": {"zh": "HONEYQUE", "en": "HONEYQUE"}, "company": {"zh": "Bottle Works", "en": "Bottle Works"}, "origin": {"zh": "日本", "en": "Japan"}, "launch": {"zh": "2023 年 9 月 13 日", "en": "September 13, 2023"}, "market": {"zh": "日本药妆、电商及生活方式零售", "en": "Japanese drugstores, e-commerce and lifestyle retail"}, "capacity": {"zh": "本体 450 mL / 替换装 400 mL", "en": "450 mL bottle / 400 mL refill"}, "price": {"zh": "本体 ¥1,650 / 替换装 ¥1,210", "en": "¥1,650 bottle / ¥1,210 refill"}, "positioning": {"zh": "围绕“貯水リペア”和“蜜髪”构建光泽修护定位。产品把有机麦卢卡蜂蜜的保水故事、三种胶原蛋白的空洞损伤修护、角质层护理和热保护整合在一起，主打毛躁、粗硬、内部空洞化和光泽不足。", "en": "Positioned around water-retention repair and glossy “honey hair.” Organic Manuka honey, three collagen types, cuticle care and heat protection are combined to address frizz, coarse texture, internal hollow damage and lack of shine."}, "target": {"zh": "主要面向染烫、吹风和夹板使用频繁、发丝干燥粗糙、缺乏光泽及难以服帖的人群。视觉和香味偏女性化，但官方没有严格限定年龄。", "en": "For consumers with color, perm and heat-tool damage who experience dryness, roughness, poor shine and difficult manageability. The visual and fragrance direction is feminine, though the brand does not impose a strict age limit."}, "distribution": {"zh": "本体 450 mL / ¥1,650；替换装 400 mL / ¥1,210。属于日本大众高机能洗护的主流价位。药妆和电商是核心渠道，替换装有利于维持复购。", "en": "450 mL at ¥1,650 and a 400 mL refill at ¥1,210. It occupies the mainstream Japanese mass-premium haircare price band, relying on drugstores and e-commerce for reach."}, "ingredients": {"zh": "核心故事包括有机麦卢卡蜂蜜、三种胶原蛋白、透明质酸衍生物、神经酰胺、角蛋白和水解丝。官方还提到 γ-Docosalactone 与水解芝麻蛋白衍生物作为热保护相关成分。", "en": "Organic Manuka honey, three collagen types, a hyaluronic-acid derivative, ceramides, keratin and hydrolyzed silk. Heat-care ingredients support a story of retaining internal moisture and smoothing the cuticle."}, "evidence": {"zh": "官方公开页面主要提供成分功能、产品特征和热保护成分说明，未见完整公开的人体临床方案、仪器测试数据或样本量。其支撑更偏向成分机理与品牌内部产品开发逻辑。", "en": "Official communication mainly provides ingredient functions and product-development logic. No complete public human clinical protocol, instrumental data set or sample size was found."}, "experience": {"zh": "450 mL 泵瓶，浅奶油色与蜂蜜琥珀色组合，强调甜润、柔软和高光泽。香型为 Aqua Blossom Honey。护发素定位强调包裹感、湿发顺滑、冲洗后的柔软度以及吹干后的服帖和光泽。", "en": "A 450 mL pump bottle in soft cream and honey-amber tones. Aqua Blossom Honey fragrance. The conditioner emphasizes coating, wet detangling, softness after rinsing, and smooth glossy hair after drying."}, "packaging": {"zh": "柔和浅色瓶身、蜂蜜色液滴与圆润泵头形成明显的甜润感。相比 &honey 的装饰性包装，HONEYQUE 更简洁成熟；相比专业沙龙品牌，则更亲和。", "en": "Soft colors, honey-toned details and a rounded pump create a rich but approachable look. It is simpler and more mature than highly decorative honey brands, while remaining more friendly than salon-professional packaging."}, "insight": {"zh": "核心优势是把蜂蜜故事从“天然保湿”推进到“发丝空洞化修护”，因此比单纯的蜂蜜香氛产品更具技术感。较容易复制的是成分组合；较难复制的是蜜感视觉、香味、顺滑触感和全系列传播的一致性。", "en": "Its strength is extending honey from a natural-moisture story into internal hollow-damage repair. The ingredient combination is easy to copy; the difficult part is achieving consistent scent, slip, gloss and visual identity across the line."}, "notes": {"zh": "", "en": ""}, "images": ["https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml1.png?v=1745527002&width=1024", "https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml2.png?v=1745527002&width=1024", "https://us.lamourlife.com/cdn/shop/files/HONEYQUERichGlossHoneyCollagenTreatment450ml3.png?v=1745527002&width=1024"], "sources": [["Official product page", "https://honeyque.jp/products/rich-gloss-treatment/"], ["MAQUIA", "https://maquia.hpplus.jp/cosme/170297/"], ["Brand concept", "https://honeyque.jp/"]]}]; const KEY='competitor-library-v4'; let lang='zh'; let products;

        ? '“保水有机美容”是品牌核心。通过蜂蜜、有机油、步骤编号、香型变化和高识别包装，把日常洗护塑造成围绕发丝含水量展开的完整美容仪式。'
        : p.id==='8thalasso'
        ? '以“头发也需要像肌肤一样保水”为品牌世界观，将海洋美容、干细胞概念和美容液感包装整合为大众可理解的头发 Skinification。'
        : '以“貯水リペア”和“蜜髪”为品牌核心，把蜂蜜保水、胶原修护、光泽和热护理整合成甜润但具有技术感的修护叙事。',
      en: p.id==='loreal'
        ? 'Scalp Advanced treats scalp imbalance as a skin concern that should be diagnosed, classified and addressed through professional protocols. Dermatological actives, expert co-development and measurable claims reinforce L’Oréal Professionnel’s salon authority.'
        : p.id==='andhoney'
        ? '“Moisture-organic beauty” is the central brand idea. Honey, organic oils, numbered steps, changing fragrances and high-recognition packaging turn routine washing into a complete moisture-focused beauty ritual.'
        : p.id==='8thalasso'
        ? 'The brand treats hair hydration like skincare, combining marine beauty, stem-cell language and serum-inspired packaging into an accessible mass-market skinification story.'
        : 'The brand combines water-retention repair and glossy “honey hair,” integrating honey moisture, collagen repair, shine and heat care into a sweet yet technical repair narrative.'
    };
  }
  if(!Array.isArray(p.images)) p.images=[];
});

function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}
function visible(){return products.filter(p=>(filter==='all'||p.category===filter)&&(!query||(bi(p.name)+' '+bi(p.brand)+' '+bi(p.origin)).toLowerCase().includes(query.toLowerCase())))}
function renderChrome(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('title').textContent=tr().title;document.getElementById('subtitle').textContent=tr().subtitle;document.getElementById('totalTxt').textContent=tr().total;document.getElementById('search').placeholder=tr().search;document.getElementById('addBtn').textContent=tr().add;document.getElementById('pdfBtn').textContent=tr().pdf;document.getElementById('slidesBtn').textContent=tr().slides;document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中文';const f=document.getElementById('filter');f.innerHTML=`<option value="all">${tr().all}</option><option value="japan">Japan</option><option value="europe">Europe</option>`;f.value=filter;document.getElementById('total').textContent=products.length;document.getElementById('japan').textContent=products.filter(p=>p.category==='japan').length;document.getElementById('europe').textContent=products.filter(p=>p.category==='europe').length}
function renderSidebar(){const box=document.getElementById('sidebar');box.innerHTML='';visible().forEach((p,i)=>{const d=document.createElement('div');d.className='side'+(p.id===selected?' active':'');d.innerHTML=`<div class="side-num">${i+1}</div><img src="${esc(p.images?.[0]||'')}"><div class="side-name">${esc(bi(p.name))}</div><span class="dot ${p.category}"></span>`;d.onclick=()=>{selected=p.id;render()};box.appendChild(d)})}
function section(title,key,p){return `<div class="section"><div class="section-head">${title}</div><div class="section-body" contenteditable="true" data-key="${key}">${esc(bi(p[key]))}</div></div>`}
function renderDetail(){const list=visible();if(!list.some(p=>p.id===selected))selected=list[0]?.id;const p=products.find(x=>x.id===selected);const root=document.getElementById('detail');if(!p){root.innerHTML='';return}const idx=products.findIndex(x=>x.id===p.id)+1;root.innerHTML=`<section class="media"><div class="media-hero"><img id="mainImg" src="${esc(p.images?.[0]||'')}"></div><div class="thumbs">${(p.images||[]).map((u,i)=>`<span class="thumb-wrap"><button class="thumb ${i===0?'active':''}" data-src="${esc(u)}"><img src="${esc(u)}"></button><button class="thumb-delete" data-index="${i}" title="Delete image">×</button></span>`).join('')}<button class="thumb-add" id="addImageUrlBtn" title="${lang==='zh'?'粘贴图片地址':'Paste image URL'}">＋</button></div><div class="image-upload-row"><input id="imageUpload" type="file" accept="image/*" multiple hidden><button class="upload-btn" id="uploadImageBtn">＋ ${lang==='zh'?'上传本地图片':'Upload Local Images'}</button><span class="upload-hint">${lang==='zh'?'自动压缩并保存在当前浏览器':'Compressed and saved in this browser'}</span></div></section><section class="content"><div class="content-head"><span class="index">No. ${String(idx).padStart(3,'0')}</span><span class="cat">${p.category==='japan'?'Japan':'Europe'}</span></div><h2 class="pname" contenteditable="true" data-name>${esc(bi(p.name))}</h2><div class="chips">${[[tr().brand,'brand'],[tr().company,'company'],[tr().origin,'origin'],[tr().capacity,'capacity'],[tr().launch,'launch'],[tr().price,'price']].map(([lab,key])=>`<div class="chip"><div class="chip-label">${lab}</div><div class="chip-val" contenteditable="true" data-key="${key}">${esc(bi(p[key]))}</div></div>`).join('')}</div>${section(tr().market,'market',p)}${section(tr().brandConcept,'brandConcept',p)}${section(tr().positioning,'positioning',p)}${section(tr().target,'target',p)}${section(tr().ingredients,'ingredients',p)}${section(tr().evidence,'evidence',p)}${section(tr().experience,'experience',p)}${section(tr().packaging,'packaging',p)}${section(tr().insight,'insight',p)}<div class="section"><div class="section-head">${tr().sources}</div><div class="section-body"><div class="sources">${(p.sources||[]).map((s,i)=>`<a class="${i===0?'official-source':''}" target="_blank" rel="noopener" href="${esc(s[1])}">${i===0?(lang==='zh'?'官网 · ':'Official Website · '):''}${esc(s[0])} ↗</a>`).join('')}</div></div></div><div class="note"><div class="note-label">${tr().notes}</div><div class="note-body" contenteditable="true" data-key="notes">${esc(bi(p.notes))}</div></div><div class="foot"><span></span><span>${tr().updated} 2026-07-29</span></div></section>`;
document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.getElementById('mainImg').src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
root.querySelectorAll('.thumb-delete').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const i=Number(b.dataset.index);p.images.splice(i,1);save();render()});
document.getElementById('uploadImageBtn').onclick=()=>document.getElementById('imageUpload').click();
document.getElementById('imageUpload').onchange=async(e)=>{
  const files=[...e.target.files];
  for(const file of files){
    try{p.images.push(await compressImage(file,1200,.84))}catch(err){console.warn(err)}
  }
  save();render();
};
document.getElementById('addImageUrlBtn').onclick=()=>{
  const value=prompt(
    lang==='zh'?'粘贴图片地址（https://...）':'Paste image URL (https://...)'
  );
  const url=(value||'').trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){
    toast(lang==='zh'?'请输入有效的图片地址':'Enter a valid image URL');
    return;
  }
  p.images.push(url);
  save();
  render();
};
root.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('blur',()=>{const k=el.dataset.key;if(typeof p[k]!=='object')p[k]={zh:'',en:''};p[k][lang]=el.textContent.trim();save();toast(tr().saved)}));root.querySelector('[data-name]').addEventListener('blur',e=>{p.name[lang]=e.target.textContent.trim();save();toast(tr().saved)})}

function compressImage(file,maxDim=1200,quality=.84){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function buildPrintArea(){
  const area=document.getElementById('printArea');
  area.innerHTML=products.map((p,i)=>`
    <article class="print-product">
      <h1 class="print-title">${String(i+1).padStart(3,'0')} · ${esc(bi(p.name))}</h1>
      <div class="print-grid">
        <div class="print-image"><img src="${esc(p.images?.[0]||'')}"></div>
        <div>
          ${[
            [tr().brandConcept,bi(p.brandConcept)],
            [tr().positioning,bi(p.positioning)],
            [tr().target,bi(p.target)],
            [tr().ingredients,bi(p.ingredients)],
            [tr().evidence,bi(p.evidence)],
            [tr().experience,bi(p.experience)],
            [tr().packaging,bi(p.packaging)],
            [tr().insight,bi(p.insight)]
          ].map(([h,b])=>`<section class="print-section"><h3>${h}</h3><p>${esc(b)}</p></section>`).join('')}
        </div>
      </div>
    </article>`).join('');
}
async function exportPptx(){
  if(typeof PptxGenJS==='undefined'){toast(lang==='zh'?'PPT组件加载失败，请确认网络连接':'PPT library failed to load; check your connection');return}
  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE';
  pptx.author='Competitor Library';
  pptx.subject='Competitive intelligence';
  pptx.title='Competitor Library';
  pptx.company='Internal';
  pptx.lang=lang==='zh'?'zh-CN':'en-US';
  for(let i=0;i<products.length;i++){
    const p=products[i];
    const slide=pptx.addSlide();
    slide.background={color:'EFEDE2'};
    slide.addText(`${String(i+1).padStart(3,'0')}  ${bi(p.name)}`,{x:.45,y:.3,w:12.1,h:.45,fontFace:'Noto Serif SC',fontSize:23,bold:true,color:'20302C',margin:0});
    slide.addText(bi(p.brand),{x:.47,y:.83,w:4.2,h:.25,fontFace:'Noto Sans SC',fontSize:11,color:'BE8F35',margin:0});
    const img=p.images?.[0];
    if(img){
      try{slide.addImage({data:img,x:.55,y:1.25,w:3.45,h:5.55,transparency:0})}catch(e){}
    }
    const blocks=[
      [tr().brandConcept,bi(p.brandConcept)],
      [tr().positioning,bi(p.positioning)],
      [tr().target,bi(p.target)],
      [tr().ingredients,bi(p.ingredients)],
      [tr().evidence,bi(p.evidence)],
      [tr().insight,bi(p.insight)]
    ];
    const positions=[[4.35,1.15,4.05,1.65],[8.55,1.15,4.1,1.65],[4.35,2.98,4.05,1.45],[8.55,2.98,4.1,1.45],[4.35,4.58,4.05,1.62],[8.55,4.58,4.1,1.62]];
    blocks.forEach((b,j)=>{
      const [x,y,w,h]=positions[j];
      slide.addShape(pptx.ShapeType.rect,{x,y,w,h,fill:{color:'FFFFFF'},line:{color:'DDD8C6',width:1},radius:.06});
      slide.addText(b[0],{x:x+.16,y:y+.12,w:w-.32,h:.2,fontFace:'Noto Sans SC',fontSize:9,bold:true,color:'7A5A18',margin:0});
      slide.addText(b[1],{x:x+.16,y:y+.38,w:w-.32,h:h-.48,fontFace:'Noto Sans SC',fontSize:9.3,color:'20302C',breakLine:false,fit:'shrink',valign:'top',margin:0.02});
    });
    slide.addText(`${tr().company}: ${bi(p.company)}   ·   ${tr().capacity}: ${bi(p.capacity)}   ·   ${tr().price}: ${bi(p.price)}`,{x:.55,y:7.1,w:12.1,h:.2,fontFace:'Noto Sans SC',fontSize:8.5,color:'8B8A7D',margin:0});
  }
  await pptx.writeFile({fileName:`Competitor_Library_${lang.toUpperCase()}.pptx`});
}

function render(){renderChrome();renderSidebar();renderDetail()}
document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.getElementById('pdfBtn').onclick=()=>{buildPrintArea();document.body.classList.add('print-all');setTimeout(()=>window.print(),60)};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
document.getElementById('slidesBtn').onclick=exportPptx;
document.getElementById('addBtn').onclick=()=>toast(lang==='zh'?'当前版本保留入口，新增产品表单下一步接入':'Entry retained; product form will be connected next');
render();
</script></body></html>
