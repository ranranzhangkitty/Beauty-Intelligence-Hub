<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Competitor Library V7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,500&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--ink:#000000;--ink-soft:#55607A;--paper:#F4F5F7;--card:#FFFFFF;--plinth:#EEF0F3;--line:#DADDE2;--honey:#2C6E8E;--honey-soft:#DCEAF0;--sage:#6B7A99;--sage-soft:#E3E7EE;--plum:#C15B72;--plum-soft:#F5DEE3;--grey:#8A8F9C;--grey-soft:#E7E9EC;--shadow:0 1px 3px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.08);--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Montserrat","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}.wrap{max-width:1380px;margin:auto;padding:24px 26px 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--honey);font-weight:700;margin-bottom:10px}h1{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:38px;margin:0 0 8px}.hero p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.7;max-width:650px}.stats{display:flex;align-items:center}.stat{font-family:var(--serif);text-align:center;padding:6px 19px;border-left:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--grey);letter-spacing:.1em}button,input,select{font-family:var(--sans)}button{cursor:pointer;border-radius:3px;font-size:12.5px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button:hover{box-shadow:var(--shadow)}.lang{font-weight:700;border-color:var(--ink);min-width:52px}
.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 28px}.group{display:flex;gap:9px;flex-wrap:wrap}.search,.filter{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 12px;font-size:13px}.search{min-width:250px}.primary{background:var(--honey);border-color:var(--honey);font-weight:700}
.workspace{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}.side{position:relative;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px;cursor:pointer;text-align:center}.side.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft) inset}.side-num{position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:2}.side img{width:100%;height:72px;object-fit:contain;background:var(--plinth);border-radius:3px}.side-noimg{width:100%;height:72px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--plinth);border-radius:3px;opacity:.6}.side-name{font-size:10.5px;line-height:1.35;margin-top:6px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.7em}.side.dragging{opacity:.4}.side{cursor:grab}
#gridToggle{width:44px;height:44px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;transition:background .3s ease,border-color .3s ease,transform .15s ease;overflow:hidden}
#gridToggle.active{background:#000;border-color:#000}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.grid-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;position:relative;transition:box-shadow .12s,border-color .12s}
.grid-card:hover{box-shadow:var(--shadow)}
.grid-card.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft)}
.grid-num{position:absolute;top:16px;left:16px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2}
.grid-thumb{width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:var(--plinth);border-radius:4px;margin-bottom:8px}
.grid-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.grid-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.5}
.grid-name{font-size:12px;line-height:1.4;color:var(--ink);font-weight:600;margin-bottom:6px;min-height:2.5em}
.grid-check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:5px;border:1.5px solid #C9CCD3;background:#fff;z-index:3;cursor:pointer;padding:0;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.grid-card.picked{border:2px solid #C15B72}
.grid-card.picked .grid-check{background:#C15B72;border-color:#C15B72}
.export-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:#F5DEE3;border-radius:6px;margin-bottom:14px;width:fit-content}
.export-bar-count{font-size:12px;color:#8B3A52;font-weight:600}
.export-bar button{font-size:11px;padding:6px 12px;border-radius:4px;border:1px solid #8B3A52;background:#fff;color:#8B3A52}
.export-bar button#exportBarClear{border:none;background:transparent;color:#8A8F9C}
.feedback-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.feedback-item{background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 12px;transition:background .15s ease}
.feedback-item:hover{background:#FFF8E1}
.feedback-item-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:8px}
.feedback-item-name{font-size:12px;font-weight:700;color:#C15B72}
.feedback-item-date-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.feedback-item-date{font-size:10px;color:#8A8F9C;white-space:nowrap}
.feedback-item-text{font-size:12px;color:#1A1D24;margin:0;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.team-feedback .section-head{background:#F5DEE3;color:#8B3A52}
.feedback-item-del{background:#fff;border:1px solid var(--line);border-radius:4px;color:#8B3A52;font-size:10px;padding:3px 7px;font-weight:600;flex-shrink:0}
.feedback-item-del:hover{background:#C15B72;color:#fff;border-color:#C15B72}
.feedback-loading,.feedback-empty{font-size:11px;color:#8A8F9C}
.feedback-form{border-top:1px dashed var(--line);padding-top:12px}
.feedback-form-row1{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.feedback-form input{width:100%;box-sizing:border-box;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;font-family:Montserrat,'Noto Sans SC',sans-serif}
.feedback-add-btn{font-size:11px;padding:7px 14px;border-radius:4px;border:1px solid #C15B72;background:#C15B72;color:#fff;font-weight:600}
.grid-tags{display:flex;gap:6px;flex-wrap:wrap}
.ptype-pill{font-size:10.5px;padding:4px 10px;border-radius:20px;background:#F5DEE3;color:#8B3A52;font-weight:600}.detail{background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(260px,30%) minmax(0,70%);overflow:hidden}
.media{background:var(--plinth);border-right:1px solid var(--line);display:flex;flex-direction:column}.media-hero{height:460px;display:flex;align-items:center;justify-content:center;padding:24px 24px 16px}.media-hero img{width:78%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(0,0,0,.15))}.thumbs{display:flex;justify-content:center;gap:8px;padding:12px 16px 18px;flex-wrap:wrap}.thumb{width:48px;height:62px;padding:3px;border:1.5px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center}.thumb.active{border-color:var(--honey)}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.content{padding:20px 22px 18px;min-width:0}.content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.index{font-family:var(--serif);font-size:11px;color:var(--grey);letter-spacing:.08em}.cat{font-size:10.5px;padding:4px 10px;border-radius:20px;background:var(--honey-soft);color:#17495F;border:0}.ptype{font-size:10.5px;padding:4px 10px;border-radius:20px;background:#F5DEE3;color:#8B3A52;border:0;margin-left:6px;font-weight:600}.pname{font-family:var(--sans);font-weight:800;font-size:22px;line-height:1.22;margin:0 0 10px;outline:none;letter-spacing:-.01em}.chips{display:grid;grid-template-columns:1fr;gap:8px;padding:0 16px 18px;margin-bottom:0}.chip{background:#fff;padding:6px 8px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.chip-label{font-size:9px;letter-spacing:.06em;color:var(--grey);font-weight:700;text-transform:uppercase;flex:0 0 auto;white-space:nowrap}.chip-val{font-size:11.5px;line-height:1.45;outline:none;text-align:right}.section{border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}.section-head{background:var(--honey-soft);color:#17495F;padding:6px 10px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans)}.section-body{padding:9px 12px;font-size:12px;line-height:1.55;outline:none;white-space:pre-wrap}.section-body:hover,.chip-val:hover,.pname:hover{background:rgba(190,143,53,.07)}.note{background:#FBEFC4;border:1px solid #E6D28B;border-radius:4px;padding:11px 14px;margin-top:2px}.note-label{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:#8A6A1E;margin-bottom:6px}.note-body{font-size:12px;line-height:1.6;outline:none;min-height:18px}.sources{display:flex;gap:7px;flex-wrap:wrap}.media-price{padding:0 16px 18px}.media-price .section{margin-bottom:0}.sources a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.sources-plain{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}.sources-plain a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--grey);font-size:10.5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}.media{border-right:0;border-bottom:1px solid var(--line);min-height:auto}.media-hero{height:520px}}
@media(max-width:760px){.wrap{padding:20px 14px 60px}.workspace{grid-template-columns:1fr}.sidebar{position:relative;max-height:none;display:flex;flex-direction:row;overflow:auto}.side{min-width:100px}.chips{grid-template-columns:1fr}}
@media print{.toolbar,.sidebar,.lang,.thumb-add,.upload-btn,.image-upload-row,.thumb-delete,.team-feedback{display:none!important}.workspace{display:none!important}.detail{box-shadow:none}.section{break-inside:avoid}#printArea{display:none}body.print-all #printArea{display:block!important}.print-detail{border:none;box-shadow:none;page-break-after:always;margin-bottom:0}.print-detail:last-child{page-break-after:auto}}

.image-upload-row{display:flex;justify-content:center;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.upload-btn{background:transparent;border:1px dashed var(--honey);color:#17495F;padding:8px 12px}
.upload-hint{font-size:9.5px;color:var(--grey);align-self:center}
.thumb-wrap{position:relative}
.thumb-delete{position:absolute;right:-4px;top:-4px;width:17px;height:17px;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;line-height:17px;display:none}
.thumb-wrap:hover .thumb-delete{display:block}
#printArea{display:none}
.print-product{page-break-after:always;background:#fff;padding:16mm;min-height:270mm}
.print-product:last-child{page-break-after:auto}
.print-title{font-family:var(--serif);font-size:25px;margin:0 0 10px}
.print-grid{display:grid;grid-template-columns:34% 66%;gap:12mm}
.print-image{height:220mm;display:flex;align-items:flex-start;justify-content:center;background:var(--plinth);padding:12mm}
.print-image img{max-width:100%;max-height:100%;object-fit:contain}
.print-section{border:1px solid var(--line);margin-bottom:6px}
.print-section h3{font-size:10px;letter-spacing:.06em;background:var(--honey-soft);color:#17495F;margin:0;padding:6px 8px}
.print-section p{font-size:10px;line-height:1.5;margin:0;padding:7px 8px;white-space:pre-wrap}
@media print{
  body.print-all .wrap{display:none!important}
  body.print-all #printArea{display:block!important}
  body.print-all{background:#fff}
  @page{size:A4 portrait;margin:0}
}


.thumb-add{
  width:48px;height:62px;padding:0;border:1.5px dashed var(--line);
  background:rgba(255,255,255,.35);color:var(--grey);font-size:25px;
  display:flex;align-items:center;justify-content:center;
}
.thumb-add:hover{border-color:var(--honey);color:var(--honey);box-shadow:none}
.official-source{font-weight:700;color:#17495F!important;border-bottom-color:var(--honey)!important}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row2>.section{margin-bottom:0}
.ic-head{display:flex;align-items:center;gap:7px}
.ic-head .ic{font-size:13px}
.ul-dot{margin:0;padding:0;list-style:none}
.ul-dot li{position:relative;padding-left:14px;margin-bottom:3px;font-size:11.5px;line-height:1.42}
.ul-dot li:before{content:"•";position:absolute;left:0;color:var(--honey);font-weight:700}
.ul-check{margin:0;padding:0;list-style:none}
.ul-check li{position:relative;padding-left:18px;margin-bottom:3px;font-size:11.5px;line-height:1.42}
.ul-check li:before{content:"✓";position:absolute;left:0;color:#3F8E52;font-weight:700}
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tech-card .t{font-size:12px;font-weight:700;color:#000;margin:0 0 4px}
.tech-card .d{font-size:11px;color:#55607A;line-height:1.5}
.ingredient-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.ingredient-name{font-weight:700;font-size:12px;margin-top:2px}
.ingredient-tag{font-size:10.5px;color:#17495F;margin-top:2px}
.ingredient-desc{font-size:10.5px;color:var(--grey);margin-top:2px;line-height:1.4}
.price-tier-row{display:flex;gap:4px;margin-bottom:8px}
.price-tier-seg{flex:1;height:8px;border-radius:2px;background:var(--grey-soft)}
.price-tier-seg.active{background:var(--honey)}
.price-tier-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--grey);margin-bottom:12px}
.price-tier-title{font-weight:700;font-size:12.5px;margin-bottom:2px}
.price-tier-desc{font-size:11px;color:var(--ink-soft)}
.price-tier-stat{font-size:10.5px;color:#17495F;margin-top:10px;background:var(--honey-soft);padding:5px 8px;border-radius:3px;display:inline-block}
.market-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.market-col-title{font-size:9px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.concept-quote{font-family:Montserrat,'Noto Sans SC',sans-serif;font-style:italic;font-weight:500;font-size:13px;color:#1A1D24;margin:0;line-height:1.7;border-left:2px solid #C15B72;padding-left:14px}
.concept-quote .concept-tag{color:#C15B72;font-weight:700}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px}
.concept-card{border:1px solid var(--line);border-radius:4px;padding:7px}
.concept-card .t{font-size:11.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.concept-card .d{font-size:10.5px;line-height:1.5;color:var(--ink-soft)}
.adv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adv-col-title{font-size:12px;font-weight:700;margin-bottom:8px;color:#8B3A52;padding-bottom:5px;border-bottom:2px solid #C15B72;display:inline-block}
@media(max-width:1000px){.row2,.ingredient-grid,.market-grid,.concept-grid,.adv-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div><div class="eyebrow" id="eyebrow">Competitive Intelligence</div><h1 id="title">竞品情报库</h1><p id="subtitle"></p></div><div class="stats"><div class="stat"><b id="total">0</b><span id="totalTxt">总数</span></div><div class="stat"><b id="japan">0</b><span>JAPAN</span></div><div class="stat"><b id="europe">0</b><span>EUROPE</span></div><div class="stat"><b id="usa">0</b><span>USA</span></div><div class="stat"><button class="lang" id="langBtn">EN</button></div></div></header>
<div class="toolbar"><div class="group"><select class="filter" id="filter"></select><select class="filter" id="filterType"></select><input class="search" id="search"><button id="sortBrandBtn"></button><button id="sortAddedBtn"></button><button id="gridToggle" title="Grid overview"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><g id="gridIcon" style="transform-origin:10px 10px;transition:transform .5s cubic-bezier(.34,1.4,.4,1)"><rect x="2" y="2" width="7" height="7" rx="3.5" fill="#C15B72"></rect><rect x="11" y="2" width="7" height="7" rx="3.5" fill="#C15B72"></rect><rect x="2" y="11" width="7" height="7" rx="3.5" fill="#C15B72"></rect><rect x="11" y="11" width="7" height="7" rx="3.5" fill="#C15B72"></rect></g></svg></button></div><div class="group"><button id="pdfBtn">导出 PDF</button><button id="slidesBtn">下载幻灯片</button></div></div>
<div class="workspace" id="workspace"><aside class="sidebar" id="sidebar"></aside><main class="detail" id="detail"></main></div><div class="library-grid" id="libraryGrid" style="display:none"></div>

<script>
const DEFAULTS=[{"id": "andhoney","category": "japan","name": {"zh": "&honey Deep Moist Shampoo 1.0","en": "&honey Deep Moist Shampoo 1.0"},"brand": {"zh": "&honey","en": "&honey"},"company": {"zh": "ViCREA","en": "ViCREA"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2018 年 4 月 5 日","en": "April 5, 2018"},"market": {"zh": "日本全国药妆、综合零售、品牌电商及跨境电商","en": "Japanese drugstores, general retail, brand e-commerce and cross-border e-commerce"},"capacity": {"zh": "440 mL","en": "440 mL"},"price": {"zh": "¥1,540","en": "¥1,540"},"positioning": {"zh": "以“头发水分量 14%”和“保水有机美容”为核心，把蜂蜜、有机油和美容液成分组合成高保湿洗护体系。产品的核心差异不是解决单一损伤，而是让消费者相信整个洗护流程都围绕保持发丝水分展开。系列化步骤编号、香味变化和高装饰性瓶身进一步强化仪式感。","en": "Built around “14% hair moisture” and a moisture-organic beauty proposition. Honey, organic oils and beauty-serum ingredients are organized into a hydration system, while numbered steps, changing fragrances and jewel-like packaging create ritual value."},"target": {"zh": "面向干燥、毛躁、缺水、卷曲和希望获得明显滋润感的人群。品牌视觉年轻、甜美、适合社交媒体传播，核心用户更偏年轻女性，但实际购买人群很广。对细软、容易塌发的人群，Deep Moist 的丰润感可能偏重。","en": "For consumers with dry, frizzy and moisture-depleted hair who want a rich conditioning feel. The brand’s visual language is young, sweet and social-media friendly, although its actual audience is broad."},"distribution": {"zh": "440 mL / ¥1,540，与日本大众高机能洗护主流价位一致。全国药妆、Ainz & Tulpe、综合零售、电商覆盖广，渠道优势明显。长期在售与高评论量形成较强社会证明，替代成本来自品牌认知而非高技术壁垒。","en": "440 mL at ¥1,540, aligned with Japan’s mainstream mass-premium haircare segment. Wide drugstore, lifestyle retail and e-commerce distribution gives the brand a major channel advantage."},"ingredients": {"zh": "品牌强调 90% 以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，并使用摩洛哥有机油。蜂蜜配比故事为 Manuka 50%、Acacia 30%、日本生蜂蜜 20%。洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。","en": "The brand emphasizes that more than 90% of the formula consists of honey, organic oils, royal jelly and other moisturizing or protective ingredients. The honey story uses a 50% Manuka, 30% Acacia and 20% Japanese raw honey blend."},"evidence": {"zh": "公开资 nsparent, faceted design with strong shelf appeal"]},"packagingItems": {"zh": ["视觉：琥珀色透明液体+几何切面瓶+金色泵头","联想：强化“蜂蜜高级感”","步骤编号：1.0/1.5/2.0体系强化仪式感","优势：包装是最难被低成本复制的品牌资产之一"],"en": ["Visual: amber transparent liquid + geometric faceted bottle + gold pump","Association: reinforces a “premium honey” feel","Step numbering: 1.0/1.5/2.0 system reinforces ritual routine","Strength: packaging is one of the hardest brand assets to copy cheaply"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "蜂蜜配比公式体系","desc": "以50%麦卢卡+30%洋槐+20%生蜂蜜的精确配比作为标准化配方方法，而非随意混合。"},{"title": "步骤编号仪式系统","desc": "1.0/1.5/2.0的编号体系把单品串联成一套结构化护理流程，而非各自独立的产品。"}],"en": [{"title": "Honey Ratio Formulation System","desc": "A precise 50/30/20 blend of Manuka, Acacia, and raw honey used as a standardized formulation method rather than an arbitrary mix."},{"title": "Step-Numbered Ritual System","desc": "The 1.0/1.5/2.0 numbering links standalone products into one structured routine rather than isolated items."}]},"addedAt": 2},{"id": "8thalasso","category": "japan","name": {"zh": "8 THE THALASSO Moist Shampoo","en": "8 THE THALASSO Moist Shampoo"},"brand": {"zh": "8 THE THALASSO","en": "8 THE THALASSO"},"company": {"zh": "Stella Seed","en": "Stella Seed"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "系列既有产品；现版本于 2025 年夏季更新","en": "Existing range; current version renewed in summer 2025"},"market": {"zh": "日本全国药妆、电商、Loft / PLAZA 等","en": "Japanese drugstores, e-commerce, Loft, PLAZA and lifestyle retail"},"capacity": {"zh": "本体 475 mL / 替换装 400 mL","en": "475 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,540 / 替换装 ¥1,210","en": "¥1,540 bottle / ¥1,210 refill"},"positioning": {"zh": "“护肤化的保水美容液洗发水”。把海洋来源成分、干细胞提取物概念、PPT 系洗净成分和 84% 美容液成分整合为高保湿修护叙事。差异点不是单一成分，而是“洗发步骤即美容液护理”。","en": "A skincare-inspired moisture serum shampoo that combines marine-derived ingredients, stem-cell-extract concepts, PPT cleansing agents and an “84% beauty serum ingredients” claim. Its differentiation is not a single active but the idea that shampooing itself functions as a serum-care step."},"target": {"zh": "核心面向干燥、毛躁、打结、缺乏光泽、有染烫或热工具损伤的人群。年龄并未在官方页面明确限定，视觉语言更接近重视成分感、简洁包装和药妆可得性的年轻至中青年消费者。","en": "Aimed at people with dryness, frizz, tangling, dullness and damage from coloring, perming or heat tools. The minimalist packaging and ingredient-focused language appeal mainly to young and middle-aged beauty consumers."},"distribution": {"zh": "本体 475 mL / ¥1,540；替换装 400 mL / ¥1,210。属于日本中价位大众高机能洗护，依赖药妆与大型生活方式零售触达，同时通过官方电商和平台电商覆盖。","en": "475 mL at ¥1,540 and a 400 mL refill at ¥1,210. It sits in Japan’s mid-priced mass-premium haircare segment, with broad distribution through drugstores, lifestyle retailers and e-commerce."},"ingredients": {"zh": "氨基酸系洗净成分 + PPT 系洗净成分；代表成分包括 Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K。Polyquaternium-51 作为保湿与顺滑强化点，“Thalasso stem-cell formula”则是品牌复合概念。新版去除了 Olefin(C12-16) Sulfonate Na，意图降低强清洁印象。","en": "Amino-acid cleansing agents plus PPT-derived surfactants, including Cocoyl Hydrolyzed Collagen K and Cocoyl Hydrolyzed Keratin K. Polyquaternium-51 strengthens hydration and slip, while the “Thalasso stem-cell formula” acts as the brand’s composite technology story."},"evidence": {"zh": "当前公开页面以配方、成分功能及品牌内部比较为主。公开资料明确提到产品中 84% 为美容液成分，但该比例包含水；未看到完整第三方临床报告、详细样本量或公开统计结果。","en": "Public materials focus on formula composition, ingredient functions and internal brand comparisons. The 84% beauty-serum figure includes water. No complete third-party clinical report or detailed sample size was found."},"experience": {"zh": "透明或半透明大容量泵瓶，银白色泵头与竖排极简标签强化“水感、洁净、实验室感”。香型为 Aqua White Floral。洗发剂型强调浓密泡沫、温和清洁、洗后湿润与“ぷるん髪”弹润感。","en": "A transparent large pump bottle with silver-white hardware and vertical minimalist labeling. Aqua White Floral fragrance. The product emphasizes rich foam, mild cleansing, moisturized feel and bouncy, supple hair."},"packaging": {"zh": "极简透明瓶、垂直排版和银白配色是品牌最强识别资产。视觉同时传达海洋、水感和实验室美容液。优点是货架辨识度高；风险是系列扩张后不同功效款外观相近。","en": "The transparent bottle, vertical typography and silver-white palette strongly convey water, marine beauty and laboratory skincare. Shelf recognition is high, although multiple variants can be difficult to distinguish."},"insight": {"zh": "真正值得研究的不是“84% 美容液”这个数字，而是如何把 PPT 洗净成分、阳离子保湿聚合物、海洋成分与干细胞概念整合成一个消费者能理解的 Skinification 故事。","en": "The most valuable lesson is not the 84% claim itself, but the integration of PPT cleansing agents, a moisturizing polymer, marine ingredients and stem-cell language into one understandable skinification story."},"notes": {"zh": "","en": ""},"images": ["https://taosbeauty.com/cdn/shop/files/72664f3e1aa7b236c00fc90563382201_a3885a1b-7e2a-42bd-8220-7212e70b320e.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/c559df78-8834-48c0-b293-45944896881c.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/1eb5fa63-b2b9-4e4b-b5f7-de6727f1b6f8.jpg?v=1753689513&width=1000"],"sources": [["MAQUIA renewal information","https://maquia.hpplus.jp/cosme/170189/"],["Retail product page","https://taosbeauty.com/products/eight-the-thalasso-moist-shampoo"]],"targetUsers": {"zh": ["干燥、毛躁、打结、缺乏光泽人群","染烫或热工具损伤发质","偏好成分感、简洁包装的年轻至中青年消费者","希望“洗发即美容液护理”体验的人群"],"en": ["Dryness, frizz, tangling, dullness","Hair damaged by coloring, perming or heat tools","Young to middle-aged consumers who value ingredient-forward, minimalist packaging","Those seeking a “shampoo as serum care” experience"]},"keyClaims": {"zh": ["84%成分为美容液成分（含水）","干细胞提取物+海洋来源成分复合概念","PPT系洗净成分，兼顾清洁与滋养","2025年夏季配方更新，降低强清洁印象"],"en": ["84% of ingredients are “beauty serum” ingredients (water included)","Composite concept of stem-cell extracts + marine-derived ingredients","PPT-derived cleansing agents balance cleansing and nourishment","Reformulated in summer 2025 to soften the “strong cleansing” impression"]},"heroIngredients": {"zh": [{"name": "Thalasso干细胞复合物","tag": "海洋美容概念","desc": "品牌复合概念，整合海洋来源成分与干细胞提取物叙事"},{"name": "PPT系洗净成分","tag": "氨基酸温和洁净","desc": "Cocoyl Hydrolyzed Collagen K、Cocoyl Hy nce closer to everyday drugstore shopping"]},{"name": "L'Occitane (prestige line)","points": ["More competitive pricing","Minimalist, lab-like visual rather than fragrance-led","Relies more on ingredient story than brand heritage"]},{"name": "Shiseido TSUBAKI","points": ["Stronger “beauty serum” technology narrative","Clear differentiation via stem-cell and marine concepts","Packaging leans into a “clean” positioning"]}]},"evidenceStats": {"zh": ["84%美容液成分为官方声明，但该比例包含水分","公开资料以配方、成分功能及品牌内部比较为主","未见完整第三方临床报告、样本量或统计结果"],"en": ["The 84% beauty-serum figure is an official claim, but the ratio includes water","Public materials focus mainly on formula composition and internal brand comparisons","No complete third-party clinical report, sample size or statistical results were found"]},"experienceItems": {"zh": ["瓶身：透明/半透明大容量泵瓶，银白泵头","设计：竖排极简标签，强化水感与实验室感","香调：Aqua White Floral","洗感：浓密泡沫，温和清洁，“ぷるん髪”弹润感"],"en": ["Bottle: transparent/translucent large pump bottle, silver-white hardware","Design: vertical minimalist labeling, reinforcing a water/lab aesthetic","Scent: Aqua White Floral","Feel: rich foam, mild cleansing, bouncy ‘purun’ supple hair"]},"packagingItems": {"zh": ["视觉：极简透明瓶+垂直排版+银白配色","联想：海洋、水感、实验室美容液","优势：货架辨识度高","风险：系列扩张后不同功效款外观相近"],"en": ["Visual: minimalist transparent bottle + vertical typography + silver-white palette","Association: marine, water, laboratory skincare","Strength: high shelf recognition","Risk: variants across the range can look similar as the line expands"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "海洋干细胞萃取工艺","desc": "品牌自有的海洋来源成分与干细胞提取复合工艺，构成其核心技术叙事。"},{"title": "PPT洗净体系重构","desc": "2025年配方更新中移除强力硫酸盐成分，改用氨基酸系PPT洗净技术，降低强清洁感。"}],"en": [{"title": "Marine Stem-Cell Extraction Process","desc": "A proprietary complex of marine-derived ingredients and stem-cell extracts forms the brand's core technology story."},{"title": "PPT Cleansing Reformulation","desc": "The 2025 reformulation removed harsher sulfate agents in favor of amino-acid-based PPT cleansing technology, softening the strong-cleansing feel."}]},"addedAt": 3},{"id": "advclinicals-keratin","category": "usa","name": {"zh": "Advanced Clinicals Keratin Sleek + Smooth Hair Mask","en": "Advanced Clinicals Keratin Sleek + Smooth Hair Mask"},"brand": {"zh": "Advanced Clinicals","en": "Advanced Clinicals"},"company": {"zh": "Advanced Clinicals（cosmeceuticals平价功效护肤品牌）","en": "Advanced Clinicals (an accessible-priced cosmeceuticals brand)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌核心护发系列常规单品","en": "A standard item in the brand's core haircare lineup"},"market": {"zh": "Walmart、iHerb、Amazon等美国大众/电商渠道","en": "Walmart, iHerb, Amazon and other US mass/e-commerce channels"},"capacity": {"zh": "12 fl oz / 340 g","en": "12 fl oz / 340 g"},"price": {"zh": "约US$13.99（单瓶）","en": "~US$13.99 (single bottle)"},"positioning": {"zh": "以角蛋白+乳木果油为核心的强效补水发膜，主打软化强韧受损发丝、改善顺滑与光泽，走科学驱动的平价功效品牌定位。","en": "A keratin + shea butter intensive hydrating hair mask, positioned to soften and strengthen weak hair while improving smoothness and shine, under the brand's science-driven, accessible positioning."},"target": {"zh": "干燥、毛躁、易断裂或经过染烫处理的受损发质人群，偏好平价功效型护理而非专业沙龙价位的消费者。","en": "Dry, frizzy, breakage-prone or color-treated damaged hair; consumers who prefer accessible, science-positioned care over professional salon pricing."},"ingredients": {"zh": "水、鲸蜡醇、甘油、双十八烷基二甲基氯化铵、肉豆蔻酸异丙酯、椰子油、水解角蛋白、丝氨基酸、水解米蛋白、泛醇（维生素B5）、乳木果油、聚季铵盐硅油-3、羟乙基纤维素等。","en": "Water, cetyl alcohol, glycerin, behentrimonium chloride, isopropyl myristate, coconut oil, hydrolyzed keratin, silk amino acids, hydrolyzed rice protein, panthenol (vitamin B5), shea butter, silicone quaternium-3, hydroxyethylcellulose, and more."},"evidence": {"zh": "宣称主要基于品牌自述的科学驱动配方与成分功效描述，未见公开的独立第三方临床或仪器测试数据；用户评论中有反馈香精浓郁引发头痛等敏感问题。","en": "Claims rest mainly on the brand's self-described science-driven formula and ingredient-function descriptions; no public independent third-party clinical or instrumental data found. Some user reviews note the fragrance is strong enough to cause headaches for sensitive users."},"experience": {"zh": "乳霜质地，清洁湿发后大量涂抹，停留5-10分钟后彻底冲洗；建议头皮易出油人群避开发根使用；每周或按需使用。","en": "Creamy texture; apply generously to clean, damp hair, leave on 5-10 minutes, then rinse thoroughly. Those with an oily scalp are advised to avoid the roots; recommended weekly or as needed."},"packaging": {"zh": "塑料瓶身，简洁临床感标签设计（角蛋白、维生素B5等成分icon化呈现），强化科学护理平价定位。","en": "A plastic bottle with a clean, clinical-style label (keratin, vitamin B5 and other ingredients shown as icons), reinforcing the brand's science-driven mass positioning."},"insight": {"zh": "Advanced Clinicals证明皮肤科学话语体系可以从护肤品类平移到护发品类，用cosmeceuticals定位在平价市场中建立差异化，但香精浓度等细节仍是用户体验的潜在风险点。","en": "Advanced Clinicals shows that a dermatological science vocabulary can transfer from skincare into haircare, using a cosmeceuticals position to differentiate within the mass market, though details like fragrance intensity remain a potential experience risk."},"notes": {"zh": "","en": ""},"images": ["https://advancedclinicals.com/cdn/shop/files/AC156_KeratinHairMask_Main_2048x.jpg?v=1760986137","https://advancedclinicals.com/cdn/shop/files/AC156-R2_Keratin_Hair_Mask_Slide_2_Retail_Ready_112125_2048x.jpg?v=1766003997","https://advancedclinicals.com/cdn/shop/files/AC156-R2_Keratin_Hair_Mask_Slide_5_Key_Ingredients_112125_2048x.jpg?v=1766003997"],"sources": [["Official product page","https://advancedclinicals.com/products/keratin-hair-mask"],["Ingredients (EWG Skin Deep)","https://www.ewg.org/skindeep/products/9343667-Advanced_Clinicals_Keratin_Sleek__Smooth_Hair_Mask_for_Damaged_Hair_12_fl_oz/"]],"targetUsers": {"zh": ["干燥、毛躁、易断裂发质人群","染烫等化学处理后的受损发质","偏好平价科学功效型护理的消费者","习惯在Walmart/iHerb等渠道购物的人群"],"en": ["Dry, frizzy, breakage-prone hair","Color-treated or chemically damaged hair","Consumers who prefer accessible science-driven care","Shoppers who buy via Walmart/iHerb channels"]},"keyClaims": {"zh": ["软化强韧受损发丝","角蛋白+泛醇+米蛋白+椰子油组合","改善顺滑度与光泽","科学驱动的平价功效定位"],"en": ["Softens and strengthens weak, damaged hair","Keratin + panthenol + rice protein + coconut oil blend","Improves smoothness and shine","Science-driven, accessible positioning"]},"heroIngredients": {"zh": [{"name": "水解角蛋白","tag": "顺滑修护","desc": "改善头发顺滑度与可梳理性外观"},{"name": "乳木果油+泛醇（维生素B5）","tag": "深层保湿","desc": "锁住水分，提升柔软与光泽感"}],"en": [{"name": "Hydrolyzed Keratin","tag": "Smoothing & repair","desc": "Improves the look of hair smoothness and manageability"},{"name": "Shea Butter + Panthenol (Vitamin B5)","tag": "Deep hydration","desc": "Locks in moisture for a softer, shinier finish"}]},"ingredientsNote": {"zh": "配方还含水解米蛋白（提升光泽与蓬松感外观）与丝氨基酸，整体走成分功能标注清晰的科学感沟通方式。","en": "The formula also includes hydrolyzed rice protein (for visible shine and volume) and silk amino acids, communicated overall in a clear, science-forward, function-labeled style."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Cosmeceutical Value"},"en": {"tier": "mass","label": "Mass Cosmeceutical Value"}},"marketChannel": {"zh": {"global": ["品牌官网","iHerb","Amazon"],"japan": ["Walmart"],"channelLabel": "Mass & E-commerce Retail","channelDesc": "以Walmart与电商平台为核心分销渠道"},"en": {"global": ["Brand website","iHerb","Amazon"],"japan": ["Walmart"],"channelLabel": "Mass & E-commerce Retail","channelDesc": "Core distribution via Walmart and e-commerce platforms"}},"brandConceptRich": {"zh": {"tagline": "护肤科学，用在头发上。","concept": "Advanced Clinicals把自己在护肤领域建立的品牌信誉延伸到头发护理，借用皮肤学式的宣称语言，同时保持药妆价格。"},"en": {"tagline": "Skincare science, for hair.","concept": "Advanced Clinicals extends its skincare-brand credibility into haircare, borrowing dermatology-style claims and formulation language at a drugstore price point."}},"competitiveAdvantage": {"zh": [{"name": "OGX Keratin Oil系列","points": ["临床/科学话语体系比OGX更突出","价格带接近，直接竞争","OGX渠道覆盖与品牌知名度更大"]},{"name": "Aussie 3 Minute Miracle","points": ["定位平价功效护理，非单纯感官体验","成分标注更透明化","Aussie品牌历史与渠道规模更大"]},{"name": "Garnier Fructis Keratin系列","points": ["cosmeceuticals平价定位差异化明显","Garnier渠道覆盖更广、营销投入更大","价格带接近，直接竞争"]}],"en": [{"name": "OGX Keratin Oil line","points": ["More pronounced clinical/science vocabulary than OGX","Very close price band, direct competitor","OGX has broader retail reach and brand awareness"]},{"name": "Aussie 3 Minute Miracle","points": ["Positioned around accessible functional care rather than pure sensory appeal","More transparent ingredient labeling","Aussie has a longer brand history and larger retail scale"]},{"name": "Garnier Fructis Keratin line","points": ["Clear differentiation via the cosmeceuticals mass positioning","Garnier has broader retail reach and marketing spend","Very close price band, direct competitor"]}]},"evidenceStats": {"zh": ["宣称基于品牌自述配方原理与成分功效描述","未见独立第三方临床或仪器测试数据公开","部分用户反馈香精浓郁可能引发敏感反应"],"en": ["Claims based on the brand's own formula rationale and ingredient-function descriptions","No independent third-party clinical or instrumental data publicly disclosed","Some users report the fragrance is strong enough to cause sensitivity"]},"experienceItems": {"zh": ["质地：浓郁乳霜状发膜","用法：清洁湿发涂抹，停留5-10分钟冲洗","注意：头皮易出油者避开发根","频率：每周或按需使用"],"en": ["Texture: rich creamy hair mask","Usage: apply to clean, damp hair, leave 5-10 min, rinse","Note: avoid roots if scalp is oil-prone","Frequency: weekly or as needed"]},"packagingItems": {"zh": ["视觉：简洁瓶身+成分icon化标签","联想：科学、临床、平价可信","规格：12oz家用装，也有2瓶装","优势：价格透明，货架辨识度高"],"en": ["Visual: simple bottle with icon-based ingredient labeling","Association: scientific, clinical, accessible and trustworthy","Size: 12oz household size, also sold as a 2-pack","Strength: transparent pricing, strong shelf recognition"]},"productType": "mask","keyTechnology": {"zh": [{"title": "水解角蛋白递送技术","desc": "针对角蛋白如何被头发吸收利用设计的递送体系。"},{"title": "皮肤学级配方标准","desc": "把护肤品级的配方标准应用到大众价位的头发护理产品中。"}],"en": [{"title": "Hydrolyzed Keratin Delivery System","desc": "A delivery system engineered around how hydrolyzed keratin is absorbed and utilized by the hair."},{"title": "Dermatology-Grade Formulation Standard","desc": "Applies skincare-grade formulation standards to a mass-market-priced haircare product."}]},"addedAt": 12},{"id": "amika-kure","category": "usa","name": {"zh": "amika The Kure Strength Repair Shampoo","en": "amika The Kure Strength Repair Shampoo"},"brand": {"zh": "amika","en": "amika"},"company": {"zh": "amika","en": "amika"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "The Kure系列核心单品，2024年经历配方升级（加入Bond Fortifying科技）","en": "Core item in The Kure line; reformulated in 2024 with Bond Fortifying Technology"},"market": {"zh": "品牌官网、Ulta Beauty、SalonCentric等美妆及沙龙专业渠道","en": "Brand website, Ulta Beauty, SalonCentric and other beauty/salon professional channels"},"capacity": {"zh": "275 mL（另有60 mL小样装、1L大瓶装）","en": "275 mL (also 60 mL sample and 1L jumbo sizes)"},"price": {"zh": "约US$29（275mL）","en": "~US$29 (275mL)"},"positioning": {"zh": "以键合强化科技（Bond Fortifying Technology）为核心的修护型洗发水，主打用1次即2倍强韧、减少55%断裂，走沙龙专业与美妆零售兼具的Masstige路线。","en": "A repair shampoo built on Bond Fortifying Technology, positioned around 2x stronger hair with 55% less breakage after one use, a masstige play spanning both salon-professional and beauty-retail channels."},"target": {"zh": "1-4c各类发质中因环境压力、热工具、化学处理导致受损脆弱的人群，尤其是高多孔发质；愿意为临床验证背书支付溢价的消费者。","en": "All hair types 1-4c experiencing damage from environmental stress, heat tools or chemical treatments, especially high-porosity hair; consumers willing to pay a premium for clinically proven claims."},"ingredients": {"zh": "水、C14-16烯烃磺酸钠、椰油酰胺丙基甜菜碱、甘油、椰油酰两性基二乙酸二钠、PEG-7椰油酸甘油酯、沙棘果/籽油、琉璃苣籽油、牛油果油、芒果籽脂、乳木果油、水解藜麦蛋白（植物蛋白）、薰衣草花提取物、洋甘菊花提取物、迷迭香叶提取物等。","en": "Water, sodium C14-16 olefin sulfonate, cocamidopropyl betaine, glycerin, disodium cocoamphodiacetate, PEG-7 glyceryl cocoate, sea buckthorn fruit/seed oil, borage seed oil, avocado oil, mango seed butter, shea butter, hydrolyzed quinoa (vegan protein), lavender flower extract, chamomile flower extract, rosemary leaf extract, and more."},"evidence": {"zh": "宣称洗发水+护发素组合使用后1次即2倍强韧、减少55%断裂已经过临床验证；另有安全用于染发的临床验证宣称。完整测试方法、样本量与统计结果未公开披露。","en": "Claims that the shampoo + conditioner system delivers 2x stronger hair with 55% less breakage after one use are described as clinically proven, as is a claim of being clinically proven safe for color-treated hair. Full protocol, sample size and statistics are not publicly disclosed."},"experience": {"zh": "质地丰盈起泡，官方建议双重清洁（洗两次，第一次清洁、第二次吸收精华）；适合高多孔发质，搭配同系列护发素效果最佳；标志性amika水果调香氛。","en": "Rich, lathering texture; the brand recommends double cleansing (wash twice, first to clean, second to absorb the benefits). Best suited to high-porosity hair and paired with the matching conditioner; features amika's signature fruity fragrance."},"packaging": {"zh": "采用含消费后回收塑料（PCR）的瓶身，绿色/薄荷色视觉搭配品牌标志性图案，强调可持续性（B Corp认证、气候中和认证）。","en": "Bottle contains post-consumer recycled plastic (PCR), in a mint-green palette with the brand's signature pattern, emphasizing sustainability (B Corp and Climate Neutral certified)."},"insight": {"zh": "amika的案例说明：临床验证的量化宣称+可持续性认证+沙龙专业渠道三者叠加，可以让一个原本大众价位的洗护品类站上Masstige定价，且不完全依赖单一网红成分。","en": "amika shows that stacking clinically proven quantified claims, sustainability certifications and salon-professional channel presence can lift an otherwise mass-priced wash category into masstige pricing, without relying on a single viral hero ingredient."},"notes": {"zh": "","en": ""},"images": ["https://cdn.shopify.com/s/files/1/2117/1151/files/amika_The-Kure_Shampoo_275ml_2024_Update_2000x2000_Trans_Shadow.png?v=1734535646","https://cdn.shopify.com/s/files/1/2117/1151/files/01-Kure_S_C_Benefits_Claims_2000x2000_8fb5b633-7a39-4872-bbb7-b18fc525ea4b.jpg?v=1775835203","https://cdn.shopify.com/s/files/1/2117/1151/files/07-Kure_S_C_freefrom_2000x2000_28e0c504-89a1-4808-a72e-33e3dc4be526.jpg?v=1768337254"],"sources": [["Official product page","https://loveamika.com/products/the-kure-strength-repair-shampoo"]],"targetUsers": {"zh": ["1-4c各类发质中因环境/热工具/化学处理受损的人群","高多孔、易断裂发质","愿意为临床验证宣称支付溢价的消费者","偏好可持续性认证品牌的购物者"],"en": ["Hair types 1-4c damaged by environmental stress, heat tools or chemical treatments","High-porosity, breakage-prone hair","Consumers willing to pay a premium for clinically proven claims","Shoppers who favor sustainability-certified brands"]},"keyClaims": {"zh": ["1次使用后2倍强韧、减少55%断裂（系统使用，临床验证）","临床验证安全用于染发","键合强化科技（Bond Fortifying Technology）","无硫酸盐/无矿物油/无Paraben/纯素配方"],"en": ["2x stronger hair with 55% less breakage after 1 use (as a system, clinically proven)","Clinically proven safe for color-treated hair","Bond Fortifying Technology","Sulfate-, mineral oil-, paraben-free, vegan formula"]},"heroIngredients": {"zh": [{"name": "键合强化科技","tag": "核心专利科技","desc": "针对易断裂的发丝键合进行强化，抵御环境与热力压力"},{"name": "沙棘果油","tag": "品牌标志性成分","desc": "富含omega脂肪酸，滋养发丝、头皮与肌肤，恢复油脂平衡增加光泽"}],"en": [{"name": "Bond Fortifying Technology","tag": "Core proprietary tech","desc": "Targets and strengthens the bonds in hair most prone to breakage from environmental and heat stress"},{"name": "Sea Buckthorn Oil","tag": "Signature brand ingredient","desc": "Omega-rich; nourishes strands, scalp and skin while restoring lipid balance for added shine"}]},"ingredientsNote": {"zh": "配方还含水解藜麦蛋白（纯素蛋白来源，提供类角蛋白功效）、芒果籽脂与乳木果油等植物黄油，以及薰衣草、洋甘菊、迷迭香等舒缓型植物提取物。","en": "The formula also includes hydrolyzed quinoa (a vegan protein source offering keratin-like benefits), plant butters like mango seed butter and shea butter, plus soothing botanical extracts such as lavender, chamomile and rosemary."},"pricePositioning": {"zh": {"tier": "masstige","label": "Salon Masstige"},"en": {"tier": "masstige","label": "Salon Masstige"}},"marketChannel": {"zh": {"global": ["品牌官网","SalonCentric（专业沙龙渠道）"],"japan": ["Ulta Beauty"],"channelLabel": "Prestige Beauty + Salon Professional","channelDesc": "横跨美妆零售与专业沙龙渠道的双线分销"},"en": {"global": ["Brand website","SalonCentric (professional salon channel)"],"japan": ["Ulta Beauty"],"channelLabel": "Prestige Beauty + Salon Professional","channelDesc": "Dual distribution spanning prestige beauty retail and professional salon channels"}},"brandConceptRich": {"zh": {"tagline": "大胆的瓶身，真正的键合修护。","concept": "amika最初以撞色设计的瓶身出圈，后来通过“The Kure”系列真正建立起键合修护的技术信誉，并获得B Corp与Climate Neutral认证。"},"en": {"tagline": "Bold bottles, real bond repair.","concept": "Known first for its colorful, design-forward packaging, amika built genuine technical credibility through 'The Kure' bond-repair franchise, backed by B Corp and Climate Neutral certification."}},"competitiveAdvantage": {"zh": [{"name": "Olaplex No.4 洗发水","points": ["价格带接近，直接竞争同一修护科技心智","amika渠道覆盖沙龙+零售更均衡","Olaplex键合修护品类心智更强"]},{"name": "Redken Extreme系列","points": ["amika可持续性认证（B Corp）是差异点","Redken专业沙龙渠道权威感更强","价格带Redken略高，定位更纯专业线"]},{"name": "Kérastase Résistance系列","points": ["amika价格更亲民，购买门槛更低","渠道覆盖更广（Ulta等零售）","Kérastase法国专业沙龙形象更突出"]}],"en": [{"name": "Olaplex No.4 Shampoo","points": ["Very close price band, direct competitor for the same bond repair mindshare","amika balances salon + retail channels more evenly","Olaplex has stronger category mindshare around bond repair"]},{"name": "Redken Extreme line","points": ["amika's B Corp sustainability certification is a differentiator","Redken carries stronger salon-professional authority","Redken is priced slightly higher, more purely professional-line positioned"]},{"name": "Kérastase Résistance line","points": ["amika is more accessibly priced, lower purchase barrier","Broader retail reach (Ulta etc.)","Kérastase projects a stronger French salon-professional image"]}]},"evidenceStats": {"zh": ["临床验证：系统使用1次后2倍强韧、减少55%断裂","临床验证：安全用于染发处理","完整测试方法、样本量与统计结果未公开披露"],"en": ["Clinically proven: 2x stronger hair, 55% less breakage after 1 use as a system","Clinically proven: safe for color-treated hair","Full test methodology, sample size and statistics not disclosed"]},"experienceItems": {"zh": ["质地：丰盈起泡洗发水","用法：建议双重清洁（洗两次）","叠加：与同系列护发素搭配效果最佳","香调：amika标志性水果调"],"en": ["Texture: rich, lathering shampoo","Usage: brand recommends double cleansing (wash twice)","Pairing: best used with the matching conditioner","Scent: amika's signature fruity fragrance"]},"packagingItems": {"zh": ["视觉：含PCR回收塑料瓶身，薄荷绿配色","联想：可持续、专业、清新科技感","认证：B Corp、气候中和认证","规格：60mL小样/275mL正装/1L沙龙装"],"en": ["Visual: PCR recycled-plastic bottle in a mint-green palette","Association: sustainable, professional, fresh and tech-forward","Certifications: B Corp, Climate Neutral","Sizes: 60mL sample / 275mL full size / 1L salon size"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "The Kure键合修护技术","desc": "品牌自有命名的键合修护技术体系，是amika技术信誉的核心来源。"},{"title": "B Corp认证可持续生产工艺","desc": "生产流程获得B Corp与Climate Neutral认证，把可持续性作为技术标准的一部分。"}],"en": [{"title": "The Kure Bond-Repair Technology","desc": "A brand-named bond-repair technology system that anchors amika's technical credibility."},{"title": "B Corp Certified Sustainable Manufacturing","desc": "Manufacturing is B Corp and Climate Neutral certified, making sustainability part of the technical standard."}]},"addedAt": 13},{"id": "camillerose-cocoa","category": "usa","name": {"zh": "Camille Rose Cocoa Nibs + Honey Ultimate Strength Serum","en": "Camille Rose Cocoa Nibs + Honey Ultimate Strength Serum"},"brand": {"zh": "Camille Rose","en": "Camille Rose"},"company": {"zh": "Camille Rose Naturals","en": "Camille Rose Naturals"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌长期在售经典单品","en": "Long-standing staple in the brand's core lineup"},"market": {"zh": "Target、Walmart、Ulta、CVS等美国大众零售渠道","en": "US mass retail: Target, Walmart, Ulta, CVS and more"},"capacity": {"zh": "8 fl oz / 240 mL","en": "8 fl oz / 240 mL"},"price": {"zh": "约US$16.79","en": "~US$16.79"},"positioning": {"zh": "以阿育吠陀余甘子（Amla）油与婆罗米（Brahmi）草本为核心的修护型发油，主打改善头发稀疏与断裂、打开受阻毛囊、促进头皮循环。","en": "An Ayurvedic-inspired restorative hair oil built on amla oil and Brahmi herbal infusions, positioned to combat thinning and breakage while opening blocked follicles and improving scalp circulation."},"target": {"zh": "面临头发稀疏、断裂困扰的天然发/纹理发消费者，偏好美食感命名与草本疗法叙事的大众价位购物者。","en": "Natural/textured-hair consumers dealing with thinning and breakage, drawn to gourmet-style naming and herbal-remedy storytelling at a mass price point."},"ingredients": {"zh": "余甘子果提取物、芝麻籽油、椰子油、荷荷巴籽油、橄榄油、夏威夷果籽油、乳木果油、可可籽脂、蜂蜜、生物素、MSM、田菁（Shikakai）提取物、鱼藤木果粉（Aritha）、婆罗米提取物、旱莲草提取物、茶树叶油、BTMS、无邻苯二甲酸盐香精。","en": "Amla fruit extract, sesame seed oil, coconut oil, jojoba seed oil, olive oil, macadamia seed oil, shea butter, cocoa seed butter, honey, biotin, MSM, shikakai extract, aritha fruit powder, Brahmi extract, bhringraj extract, tea tree leaf oil, BTMS, phthalate-free fragrance."},"evidence": {"zh": "宣称主要基于阿育吠陀传统草本功效描述（余甘子、婆罗米），未见公开的第三方临床或仪器测试数据；电商评论中存在过蜡感/太重的负面反馈，提示配方感官体验因发质而异。","en": "Claims lean mainly on traditional Ayurvedic herbal function (amla, Brahmi); no public third-party clinical or instrumental data found. E-commerce reviews include negative feedback about a waxy/heavy feel, suggesting sensory experience varies by hair type."},"experience": {"zh": "摇匀后取适量按摩头皮，建议隔天睡前使用或按需使用；官方描述为可可与杏仁的美食感香调；部分用户反馈质地偏厚重，需搭配深层清洁使用。","en": "Shake well, massage a small amount into the scalp; recommended every other night or as needed. Officially described with a gourmet chocolate-almond scent; some users find the texture heavy and pair it with clarifying washes."},"packaging": {"zh": "塑料按压瓶，卡通感美食标签设计（可可豆插画），走亲和、平价大众零售货架路线，与专业沙龙线的极简克制视觉形成对比。","en": "Plastic squeeze bottle with playful gourmet labeling (cocoa bean illustration), leaning approachable and mass-retail-friendly, a contrast to the minimalist restraint of professional salon lines."},"insight": {"zh": "Camille Rose证明草本疗法+美食感命名在美国大众纹理发市场依然是可靠的差异化路径，但产品评论两极分化（圣品vs太腊）提示配方一致性和肤感是其主要风险点。","en": "Camille Rose shows that herbal remedy plus gourmet naming remains a reliable differentiation path in the US mass textured-hair market, but polarized reviews (holy grail vs. too waxy) point to formula consistency and sensory feel as its main risk."},"notes": {"zh": "","en": ""},"images": ["https://www.camillerose.com/cdn/shop/files/P 第三方临床或仪器测试数据公开","消费者评论呈两极分化：部分称圣品，部分反馈过蜡/太重"],"en": ["Claims rest mainly on traditional Ayurvedic herbal-function descriptions","No independent third-party clinical or instrumental data found publicly","Consumer reviews are polarized: some call it a holy grail, others report a waxy/heavy feel"]},"experienceItems": {"zh": ["质地：油质精华，需摇匀使用","用法：按摩头皮，隔天睡前或按需使用","香调：可可与杏仁美食感香氛","反馈：部分用户认为质地偏厚重"],"en": ["Texture: oil serum, shake before use","Usage: massage into scalp, every other night or as needed","Scent: gourmet cocoa-almond fragrance","Feedback: some users find the texture on the heavier side"]},"packagingItems": {"zh": ["视觉：塑料按压瓶+可可豆插画标签","联想：亲和、美食感、平价大众","规格：8 fl oz家用装","优势：货架辨识度高，价格透明"],"en": ["Visual: plastic squeeze bottle with cocoa-bean illustration label","Association: approachable, gourmet, mass-market friendly","Size: 8 fl oz household size","Strength: strong shelf recognition, transparent pricing"]},"productType": "serum","keyTechnology": {"zh": [{"title": "全成分配方哲学","desc": "偏好可可、蜂蜜等天然全成分组合，而非依赖单一分离活性物构建配方。"},{"title": "社区反馈驱动的配方迭代","desc": "曾根据消费者反馈公开调整配方，形成开放的迭代机制。"}],"en": [{"title": "Whole-Ingredient Formulation Philosophy","desc": "Favors recognizable whole ingredients like cocoa and honey over formulas built around isolated synthetic actives."},{"title": "Community Feedback-Driven Reformulation","desc": "Has publicly adjusted formulas in response to consumer feedback, forming an open iteration loop."}]},"addedAt": 8},{"id": "cecred-edgedrops","category": "usa","name": {"zh": "Cécred Restoring Hair & Edge Drops","en": "Cécred Restoring Hair & Edge Drops"},"brand": {"zh": "Cécred","en": "Cécred"},"company": {"zh": "Cécred（Beyoncé Knowles-Carter）","en": "Cécred (Beyoncé Knowles-Carter)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌2024年2月20日成立；本品为持续在售单品","en": "Brand launched Feb 20, 2024; ongoing lineup item"},"market": {"zh": "DTC官网 + Ulta Beauty（2025年4月起进驻1,400+门店）","en": "DTC (cecred.com) + Ulta Beauty (1,400+ stores since April 2025)"},"capacity": {"zh": "50 mL / 1.7 fl oz","en": "50 mL / 1.7 fl oz"},"price": {"zh": "US$56","en": "US$56"},"positioning": {"zh": "每日使用的头皮密度精华，主打「密度肽」技术改善发际线与头发密度，是Beyoncé「hair is sacred」品牌仪式感叙事的核心单品之一。","en": "A daily scalp density serum built on peptide technology to improve edges and hair density, a hero item in Beyoncé's ritual-driven 'hair is sacred' brand story."},"target": {"zh": "发际线稀疏、头发变细、追求「可见密度提升」的消费者；愿意为明星背书的高端仪式化护理买单的人群。","en": "Consumers with thinning edges or reduced density seeking visible improvement; willing to pay a premium for a celebrity-backed ritual routine."},"ingredients": {"zh": "核心为Biopeptide-5（Acetyl Tetrapeptide-3 + Biotinoyl Tripeptide-1），搭配专利Bioactive Keratin Ferment（乳酸菌/蜂蜜/角蛋白发酵物）、生物素、姜根提取物、玫瑰提取物、薄荷叶提取物。无硅油、SLS/SLES、邻苯二甲酸盐、Paraben。","en": "Built on Biopeptide-5 (Acetyl Tetrapeptide-3 + Biotinoyl Tripeptide-1) plus a patent-pending Bioactive Keratin Ferment (lactobacillus/honey/keratin ferment), biotin, ginger root extract, rose extract and peppermint leaf extract. Free of silicones, SLS/SLES, phthalates and parabens."},"evidence": {"zh": "第三方消费者研究（16周）显示头发密度可见提升1.5倍；另有84%改善头皮与头发健康的宣称；皮肤科测试、沙龙测试。未见公开的仪器测量或对照组设计细节。","en": "A third-party 16-week consumer study reports up to 1.5x visibly denser hair; also claims 84% improved scalp and hair health. Dermatologist- and salon-tested. Full protocol and control-group details are not publicly disclosed."},"experience": {"zh": "轻盈滴管精华，不油腻，可用于有护发假发或化学处理的头发。每日直接滴于头皮并按摩吸收，不需冲洗。","en": "Lightweight, fast-absorbing dropper serum, non-greasy; safe for extensions or chemically treated hair. Applied daily to the scalp and massaged in, no rinsing."},"packaging": {"zh": "玻璃滴管瓶设计，米白与金色配色，呼应品牌仪式感美学；瓶身信息突出临床宣称与获奖标识（2025 Essence最佳美妆、Women's Health最佳发际线产品）。","en": "Glass dropper bottle in cream and gold, echoing the brand's ritual aesthetic; labeling highlights clinical claims and awards (2025 Essence 'Best in Beauty', Women's Health 'Best Edge Product')."},"insight": {"zh": "Cécred证明名人品牌可以靠仪式感叙事+专利技术命名在高价位站稳脚跟：Biopeptide-5这类专有名词本身就是营销资产，比单一成分更难被平价品牌复制。","en": "Cécred shows a celebrity brand can hold a premium price point through ritual storytelling plus proprietary-named technology; a coined term like 'Biopeptide-5' is itself a marketing asset, harder for mass brands to copy than a single ingredient."},"notes": {"zh": "","en": ""},"images": ["https://cecred.com/cdn/shop/files/PDP-Carousel-Restoring-Hair-Edge-Drops-Hero-Shot.jpg?v=1782756828"],"sources": [["Official product page","https://cecred.com/products/restoring-hair-edge-drops"],["Ingredients (INCIDecoder)","https://incidecoder.com/products/cecred-restoring-hair-edge-drops"]],"targetUsers": {"zh": ["发际线稀疏、边缘头发脆弱人群","头发整体密度下降、变细人群","佩戴假发/编发/化学处理头发的人群","愿意为明星品牌与仪式感体验支付溢价的消费者"],"en": ["Thinning, fragile edges/hairline","Overall reduced hair density or fine hair","Those wearing extensions/braids or with chemically treated hair","Consumers willing to pay a premium for celebrity brand ritual experience"]},"keyClaims": {"zh": ["1.5倍可见密度提升（第三方消费者研究）","84%改善头皮与头发健康","皮肤科测试、沙龙测试","无硅油/SLS·SLES/邻苯二甲酸盐/Paraben"],"en": ["1.5x visibly denser hair (3rd-party consumer study)","84% improved scalp & hair health","Dermatologist- and salon-tested","Free of silicones/SLS·SLES/phthalates/parabens"]},"heroIngredients": {"zh": [{"name": "Biopeptide-5","tag": "密度肽技术","desc": "Acetyl Tetrapeptide-3 + Biotinoyl Tripeptide-1，支持毛囊锚定与密度感"},{"name": "Bioactive Keratin Ferment","tag": "专利发酵技术","desc": "乳酸菌/蜂蜜/角蛋白发酵物，滋养头皮环境"}],"en": [{"name": "Biopeptide-5","tag": "Density peptide technology","desc": "Acetyl Tetrapeptide-3 + Biotinoyl Tripeptide-1 to support follicle anchorage and density"},{"name": "Bioactive Keratin Ferment","tag": "Patent-pending ferment","desc": "Lactobacillus/honey/keratin ferment that nourishes the scalp environment"}]},"ingredientsNote": {"zh": "辅助成分包括生物素、姜根提取物、玫瑰提取物与薄荷叶提取物，兼顾头皮舒缓与感官体验。","en": "Supporting ingredients include biotin, ginger root extract, rose extract and peppermint leaf extract, balancing scalp comfort with sen
