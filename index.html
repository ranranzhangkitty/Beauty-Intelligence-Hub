<style>
:root{--ink:#000000;--ink-soft:#55607A;--paper:#F4F5F7;--card:#FFFFFF;--plinth:#EEF0F3;--line:#DADDE2;--honey:#2C6E8E;--honey-soft:#DCEAF0;--sage:#6B7A99;--sage-soft:#E3E7EE;--plum:#C15B72;--plum-soft:#F5DEE3;--grey:#8A8F9C;--grey-soft:#E7E9EC;--shadow:0 1px 3px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.08);--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Montserrat","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}.wrap{max-width:1380px;margin:auto;padding:24px 26px 60px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--honey);font-weight:700;margin-bottom:10px}h1{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:38px;margin:0 0 8px}.hero p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.7;max-width:650px}.stats{display:flex;align-items:center}.stat{font-family:var(--serif);text-align:center;padding:6px 19px;border-left:1px solid var(--line)}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--grey);letter-spacing:.1em}button,input,select{font-family:var(--sans)}button{cursor:pointer;border-radius:3px;font-size:12.5px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button:hover{box-shadow:var(--shadow)}.lang{font-weight:700;border-color:var(--ink);min-width:52px}
.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 28px}.group{display:flex;gap:9px;flex-wrap:wrap}.search,.filter{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px 12px;font-size:13px}.search{min-width:250px}.primary{background:var(--honey);border-color:var(--honey);font-weight:700}
.workspace{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}.side{position:relative;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px;cursor:pointer;text-align:center}.side.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft) inset}.side-num{position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:2}.side img{width:100%;height:72px;object-fit:contain;background:var(--plinth);border-radius:3px}.side-noimg{width:100%;height:72px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--plinth);border-radius:3px;opacity:.6}.side-name{font-size:10.5px;line-height:1.35;margin-top:6px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.7em}.side.dragging{opacity:.4}.side{cursor:grab}
#gridToggle,#wishToggle{height:44px;border-radius:12px;padding:0 15px 0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--plum);position:relative;transition:background .3s ease,border-color .3s ease,color .3s ease,transform .15s ease;overflow:visible}
#gridToggle:hover,#wishToggle:hover{transform:translateY(-1px)}
#gridToggle.active,#wishToggle.active{background:#000;border-color:#000;color:#fff}
#wishToggle.active svg [stroke]{stroke:#fff}
#wishToggle.active svg [fill]:not([fill="none"]){fill:#fff}
.nav-badge{position:absolute;top:-6px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--plum);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);line-height:1}
/* ---------- wishlist view ---------- */
.wl-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.wl-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);font-weight:700;margin-bottom:8px}
.wl-title{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:28px;margin:0 0 7px}
.wl-desc{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.7;max-width:660px}
.wl-form{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden}
.wl-form-head{background:var(--plum-soft);color:#8B3A52;padding:7px 12px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wl-form-body{padding:14px}
.wl-row{display:grid;grid-template-columns:190px 1fr;gap:9px;margin-bottom:9px}
.wl-form input,.wl-form textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:12.5px;color:var(--ink);font-family:var(--sans)}
.wl-form textarea{resize:vertical;min-height:56px;line-height:1.55}
.wl-form input:focus,.wl-form textarea:focus{outline:none;border-color:var(--plum)}
.wl-form input::placeholder,.wl-form textarea::placeholder{color:#B4B9C2}
.wl-form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wl-hint{font-size:10.5px;color:var(--grey);line-height:1.5}

.wl-submit:disabled{opacity:.5;cursor:default}
.wl-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wl-tabs{display:flex;gap:7px;flex-wrap:wrap}
.wl-tab{font-size:11.5px;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
.wl-tab.on{background:#000;border-color:#000;color:#fff;font-weight:700}
.wl-sorts{display:flex;gap:7px}
.wl-sortb{font-size:11.5px;padding:6px 12px;border-radius:4px}
.wl-sortb.on{border-color:var(--plum);color:var(--plum);font-weight:700}
.wl-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wl-table th{background:var(--plinth);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.wl-table td{padding:12px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top;line-height:1.55}
.wl-table tr:last-child td{border-bottom:0}
.wl-table tbody tr:hover{background:#FDF7F8}
.wl-c-vote{width:62px}.wl-c-prod{min-width:210px}.wl-c-who{width:110px}.wl-c-reason{min-width:230px}.wl-c-status{width:118px}.wl-c-act{width:90px}
.wl-vote{width:46px;padding:5px 0;border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.wl-vote .car{font-size:8px;color:var(--grey)}
.wl-vote .num{font-size:14px;font-weight:800}
.wl-vote.voted{border-color:var(--plum);background:var(--plum-soft);color:#8B3A52}
.wl-vote.voted .car{color:#8B3A52}
.wl-pname{font-weight:700;font-size:12.5px;margin-bottom:3px}
.wl-pname.noname{color:#C2C6CE;font-weight:600;font-style:italic}
.wl-plink{font-size:10.5px;color:var(--honey);text-decoration:none;border-bottom:1px solid var(--honey-soft);word-break:break-all}
.wl-plink:hover{border-bottom-color:var(--honey)}
.wl-golink{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--plum);font-weight:700;text-decoration:none;margin-top:4px;cursor:pointer}
.wl-who{font-weight:700;font-size:11.5px}
.wl-date{font-size:10px;color:var(--grey);margin-top:2px}
.wl-reason{color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.wl-reason.empty{color:#C2C6CE;font-style:italic}
.wl-st{display:inline-block;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.wl-st-todo{background:var(--plum-soft);color:#8B3A52}
.wl-st-done{background:#DCEFE0;color:#2C6B3F}
.wl-stsel{margin-top:6px;width:100%;font-size:10.5px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-soft);background:#fff;font-family:var(--sans)}
.wl-del{font-size:10px;padding:4px 9px;border-radius:4px;color:#8B3A52;border:1px solid var(--line)}
.wl-del:hover{background:var(--plum);color:#fff;border-color:var(--plum)}
.wl-empty td{text-align:center;color:var(--grey);font-size:12px;padding:34px 12px}
@media(max-width:900px){.wl-row{grid-template-columns:1fr}.wl-c-reason{min-width:150px}}
@media print{#wishlistView{display:none!important}}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.grid-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;position:relative;transition:box-shadow .12s,border-color .12s}
.grid-card:hover{box-shadow:var(--shadow)}
.grid-card.active{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft)}
.grid-num{position:absolute;top:16px;left:16px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2}
.grid-thumb{width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:var(--plinth);border-radius:4px;margin-bottom:8px}
.grid-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.grid-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.5}
.grid-name{font-size:12px;line-height:1.4;color:var(--ink);font-weight:600;margin-bottom:6px;min-height:2.5em}
.grid-check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:5px;border:1.5px solid #C9CCD3;background:#fff;z-index:3;cursor:pointer;padding:0;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.grid-card.picked{border:2px solid #C15B72}
.grid-card.picked .grid-check{background:#C15B72;border-color:#C15B72}
.export-bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:#F5DEE3;border-radius:6px;margin-bottom:14px;width:fit-content}
.export-bar-count{font-size:12px;color:#8B3A52;font-weight:600}
.export-bar button{font-size:11px;padding:6px 12px;border-radius:4px;border:1px solid #8B3A52;background:#fff;color:#8B3A52}
.export-bar button#exportBarClear{border:none;background:transparent;color:#8A8F9C}
.feedback-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.feedback-item{background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 12px;transition:background .15s ease}
.feedback-item:hover{background:#FFF8E1}

.feedback-item-name{font-size:12px;font-weight:700;color:#C15B72}
.feedback-item-date-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.feedback-item-date{font-size:10px;color:#8A8F9C;white-space:nowrap}
.feedback-item-text{font-size:12px;color:#1A1D24;margin:0;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.team-feedback .section-head{background:#F5DEE3;color:#8B3A52}
.feedback-item-del{background:#fff;border:1px solid var(--line);border-radius:4px;color:#8B3A52;font-size:10px;padding:3px 7px;font-weight:600;flex-shrink:0}
.feedback-item-del:hover{background:#C15B72;color:#fff;border-color:#C15B72}
.feedback-loading,.feedback-empty{font-size:11px;color:#8A8F9C}
.feedback-form{border-top:1px dashed var(--line);padding-top:12px}
.feedback-form-row1{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.feedback-form input{width:100%;box-sizing:border-box;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;font-family:Montserrat,'Noto Sans SC',sans-serif}
.feedback-add-btn{font-size:11px;padding:7px 14px;border-radius:4px;border:1px solid #C15B72;background:#C15B72;color:#fff;font-weight:600}
.grid-tags{display:flex;gap:6px;flex-wrap:wrap}
.ptype-pill{font-size:10.5px;padding:4px 10px;border-radius:20px;background:#F5DEE3;color:#8B3A52;font-weight:600}.detail{background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(260px,30%) minmax(0,70%);overflow:hidden}
.media{background:var(--plinth);border-right:1px solid var(--line);display:flex;flex-direction:column}.media-hero{height:460px;display:flex;align-items:center;justify-content:center;padding:24px 24px 16px}.media-hero img{width:78%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(0,0,0,.15))}.thumbs{display:flex;justify-content:center;gap:8px;padding:12px 16px 18px;flex-wrap:wrap}.thumb{width:48px;height:62px;padding:3px;border:1.5px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center}.thumb.active{border-color:var(--honey)}.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.content{padding:20px 22px 18px;min-width:0}.content-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.index{font-family:var(--serif);font-size:11px;color:var(--grey);letter-spacing:.08em}.cat{font-size:10.5px;padding:4px 10px;border-radius:20px;background:var(--honey-soft);color:#17495F;border:0}.ptype{font-size:10.5px;padding:4px 10px;border-radius:20px;background:#F5DEE3;color:#8B3A52;border:0;margin-left:6px;font-weight:600}.pname{font-family:var(--sans);font-weight:800;font-size:22px;line-height:1.22;margin:0 0 10px;outline:none;letter-spacing:-.01em}.chips{display:grid;grid-template-columns:1fr;gap:8px;padding:0 16px 18px;margin-bottom:0}.chip{background:#fff;padding:6px 8px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.chip-label{font-size:9px;letter-spacing:.06em;color:var(--grey);font-weight:700;text-transform:uppercase;flex:0 0 auto;white-space:nowrap}.chip-val{font-size:11.5px;line-height:1.45;outline:none;text-align:right}.section{border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}.section-head{background:var(--honey-soft);color:#17495F;padding:6px 10px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans)}.section-body{padding:9px 12px;font-size:12px;line-height:1.55;outline:none;white-space:pre-wrap}.section-body:hover,.chip-val:hover,.pname:hover{background:rgba(190,143,53,.07)}.note{background:#FBEFC4;border:1px solid #E6D28B;border-radius:4px;padding:11px 14px;margin-top:2px}.note-label{font-size:9.5px;letter-spacing:.1em;font-weight:700;color:#8A6A1E;margin-bottom:6px}.note-body{font-size:12px;line-height:1.6;outline:none;min-height:18px}.sources{display:flex;gap:7px;flex-wrap:wrap}.media-price{padding:0 16px 18px}.media-price .section{margin-bottom:0}.sources a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.sources-plain{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}.sources-plain a{font-size:10.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--grey);font-size:10.5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.detail{grid-template-columns:1fr}.media{border-right:0;border-bottom:1px solid var(--line);min-height:auto}.media-hero{height:520px}}
@media(max-width:760px){.wrap{padding:20px 14px 60px}.workspace{grid-template-columns:1fr}.sidebar{position:relative;max-height:none;display:flex;flex-direction:row;overflow:auto}.side{min-width:100px}.chips{grid-template-columns:1fr}}
@media print{.toolbar,.sidebar,.lang,.thumb-add,.upload-btn,.image-upload-row,.thumb-delete,.team-feedback{display:none!important}.workspace{display:none!important}.detail{box-shadow:none}.section{break-inside:avoid}#printArea{display:none}body.print-all #printArea{display:block!important}.print-detail{border:none;box-shadow:none;page-break-after:always;margin-bottom:0}.print-detail:last-child{page-break-after:auto}}

.image-upload-row{display:flex;justify-content:center;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.upload-btn{background:transparent;border:1px dashed var(--honey);color:#17495F;padding:8px 12px}
.upload-hint{font-size:9.5px;color:var(--grey);align-self:center}
.thumb-wrap{position:relative}
.thumb-delete{position:absolute;right:-4px;top:-4px;width:17px;height:17px;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;line-height:17px;display:none}
.thumb-wrap:hover .thumb-delete{display:block}

.print-title{font-family:var(--serif);font-size:25px;margin:0 0 10px}
.print-grid{display:grid;grid-template-columns:34% 66%;gap:12mm}

.thumb-add{
  width:48px;height:62px;padding:0;border:1.5px dashed var(--line);
  background:rgba(255,255,255,.35);color:var(--grey);font-size:25px;
  display:flex;align-items:center;justify-content:center;
}
.thumb-add:hover{border-color:var(--honey);color:var(--honey);box-shadow:none}
.official-source{font-weight:700;color:#17495F!important;border-bottom-color:var(--honey)!important}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row2>.section{margin-bottom:0}
.ic-head{display:flex;align-items:center;gap:7px}
.ic-head .ic{font-size:13px}

.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tech-card .d{font-size:11px;color:#55607A;line-height:1.5}

.ingredient-tag{font-size:10.5px;color:#17495F;margin-top:2px}
.ingredient-desc{font-size:10.5px;color:var(--grey);margin-top:2px;line-height:1.4}

<script>
const DEFAULTS=[{"id": "andhoney","category": "japan","name": {"zh": "&honey Deep Moist Shampoo 1.0","en": "&honey Deep Moist Shampoo 1.0"},"brand": {"zh": "&honey","en": "&honey"},"company": {"zh": "ViCREA","en": "ViCREA"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "2018 年 4 月 5 日","en": "April 5, 2018"},"market": {"zh": "日本全国药妆、综合零售、品牌电商及跨境电商","en": "Japanese drugstores, general retail, brand e-commerce and cross-border e-commerce"},"capacity": {"zh": "440 mL","en": "440 mL"},"price": {"zh": "¥1,540","en": "¥1,540"},"positioning": {"zh": "以“头发水分量 14%”和“保水有机美容”为核心，把蜂蜜、有机油和美容液成分组合成高保湿洗护体系。产品的核心差异是把整个洗护流程都指向“保持发丝水分”这一件事。系列化步骤编号、香味变化和高装饰性瓶身进一步强化仪式感。","en": "Built around “14% hair moisture” and a moisture-organic beauty proposition. Honey, organic oils and beauty-serum ingredients are organized into a hydration system. The core difference is that the entire wash routine points to one goal — keeping hair hydrated. Numbered steps, changing fragrances and jewel-like packaging create ritual value."},"target": {"zh": "面向干燥、毛躁、缺水、卷曲和希望获得明显滋润感的人群。品牌视觉年轻、甜美、适合社交媒体传播，核心用户更偏年轻女性，但实际购买人群很广。对细软、容易塌发的人群，Deep Moist 的丰润感可能偏重。","en": "For consumers with dry, frizzy and moisture-depleted hair who want a rich conditioning feel. The brand’s visual language is young, sweet and social-media friendly, although its actual audience is broad."},"distribution": {"zh": "440 mL / ¥1,540，与日本大众高机能洗护主流价位一致。全国药妆、Ainz & Tulpe、综合零售、电商覆盖广，渠道优势明显。长期在售与高评论量形成较强社会证明，替代成本来自品牌认知而非高技术壁垒。","en": "440 mL at ¥1,540, aligned with Japan’s mainstream mass-premium haircare segment. Wide drugstore, lifestyle retail and e-commerce distribution gives the brand a major channel advantage."},"ingredients": {"zh": "品牌强调 90% 以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，并使用摩洛哥有机油。蜂蜜配比故事为 Manuka 50%、Acacia 30%、日本生蜂蜜 20%。洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。","en": "The brand emphasizes that more than 90% of the formula consists of honey, organic oils, royal jelly and other moisturizing or protective ingredients. The honey story uses a 50% Manuka, 30% Acacia and 20% Japanese raw honey blend."},"evidence": {"zh": "公开资料主要是配方比例、成分来源、自由配方和消费者评论。没有在官方产品页看到完整临床或仪器测试方案。其证据优势来自长期市场销售、较高评论量和清晰的成分比例传播，而非公开临床研究。","en": "Public evidence is mainly formula ratios, ingredient sourcing, free-from claims and large volumes of consumer reviews. No full clinical or instrumental study protocol was found on the official product page."},"experience": {"zh": "浓厚的 Shea & Honey 泡沫，Peony Honey 香味，洗后追求柔软、滋润、香气持续和毛躁改善。瓶身厚重、透明、带切割感和蜂蜜色液体，视觉非常适合货架和社交媒体。使用体验偏丰润，对重度干燥发更有吸引力。","en": "Rich Shea & Honey foam, Peony Honey fragrance and a strongly moisturized finish. The faceted transparent bottle, amber liquid and gold pump create high shelf visibility and social-media appeal."},"packaging": {"zh": "琥珀色透明液体、几何切面瓶和金色泵头构成极强的蜂蜜高级感。步骤编号 1.0、1.5、2.0 让消费者自然理解整套使用顺序。包装是其最难被低成本复制的品牌资产之一。","en": "Amber liquid, a geometric faceted bottle, gold hardware and numbered steps create a strong premium honey identity. Packaging is one of the brand’s hardest assets to copy cheaply."},"insight": {"zh": "&honey 的成功说明大众洗护的竞争不一定依赖新型活性，而可以通过一个极强的单一概念——“保水”——把配方、包装、香味、步骤和渠道统一起来。研发层面容易模仿，品牌层面难以复制。","en": "&honey shows that mass haircare can win without a new active by aligning formula, packaging, fragrance, usage steps and distribution around one powerful memory structure: moisture."},"notes": {"zh": "","en": ""},"images": ["https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-1-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600","https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-2-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600","https://japanesetaste.com/cdn/shop/files/andhoney-Deep-Moist-Shampoo-1-0--Japanese-Honey-Shampoo--440ml-3-2024-06-14T01_48_01.020Z.jpg?v=1743424199&width=600"],"sources": [["Official product page","https://www.and-honey.com/deep/product/"],["@cosme","https://www.cosme.net/variations/973782/"],["Ainz & Tulpe","https://ainz-tulpe.jp/products/4589546890758"]],"targetUsers": {"zh": ["干燥、毛躁、缺水、卷曲发质","希望获得明显滋润感的人群","年轻、偏好甜美视觉与社交媒体传播的消费者","细软易塌发人群需注意丰润感是否过重"],"en": ["Dry, frizzy, dehydrated, curly hair","Consumers seeking a noticeably richer, moisturized feel","Younger consumers drawn to sweet visuals and social sharing","Fine, flat-prone hair types should note the rich feel may be heavy"]},"keyClaims": {"zh": ["头发水分量14%的保水诉求","90%以上蜂蜜、有机油、蜂王浆等保湿成分","系列化步骤编号强化护理仪式感","长期热销与高评论量的市场验证"],"en": ["“14% hair moisture” hydration claim","90%+ honey, organic oils, royal jelly and other moisturizing ingredients","Numbered step system reinforces a ritual care routine","Long-term bestseller status with high review volume as market proof"]},"heroIngredients": {"zh": [{"name": "蜂蜜复合配方","tag": "核心保湿因子","desc": "Manuka 50%+洋槐30%+日本生蜂蜜20%，构成品牌“保水”故事"},{"name": "摩洛哥有机油+蜂王浆","tag": "顺滑保护","desc": "配合油脂、保湿剂与调理成分，减少洗后干涩"}],"en": [{"name": "Honey Complex","tag": "Core moisture factor","desc": "50% Manuka + 30% Acacia + 20% raw Japanese honey forms the brand's “moisture” story"},{"name": "Moroccan Organic Oil + Royal Jelly","tag": "Smoothing & protection","desc": "Paired with oils, humectants and conditioning agents to reduce post-wash dryness"}]},"ingredientsNote": {"zh": "品牌强调90%以上由蜂蜜、有机油、蜂王浆等保湿与保护成分构成，洗净体系配合油脂、保湿剂和调理成分，目标是减少洗后干涩并维持含水感。","en": "The brand states that 90%+ of the formula is honey, organic oils, royal jelly and similar moisturizing/protective ingredients, paired with a cleansing base designed to reduce dryness and retain a hydrated feel after washing."},"pricePositioning": {"zh": {"tier": "masstige","label": "大众高机能 · Masstige定位"},"en": {"tier": "masstige","label": "Mass-Premium · Masstige Positioning"}},"marketChannel": {"zh": {"global": ["品牌官网","跨境电商"],"japan": ["全国药妆","Ainz & Tulpe","综合零售"],"channelLabel": "Drugstore & Mass Retail","channelDesc": "日本全国药妆与综合零售为核心，电商覆盖广"},"en": {"global": ["Official website","Cross-border e-commerce"],"japan": ["Nationwide drugstores","Ainz & Tulpe","General retail"],"channelLabel": "Drugstore & Mass Retail","channelDesc": "Core distribution via Japanese drugstores and mass retail, with broad e-commerce reach"}},"brandConceptRich": {"zh": {"tagline": "保湿有机美容。","concept": "以蜂蜜为核心概念，将头发“含水量”视为健康头发的真正标准，把日常洗护变成一场值得收藏的仪式体验。"},"en": {"tagline": "Moisturizing Organic Beauty Care.","concept": "Built around honey as its central concept, &honey treats hair's water content as the true measure of healthy hair, turning an everyday wash into a collectible, ritual-like experience."}},"competitiveAdvantage": {"zh": [{"name": "Moroccanoil","points": ["蜂蜜概念比单一油类更具情感辨识度","价格更亲民，渠道更下沉","系列步骤感增强复购逻辑"]},{"name": "TSUBAKI（大众品牌）","points": ["更强调“有机”与国际化视觉","蜂蜜甜美香调差异化明显","瓶身设计更具收藏与社交属性"]},{"name": "Kérastase（沙龙线）","points": ["价格更具竞争力，购买门槛低","无需依赖沙龙渠道即可获得","更适合日常自我护理场景"]}],"en": [{"name": "Moroccanoil","points": ["Honey concept offers stronger emotional distinctiveness than a single-oil claim","More accessible price point and wider retail reach","Step-numbered range logic encourages repeat purchase"]},{"name": "TSUBAKI (mass brand)","points": ["Stronger “organic”/international visual language","Clear differentiation through a sweet honey scent","Bottle design carries more collectible, social-media appeal"]},{"name": "Kérastase (salon line)","points": ["More competitive pricing, lower purchase barrier","Accessible without relying on a salon channel","Better suited to everyday self-care routines"]}]},"evidenceStats": {"zh": ["证据类型：配方比例、成分来源、自由配方声明与消费者评论","未见官方产品页公开完整临床或仪器测试方案","支撑逻辑：长期市场销售+高评论量+清晰成分比例传播"],"en": ["Evidence type: formula ratios, ingredient sourcing, free-from claims and consumer reviews","No full clinical or instrumental test protocol found on the official product page","Support logic: long-term sales performance + high review volume + transparent ingredient ratios"]},"experienceItems": {"zh": ["质地：浓厚Shea & Honey泡沫","香调：Peony Honey，甜美持续","洗感：柔软滋润，改善毛躁","瓶身：厚重透明切面设计，货架吸睛"],"en": ["Texture: rich Shea & Honey foam","Scent: Peony Honey, sweet and long-lasting","Feel: soft, moisturized, reduces frizz","Bottle: heavy, transparent, faceted design with strong shelf appeal"]},"packagingItems": {"zh": ["视觉：琥珀色透明液体+几何切面瓶+金色泵头","联想：强化“蜂蜜高级感”","步骤编号：1.0/1.5/2.0体系强化仪式感","优势：包装是最难被低成本复制的品牌资产之一"],"en": ["Visual: amber transparent liquid + geometric faceted bottle + gold pump","Association: reinforces a “premium honey” feel","Step numbering: 1.0/1.5/2.0 system reinforces ritual routine","Strength: packaging is one of the hardest brand assets to copy cheaply"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "蜂蜜配比公式体系","desc": "以50%麦卢卡+30%洋槐+20%生蜂蜜的精确配比作为标准化配方方法，而非随意混合。"},{"title": "步骤编号仪式系统","desc": "1.0/1.5/2.0的编号体系把单品串联成一套结构化护理流程，而非各自独立的产品。"}],"en": [{"title": "Honey Ratio Formulation System","desc": "A precise 50/30/20 blend of Manuka, Acacia, and raw honey used as a standardized formulation method rather than an arbitrary mix."},{"title": "Step-Numbered Ritual System","desc": "The 1.0/1.5/2.0 numbering links standalone products into one structured routine rather than isolated items."}]},"addedAt": 2},{"id": "8thalasso","category": "japan","name": {"zh": "8 THE THALASSO Moist Shampoo","en": "8 THE THALASSO Moist Shampoo"},"brand": {"zh": "8 THE THALASSO","en": "8 THE THALASSO"},"company": {"zh": "Stella Seed","en": "Stella Seed"},"origin": {"zh": "日本","en": "Japan"},"launch": {"zh": "系列既有产品；现版本于 2025 年夏季更新","en": "Existing range; current version renewed in summer 2025"},"market": {"zh": "日本全国药妆、电商、Loft / PLAZA 等","en": "Japanese drugstores, e-commerce, Loft, PLAZA and lifestyle retail"},"capacity": {"zh": "本体 475 mL / 替换装 400 mL","en": "475 mL bottle / 400 mL refill"},"price": {"zh": "本体 ¥1,540 / 替换装 ¥1,210","en": "¥1,540 bottle / ¥1,210 refill"},"positioning": {"zh": "“护肤化的保水美容液洗发水”。把海洋来源成分、干细胞提取物概念、PPT 系洗净成分和 84% 美容液成分整合为高保湿修护的宣称方向。差异点是“洗发步骤即美容液护理”这一整体概念，成分本身并不独特。","en": "A skincare-inspired moisture serum shampoo that combines marine-derived ingredients, stem-cell-extract concepts, PPT cleansing agents and an “84% beauty serum ingredients” claim. Its differentiation is the overall idea that shampooing itself functions as a serum-care step; the individual actives are not unique."},"target": {"zh": "核心面向干燥、毛躁、打结、缺乏光泽、有染烫或热工具损伤的人群。年龄并未在官方页面明确限定，视觉风格更接近重视成分感、简洁包装和药妆可得性的年轻至中青年消费者。","en": "Aimed at people with dryness, frizz, tangling, dullness and damage from coloring, perming or heat tools. The minimalist packaging and ingredient-focused language appeal mainly to young and middle-aged beauty consumers."},"distribution": {"zh": "本体 475 mL / ¥1,540；替换装 400 mL / ¥1,210。属于日本中价位大众高机能洗护，依赖药妆与大型生活方式零售触达，同时通过官方电商和平台电商覆盖。","en": "475 mL at ¥1,540 and a 400 mL refill at ¥1,210. It sits in Japan’s mid-priced mass-premium haircare segment, with broad distribution through drugstores, lifestyle retailers and e-commerce."},"ingredients": {"zh": "氨基酸系洗净成分 + PPT 系洗净成分；代表成分包括 Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K。Polyquaternium-51 作为保湿与顺滑强化点，“Thalasso stem-cell formula”则是品牌复合概念。新版去除了 Olefin(C12-16) Sulfonate Na，意图降低强清洁印象。","en": "Amino-acid cleansing agents plus PPT-derived surfactants, including Cocoyl Hydrolyzed Collagen K and Cocoyl Hydrolyzed Keratin K. Polyquaternium-51 strengthens hydration and slip, while the “Thalasso stem-cell formula” acts as the brand’s composite technology claim."},"evidence": {"zh": "当前公开页面以配方、成分功能及品牌内部比较为主。公开资料明确提到产品中 84% 为美容液成分，但该比例包含水；未看到完整第三方临床报告、详细样本量或公开统计结果。","en": "Public materials focus on formula composition, ingredient functions and internal brand comparisons. The 84% beauty-serum figure includes water. No complete third-party clinical report or detailed sample size was found."},"experience": {"zh": "透明或半透明大容量泵瓶，银白色泵头与竖排极简标签强化“水感、洁净、实验室感”。香型为 Aqua White Floral。洗发剂型强调浓密泡沫、温和清洁、洗后湿润与“ぷるん髪”弹润感。","en": "A transparent large pump bottle with silver-white hardware and vertical minimalist labeling. Aqua White Floral fragrance. The product emphasizes rich foam, mild cleansing, moisturized feel and bouncy, supple hair."},"packaging": {"zh": "极简透明瓶、垂直排版和银白配色是品牌货架辨识度最高的元素。视觉同时传达海洋、水感和实验室美容液。优点是货架辨识度高；风险是系列扩张后不同功效款外观相近。","en": "The transparent bottle, vertical typography and silver-white palette strongly convey water, marine beauty and laboratory skincare. Shelf recognition is high, although multiple variants can be difficult to distinguish."},"insight": {"zh": "真正值得研究的是整合能力：把 PPT 洗净成分、阳离子保湿聚合物、海洋成分与干细胞概念组合成一个消费者能理解的 Skinification 故事。“84% 美容液”只是这套组合的对外数字表达。","en": "The most valuable lesson is the integration itself: PPT cleansing agents, a moisturizing polymer, marine ingredients and stem-cell language combined into one understandable skinification concept. The 84% figure is simply how that combination is expressed to consumers."},"notes": {"zh": "","en": ""},"images": ["https://taosbeauty.com/cdn/shop/files/72664f3e1aa7b236c00fc90563382201_a3885a1b-7e2a-42bd-8220-7212e70b320e.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/c559df78-8834-48c0-b293-45944896881c.jpg?v=1753689513&width=1000","https://taosbeauty.com/cdn/shop/files/1eb5fa63-b2b9-4e4b-b5f7-de6727f1b6f8.jpg?v=1753689513&width=1000"],"sources": [["MAQUIA renewal information","https://maquia.hpplus.jp/cosme/170189/"],["Retail product page","https://taosbeauty.com/products/eight-the-thalasso-moist-shampoo"]],"targetUsers": {"zh": ["干燥、毛躁、打结、缺乏光泽人群","染烫或热工具损伤发质","偏好成分感、简洁包装的年轻至中青年消费者","希望“洗发即美容液护理”体验的人群"],"en": ["Dryness, frizz, tangling, dullness","Hair damaged by coloring, perming or heat tools","Young to middle-aged consumers who value ingredient-forward, minimalist packaging","Those seeking a “shampoo as serum care” experience"]},"keyClaims": {"zh": ["84%成分为美容液成分（含水）","干细胞提取物+海洋来源成分复合概念","PPT系洗净成分，兼顾清洁与滋养","2025年夏季配方更新，降低强清洁印象"],"en": ["84% of ingredients are “beauty serum” ingredients (water included)","Composite concept of stem-cell extracts + marine-derived ingredients","PPT-derived cleansing agents balance cleansing and nourishment","Reformulated in summer 2025 to soften the “strong cleansing” impression"]},"heroIngredients": {"zh": [{"name": "Thalasso干细胞复合物","tag": "海洋美容概念","desc": "品牌复合概念，整合海洋来源成分与干细胞提取物概念"},{"name": "PPT系洗净成分","tag": "氨基酸温和洁净","desc": "Cocoyl Hydrolyzed Collagen K、Cocoyl Hydrolyzed Keratin K等"}],"en": [{"name": "Thalasso Stem Cell Complex","tag": "Marine beauty concept","desc": "The brand's composite concept combining marine-derived ingredients and stem-cell extract language"},{"name": "PPT Cleansing Agents","tag": "Gentle amino-acid cleansing","desc": "Cocoyl Hydrolyzed Collagen K, Cocoyl Hydrolyzed Keratin K, and related agents"}]},"ingredientsNote": {"zh": "Polyquaternium-51作为保湿与顺滑强化点；新版配方去除了Olefin(C12-16) Sulfonate Na，意图降低强清洁印象。","en": "Polyquaternium-51 strengthens hydration and slip; the reformulated version removed Olefin(C12-16) Sulfonate Na to soften the strong-cleansing impression."},"pricePositioning": {"zh": {"tier": "masstige","label": "中价位大众高机能"},"en": {"tier": "masstige","label": "Mid-Priced Mass-Premium"}},"marketChannel": {"zh": {"global": ["品牌官网","海外电商"],"japan": ["全国药妆","Loft","PLAZA"],"channelLabel": "Lifestyle & Drugstore Retail","channelDesc": "依赖药妆与大型生活方式零售触达，兼具电商覆盖"},"en": {"global": ["Official website","Overseas e-commerce"],"japan": ["Nationwide drugstores","Loft","PLAZA"],"channelLabel": "Lifestyle & Drugstore Retail","channelDesc": "Relies on drugstores and lifestyle retailers for reach, with e-commerce coverage"}},"brandConceptRich": {"zh": {"tagline": "美容精华，融入每一次洗发。","concept": "8 THE THALASSO把洗发重新定义为护肤级仪式，借用海洋与干细胞的精华语言，将一个日常品类提升到高端质感。"},"en": {"tagline": "Beauty essence, in every wash.","concept": "8 THE THALASSO reframes shampooing as a skincare-style ritual, borrowing marine and stem-cell language from prestige serums to elevate a commodity category."}},"competitiveAdvantage": {"zh": [{"name": "Olaplex","points": ["更强调感官体验与香调而非单一修护科技","价格更亲民，购买门槛低","渠道更贴近日常药妆场景"]},{"name": "L'Occitane（精品线）","points": ["价格更具竞争力","视觉更简约实验室感而非香氛导向","更依赖成分故事而非品牌历史"]},{"name": "资生堂 TSUBAKI","points": ["更强调“美容液”技术宣称","干细胞与海洋概念差异化明显","包装更具“洁净感”定位"]}],"en": [{"name": "Olaplex","points": ["Leans on sensory experience and scent rather than a single repair technology","More accessible price, lower purchase barrier","Channel presence closer to everyday drugstore shopping"]},{"name": "L'Occitane (prestige line)","points": ["More competitive pricing","Minimalist, lab-like visual rather than fragrance-led","Relies more on ingredient claims than brand heritage"]},{"name": "Shiseido TSUBAKI","points": ["Stronger “beauty serum” technology claim","Clear differentiation via stem-cell and marine concepts","Packaging leans into a “clean” positioning"]}]},"evidenceStats": {"zh": ["84%美容液成分为官方声明，但该比例包含水分","公开资料以配方、成分功能及品牌内部比较为主","未见完整第三方临床报告、样本量或统计结果"],"en": ["The 84% beauty-serum figure is an official claim, but the ratio includes water","Public materials focus mainly on formula composition and internal brand comparisons","No complete third-party clinical report, sample size or statistical results were found"]},"experienceItems": {"zh": ["瓶身：透明/半透明大容量泵瓶，银白泵头","设计：竖排极简标签，强化水感与实验室感","香调：Aqua White Floral","洗感：浓密泡沫，温和清洁，“ぷるん髪”弹润感"],"en": ["Bottle: transparent/translucent large pump bottle, silver-white hardware","Design: vertical minimalist labeling, reinforcing a water/lab aesthetic","Scent: Aqua White Floral","Feel: rich foam, mild cleansing, bouncy ‘purun’ supple hair"]},"packagingItems": {"zh": ["视觉：极简透明瓶+垂直排版+银白配色","联想：海洋、水感、实验室美容液","优势：货架辨识度高","风险：系列扩张后不同功效款外观相近"],"en": ["Visual: minimalist transparent bottle + vertical typography + silver-white palette","Association: marine, water, laboratory skincare","Strength: high shelf recognition","Risk: variants across the range can look similar as the line expands"]},"productType": "shampoo","keyTechnology": {"zh": [{"title": "海洋干细胞萃取工艺","desc": "品牌自有的海洋来源成分与干细胞提取复合工艺，构成其核心技术宣称。"},{"title": "PPT洗净体系重构","desc": "2025年配方更新中移除强力硫酸盐成分，改用氨基酸系PPT洗净技术，降低强清洁感。"}],"en": [{"title": "Marine Stem-Cell Extraction Process","desc": "A proprietary complex of marine-derived ingredients and stem-cell extracts forms the brand's core technology claim."},{"title": "PPT Cleansing Reformulation","desc": "The 2025 reformulation removed harsher sulfate agents in favor of amino-acid-based PPT cleansing technology, softening the strong-cleansing feel."}]},"addedAt": 3},{"id": "advclinicals-keratin","category": "usa","name": {"zh": "Advanced Clinicals Keratin Sleek + Smooth Hair Mask","en": "Advanced Clinicals Keratin Sleek + Smooth Hair Mask"},"brand": {"zh": "Advanced Clinicals","en": "Advanced Clinicals"},"company": {"zh": "Advanced Clinicals（cosmeceuticals平价功效护肤品牌）","en": "Advanced Clinicals (an accessible-priced cosmeceuticals brand)"},"origin": {"zh": "美国","en": "USA"},"launch": {"zh": "品牌核心护发系列常规单品","en": "A standard item in the brand's core haircare lineup"},"market": {"zh": "Walmart、iHerb、Amazon等美国大众/电商渠道","en": "Walmart, iHerb, Amazon and other US mass/e-commerce channels"},"capacity": {"zh": "12 fl oz / 340 g","en": "12 fl oz / 340 g"},"price": {"zh": "约US$13.99（单瓶）","en": "~US$13.99 (single bottle)"},"positioning": {"zh": "以角蛋白+乳木果油为核心的强效补水发膜，主打软化强韧受损发丝、改善顺滑与光泽，走科学驱动的平价功效品牌定位。","en": "A keratin + shea butter intensive hydrating hair mask, positioned to soften and strengthen weak hair while improving smoothness and shine, under the brand's science-driven, accessible positioning."},"target": {"zh": "干燥、毛躁、易断裂或经过染烫处理的受损发质人群，偏好平价功效型护理而非专业沙龙价位的消费者。","en": "Dry, frizzy, breakage-prone or color-treated damaged hair; consumers who prefer accessible, science-positioned care over professional salon pricing."},"ingredients": {"zh": "水、鲸蜡醇、甘油、双十八烷基二甲基氯化铵、肉豆蔻酸异丙酯、椰子油、水解角蛋白、丝氨基酸、水解米蛋白、泛醇（维生素B5）、乳木果油、聚季铵盐硅油-3、羟乙基纤维素等。","en": "Water, cetyl alcohol, glycerin, behentrimonium chloride, isopropyl myristate, coconut oil, hydrolyzed keratin, silk amino acids, hydrolyzed rice protein, panthenol (vitamin B5), shea butter, silicone quaternium-3, hydroxyethylcellulose, and more."},"evidence": {"zh": "宣称主要基于品牌自述的科学驱动配方与成分功效描述，未见公开的独立第三方临床或仪器测试数据；用户评论中有反馈香精浓郁引发头痛等敏感问题。","en": "Claims rest mainly on the brand's self-described science-driven formula and ingredient-function descriptions; no public independent third-party clinical or instrumental data found. Some user reviews note the fragrance is strong enough to cause headaches for sensitive users."},"experience": {"zh": "乳霜质地，清洁湿发后大量涂抹，停留5-10分钟后彻底冲洗；建议头皮易出油人群避开发根使用；每周或按需使用。","en": "Creamy texture; apply generously to clean, damp hair, leave on 5-10 minutes, then rinse thoroughly. Those with an oily scalp are advised to avoid the roots; recommended weekly or as needed."},"packaging": {"zh": "塑料瓶身，简洁临床感标签设计（角蛋白、维生素B5等成分icon化呈现），强化科学护理平价定位。","en": "A plastic bottle with a clean, clinical-style label (keratin, vitamin B5 and other ingredients shown as icons), reinforcing the brand's science-driven mass positioning."},"insight": {"zh": "Advanced Clinicals证明皮肤科学话语体系可以从护肤品类平移到护发品类，用cosmeceuticals定位在平价市场中建立差异化，但香精浓度等细节仍是用户体验的潜在风险点。","en": "Advanced Clinicals shows that a dermatological science vocabulary can transfer from skincare into haircare, using a cosmeceuticals position to differentiate within the mass market, though details like fragrance intensity remain a potential experience risk."},"notes": {"zh": "","en": ""},"images": ["https://advancedclinicals.com/cdn/shop/files/AC156_KeratinHairMask_Main_2048x.jpg?v=1760986137","https://advancedclinicals.com/cdn/shop/files/AC156-R2_Keratin_Hair_Mask_Slide_2_Retail_Ready_112125_2048x.jpg?v=1766003997","https://advancedclinicals.com/cdn/shop/files/AC156-R2_Keratin_Hair_Mask_Slide_5_Key_Ingredients_112125_2048x.jpg?v=1766003997"],"sources": [["Official product page","https://advancedclinicals.com/products/keratin-hair-mask"],["Ingredients (EWG Skin Deep)","https://www.ewg.org/skindeep/products/9343667-Advanced_Clinicals_Keratin_Sleek__Smooth_Hair_Mask_for_Damaged_Hair_12_fl_oz/"]],"targetUsers": {"zh": ["干燥、毛躁、易断裂发质人群","染烫等化学处理后的受损发质","偏好平价科学功效型护理的消费者","习惯在Walmart/iHerb等渠道购物的人群"],"en": ["Dry, frizzy, breakage-prone hair","Color-treated or chemically damaged hair","Consumers who prefer accessible science-driven care","Shoppers who buy via Walmart/iHerb channels"]},"keyClaims": {"zh": ["软化强韧受损发丝","角蛋白+泛醇+米蛋白+椰子油组合","改善顺滑度与光泽","科学驱动的平价功效定位"],"en": ["Softens and strengthens weak, damaged hair","Keratin + panthenol + rice protein + coconut oil blend","Improves smoothness and shine","Science-driven, accessible positioning"]},"heroIngredients": {"zh": [{"name": "水解角蛋白","tag": "顺滑修护","desc": "改善头发顺滑度与可梳理性外观"},{"name": "乳木果油+泛醇（维生素B5）","tag": "深层保湿","desc": "锁住水分，提升柔软与光泽感"}],"en": [{"name": "Hydrolyzed Keratin","tag": "Smoothing & repair","desc": "Improves the look of hair smoothness and manageability"},{"name": "Shea Butter + Panthenol (Vitamin B5)","tag": "Deep hydration","desc": "Locks in moisture for a softer, shinier finish"}]},"ingredientsNote": {"zh": "配方还含水解米蛋白（提升光泽与蓬松感外观）与丝氨基酸，整体走成分功能标注清晰的科学感沟通方式。","en": "The formula also includes hydrolyzed rice protein (for visible shine and volume) and silk amino acids, communicated overall in a clear, science-forward, function-labeled style."},"pricePositioning": {"zh": {"tier": "mass","label": "Mass Cosmeceutical Value"},"en": {"tier": "mass","label": "Mass Cosmeceutical Value"}},"marketChannel": {"zh": {"global": ["品牌官网","iHerb","Amazon"],"japan": ["Walmart"],"channelLabel": "Mass & E-commerce Retail","channelDesc": "以Walmart与电商平台为核心分销渠道"},"en": {"global": ["Brand website","iHerb","Amazon"],"japan": ["Walmart"],"channelLabel": "Mass & E-commerce Retail","channelDesc": "Core distribution via Walmart and e-commerce platforms"}},"brandConceptRich": {"zh": {"tagline": "护肤科学，用在头发上。","concept": "Advanced Clinicals把自己在护肤领域建立的品牌信誉延伸到头发护理，借用皮肤学式的宣称语言，同时保持药妆价格。"},"en": {"tagline": "Skincare science, for hair.","concept": "Advanced Clinicals extends its skincare-brand credibility into haircare, borrowing dermatology-style claims and formulation language at a drugstore price point."}},"competitiveAdvantage": {"zh": [{"name": "OGX Keratin Oil系列","points": ["临床/科学话语体系比OGX更突出","价格带接近，直接竞争","OGX渠道覆盖与品牌知名度更大"]},{"name": "Aussie 3 Minute Miracle","points": ["定位平价功效护理，非单纯感官体验","成分标注更透明化","Aussie品牌历史与渠道规模更大"]},{"name": "Garnier Fructis Keratin系列","points": ["cosmeceuticals平价定位差异化明显","Garnier渠道覆盖更广、营销投入更大","价格带接近，直接竞争"]}],"en": [{"name": "OGX Keratin Oil line","points": ["More pronounced clinical/science vocabulary than OGX","Very close price band, direct competitor","OGX has broader retail reach and brand awareness"]},{"name": "Aussie 3 Minute Miracle","points": ["Positioned around accessible functional care rather than pure sensory appeal","More transparent ingredient labeling","Aussie has a longer brand history and larger retail scale"]},{"name": "Garnier Fructis Keratin line","points": ["Clear differentiation via the cosmeceuticals mass positioning","Garnier has broader retail reach and marketing spend","Very close price band, direct competitor"]}]},"evidenceStats": {"zh": ["宣称基于品牌自述配方原理与成分功效描述","未见独立第三方临床或仪器测试数据公开","部分用户反馈香精浓郁可能引发敏感反应"],"en": ["Claims based on the brand's own formula rationale and ingredient-function descriptions","No independent third-party clinical or instrumental data publicly disclosed","Some users report the fragrance is strong enough to cause sensitivity"]},"experienceItems": {"zh": ["质地：浓郁乳霜状发膜","用法：清洁湿发涂抹，停留5-10分钟冲洗","注意：头皮易出油者避开发根","频率：每周或按需使用"],"en": ["Texture: rich creamy hair mask","Usage: apply to clean, damp hair, leave 5-10 min, rinse","Note: avoid roots if scalp is oil-prone","Frequency: weekly or as needed"]},"packagingItems": {"zh": ["视觉：简洁瓶身+成分icon化标签","联想：科学、临床、平价可信","规格：12oz家用装，也有2瓶装","优势：价格透明，货架辨识度高"],"en": ["Visual: simple bottle with icon-based ingredient labeling","Association: scientific, clinical, accessible and trustworthy","Size: 12oz household size, also sold as a 2-pack","Strength: transparent pricing, strong shelf recognition"]},"productType": "mask","keyTechnology": {"zh": [{"title": "水解角蛋白递送技术","desc": "针对角蛋白如何被头发吸收利用设计的递送体系。"},{"title": "皮肤学级配方标准","desc": "把护肤品级的配方标准应用到大众价位的头发护理产品中。"}],"en": [{"title": "
