async function exportPptx(){
  if(typeof PptxGenJS==='undefined'){toast(lang==='zh'?'PPT组件加载失败，请确认网络连接':'PPT library failed to load; check your connection');return}
  const savedLang=lang;
  lang='en';
  try{
  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE';
  pptx.author='Competitor Library';
  pptx.subject='Competitive intelligence';
  pptx.title='Competitor Library';
  pptx.company='Internal';
  pptx.lang='en-US';

  function imgOpt(u){ return u&&u.startsWith('data:') ? {data:u} : {path:u}; }
  const ACCENT='C15B72';
  const INK='1A1D24';
  const GREY='8A8F9C';

  function estLines(str,charsPerLine){ return Math.max(1,Math.ceil((str||'').length/charsPerLine)); }

  const exportList=selectedForExport.size?products.filter(p=>selectedForExport.has(p.id)):products;
  exportList.forEach((p)=>{
    const slide=pptx.addSlide();
    slide.background={color:'FFFFFF'};
    slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:0.14,h:7.5,fill:{color:ACCENT},line:{type:'none'}});

    const leftX=0.55, leftW=8.5;
    slide.addText(bi(p.name),{x:leftX,y:0.32,w:leftW,h:0.55,fontFace:'Georgia',bold:true,fontSize:24,color:INK,valign:'top'});
    const catLabel=p.category==='japan'?'Japan':p.category==='usa'?'USA':'Europe';
    slide.addText(`${catLabel} · ${typeLabel(p.productType)||''}`,{x:leftX,y:0.88,w:leftW,h:0.25,fontFace:'Montserrat',fontSize:11,color:GREY});

    let y=1.35;
    function label(text,x,w){
      slide.addText(text,{x,y,w,h:0.24,fontFace:'Montserrat',fontSize:10.5,bold:true,color:ACCENT,charSpacing:1});
    }
    function value(text,x,y0,w,fontSize,lines,italic){
      slide.addText(text||'—',{x,y:y0,w,h:0.24*lines+0.1,fontFace:'Montserrat',fontSize:fontSize||13,color:INK,italic:!!italic,valign:'top'});
    }

    // Row 1: Net Volume + Price | Price Position
    const halfW=(leftW-0.4)/2;
    label(lang==='zh'?'容量与价格':'Net Volume + Price',leftX,halfW);
    const npText=[bi(p.capacity),bi(p.price)].filter(Boolean).join(' · ');
    value(npText,leftX,y+0.26,halfW,13,estLines(npText,42));

    const pp=biObj(p.pricePositioning);
    if(pp){
      const tiers=['mass','masstige','premium','luxury'];
      const idx=tiers.indexOf(pp.tier);
      const segX=leftX+halfW+0.4;
      tiers.forEach((tname,i)=>{
        slide.addShape(pptx.ShapeType.rect,{x:segX+i*0.85,y:y+0.03,w:0.78,h:0.07,fill:{color:i===idx?ACCENT:'E7E9EC'},line:{type:'none'}});
      });
      slide.addText(pp.label||'',{x:segX,y:y+0.18,w:halfW,h:0.28,fontFace:'Montserrat',fontSize:12,bold:true,color:INK});
    }
    y+=0.72;

    // Brand Concept
    const bc=biObj(p.brandConceptRich);
    const taglineTxt=bc&&bc.tagline?`"${bc.tagline}"`:(bi(p.brandTagline)?`"${bi(p.brandTagline)}"`:'');
    if(taglineTxt){
      label(lang==='zh'?'品牌概念':'Brand Concept',leftX,leftW);
      y+=0.26;
      slide.addText(taglineTxt,{x:leftX,y,w:leftW,h:0.3,fontFace:'Montserrat',fontSize:13,italic:true,color:INK});
      y+=0.44;
    }

    // Positioning (merged with target users)
    const targetPhrase=biList(p.targetUsers).slice(0,2).join(', ');
    const posText=[targetPhrase?`For ${targetPhrase}`:'',bi(p.positioning)].filter(Boolean).join(' — ');
    if(posText){
      label(lang==='zh'?'定位':'Positioning',leftX,leftW);
      y+=0.26;
      const lines=estLines(posText,68);
      value(posText,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Technology
    const techTxt=biList(p.keyTechnology).map(x=>x.title).join(' · ');
    if(techTxt){
      label(lang==='zh'?'核心技术':'Key Technology',leftX,leftW);
      y+=0.26;
      const lines=estLines(techTxt,68);
      value(techTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Key Claims
    const claimsTxt=biList(p.keyClaims).join(' · ');
    if(claimsTxt){
      label(lang==='zh'?'核心卖点':'Key Claims',leftX,leftW);
      y+=0.26;
      const lines=estLines(claimsTxt,68);
      value(claimsTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Core Ingredients
    let ingTxt=biList(p.heroIngredients).map(x=>x.name).join(', ');
    if(!ingTxt) ingTxt=bi(p.ingredients);
    if(ingTxt){
      label(lang==='zh'?'核心成分':'Core Ingredients',leftX,leftW);
      y+=0.26;
      const lines=estLines(ingTxt,68);
      value(ingTxt,leftX,y,leftW,13,lines);
      y+=0.24*lines+0.22;
    }

    // Source (link only, same color as body text)
    if(p.sources && p.sources[0]){
      slide.addText(p.sources[0][1],{x:leftX,y:Math.min(y+0.05,7.05),w:leftW,h:0.25,fontFace:'Montserrat',fontSize:10,color:INK});
    }

    // Images (right column, clean product shots, up to 3) — spans full content height for even distribution
    const images=(p.images||[]).slice(0,3);
    const imgX=9.35, imgW=3.45;
    const imgTop=1.35, imgBottom=7.1, imgSpan=imgBottom-imgTop;
    if(images[0]){
      const h0=images.length>1?imgSpan*0.62:imgSpan;
      try{ slide.addImage({...imgOpt(images[0]),x:imgX,y:imgTop,w:imgW,h:h0,sizing:{type:'contain',w:imgW,h:h0}}); }catch(e){}
      if(images[1]){
        const y2=imgTop+h0+0.2;
        const h2=imgBottom-y2;
        const halfImgW=(imgW-0.15)/2;
        try{ slide.addImage({...imgOpt(images[1]),x:imgX,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        if(images[2]){
          try{ slide.addImage({...imgOpt(images[2]),x:imgX+halfImgW+0.15,y:y2,w:halfImgW,h:h2,sizing:{type:'contain',w:halfImgW,h:h2}}); }catch(e){}
        }
      }
    }
  });

  await pptx.writeFile({fileName:'Competitor_Library_EN.pptx'});
  }catch(err){
    console.error('exportPptx failed:',err);
    toast((savedLang==='zh'?'幻灯片生成出错：':'Slide generation error: ')+(err&&err.message?err.message:err));
  }finally{
    lang=savedLang;
  }
}
